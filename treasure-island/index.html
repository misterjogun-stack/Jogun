<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>보물섬 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: 유리 돔 디오라마를 화면 가득 보여 주고, 그 위에 HUD가 떠 있어요 (상단: 이름표·보물 칸·버튼 / 하단: 레이더·파기) */
:root {
  --night: #0b1630;
  --night-glow: #29477a;
  --sun: #ffd23f;
  --sun-deep: #e6a100;
  --coral: #ff6f61;
  --ink: #24405c;
  --ink-soft: #4d6a86;
  --panel: rgba(255, 255, 255, 0.93);
  --panel-edge: rgba(36, 64, 92, 0.18);
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 42%, var(--night-glow) 0%, #16294f 42%, var(--night) 100%);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 16px;
  overflow: hidden;
  word-break: keep-all;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 12% 22%, rgba(120, 170, 255, .16) 0 3.5%, transparent 3.7%),
    radial-gradient(circle at 86% 30%, rgba(255, 220, 150, .12) 0 5%, transparent 5.2%),
    radial-gradient(circle at 78% 80%, rgba(120, 170, 255, .12) 0 4%, transparent 4.2%),
    radial-gradient(circle at 20% 76%, rgba(255, 220, 150, .1) 0 2.5%, transparent 2.7%);
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

.panel { background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 18px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18); }
.hud {
  position: absolute; left: 0; right: 0; display: flex; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud.top { top: 0; padding-top: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.hud.bottom { bottom: 0; padding-bottom: 16px; align-items: flex-end; justify-content: space-between; }

.brand { order: 1; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 10px; font-size: 19px; line-height: 1; min-height: 32px; }
.brand em { font-style: normal; font-size: 12px; background: var(--sun); color: var(--ink); padding: 3px 8px; border-radius: 999px; }
.btns { order: 2; display: flex; gap: 8px; }
.lootrow { order: 3; flex: 1 1 100%; display: flex; justify-content: center; }
.ibtn { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; border-radius: 50%; color: var(--ink); cursor: pointer; font: inherit; touch-action: manipulation; }
.ibtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
.ibtn[aria-pressed="true"].hand { background: var(--sun); }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

.loot { display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
.slots { display: flex; gap: 6px; }
.slots canvas { width: 40px; height: 40px; border-radius: 12px; background: #eaf6fb; border: 2px dashed rgba(36, 64, 92, 0.28); box-sizing: border-box; }
.slots canvas.got { background: #fff6cf; border: 2px solid var(--sun-deep); animation: pop 0.7s ease-out; }
.slots.big canvas { width: 56px; height: 56px; }
.count { font-size: 18px; min-width: 2.4em; text-align: right; font-variant-numeric: tabular-nums; }
@keyframes pop { 0% { transform: scale(0.6); } 55% { transform: scale(1.3) rotate(-6deg); } 100% { transform: scale(1); } }

.radar { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; min-width: 176px; --lc: #5aa9ff; }
.radar svg { flex: none; }
.radar .label { font-size: 12px; color: var(--ink-soft); line-height: 1; }
.radar b { display: block; font-weight: 400; font-size: 20px; line-height: 1.15; margin-top: 3px; }
.seg { display: flex; gap: 4px; margin-top: 6px; }
.seg i { width: 22px; height: 8px; border-radius: 4px; background: rgba(36, 64, 92, 0.14); transition: background 0.25s; }
.seg i.on { background: var(--lc); }

.dig {
  width: 92px; height: 92px; border-radius: 50%; border: 0; padding: 0; background: var(--sun); color: var(--ink);
  font: inherit; font-size: 18px; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  box-shadow: 0 6px 0 var(--sun-deep), 0 12px 20px rgba(0, 0, 0, 0.35); cursor: pointer; touch-action: manipulation;
}
.dig:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-deep), 0 6px 12px rgba(0, 0, 0, 0.3); }

.bubble {
  position: absolute; left: 50%; bottom: 124px; transform: translateX(-50%);
  max-width: min(92vw, 440px); padding: 10px 18px; text-align: center; font-size: 17px; line-height: 1.35; pointer-events: none; animation: rise 0.28s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

.end, .consent { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(8, 16, 36, 0.55); }
.card { max-width: 420px; width: 100%; box-sizing: border-box; padding: 24px 20px; text-align: center; }
.card h2 { margin: 0 0 12px; font-weight: 400; font-size: 26px; text-wrap: balance; }
.card p { margin: 0 0 18px; font-size: 18px; line-height: 1.45; text-wrap: balance; }
.card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.end .slots { justify-content: center; flex-wrap: wrap; margin-bottom: 4px; }
.end .slots canvas { background: #fff6cf; border: 2px solid var(--sun-deep); }
.end p { margin-top: 16px; }
.cta, .ghost { font: inherit; font-size: 19px; padding: 12px 22px; min-height: 48px; border: 0; border-radius: 999px; cursor: pointer; }
.cta { background: var(--sun); color: var(--ink); box-shadow: 0 5px 0 var(--sun-deep); }
.cta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sun-deep); }
.ghost { background: #e6eef5; color: var(--ink); box-shadow: 0 5px 0 #b7c6d4; }
.small { font-size: 14px !important; color: var(--ink-soft); margin: -6px 0 16px !important; }

.handcam { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 108px; width: 132px; padding: 6px; }
.handcam .vid { position: relative; width: 120px; height: 90px; border-radius: 12px; overflow: hidden; background: #0e1b33; }
.handcam video, .handcam canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }
.handcam .chip { margin-top: 6px; font-size: 14px; text-align: center; line-height: 1.2; min-height: 17px; }
.hcur { position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; border: 4px solid #6fd3ff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .8), 0 0 18px rgba(111, 211, 255, .9); pointer-events: none; transition: border-color .15s, transform .15s; }
.hcur.dig { border-color: var(--sun); transform: scale(.6); box-shadow: 0 0 0 3px rgba(255, 255, 255, .8), 0 0 24px rgba(255, 210, 63, 1); }

@media (min-width: 760px) {
  .brand { order: 1; } .lootrow { order: 2; flex: 0 1 auto; } .btns { order: 3; }
}
@media (max-width: 479px) {
  .hud.top { flex-wrap: wrap; gap: 8px; }
  .brand { font-size: 17px; padding: 6px 10px 6px 8px; }
  .brand em { display: none; }
  .btns { gap: 6px; }
  .ibtn { width: 40px; height: 40px; }
  .ibtn svg { width: 22px; height: 22px; }
  .slots canvas { width: 36px; height: 36px; }
}
@media (prefers-reduced-motion: reduce) { .slots canvas.got, .bubble { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" role="img" aria-label="유리 돔 안의 작은 보물섬. 땅을 눌러 걸어가고 파기 버튼으로 땅을 파요."></canvas>

  <header class="hud top">
    <div class="brand panel">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#fff6cf" stroke="#24405c" stroke-width="2"/>
        <path d="M12 4.5l2.6 7.5-2.6 7.5-2.6-7.5z" fill="#ff6f61" stroke="#24405c" stroke-width="1.4" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="1.6" fill="#24405c"/>
      </svg>
      <span>보물섬 탐험</span><em>체험판</em>
    </div>
    <div class="lootrow">
      <div class="loot panel" role="group" aria-label="찾은 보물">
        <div id="lootSlots" class="slots"></div>
        <span id="lootCount" class="count">0/5</span>
      </div>
    </div>
    <div class="btns">
      <button id="hand" class="ibtn hand panel" type="button" aria-pressed="false" aria-label="손 조작 켜기">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 11V4.8a1.4 1.4 0 012.8 0V10M11.8 9.6a1.4 1.4 0 012.8 0V11M14.6 10.6a1.4 1.4 0 012.8 0V14c0 3.6-2.2 6-5.6 6-2.6 0-4-1.2-5.4-3.4L4.6 13a1.4 1.4 0 012.4-1.4L9 14.4V11" stroke="#24405c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="zoom" class="ibtn panel" type="button" aria-label="화면 크기 바꾸기">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" stroke="#24405c" stroke-width="2.2"/><path d="M15 15l5 5" stroke="#24405c" stroke-width="2.4" stroke-linecap="round"/><path d="M8 10.5h5M10.5 8v5" stroke="#24405c" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="sound" class="ibtn panel" type="button" aria-pressed="true" aria-label="소리 끄기">
        <svg id="sndOn" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#24405c"/><path d="M15.5 9a4 4 0 010 6M17.8 6.5a7.5 7.5 0 010 11" stroke="#24405c" stroke-width="2" stroke-linecap="round"/></svg>
        <svg id="sndOff" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#24405c"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="#ff6f61" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button id="fresh" class="ibtn panel" type="button" aria-label="새 섬으로 바꾸기">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12a7 7 0 11-2.2-5.1" stroke="#24405c" stroke-width="2.2" stroke-linecap="round"/><path d="M19.5 3.5v5h-5" stroke="#24405c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div id="bubble" class="bubble panel" role="status" aria-live="polite" hidden></div>

  <div id="handcam" class="handcam panel" hidden>
    <div class="vid"><video id="hv" playsinline muted></video><canvas id="hov" width="240" height="180"></canvas></div>
    <div id="handChip" class="chip">손을 보여 주세요</div>
  </div>
  <div id="hcur" class="hcur" hidden></div>

  <footer class="hud bottom">
    <div id="radar" class="radar panel">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="#24405c" stroke-width="1.8" opacity=".35"/>
        <circle cx="12" cy="12" r="6" stroke="#24405c" stroke-width="1.8" opacity=".6"/>
        <circle cx="12" cy="12" r="2.4" fill="#ff6f61"/>
      </svg>
      <div>
        <span class="label">보물 레이더</span>
        <b id="radarWord">차가워요</b>
        <div class="seg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <button id="dig" class="dig" type="button" aria-label="땅 파기">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M17.5 3.2l3.3 3.3" stroke="#24405c" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M19.2 4.9L10.6 13.5" stroke="#a8703a" stroke-width="3" stroke-linecap="round"/>
        <path d="M11.4 12.8l-3.2-.7C5 14.6 4.2 18 4.8 20c2.2.4 5.2-.4 7.2-3.4z" fill="#9fc3da" stroke="#24405c" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span>파기</span>
    </button>
  </footer>

  <div id="consent" class="consent" hidden>
    <div class="card panel" role="dialog" aria-modal="true" aria-labelledby="consentTitle">
      <h2 id="consentTitle">손으로 조작해 볼까요?</h2>
      <p>카메라로 손을 보고 움직여요.<br>검지를 펴서 가는 곳을 고르고, 검지를 굽히면 그 자리를 파요.</p>
      <p class="small">영상은 이 기기 안에서만 쓰이고 저장하거나 보내지 않아요.</p>
      <div class="row">
        <button id="consentNo" class="ghost" type="button">다음에요</button>
        <button id="consentYes" class="cta" type="button">카메라 켜기</button>
      </div>
    </div>
  </div>

  <div id="end" class="end" hidden>
    <div class="card panel" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <h2 id="endTitle">보물을 모두 찾았어요!</h2>
      <div id="endRow" class="slots big"></div>
      <p>다섯 개의 보물이 모두 모였어요. 정말 멋진 탐험가예요!</p>
      <button id="again" class="cta" type="button">새 섬에서 다시 탐험</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= 기본 ================= */
const N = 16, LH = 0.55, CAP = 0.16, WATER_Y = 0.3, TANK_R = 9.0;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const TAU = Math.PI * 2;
const SPEED = 4.2;
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';

const TREASURES = [
  { name: '반짝 금화', josa: '를' }, { name: '분홍 진주', josa: '를' }, { name: '푸른 보석', josa: '을' },
  { name: '황금 별', josa: '을' }, { name: '무지개 조개', josa: '를' }
];
const RADAR_WORDS = ['모두 찾았어요', '차가워요', '미지근해요', '따뜻해요', '뜨거워요!'];
const RADAR_COLORS = ['#5cc24a', '#5aa9ff', '#3fc6ab', '#ffb627', '#ff5a4d'];

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let h = Math.imul((x * 374761393 + y * 668265263 + s * 1274126177) | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function makeNoise(rnd, size) {
  const g = [];
  for (let i = 0; i < (size + 1) * (size + 1); i++) g.push(rnd());
  return (u, v) => {
    const x0 = Math.floor(u), y0 = Math.floor(v), fx = u - x0, fy = v - y0;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = g[y0 * (size + 1) + x0], b = g[y0 * (size + 1) + x0 + 1];
    const c = g[(y0 + 1) * (size + 1) + x0], d = g[(y0 + 1) * (size + 1) + x0 + 1];
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  };
}
function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}
const wxOf = x => x - N / 2 + 0.5;   // 칸 번호 → 월드 좌표
const wzOf = y => y - N / 2 + 0.5;

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const canvas = $('c');
const el = {
  bubble: $('bubble'), radar: $('radar'), radarWord: $('radarWord'),
  segs: Array.from(document.querySelectorAll('#radar .seg i')),
  slots: $('lootSlots'), count: $('lootCount'), dig: $('dig'),
  sound: $('sound'), sndOn: $('sndOn'), sndOff: $('sndOff'), fresh: $('fresh'), zoom: $('zoom'), hand: $('hand'),
  end: $('end'), endRow: $('endRow'), again: $('again'),
  consent: $('consent'), consentYes: $('consentYes'), consentNo: $('consentNo'),
  handcam: $('handcam'), hv: $('hv'), hov: $('hov'), chip: $('handChip'), hcur: $('hcur')
};

/* ================= 소리 ================= */
let AC = null, soundOn = true;
function unlockAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function tone(freq, dur, type, vol, delay, slide) {
  if (!AC || !soundOn) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  step() { tone(420 + Math.random() * 90, 0.05, 'triangle', 0.025); },
  thud() { tone(130, 0.14, 'sine', 0.13, 0, -70); tone(90, 0.1, 'square', 0.03, 0.02); },
  miss() { tone(330, 0.16, 'sine', 0.06, 0, -110); },
  splash() { tone(700, 0.09, 'sine', 0.04, 0, -300); },
  pop() { tone(620, 0.07, 'triangle', 0.05); },
  find() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.07, i * 0.09)); tone(1568, 0.4, 'sine', 0.04, 0.38); },
  win() { [523, 659, 784, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.24, 'triangle', 0.07, i * 0.13)); }
};

/* ================= 말풍선 ================= */
let tipActive = false, bubbleTimer = 0;
function say(text, ms) {
  tipActive = false;
  el.bubble.textContent = text; el.bubble.hidden = false;
  el.bubble.style.animation = 'none'; void el.bubble.offsetWidth; el.bubble.style.animation = '';
  clearTimeout(bubbleTimer);
  if (ms) bubbleTimer = setTimeout(() => { el.bubble.hidden = true; }, ms);
}
function hideTip() { if (tipActive) { tipActive = false; el.bubble.hidden = true; } }

/* ================= HUD 보물 모양 (2D) ================= */
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function buildStream() {

    if (t.kind === 'bridge') {

      if (t.flow.dx === 0) g.rotation.y = Math.PI / 2;     // 길이 방향을 흐름과 수직으로

      }

    if (t.fall) {
      const toY = t.fall === 'sea' ? WATER_Y : t.fall.h * LH + 0.06;
      const fromY = Y + 0.06, hh = Math.max(0.1, fromY - toY);
      const tx = t.flow.dx, tz = t.flow.dy;
      const fm = new THREE.Mesh(GEO.plane, MAT.fall); fm.scale.set(0.8, hh, 1);
      fm.position.set(X + tx * 0.5, (fromY + toY) / 2, Z + tz * 0.5); fm.rotation.y = Math.atan2(tx, tz);

    }

  const last = streamInfo.path[streamInfo.path.length - 1];
  if (last.fall === 'sea') {
    const mist = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xdff8ff, transparent: true, opacity: 0.5, depthWrite: false }));

  }
}

let W = 1, H = 1, halfW = 10, halfH = 10;
const ZOOMS = [1, 2, 3];
let zoomIdx = COARSE ? 2 : 0, zoomCur = ZOOMS[zoomIdx];
const camT = new THREE.Vector3(0, 3, 0);
function resize() {
  const r = canvas.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  const pr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(pr); renderer.setSize(W, H, false);
  spMat.size = 15 * pr;
  const aspect = W / H, needW = 24, needH = 17;
  halfH = Math.max(needH / 2, needW / (2 * aspect)); halfW = halfH * aspect;
  applyCamera();
}
function applyCamera() {
  camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH; camera.zoom = zoomCur; camera.updateProjectionMatrix();
  camera.position.set(camT.x + CAM_DIR.x * 70, camT.y + CAM_DIR.y * 70, camT.z + CAM_DIR.z * 70);
  camera.lookAt(camT);
}
function heroWorld() { return new THREE.Vector3(P.px - N / 2, P.y, P.py - N / 2); }
function camGoal() {
  if (ZOOMS[zoomIdx] <= 1) return new THREE.Vector3(0, 3.4, 0);
  const h = heroWorld(); const lim = 7;
  return new THREE.Vector3(clamp(h.x, -lim, lim), h.y + 0.3, clamp(h.z, -lim, lim));
}
function snapCamera() { camT.copy(camGoal()); zoomCur = ZOOMS[zoomIdx]; applyCamera(); }

/* ================= 입력(고르기) ================= */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -WATER_Y);
function pickAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickMeshes, false);
  if (hits.length) return { tile: hits[0].object.userData.tile, point: hits[0].point };
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(waterPlane, p)) {
    const tx = Math.floor(p.x + N / 2), ty = Math.floor(p.z + N / 2);
    // 해안 근처를 누르면 가장 가까운 땅으로 (손가락이 굵어도 괜찮게)
    let near = null, nd = 1.0;
    for (const t of tiles) {
      if (!walkable(t)) continue;
      const d = Math.hypot(wxOf(t.x) - p.x, wzOf(t.y) - p.z);
      if (d < nd) { nd = d; near = t; }
    }
    if (near) return { tile: near, point: p };
    const t = tileAt(tx, ty);
    return { tile: t || null, point: p, water: true };
  }
  return null;
}
function resolveGoal(t, from) {
  if (!t.block && t.kind !== 'stream') return t;
  const { dist } = bfsFrom(from.x, from.y);
  let bd = 1e9, goal = null;
  for (const [dx, dy] of DIRS) {
    const n = tileAt(t.x + dx, t.y + dy);
    if (n && walkable(n) && dist[n.i] >= 0 && dist[n.i] < bd) { bd = dist[n.i]; goal = n; }
  }
  return goal;
}
function currentFrom() { return P.to || tileAt(P.tx, P.ty); }
function goTo(t, digAfter) {
  if (G.over || P.dig) return false;
  const from = currentFrom();
  if (t === from && !P.to && !P.path.length) { if (digAfter) startDig(); return true; }
  const goal = resolveGoal(t, from);
  if (!goal) { sfx.miss(); return false; }
  const path = findPath(from, goal);
  if (!path) { sfx.miss(); return false; }
  P.path = path; P.wantDig = false; P.digAfter = !!digAfter;
  P.marker = path.length || P.to ? { x: goal.x, y: goal.y } : null;
  return true;
}
function tapAt(clientX, clientY) {
  if (G.over || P.dig) return;
  const h = pickAt(clientX, clientY);
  if (!h || !h.tile) return;
  hideTip();
  const t = h.tile;
  if (h.water || t.h === 0) {
    if (h.point) rippleList.push({ x: h.point.x, z: h.point.z, t: 0 });
    sfx.splash();
    if (T - splashSay > 3) { splashSay = T; say('물에는 들어갈 수 없어요. 섬 안을 탐험해요!', 1800); }
    return;
  }
  const from = currentFrom();
  if (t === from && !P.to && !P.path.length) { requestDig(); return; }
  if (goTo(t, false)) sfx.pop();
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); tapAt(e.clientX, e.clientY); });

const KEYMAP = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r', w: 'u', s: 'd', a: 'l', d: 'r', W: 'u', S: 'd', A: 'l', D: 'r' };

  if ((e.key === ' ' || e.key === 'Enter') && !(e.target && e.target.closest && e.target.closest('button'))) { e.preventDefault(); unlockAudio(); requestDig(); }

function requestDig() {
  if (P.dig || G.over) return;
  if (P.to || P.path.length) { P.path = []; P.marker = null; P.wantDig = true; return; }
  startDig();
}
function startDig() {
  const t = tileAt(P.tx, P.ty);
  if (t.kind === 'bridge') { say('다리 위에서는 땅을 팔 수 없어요.', 1800); sfx.miss(); return; }
  if (t.dug) { say('이미 판 곳이에요. 다른 곳을 파 봐요!', 1800); sfx.miss(); return; }
  P.dig = { t: 0, dur: 0.85, hit: false };
}
function nearestTreasureDist() {

}
function arrive() {

}
function keyStep() {

  if (keys.has('d')) { dx += 1; dy += 1; }
  if (keys.has('l')) { dx -= 1; dy += 1; }
  if (keys.has('r')) { dx += 1; dy -= 1; }

  if (!dx && !dy) return false;
  const cur = tileAt(P.tx, P.ty), nt = tileAt(P.tx + dx, P.ty + dy);
  if (!walkable(nt) || Math.abs(nt.h - cur.h) > 1) { P.face = { dx, dy }; return false; }

}
function updatePlayer(dt) {

const Hand = { on: false, loading: false, hands: null, stream: null, busy: false, raw: 'none', cand: 'none', candN: 0, state: 'none', sx: 0, sy: 0, has: false, hover: null, hoverSince: 0, stable: null, armed: false, pointSince: 0, loop: 0 };
const CONN = [[0, 1, 2, 3, 4], [0, 5, 6, 7, 8], [5, 9, 10, 11, 12], [9, 13, 14, 15, 16], [13, 17, 18, 19, 20], [0, 17]];
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous'; s.onload = res; s.onerror = () => rej(new Error('script')); document.head.appendChild(s); }); }
function setChip(t) { el.chip.textContent = t; }
function handOffUI() {

  el.handcam.hidden = true; el.hcur.hidden = true; hoverMark.visible = false;
}
function handStop() {
  Hand.on = false; Hand.loading = false; cancelAnimationFrame(Hand.loop);
  if (Hand.stream) { Hand.stream.getTracks().forEach(t => t.stop()); Hand.stream = null; }
  el.hv.srcObject = null; Hand.state = 'none'; Hand.has = false; Hand.stable = null; Hand.armed = false;

async function handStart() {

  el.hand.setAttribute('aria-pressed', 'true'); el.hand.setAttribute('aria-label', '손 조작 끄기');
  el.handcam.hidden = false; setChip('카메라 준비 중…');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('no-media'), { name: 'NoMedia' });
    Hand.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  } catch (e) {
    handStop();
    say(e && e.name === 'NotAllowedError' ? '카메라를 쓸 수 없어요. 이 화면에서 막혀 있거나 권한을 허용하지 않았어요. 웹 주소(https)로 직접 열면 쓸 수 있어요.' : '카메라를 찾지 못했어요. 이 기기에서는 손 조작을 쓸 수 없어요.', 6500);
    return;

  try { await el.hv.play(); } catch (e) {}

  try {
    if (!window.Hands) await loadScript(MP_BASE + 'hands.js');

    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });

    say('손 인식 도구를 불러오지 못했어요. 인터넷 연결을 확인하거나, 이 화면이 아닌 웹 주소로 열어 보세요.', 6500);

    if (!Hand.on) return;

}

function drawHandPreview(lm) {
  const c = el.hov.getContext('2d'), w = el.hov.width, h = el.hov.height;
  c.clearRect(0, 0, w, h);
  if (!lm) return;
  c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineCap = 'round';
  for (const ch of CONN) { c.beginPath(); ch.forEach((i, k) => (k ? c.lineTo(lm[i].x * w, lm[i].y * h) : c.moveTo(lm[i].x * w, lm[i].y * h))); c.stroke(); }

}
function onHandResults(res) {
  const lms = res && res.multiHandLandmarks;
  if (!lms || !lms.length) { drawHandPreview(null); processHand(null); return; }
  drawHandPreview(lms[0]); processHand(lms[0]);
}
// 검지 펴짐 정도: 손목→검지 끝 거리 ÷ 손목→검지 뿌리 거리
function fingerRatio(lm, vw, vh) {
  const P3 = i => [lm[i].x * vw, lm[i].y * vh, lm[i].z * vw];
  const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const w = P3(0), mcp = P3(5), tip = P3(8);
  return d(tip, w) / Math.max(1e-3, d(mcp, w));
}
function processHand(lm) {
  const now = performance.now() / 1000;
  if (!lm) {
    Hand.has = false; Hand.state = 'none'; Hand.cand = 'none'; Hand.candN = 0; Hand.armed = false; Hand.stable = null;
    el.hcur.hidden = true; hoverMark.visible = false; setChip('손을 보여 주세요'); return;
  }
  const vw = el.hv.videoWidth || 640, vh = el.hv.videoHeight || 480;
  const ratio = fingerRatio(lm, vw, vh);
  let raw = ratio > 1.75 ? 'point' : ratio < 1.4 ? 'curl' : Hand.raw;
  if (raw === 'none') raw = 'point';
  Hand.raw = raw;
  if (raw === Hand.cand) Hand.candN++; else { Hand.cand = raw; Hand.candN = 1; }
  const prev = Hand.state;
  if (Hand.candN >= 2) Hand.state = raw;
  Hand.has = true;
  if (Hand.state === 'point') {
    // 손가락 끝 → 화면 위치 (거울 모드)
    const u = clamp((1 - lm[8].x - 0.1) / 0.8, 0, 1), v = clamp((lm[8].y - 0.08) / 0.72, 0, 1);
    const tx = u * W, ty = v * H;
    if (!Hand.hasPtr) { Hand.sx = tx; Hand.sy = ty; Hand.hasPtr = true; } else { Hand.sx += (tx - Hand.sx) * 0.35; Hand.sy += (ty - Hand.sy) * 0.35; }
    const r = canvas.getBoundingClientRect();
    el.hcur.hidden = false; el.hcur.style.left = (r.left + Hand.sx) + 'px'; el.hcur.style.top = (r.top + Hand.sy) + 'px'; el.hcur.classList.remove('dig');
    const hit = pickAt(r.left + Hand.sx, r.top + Hand.sy);
    const tile = hit && hit.tile && hit.tile.h > 0 ? hit.tile : null;
    if (tile !== Hand.hover) { Hand.hover = tile; Hand.hoverSince = now; }
    if (prev !== 'point') Hand.pointSince = now;
    if (tile) { hoverMark.visible = true; hoverMark.position.set(wxOf(tile.x), tile.topY + 0.06, wzOf(tile.y)); } else hoverMark.visible = false;
    if (tile && now - Hand.hoverSince > 0.3 && Hand.stable !== tile) {
      Hand.stable = tile;
      if (!G.over && !P.dig && tile !== tileAt(P.tx, P.ty) && !(tile === currentFrom() && !P.to)) goTo(tile, false);
    }
    if (now - Hand.pointSince > 0.25) Hand.armed = true;
    setChip(Hand.stable ? '가리키는 중 · 굽히면 파요' : '가리키는 중');
  } else if (Hand.state === 'curl') {
    el.hcur.classList.add('dig');
    if (prev !== 'curl' && Hand.armed && Hand.stable && !G.over) {
      Hand.armed = false;
      hideTip(); unlockAudio();
      goTo(Hand.stable, true);
      setChip('파는 중!');
    } else setChip(Hand.armed ? '검지를 다시 펴 보세요' : '검지를 펴 주세요');
  }
}

/* ================= 한 프레임 ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
resize();
newGame((Math.random() * 1e9) | 0);
requestAnimationFrame(t => { last = t; frame(t); });

// 점검용 (플레이에는 영향 없음)
window.__island = {
  state: () => ({ found: G.found, over: G.over, level: G.level, treasures: treasures.map(t => ({ x: t.x, y: t.y, found: t.found })), player: { x: P.tx, y: P.ty }, start, W, H, stream: !!streamInfo, handState: Hand.state, handOn: Hand.on, moving: !!P.to || P.path.length > 0 || !!P.dig, digging: !!P.dig, gate: gateTile && { x: gateTile.x, y: gateTile.y } }),
  teleport: (x, y) => { const t = tileAt(x, y); P.tx = x; P.ty = y; P.px = x + 0.5; P.py = y + 0.5; P.y = t.topY; P.to = null; P.path = []; snapCamera(); },
  dig: requestDig, tap: tapAt, newGame, setZoom: i => { zoomIdx = i; snapCamera(); },
  tileScreen: (x, y) => { const t = tileAt(x, y); const v = new THREE.Vector3(wxOf(x), t.topY, wzOf(y)).project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height }; },
  // 가짜 손 (테스트): kind = 'point' | 'curl', (u,v) = 0..1 화면 위치
  fakeHand: (kind, u, v) => {
    const lm = []; for (let i = 0; i < 21; i++) lm.push({ x: 0.5, y: 0.8, z: 0 });
    const tipX = 1 - (0.1 + u * 0.8), tipY = 0.08 + v * 0.72;
    lm[0] = { x: 0.5, y: 0.85, z: 0 }; lm[5] = { x: 0.5, y: 0.65, z: 0 }; lm[9] = { x: 0.55, y: 0.65, z: 0 };
    if (kind === 'point') { lm[8] = { x: tipX, y: tipY, z: 0 }; lm[6] = { x: (tipX + 0.5) / 2, y: (tipY + 0.65) / 2, z: 0 }; }
    else { lm[8] = { x: 0.52, y: 0.72, z: 0 }; lm[6] = { x: 0.5, y: 0.6, z: 0 }; }
    if (!Hand.on) { Hand.on = true; }
    onHandResults({ multiHandLandmarks: [lm] });
  }
};
})();
</script>
