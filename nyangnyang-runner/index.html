<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>냥냥 러너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 거실 장면이 화면을 채우고, 메뉴·결과 카드가 그 위에 얹힌다. 캔버스는 16:9~4:3 사이로 맞춰 가운데에 둔다. */
:root {
  --stage: #231a2e;
  --ink: #2b2230;
  --paper: #fff7ec;
  --paper-2: #f5e5cc;
  --line: #e2cdb0;
  --muted: #7d6b62;
  --accent: #ff7a59;
  --scrim: rgba(35, 26, 46, 0.58);
  --shadow: 0 14px 40px rgba(20, 10, 30, 0.38);
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #fff0de;
    --paper: #2e2536;
    --paper-2: #3c3146;
    --line: #52455e;
    --muted: #bcaac4;
    --accent: #ff8a65;
    --scrim: rgba(10, 6, 16, 0.64);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #fff0de;
  --paper: #2e2536;
  --paper-2: #3c3146;
  --line: #52455e;
  --muted: #bcaac4;
  --accent: #ff8a65;
  --scrim: rgba(10, 6, 16, 0.64);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--stage);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: relative;
  height: 100%;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  user-select: none;
  -webkit-user-select: none;
}
#fit { position: relative; width: 100%; height: 100%; }
#stage { position: absolute; touch-action: none; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
#game { display: block; width: 100%; height: 100%; }

button, input, label { font-family: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 게임 중 작은 버튼 (일시정지·소리) */
.hudbtns { position: absolute; top: 8px; right: 8px; display: none; gap: 8px; z-index: 3; }
#app.playing .hudbtns { display: flex; }
.round {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line);
  background: color-mix(in srgb, var(--paper) 88%, transparent); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.round svg { width: 20px; height: 20px; fill: currentColor; }
.round:active { transform: scale(.94); }

/* 터치 버튼 */
#touch { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end; pointer-events: none; z-index: 4; padding: 0 0 4px; }
@media (pointer: coarse) { #app.playing #touch { display: flex; } }
.tbtn {
  pointer-events: auto; touch-action: none; border: 2px solid var(--line); cursor: pointer;
  background: color-mix(in srgb, var(--paper) 82%, transparent); color: var(--ink);
  font-family: var(--font-display); font-size: 22px; height: 72px; border-radius: 24px; padding: 0 22px;
  backdrop-filter: blur(4px);
}
.tbtn.jump { min-width: 150px; background: color-mix(in srgb, var(--accent) 88%, transparent); border-color: transparent; }
.tbtn.slide { min-width: 110px; }
.tbtn.down { transform: scale(.95); filter: brightness(.94); }

/* 오버레이 */
.overlay {
  position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 12px;
  background: var(--scrim); overflow: auto;
}
.overlay[hidden] { display: none; }
.card {
  width: 100%; max-width: 440px; background: var(--paper); color: var(--ink);
  border-radius: 24px; padding: 20px 22px 18px; box-shadow: var(--shadow); border: 2px solid var(--line);
  display: grid; gap: 14px; margin: auto;
}
.title { font-family: var(--font-display); font-size: 40px; line-height: 1.05; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
.headcol { display: grid; gap: 12px; min-width: 0; }
.title + .sub { margin-top: 8px; }
.pvwrap { border-radius: 16px; overflow: hidden; border: 2px solid var(--line); background: var(--paper-2); }
#pv { display: block; width: 100%; height: 128px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > .lbl, .lbl { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
#nameInput {
  width: 100%; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper-2); color: var(--ink);
  padding: 0 14px; font-size: 16px; font-weight: 500;
}
#nameInput::placeholder { color: var(--muted); opacity: .8; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.swatch {
  position: relative; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--paper);
  box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; display: block; flex: none;
}
.swatch[aria-checked="true"] { box-shadow: 0 0 0 3px var(--ink); }
.swatch.custom { background: conic-gradient(#ff5e5e, #ffd35e, #7be06b, #55d6e8, #6a7bff, #d86bff, #ff5e5e); overflow: hidden; }
.swatch.custom::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--c, #c99a6b); border: 2px solid rgba(255,255,255,.85); }
.swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.swatch.custom:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.thumb { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper-2) center/cover no-repeat; flex: none; }
.btn {
  border: 2px solid var(--line); background: var(--paper-2); color: var(--ink); border-radius: 14px;
  min-height: 44px; padding: 0 16px; font-weight: 700; font-size: 14px; cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn.small { min-height: 38px; font-size: 13px; }
.btn.primary {
  background: var(--accent); border-color: transparent; color: #2b1f2a; font-family: var(--font-display);
  font-size: 26px; min-height: 58px; border-radius: 18px; box-shadow: 0 5px 0 rgba(0,0,0,.18);
}
.btn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.btns { display: grid; gap: 10px; }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.hint kbd { font-family: var(--font-body); font-weight: 700; background: var(--paper-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--ink); }
.bestline { margin: 0; text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bestline b { color: var(--ink); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--paper-2); border-radius: 14px; padding: 10px 8px; text-align: center; min-width: 0; }
.stat .v { font-family: var(--font-display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.stat.big { grid-column: 1 / -1; background: var(--accent); color: #2b1f2a; }
.stat.big .k { color: rgba(43,31,42,.75); }
.stat.big .v { font-size: 52px; }
.badge { display: inline-block; background: #ffd23f; color: #3a2a00; font-weight: 700; font-size: 12px; border-radius: 999px; padding: 3px 10px; margin-left: 8px; vertical-align: middle; }
.center { text-align: center; }

@media (max-height: 640px) and (min-width: 640px) {
  #menu .card { max-width: 760px; grid-template-columns: 230px 1fr; column-gap: 22px; align-items: start; padding: 16px 20px; }
  #menu .headcol { display: grid; gap: 10px; }
  #menu .title { font-size: 32px; }
  #pv { height: 110px; }
  .btn.primary { min-height: 50px; font-size: 22px; }
}
@media (max-width: 420px) { .title { font-size: 34px; } .card { padding: 16px 16px 14px; } }
/* 낮은 화면(휴대폰 가로): 한 화면에 다 들어가도록 줄인다 */
@media (max-height: 480px) {
  .overlay { padding: 6px; }
  .card { padding: 12px 16px; gap: 8px; }
  #menu .card { max-width: 780px; grid-template-columns: 210px 1fr; column-gap: 18px; align-items: start; }
  #menu .title { font-size: 28px; }
  #menu .sub { font-size: 12px; margin-top: 4px; }
  #pv { height: 86px; }
  #menu .bodycol { gap: 8px !important; }
  #menu .hint, #howto { display: none; }
  #nameInput { height: 38px; }
  .swatch { width: 34px; height: 34px; }
  .btn.primary { min-height: 46px; font-size: 22px; }
  #over .card, #pause .card { max-width: 420px; }
  #over .stat .v { font-size: 24px; } #over .stat.big .v { font-size: 38px; }
  .tbtn { height: 52px; font-size: 18px; border-radius: 18px; padding: 0 16px; background: color-mix(in srgb, var(--paper) 55%, transparent); }
  .tbtn.jump { background: color-mix(in srgb, var(--accent) 60%, transparent); min-width: 120px; }
  .tbtn.slide { min-width: 90px; }
}
@media (prefers-reduced-motion: reduce) { .btn, .round { transition: none; } }
</style>

<div id="app">
  <div id="fit">
    <div id="stage">
      <canvas id="game" aria-label="냥냥 러너 게임 화면"></canvas>
      <div class="hudbtns">
        <button class="round" id="btnPause" aria-label="일시정지"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg></button>
        <button class="round" id="btnMute" aria-label="소리 끄기"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="muteIcon" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
      </div>
    </div>
    <div id="touch">
      <button class="tbtn slide" id="tSlide" aria-label="숙이기">숙이기</button>
      <button class="tbtn jump" id="tJump" aria-label="점프">점프</button>
    </div>

    <section class="overlay" id="menu" aria-label="시작 화면">
      <div class="card">
        <div class="headcol">
          <div>
            <h1 class="title">냥냥 러너</h1>
            <p class="sub">우리 집 고양이가 장애물을 피해 달리며 생선을 모아요.</p>
          </div>
          <div class="pvwrap"><canvas id="pv" aria-label="고양이 미리보기"></canvas></div>
        </div>
        <div class="bodycol" style="display:grid;gap:14px;min-width:0">
          <div class="field">
            <label class="lbl" for="nameInput">고양이 이름</label>
            <input id="nameInput" type="text" maxlength="8" placeholder="예: 나비" autocomplete="off">
          </div>
          <div class="field">
            <span class="lbl" id="furLbl">털 색깔</span>
            <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="furLbl"></div>
          </div>
          <div class="field">
            <span class="lbl">얼굴 사진 (선택)</span>
            <div class="row">
              <div class="thumb" id="thumb" hidden></div>
              <label class="btn small" for="photo" style="display:inline-flex;align-items:center;cursor:pointer" id="photoLbl">사진 고르기</label>
              <input id="photo" type="file" accept="image/*" hidden>
              <button class="btn small" id="photoClear" type="button" hidden>사진 빼기</button>
            </div>
            <p class="hint">사진은 이 기기 안에서만 쓰여요. 어디로도 보내지 않아요.</p>
          </div>
          <div class="btns">
            <button class="btn primary" id="btnStart" type="button">달리기 시작</button>
            <p class="bestline" id="bestLine"></p>
          </div>
          <p class="hint" id="howto"><kbd>Space</kbd> 또는 <kbd>↑</kbd> 점프 (공중에서 한 번 더) · <kbd>↓</kbd> 숙이기 · <kbd>P</kbd> 일시정지<br>휴대폰은 화면을 탭하면 점프, 왼쪽 아래 버튼을 누르면 숙여요.</p>
        </div>
      </div>
    </section>

    <section class="overlay" id="pause" hidden aria-label="일시정지">
      <div class="card center">
        <h2 class="title">잠깐 쉬는 중</h2>
        <p class="sub" id="pauseName"></p>
        <div class="btns">
          <button class="btn primary" id="btnResume" type="button">계속 달리기</button>
          <button class="btn" id="btnPauseMenu" type="button">처음 화면으로</button>
        </div>
      </div>
    </section>

    <section class="overlay" id="over" hidden aria-label="결과">
      <div class="card">
        <div class="center">
          <h2 class="title">달리기 끝!</h2>
          <p class="sub" id="oMsg"></p>
        </div>
        <div class="stats">
          <div class="stat big"><div class="v" id="oScore">0</div><div class="k">점수<span class="badge" id="oNew" hidden>새 기록</span></div></div>
          <div class="stat"><div class="v" id="oFish">0</div><div class="k">생선</div></div>
          <div class="stat"><div class="v" id="oDist">0</div><div class="k">거리(m)</div></div>
          <div class="stat"><div class="v" id="oBest">0</div><div class="k">최고 점수</div></div>
        </div>
        <div class="btns">
          <button class="btn primary" id="btnAgain" type="button">다시 달리기</button>
          <button class="btn" id="btnChange" type="button">고양이 바꾸기</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
'use strict';

/* ───────── 기본 도구 ───────── */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const TAU = Math.PI * 2;
const mq = (q) => { try { return matchMedia(q).matches; } catch (e) { return false; } };
const reduceMotion = mq('(prefers-reduced-motion: reduce)');
const coarse = mq('(pointer: coarse)');

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장소를 못 쓰는 환경 */ }
  }
};

function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHex(r) { return '#' + r.map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((v, i) => lerp(v, B[i], t))); }
const shade = (h, amt) => (amt < 0 ? mix(h, '#000000', -amt) : mix(h, '#ffffff', amt));

/* ───────── 장면 크기 ───────── */
const H = 540;            // 논리 높이
const GROUND = 450;       // 고양이 발이 닿는 바닥
const FLOOR_TOP = 392;    // 바닥 판이 시작하는 선
let W = 960;              // 논리 너비 (화면 비율에 따라 720~1190)
let scalePx = 1;          // 논리 1칸이 화면에서 차지하는 css px
let hudScale = 1;

const canvas = $('#game');
const g = canvas.getContext('2d');
const stage = $('#stage');
const app = $('#app');
const fit = $('#fit');

function layout() {
  const r = fit.getBoundingClientRect();
  const cw = Math.max(200, r.width || window.innerWidth);
  const ch = Math.max(200, r.height || window.innerHeight);
  const a = clamp(cw / ch, 4 / 3, 2.2);
  W = Math.round(H * a);
  let dw = cw, dh = cw / a;
  if (dh > ch) { dh = ch; dw = ch * a; }
  const free = ch - dh;
  const reserve = 96;
  const top = (coarse && free >= reserve) ? Math.max(0, Math.min(free * 0.3, free - reserve)) : free / 2;
  stage.style.width = dw + 'px';
  stage.style.height = dh + 'px';
  stage.style.left = (cw - dw) / 2 + 'px';
  stage.style.top = top + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(dw * dpr);
  canvas.height = Math.round(dh * dpr);
  scalePx = dw / W;
  hudScale = clamp(0.8 / scalePx, 1, 1.8);
  layoutPreview();
}

/* ───────── 고양이 설정 ───────── */
const FURS = [
  { id: 'cheese', name: '치즈', body: '#f0a04b', stripe: '#d27a24', belly: '#ffe8c8', ear: '#ffb3a7', eye: '#3f8a52', tabby: true },
  { id: 'black',  name: '까망', body: '#34333d', stripe: '#26252d', belly: '#4a4955', ear: '#d79aa8', eye: '#f2c230' },
  { id: 'white',  name: '하양', body: '#f6f3ee', stripe: '#dad5cd', belly: '#ffffff', ear: '#ffb8b8', eye: '#4aa3d6' },
  { id: 'gray',   name: '고등어', body: '#98a2ad', stripe: '#5c6670', belly: '#e0e4e9', ear: '#f0b5b5', eye: '#d9a82a', tabby: true },
  { id: 'calico', name: '삼색', body: '#f7f2ea', stripe: '#2f2c33', belly: '#ffffff', ear: '#ffb8b0', eye: '#3f8a52', patches: ['#ee9a44', '#2f2c33'] }
];
const profile = Object.assign({ name: '', fur: 'cheese', custom: '#c99a6b', photo: null }, store.get('nyang.profile', {}));
let best = Number(store.get('nyang.best', 0)) || 0;
let muted = !!store.get('nyang.muted', false);
let photoImg = null;
if (profile.photo) { const im = new Image(); im.onload = () => { photoImg = im; syncMenu(); }; im.src = profile.photo; }

function currentLook() {
  if (profile.fur === 'custom') {
    const b = profile.custom || '#c99a6b';
    return { body: b, stripe: shade(b, -0.25), belly: shade(b, 0.55), ear: '#ffb3a7', eye: '#3f8a52', tabby: true };
  }
  return FURS.find((f) => f.id === profile.fur) || FURS[0];
}
const catName = () => (profile.name || '').trim() || '나비';
const saveProfile = () => store.set('nyang.profile', profile);

/* ───────── 소리 ───────── */
let actx = null, master = null;
function audioInit() {
  try {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.3;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function tone(f, dur, type, vol, to, delay) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(vol || 0.3, t0 + 0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol) {
  if (!actx || muted) return;
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(), gn = actx.createGain();
  s.buffer = buf; gn.gain.value = vol || 0.3;
  s.connect(gn); gn.connect(master); s.start();
}
const sfx = {
  jump() { tone(330, 0.14, 'triangle', 0.28, 640); },
  jump2() { tone(480, 0.14, 'triangle', 0.26, 860); },
  fish(c) { const b = 760 + Math.min(c, 24) * 22; tone(b, 0.09, 'triangle', 0.3); tone(b * 1.5, 0.12, 'triangle', 0.26, null, 0.06); },
  gold() { [880, 1100, 1320, 1760].forEach((f, i) => tone(f, 0.16, 'sine', 0.3, null, i * 0.07)); },
  hit() { noise(0.25, 0.4); tone(220, 0.3, 'sawtooth', 0.3, 70); },

  heart() { [660, 880, 1320].forEach((f, i) => tone(f, 0.13, 'sine', 0.3, null, i * 0.09)); },

addEventListener('keydown', (e) => {

/* ───────── 패턴 만들기 ───────── */
function addFish(x, y, gold) { items.push({ k: gold ? 'gold' : 'fish', x, y, t: rand(0, TAU) }); }
function addObs(type, x) {
  const d = OBS[type];
  const o = { type, x, w: d.w, h: d.h, y: GROUND - d.h - (d.lift || 0), t: rand(0, 6), rot: 0, vx: d.vx || 0, dead: false };
  obstacles.push(o); return o;
}
function fishArc(cx, span, n, peak, gold) {
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.5 : i / (n - 1);
    addFish(cx - span / 2 + t * span, GROUND - 38 - Math.sin(t * Math.PI) * peak, gold);
  }
}
const SAFE = { line: 1, high: 1, goldRain: 1 };
const PAT = {
  line(x) { const n = randInt(5, 8); for (let i = 0; i < n; i++) addFish(x + i * 44, GROUND - 32); return n * 44; },
  high(x) { const n = randInt(5, 7); const gold = Math.random() < 0.3; for (let i = 0; i < n; i++) addFish(x + i * 44, GROUND - 142, gold && i % 2 === 1); return n * 44; },
  goldRain(x) { fishArc(x + 170, 340, 5, 150, true); return 340; },
  jumpOver(x) {
    const type = pick(['box', 'plant', 'tower', 'vacuum']); const d = OBS[type];
    const span = Math.max(260, speed * 0.62) + d.w;
    fishArc(x + span / 2, span * 0.85, Math.round(span / 48), 118);
    addObs(type, x + span / 2 - d.w / 2);
    return span;
  },
  birdSlide(x) {
    addObs('bird', x + 130);
    for (let i = 0; i < 6; i++) addFish(x + 60 + i * 40, GROUND - 28);
    return 320;
  },
  twin(x) {
    const a = pick(['box', 'plant']), b = pick(['box', 'tower']);
    const da = OBS[a], db = OBS[b];
    const dd = speed * 0.75 + 130;
    const xa = x + 60, xb = xa + dd;
    addObs(a, xa); addObs(b, xb);
    fishArc(xa + da.w / 2, Math.min(240, dd * 0.7), 5, 118);
    fishArc(xb + db.w / 2, Math.min(240, dd * 0.7), 5, 118);
    return dd + db.w + 120;
  },
  yarn(x) {
    const span = Math.max(300, speed * 0.7);
    fishArc(x + span / 2, span * 0.8, 6, 112);
    addObs('yarn', x + span);
    return span + 60;
  }
};
function pickPattern() {
  if (patCount === 0) return 'line';
  if (patCount === 1) return 'jumpOver';
  const m = dist / 60;
  const pool = ['line', 'high', 'jumpOver', 'jumpOver', 'jumpOver', 'birdSlide'];
  if (m > 40) pool.push('twin', 'jumpOver');
  if (m > 90) pool.push('yarn', 'birdSlide');
  if (m > 150) pool.push('twin', 'yarn');
  if (m > 30 && Math.random() < 0.09) return 'goldRain';
  return pick(pool);
}
function spawn() {
  const name = pickPattern();
  const x0 = W + 70;
  const len = PAT[name](x0);
  const gap = SAFE[name] ? rand(90, 170) : rand(170, 300) * (1 - Math.min(0.3, dist / 60 / 600)) + speed * 0.5;
  if (!SAFE[name] && T - lastPower > 16 && Math.random() < 0.3) {
    items.push({ k: Math.random() < 0.55 ? 'tuna' : 'churu', x: x0 + len + gap * 0.5, y: GROUND - 64, t: 0 });
    lastPower = T;
  }
  patCount++;
  nextAt = dist + len + gap;
}

/* ───────── 효과 ───────── */
function burst(x, y, n, color, type) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(40, type === 'dust' ? 130 : 260);
    parts.push({ x, y, vx: Math.cos(a) * v * (type === 'dust' ? 0.8 : 1) - (type === 'dust' ? 60 : 0), vy: Math.sin(a) * v - (type === 'dust' ? 70 : 90), g: type === 'dust' ? 160 : 520,
      life: rand(0.3, 0.6), max: 0.6, size: rand(3, type === 'dust' ? 7 : 6), color, type });
  }
}
function floatText(x, y, text, color) { floaters.push({ x, y, text, color: color || '#fff', life: 0.9 }); }

/* ───────── 충돌 ───────── */
function catBox() {
  const sl = cat.slide > 0 && cat.ground;
  const w = sl ? 70 : 50, h = sl ? 32 : 60;
  return { x: cat.x - (sl ? 30 : 20), y: cat.y - h, w, h };
}
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
const catCenter = () => ({ x: cat.x + 6, y: cat.y - (cat.slide > 0 && cat.ground ? 18 : 38) });

function hurt(o) {
  lives--; combo = 0; comboT = 0;
  cat.inv = 1.6; cat.mood = 'hurt'; cat.moodT = 0.6;
  shake = reduceMotion ? 0 : 14;
  sfx.hit();
  burst(cat.x + 10, cat.y - 40, 10, '#ffd23f', 'star');
  if (lives <= 0) { dying(); return; }
  cat.vy = -520; cat.ground = false; cat.jumps = 1; cat.slide = 0;
}
function smash(o) {
  o.dead = true; bonus += 5; shake = reduceMotion ? 0 : 5;
  sfx.smash();
  burst(o.x + o.w / 2, o.y + o.h / 2, 12, '#ffe08a', 'star');
  burst(o.x + o.w / 2, o.y + o.h / 2, 8, '#d9b48a', 'dust');
  floatText(o.x + o.w / 2, o.y, '+5', '#ffe08a');
}
function dying() {
  state = 'dying'; dyingT = 0; endDuck();
  power.dash = 0; power.magnet = 0;
  cat.vy = -560; cat.ground = false; cat.mood = 'hurt'; cat.moodT = 99; cat.slide = 0;
  const s = score();
  if (s > best) { best = s; newRecord = true; store.set('nyang.best', best); }
  sfx.sad();
}
function showResult() {
  state = 'over'; overT = 0;
  app.classList.remove('playing');
  const name = catName();
  const s = score(), m = Math.floor(dist / 60);
  $('#oScore').textContent = s;
  $('#oFish').textContent = fishCount;
  $('#oDist').textContent = m;
  $('#oBest').textContent = best;
  $('#oNew').hidden = !newRecord;
  const msg = s < 150 ? '몸풀기로 딱 좋았어요.' : s < 400 ? '점점 빨라지고 있어요.' : s < 900 ? '사냥 감각이 살아났어요.' : '전설의 생선 사냥꾼이에요.';
  $('#oMsg').textContent = name + '의 오늘 기록 · ' + msg;
  show('#over', true);
  const b = $('#btnAgain'); if (b) b.focus({ preventScroll: true });
}

function collect(it) {
  const cc = catCenter();
  if (it.k === 'fish' || it.k === 'gold') {
    const gold = it.k === 'gold';
    combo++; comboT = 2.0;
    const mult = 1 + Math.min(3, Math.floor(combo / 10));
    const pts = (gold ? 50 : 10) * mult;
    bonus += pts; fishCount++; if (gold) goldCount++;
    cat.mood = 'happy'; cat.moodT = 0.35;
    (gold ? sfx.gold : () => sfx.fish(combo))();
    burst(it.x, it.y, gold ? 12 : 6, gold ? '#ffe066' : '#bfe8ff', 'star');
    floatText(it.x, it.y - 16, '+' + pts, gold ? '#ffd23f' : '#fff');
    healCount++;
    if (healCount >= 30) { healCount = 0; if (lives < 3) { lives++; sfx.heart(); floatText(cc.x, cc.y - 70, '하트 +1', '#ff7a8a'); } }
  } else if (it.k === 'tuna') {
    power.magnet = 6.5; sfx.power();
    burst(it.x, it.y, 14, '#c9a7ff', 'star');
    floatText(it.x, it.y - 20, '자석 6초', '#d9c2ff');
  } else if (it.k === 'churu') {
    power.dash = 5; cat.inv = Math.max(cat.inv, 0.2); sfx.power();
    burst(it.x, it.y, 16, '#ffb066', 'star');
    floatText(it.x, it.y - 20, '츄르 대시!', '#ffc58a');
  }
}

/* ───────── 업데이트 ───────── */
function updateParts(dt) {
  for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter((p) => p.life > 0);
  for (const f of floaters) { f.life -= dt; f.y -= 40 * dt; }
  floaters = floaters.filter((f) => f.life > 0);
  shake = Math.max(0, shake - dt * 40);
}

let dustT = 0;
function update(dt) {
  T += dt;
  const dashOn = power.dash > 0;
  const baseSp = Math.min(MAX_SPEED, BASE_SPEED + T * 6);
  speed = baseSp * (dashOn ? 1.6 : 1);
  dist += speed * dt; scroll = dist;
  hintT = Math.max(0, hintT - dt);

  cat.x += (catHomeX() - cat.x) * Math.min(1, 5 * dt);
  cat.runT += dt * (0.85 + speed / 800);

  if (!cat.ground) {
    cat.vy += GRAV * dt; cat.y += cat.vy * dt;
    if (cat.y >= GROUND) {
      cat.y = GROUND; cat.vy = 0; cat.ground = true; cat.jumps = 0;
      burst(cat.x - 6, cat.y - 2, 6, '#f4e8d8', 'dust');
      if (jumpBuf > 0) { jumpBuf = 0; jump(); }
      else if (keys.down) cat.slide = 0.5;
    }
  }
  jumpBuf = Math.max(0, jumpBuf - dt);
  if (cat.slide > 0) { cat.slide -= dt; if (keys.down && cat.ground) cat.slide = Math.max(cat.slide, 0.12); }
  cat.inv = Math.max(0, cat.inv - dt);
  if (cat.moodT > 0) { cat.moodT -= dt; if (cat.moodT <= 0) cat.mood = 'normal'; }

  comboT -= dt; if (comboT <= 0) combo = 0;
  power.magnet = Math.max(0, power.magnet - dt);
  if (power.dash > 0) { power.dash -= dt; if (power.dash <= 0) cat.inv = Math.max(cat.inv, 0.8); }

  dustT -= dt;
  if (cat.ground && dustT <= 0) {
    dustT = cat.slide > 0 ? 0.04 : 0.11;
    burst(cat.x - 28, cat.y - 2, cat.slide > 0 ? 2 : 1, '#f1e1cc', 'dust');
  }

  while (dist >= nextAt) spawn();

  const box = catBox();
  for (const o of obstacles) {
    o.x -= (speed + o.vx) * dt; o.t += dt;
    if (o.type === 'yarn') o.rot -= ((speed + o.vx) / 22) * dt;
    if (o.dead) continue;
    const hb = { x: o.x + 5, y: o.y + 5, w: o.w - 10, h: o.h - 8 };
    if (dashOn) {
      const ex = { x: box.x - 6, y: box.y - 10, w: box.w + 60, h: box.h + 20 };
      if (overlap(ex, hb)) smash(o);
    } else if (cat.inv <= 0 && overlap(box, hb)) hurt(o);
  }
  obstacles = obstacles.filter((o) => !o.dead && o.x + o.w > -140);

  const cc = catCenter();
  for (const it of items) {
    it.x -= speed * dt; it.t += dt * 4;
    if (power.magnet > 0 && (it.k === 'fish' || it.k === 'gold')) {
      const dx = cc.x - it.x, dy = cc.y - it.y, d = Math.hypot(dx, dy);
      if (d < 270 && d > 1) { const sp = 820 * dt; it.x += (dx / d) * sp; it.y += (dy / d) * sp; }
    }
    const rr = it.k === 'fish' || it.k === 'gold' ? 40 : 48;
    if (Math.hypot(cc.x - it.x, cc.y - it.y) < rr) { it.got = true; collect(it); }

function updateDying(dt) {
  dyingT += dt;
  speed *= Math.pow(0.02, dt);
  for (const o of obstacles) { o.x -= (speed + o.vx * 0.2) * dt; o.t += dt; }
  for (const it of items) { it.x -= speed * dt; it.t += dt * 4; }
  if (!cat.ground) {
    cat.vy += GRAV * dt; cat.y += cat.vy * dt;
    if (cat.y >= GROUND) { cat.y = GROUND; cat.vy = -140; if (Math.abs(cat.vy) < 150 && dyingT > 0.5) { cat.vy = 0; cat.ground = true; } }
  }

}

function updateMenu(dt) {

function drawCat(c, o) {

    c.save(); c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.clip();

  } else {
    c.fillStyle = look.patches ? look.patches[0] : near; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
    if (look.patches) { c.save(); c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.clip(); c.fillStyle = look.patches[1]; c.beginPath(); c.arc(hx - 12, hy - 8, 12, 0, TAU); c.fill(); c.restore(); }
    if (look.tabby) { c.strokeStyle = look.stripe; c.lineWidth = 3; for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(hx + i * 6, hy - hr + 1); c.lineTo(hx + i * 6, hy - hr + 7); c.stroke(); } }
    c.fillStyle = look.belly; c.beginPath(); c.ellipse(hx + 10, hy + 7, 9, 7, 0, 0, TAU); c.fill();
    const ex1 = hx + 3, ex2 = hx + 16, ey = hy - 3;

    } else {
      [ex1, ex2].forEach((ex) => {

  }
  c.restore();
}

const SKY = {

  night: { top: '#1a2150', bot: '#3a4090', dark: 0.46 },

const CYCLE = [[0, 'day'], [0.32, 'day'], [0.5, 'dusk'], [0.65, 'night'], [0.86, 'night'], [0.95, 'dawn'], [1, 'day']];
function skyAt(p) {
  for (let i = 0; i < CYCLE.length - 1; i++) {
    const [p0, n0] = CYCLE[i], [p1, n1] = CYCLE[i + 1];
    if (p >= p0 && p <= p1) {

}

    g.fillStyle = '#e1f0ff'; g.beginPath(); g.ellipse(x + w / 2 + 2, y + h / 2 + 9, 20, 8, 0, 0, TAU); g.fill();

    g.strokeStyle = '#1e1a28'; g.lineWidth = 2; g.beginPath(); g.moveTo(x + 8, y + 10); g.lineTo(x + 20, y + 14); g.stroke();

function drawParticles() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    g.globalAlpha = a; g.fillStyle = p.color;
    if (p.type === 'star') {
      g.save(); g.translate(p.x, p.y); g.rotate(p.life * 8); g.beginPath();
      for (let k = 0; k < 4; k++) { const ang = k * Math.PI / 2; g.lineTo(Math.cos(ang) * p.size * 1.6, Math.sin(ang) * p.size * 1.6); g.lineTo(Math.cos(ang + Math.PI / 4) * p.size * 0.5, Math.sin(ang + Math.PI / 4) * p.size * 0.5); }
      g.closePath(); g.fill(); g.restore();
    } else { g.beginPath(); g.arc(p.x, p.y, p.size * (0.6 + a * 0.6), 0, TAU); g.fill(); }
  }
  g.globalAlpha = 1;
  for (const f of floaters) {
    g.globalAlpha = clamp(f.life / 0.5, 0, 1);
    g.lineWidth = 4; g.strokeStyle = 'rgba(43,34,48,.8)'; g.font = "26px Jua, 'Noto Sans KR', sans-serif"; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.strokeText(f.text, f.x, f.y); g.fillStyle = f.color; g.fillText(f.text, f.x, f.y);
  }
  g.globalAlpha = 1;
}

const pv = $('#pv'); const pg = pv.getContext('2d');
let pvW = 200, pvH = 128;
function layoutPreview() {
  const r = pv.getBoundingClientRect();
  if (!r.width) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  pvW = r.width; pvH = r.height;
  pv.width = Math.round(pvW * dpr); pv.height = Math.round(pvH * dpr);
}
function drawPreview() {
  const dpr = pv.width / (pvW || 1);
  pg.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gr = pg.createLinearGradient(0, 0, 0, pvH); gr.addColorStop(0, '#f6e7d0'); gr.addColorStop(0.68, '#ecd3b0'); gr.addColorStop(0.68, '#cd935c'); gr.addColorStop(1, '#a8693a');
  pg.fillStyle = gr; pg.fillRect(0, 0, pvW, pvH);
  pg.fillStyle = '#d9604f'; pg.fillRect(0, pvH * 0.8, pvW, pvH * 0.14);
  const s = Math.min(1.1, pvH / 150);
  drawCat(pg, { x: pvW / 2 - 8, y: pvH * 0.87, s, pose: 'run', t: T, look: currentLook(), mood: 'normal', photo: photoImg });
}

/* ───────── 렌더 ───────── */
function render() {
  const sc = canvas.width / W;
  g.setTransform(sc, 0, 0, sc, 0, 0);
  g.clearRect(0, 0, W, H);
  g.save();
  if (shake > 0 && !reduceMotion) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  const p = ((dist / 60) / 420) % 1;
  drawBackground(state === 'menu' ? ((menuScroll / 60 / 420) % 1) * 0.28 : p);
  for (const o of obstacles) drawObstacle(o);
  for (const it of items) drawItem(it);
  drawCatInGame();
  drawParticles();
  g.restore();
  if (state === 'playing' || state === 'paused' || state === 'dying') drawHUD();
  if (state === 'menu') drawPreview();
}

/* ───────── 루프 ───────── */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  if (state === 'playing') update(dt);
  else if (state === 'dying') updateDying(dt);
  else if (state === 'menu') updateMenu(dt);
  else if (state === 'over') { overT += dt; updateParts(dt); }
  render();
  requestAnimationFrame(frame);
}

/* ───────── 시작 ───────── */
buildSwatches();
syncMenu();
syncMute();
layout();
if ('ResizeObserver' in window) new ResizeObserver(layout).observe(fit);
addEventListener('resize', layout);
try { if (document.fonts && document.fonts.load) document.fonts.load("20px Jua"); } catch (e) { /* 글꼴 대기 실패는 무시 */ }
requestAnimationFrame(frame);

// 점검용: 화면 밖에서 상태를 읽을 수 있게 둔다.
window.__nyang = {
  get: () => ({ state, score: score(), lives, dist, fish: fishCount, speed, combo, W, items: items.length, obstacles: obstacles.length, power: { ...power }, catY: cat.y }),
  setLook: (fur) => { profile.fur = fur; syncMenu(); },
  give: (k) => { items.push({ k, x: cat.x + 90, y: cat.y - 52, t: 0 }); },
  obs: (type, x) => addObs(type, x || W * 0.72),
  hold: () => { nextAt = Infinity; }
};
})();
</script>
