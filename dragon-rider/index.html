<title>드래곤 라이더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-bleed voxel sky (3D canvas) with chunky block-style panels floating on top */
:root {
  --sky: #8fd3f7;
  --ink: #1d2a4a;
  --panel: #f3faff;
  --panel-line: #c9def0;
  --sun: #ffc93c;
  --sun-deep: #d8920c;
  --leaf: #4fbf5a;
  --leaf-deep: #2b8538;
  --berry: #ff5a6e;
  --berry-deep: #b92a43;
  --muted: #5d6a88;
  --white: #ffffff;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); }
body {
  font-family: var(--font-display);
  color: var(--ink);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  overscroll-behavior: none;
}
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-bottom, 0px));
  pointer-events: none;
  box-sizing: border-box;
}
.screen > * { pointer-events: auto; }
.screen.center { align-items: center; justify-content: center; background: rgba(29, 42, 74, 0.28); }
.spacer { flex: 1; pointer-events: none !important; }

/* ---------- Blocks & buttons ---------- */
.panel {
  background: var(--panel);
  border: 4px solid var(--ink);
  border-radius: 8px;
  box-shadow: 0 8px 0 rgba(29, 42, 74, 0.35);
  padding: 22px 20px;
  width: min(440px, 100%);
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 14px;
  text-align: center;
}
.panel h2 { margin: 0; font-size: 30px; font-weight: 400; text-wrap: balance; line-height: 1.15; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

.btn {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--ink);
  background: var(--sun);
  border: 3px solid var(--ink);
  border-radius: 8px;
  padding: 12px 22px;
  box-shadow: 0 6px 0 var(--sun-deep), 0 6px 0 3px var(--ink);
  cursor: pointer;
  transform: translateY(0);
  transition: transform .06s, box-shadow .06s;
  margin-bottom: 9px;
  position: relative;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--sun-deep), 0 1px 0 3px var(--ink); }
.btn:focus-visible { outline: 4px solid var(--white); outline-offset: 4px; }
.btn.big { font-size: 30px; padding: 14px 28px; }
.btn.alt { background: var(--leaf); color: var(--white); box-shadow: 0 6px 0 var(--leaf-deep), 0 6px 0 3px var(--ink); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn.alt:active { box-shadow: 0 1px 0 var(--leaf-deep), 0 1px 0 3px var(--ink); }
.btn.ghost { background: var(--white); box-shadow: 0 6px 0 var(--panel-line), 0 6px 0 3px var(--ink); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--panel-line), 0 1px 0 3px var(--ink); }
.btn.small { font-size: 18px; padding: 8px 14px; }
.btn[disabled] { background: #d9dfea; color: var(--muted); box-shadow: 0 6px 0 #aeb7c9, 0 6px 0 3px var(--ink); cursor: default; }
.btn[disabled]:active { transform: none; }

.coinpill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--white); border: 3px solid var(--ink); border-radius: 999px;
  padding: 4px 14px 4px 6px; font-size: 22px;
  box-shadow: 0 4px 0 rgba(29,42,74,.3);
  font-variant-numeric: tabular-nums;
}
.coinpill svg { width: 26px; height: 26px; }
.coinpill.bump { animation: bump .25s; }
@keyframes bump { 50% { transform: scale(1.18); } }

.iconbtn {
  width: 48px; height: 48px; border-radius: 8px;
  border: 3px solid var(--ink); background: var(--white);
  box-shadow: 0 4px 0 rgba(29,42,74,.3);
  display: grid; place-items: center; cursor: pointer; padding: 0;
  font-family: var(--font-display); color: var(--ink);
}
.iconbtn svg { width: 26px; height: 26px; }
.iconbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(29,42,74,.3); }
#btnSound {
  position: fixed; z-index: 30;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(max(14px, env(safe-area-inset-top, 0px)) + 56px);
}

/* ---------- Menu ---------- */
.menu-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.logo { display: flex; flex-direction: column; gap: 2px; }
.logo small { font-size: 18px; color: var(--ink); background: var(--sun); border: 3px solid var(--ink); border-radius: 6px; padding: 2px 10px; align-self: flex-start; transform: rotate(-3deg); }
.logo h1 {
  margin: 0; font-weight: 400; font-size: clamp(44px, 12vw, 76px); line-height: 1;
  color: var(--white);
  text-shadow: 0 4px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 3px 4px 0 var(--ink), -3px 4px 0 var(--ink), 0 9px 0 rgba(29,42,74,.3);
  letter-spacing: 1px; word-break: keep-all; text-wrap: balance;
}
.menu-bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.dragon-tag {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: rgba(255,255,255,.88); border: 3px solid var(--ink); border-radius: 8px; padding: 6px 16px;
}
.dragon-tag b { font-size: 24px; font-weight: 400; }
.dragon-tag span { font-size: 15px; color: var(--muted); }
.menu-actions { display: flex; flex-direction: column; gap: 6px; width: min(360px, 100%); }
.menu-actions .btn { width: 100%; }
.badge {
  position: absolute; top: -14px; right: -8px;
  background: var(--berry); color: var(--white); font-size: 15px;
  border: 3px solid var(--ink); border-radius: 999px; padding: 2px 10px;
  animation: wiggle 1.2s infinite;
}
@keyframes wiggle { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg) scale(1.06); } }
.best { margin: 0; font-size: 17px; color: var(--ink); background: rgba(255,255,255,.7); border-radius: 999px; padding: 3px 12px; font-variant-numeric: tabular-nums; }

/* ---------- HUD ---------- */
#hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; }
#hud > * { pointer-events: none; }
#hearts { display: flex; flex-wrap: wrap; gap: 3px; max-width: 190px; }
#hearts svg { width: 30px; height: 30px; filter: drop-shadow(0 3px 0 rgba(29,42,74,.3)); }
#hearts svg.lost { opacity: .9; }
#hearts .shield { width: 30px; height: 30px; }
.hud-mid { text-align: center; color: var(--white); text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); font-variant-numeric: tabular-nums; }
.hud-mid b { font-size: 40px; font-weight: 400; line-height: 1; }
.hud-mid small { font-size: 20px; }
.hud-right { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.hud-right .iconbtn { pointer-events: auto; }
#hint {
  position: fixed; left: 50%; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 74px); transform: translateX(-50%);
  background: rgba(29,42,74,.85); color: var(--white); padding: 10px 18px; border-radius: 10px;
  font-size: 19px; text-align: center; width: max-content; max-width: calc(100% - 32px); box-sizing: border-box;
  pointer-events: none; transition: opacity .6s; line-height: 1.4;
}
#hint.fade { opacity: 0; }
#btnFire {
  position: fixed; z-index: 20;
  right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
  bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 22px));
  width: 96px; height: 96px; border-radius: 50%;
  border: 4px solid var(--ink);
  background: conic-gradient(rgba(29,42,74,.55) calc(var(--cd, 0) * 360deg), #ff7a2f 0);
  box-shadow: 0 6px 0 var(--berry-deep), 0 6px 0 4px var(--ink);
  color: var(--white); font-family: var(--font-display); font-size: 19px; text-shadow: 0 2px 0 var(--ink);
  display: grid; place-items: center; cursor: pointer; padding: 0;
  touch-action: none;
}
#btnFire svg { width: 40px; height: 40px; display: block; margin: 0 auto -2px; }
#btnFire:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--berry-deep), 0 2px 0 4px var(--ink); }

/* ---------- Game over ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats > div { background: var(--white); border: 3px solid var(--ink); border-radius: 8px; padding: 10px 6px; display: flex; flex-direction: column; gap: 2px; }
.stats small { font-size: 15px; color: var(--muted); }
.stats b { font-size: 30px; font-weight: 400; font-variant-numeric: tabular-nums; }
.note { margin: 0; font-size: 18px; color: var(--muted); }
.note.good { color: var(--leaf-deep); background: #e3f7e0; border: 3px dashed var(--leaf); border-radius: 8px; padding: 8px; }
.note.record { color: var(--berry-deep); }

/* ---------- Shop ---------- */
#shop { background: rgba(29, 42, 74, 0.35); }
.shop-wrap {
  width: min(760px, 100%); margin: 0 auto; flex: 1; min-height: 0;
  background: var(--panel); border: 4px solid var(--ink); border-radius: 10px;
  box-shadow: 0 8px 0 rgba(29, 42, 74, 0.35);
  display: flex; flex-direction: column; overflow: hidden;
}
.shop-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 3px solid var(--panel-line); flex-wrap: wrap; }
.shop-head h2 { flex: 1; margin: 0; font-size: clamp(20px, 5.4vw, 26px); font-weight: 400; min-width: 0; word-break: keep-all; }
.shop-head .btn { margin-bottom: 4px; }
.shop-sub { margin: 10px 16px 0; font-size: 16px; color: var(--muted); line-height: 1.45; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px;
  padding: 14px 14px 22px; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
}
@media (max-width: 460px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 10px 20px; } }
.card {
  background: var(--white); border: 3px solid var(--ink); border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 8px 4px;
  min-width: 0; text-align: center;
}
.card.current { background: #fff6d6; border-color: var(--sun-deep); box-shadow: 0 0 0 3px var(--sun); }
.card img { width: 100%; max-width: 150px; aspect-ratio: 1; object-fit: contain; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #ffffff 0 30%, #d6ecfb 70%); }
.card .nm { font-size: 22px; line-height: 1.1; }
.card .lvl { font-size: 13px; color: var(--muted); }
.card .btn { width: 100%; font-size: 18px; padding: 8px 6px; box-sizing: border-box; }
.card .need { font-size: 13px; color: var(--muted); min-height: 1em; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.chip { font-size: 13px; padding: 2px 8px; border-radius: 999px; border: 2px solid var(--ink); background: #e8f3fc; white-space: nowrap; }
.chip.fire { background: #ffe0cf; } .chip.mag { background: #efe2ff; } .chip.dbl { background: #fff1c2; } .chip.shd { background: #d7fbff; } .chip.hp { background: #ffe1e6; } .chip.spd { background: #dff7dc; }
.price { display: inline-flex; align-items: center; gap: 4px; }
.price svg { width: 20px; height: 20px; }

/* ---------- Hatch ---------- */
.hatch-top { display: flex; justify-content: center; }
#hatchMsg {
  margin: 8px 0 0; font-size: 26px; color: var(--white); text-align: center;
  text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink);
}
.reveal { align-self: center; animation: pop .45s cubic-bezier(.2, 1.6, .5, 1); }
.reveal small { font-size: 18px; color: var(--berry-deep); }
.reveal h2 { font-size: 40px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
#flash { position: fixed; inset: 0; background: var(--white); opacity: 0; pointer-events: none; z-index: 40; transition: opacity .5s; }
#flash.on { opacity: 1; transition: none; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--sky); font-size: 28px; color: var(--ink); z-index: 50; text-align: center; padding: 16px; }

@media (prefers-reduced-motion: reduce) {
  .badge, .reveal, .coinpill.bump { animation: none; }
}
</style>

  <div class="menu-top">

<section id="pause" class="screen center" hidden>

</section>

<div id="flash"></div>
<button id="btnSound" class="iconbtn" aria-label="소리 끄기/켜기" hidden></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

function pixelSVG(rows, pal) {

  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (pal[ch]) r += `<rect x="${x}" y="${y}" width="1.04" height="1.04" fill="${pal[ch]}"/>`;
  }));
  return `<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

  soundOn: pixelSVG(['...K...', '..KK.K.', 'KKKK..K', 'KKKK.KK', 'KKKK..K', '..KK.K.', '...K...'], { K: '#1d2a4a' }),
  soundOff: pixelSVG(['...K...', '..KK...', 'KKKKR.R', 'KKKK.R.', 'KKKKR.R', '..KK...', '...K...'], { K: '#1d2a4a', R: '#ff4d6a' }),
};
document.querySelectorAll('.ico-coin').forEach((e) => (e.outerHTML = ICON.coin));

/* =========================================================

const DRAGONS = [
  { name: '풀잎이', price: 0, body: 0x62c85b, body2: 0x52b24e, belly: 0xf6e7a1, wing: 0xa7e889, bone: 0x2f7d3a, horn: 0xfff3d1, accent: 0xffcf3a,

    hearts: 4, agility: 1.15, fire: false, magnet: false, double: false, shield: false, scale: 1.04, hornLen: 3, wingLen: 11,
    egg: [0xe2f4ff, 0x3d9de6], desc: '하트가 많고 몸이 날쌘 물 드래곤' },
  { name: '불꽃이', price: 300, body: 0xe8483a, body2: 0xcf3a2f, belly: 0xffd27a, wing: 0xff9b4a, bone: 0x8e1f1f, horn: 0x3a2a2a, accent: 0xffd23f,

const PGEO = new THREE.BoxGeometry(1, 1, 1);
const pmats = new Map();
function pmat(c, basic) { const k = c + (basic ? 'b' : ''); if (!pmats.has(k)) pmats.set(k, basic ? new THREE.MeshBasicMaterial({ color: c }) : new THREE.MeshLambertMaterial({ color: c })); return pmats.get(k); }

function burst(x, y, z, colors, n, spd, size, grav, life, scroll, basic) {
  for (let i = 0; i < n && parts.length < 320; i++) {
    const m = ppool.pop() || new THREE.Mesh(PGEO);
    m.material = pmat(colors[i % colors.length], basic);
    m.position.set(x, y, z);
    const sz = size * (0.6 + Math.random() * 0.8); m.scale.setScalar(sz);
    const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.35, Math.random() - 0.5).normalize().multiplyScalar(spd * (0.4 + Math.random() * 0.8));
    const l = life * (0.6 + Math.random() * 0.6);
    parts.push({ m, v, life: l, max: l, grav, scroll, sz, spin: (Math.random() - 0.5) * 10 });
    scene.add(m);

}
function updateParticles(dt, dz) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.m); ppool.push(p.m); parts.splice(i, 1); continue; }
    p.v.y -= p.grav * dt;
    p.m.position.addScaledVector(p.v, dt);
    if (p.scroll) p.m.position.z += dz;
    if (p.m.position.y < 0.1) { p.m.position.y = 0.1; p.v.y *= -0.3; p.v.x *= 0.7; p.v.z *= 0.7; }

  else {
    const np = nextEggPrice();
    if (np != null) { oe.hidden = false; oe.className = 'note'; oe.textContent = '다음 알까지 코인 ' + (np - save.coins) + '개 남았어요'; }
    else oe.hidden = true;
  }
  if (canBuyAny()) oe.className = 'note good';
  show('hud', 'over');
}

/* ---------- Shop ---------- */
const thumbs = { egg: [], dragon: [] };
function renderShop() {
  $('#shopCoins').textContent = save.coins;
  const grid = $('#shopGrid'); grid.innerHTML = '';
  DRAGONS.forEach((D, i) => {
    const owned = save.owned.includes(i);
    const isCur = save.sel === i;
    const card = document.createElement('div');
    card.className = 'card' + (isCur ? ' current' : '');
    const img = owned ? thumbs.dragon[i] : thumbs.egg[i];
    let btn, need = '';
    if (owned) btn = `<button class="btn ${isCur ? 'ghost' : 'alt'}" data-act="ride" data-i="${i}" ${isCur ? 'disabled' : ''}>${isCur ? '타는 중' : '이 드래곤 타기'}</button>`;
    else {
      const ok = save.coins >= D.price;
      btn = `<button class="btn" data-act="buy" data-i="${i}" ${ok ? '' : 'disabled'}><span class="price">${ICON.coin}${D.price}</span> 알 사기</button>`;
      if (!ok) need = `코인 ${D.price - save.coins}개 더 필요해요`;
    }
    card.innerHTML = `${img ? `<img src="${img}" alt="${owned ? D.name : D.name + ' 알'}">` : ''}
      <div class="nm">${owned ? D.name : '??? 알'}</div>
      <div class="lvl">${owned ? D.desc : (i + 1) + '단계 드래곤이 태어나요'}</div>
      <div class="chips">${chipsHTML(D)}</div>
      ${btn}<div class="need">${need}</div>`;
    grid.appendChild(card);
  });
}
$('#shopGrid').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]'); if (!b || b.disabled) return;
  ensureAudio();
  const i = +b.dataset.i;
  if (b.dataset.act === 'ride') { save.sel = i; persist(); SFX.click(); mountPlayer(); renderShop(); }
  else if (b.dataset.act === 'buy') {
    const D = DRAGONS[i];
    if (save.coins < D.price || save.owned.includes(i)) return;
    save.coins -= D.price; save.owned.push(i); persist(); SFX.buy();
    startHatch(i);
  }
});
let shopFrom = 'menu';
function openShop(from) {
  shopFrom = from; mode = 'shop';
  if (from === 'over') { clearWorld(); playerRoot.position.set(0, 4, 0); p.x = 0; p.y = 4; if (playerModel) playerModel.root.rotation.set(0, 0, 0); }
  playerRoot.visible = true;
  renderShop(); show('shop'); SFX.click();
}

/* ---------- Hatching ---------- */
const hatch = { i: 0, t: 0, egg: null, model: null, cracks: 0, revealed: false };
const hatchRoot = new THREE.Group(); hatchRoot.position.set(0, 4, 0); scene.add(hatchRoot);
function startHatch(i) {
  mode = 'hatch';
  hatch.i = i; hatch.t = 0; hatch.cracks = 0; hatch.revealed = false;
  clearWorld();
  playerRoot.visible = false; playerShadow.visible = true;
  if (hatch.egg) hatchRoot.remove(hatch.egg);
  if (hatch.model) hatchRoot.remove(hatch.model.root);
  hatch.egg = buildEgg(DRAGONS[i], 0.2);
  hatchRoot.add(hatch.egg);
  hatchRoot.rotation.set(0, 0, 0);
  $('#hatchMsg').textContent = '두근두근... 알이 움직여요!';
  $('#hatchReveal').hidden = true;
  show('hatch');
}
function updateHatch(dt) {
  hatch.t += dt;
  const t = hatch.t;
  if (!hatch.revealed) {
    const k = Math.min(1, t / 2.6);
    hatch.egg.rotation.z = Math.sin(t * (14 + k * 16)) * 0.22 * k;
    hatch.egg.position.y = Math.abs(Math.sin(t * 6)) * 0.12 * k;
    const marks = [0.7, 1.4, 1.9, 2.3, 2.55];
    if (hatch.cracks < marks.length && t > marks[hatch.cracks]) {
      hatch.cracks++; SFX.crack();
      burst(0, 4 + (Math.random() - 0.3) * 1.2, 0.4, DRAGONS[hatch.i].egg, 4, 3, 0.1, 9, 0.6, false);
      if (hatch.cracks === 3) $('#hatchMsg').textContent = '와! 금이 갔어요!';
    }
    if (t > 2.8) {
      hatch.revealed = true;
      hatchRoot.remove(hatch.egg);
      const D = DRAGONS[hatch.i];
      burst(0, 4, 0, D.egg.concat([0xffffff]), 50, 9, 0.24, 11, 1.2, false);
      burst(0, 4, 0, [0xffd23f, 0xffffff, 0x7fefff], 30, 7, 0.14, 1, 1.4, false, true);
      SFX.fanfare(); buzz(60);
      const fl = $('#flash'); fl.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove('on')));
      hatch.model = getDragon(hatch.i);
      hatch.model.root.rotation.set(0, 0, 0); hatch.model.root.position.set(0, 0, 0);
      hatch.model.root.scale.setScalar(0.01);
      hatchRoot.add(hatch.model.root);
      $('#hatchMsg').textContent = '';
      $('#hatchName').textContent = D.name;
      $('#hatchChips').innerHTML = chipsHTML(D);
      $('#hatchReveal').hidden = false;
      hatch.revealT = t;
    }
  } else {
    const k = Math.min(1, (t - hatch.revealT) / 0.6);
    const e = 1 - Math.pow(1 - k, 3);
    hatch.model.root.scale.setScalar(0.01 + e * 1.05);
    hatchRoot.rotation.y = Math.PI + t * 0.7;
    animDragon(hatch.model, t, 9);
    if (Math.random() < dt * 6) burst((Math.random() - 0.5) * 3, 4 + Math.random() * 2, (Math.random() - 0.5) * 3, [0xffd23f, 0xffffff], 1, 1, 0.08, -1, 0.9, false, true);
  }
}
function finishHatch(ride) {
  if (hatch.model) hatchRoot.remove(hatch.model.root);
  hatch.model = null;
  hatchRoot.rotation.set(0, 0, 0);
  if (ride) { save.sel = hatch.i; persist(); startGame(); }
  else { mountPlayer(); playerRoot.position.set(0, 4, 0); playerRoot.visible = true; mode = 'shop'; renderShop(); show('shop'); }
}

/* ---------- Buttons ---------- */
$('#btnPlay').addEventListener('click', startGame);
$('#btnShop').addEventListener('click', () => { ensureAudio(); openShop('menu'); });
$('#btnRetry').addEventListener('click', startGame);
$('#btnOverShop').addEventListener('click', () => { ensureAudio(); openShop('over'); });
$('#btnOverMenu').addEventListener('click', () => { SFX.click(); goMenu(); });
$('#btnPause').addEventListener('click', () => { ensureAudio(); pauseGame(); });
$('#btnResume').addEventListener('click', resumeGame);
$('#btnQuit').addEventListener('click', () => { persist(); SFX.click(); goMenu(); });
$('#btnShopBack').addEventListener('click', () => { SFX.click(); goMenu(); });
$('#btnHatchRide').addEventListener('click', () => finishHatch(true));
$('#btnHatchShop').addEventListener('click', () => { SFX.click(); finishHatch(false); });
function toggleSound() { ensureAudio(); save.muted = !save.muted; persist(); renderSoundBtn(); SFX.click(); }
$('#btnSound').addEventListener('click', toggleSound);
$('#btnSound2').addEventListener('click', toggleSound);
document.addEventListener('visibilitychange', () => { if (document.hidden) { persist(); if (mode === 'play') pauseGame(); } });

/* =========================================================
   Main loop
   ========================================================= */
const tmpPos = new THREE.Vector3(), tmpLook = new THREE.Vector3();
function updatePlay(dt) {
  const D = cur();
  const d = difficulty();
  p.speed = 17 + 15 * d;
  let dz = p.speed * dt;
  if (mode === 'dying') { p.speed *= Math.max(0, p.dying / 1.3); dz = p.speed * dt; }
  p.dist += dz * 0.5 * (mode === 'play' ? 1 : 0);

  // controls
  if (mode === 'play') {
    const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    const ky = (keys.ArrowUp || keys.KeyW ? 1 : 0) - (keys.ArrowDown || keys.KeyS ? 1 : 0);
    p.tx = clamp(p.tx + kx * 11 * D.agility * dt, -XR, XR);
    p.ty = clamp(p.ty + ky * 9 * D.agility * dt, YMIN, YMAX);
  }
  const ease = 1 - Math.exp(-dt * 9 * D.agility);
  const px0 = p.x, py0 = p.y;
  p.x += (p.tx - p.x) * ease; p.y += (p.ty - p.y) * ease;
  const vx = (p.x - px0) / Math.max(dt, 1e-4), vy = (p.y - py0) / Math.max(dt, 1e-4);

  // player transform
  playerRoot.position.set(p.x, p.y, 0);
  const m = playerModel;
  if (mode === 'dying') {
    p.dying -= dt;
    m.root.rotation.z += dt * 7; m.root.rotation.x = Math.min(0.6, m.root.rotation.x + dt);
    p.ty = Math.max(YMIN, p.ty - dt * 3);
    if (p.dying <= 0) gameOver();
  } else {
    m.root.rotation.z += (clamp(-vx * 0.05, -0.6, 0.6) - m.root.rotation.z) * Math.min(1, dt * 8);
    m.root.rotation.x += (clamp(vy * 0.045, -0.45, 0.45) - m.root.rotation.x) * Math.min(1, dt * 8);
  }
  p.inv = Math.max(0, p.inv - dt);
  playerRoot.visible = p.inv > 0 && mode === 'play' ? Math.floor(p.inv * 12) % 2 === 0 : true;
  shieldMesh.visible = p.shield;
  if (p.shield) { shieldMesh.rotation.y += dt; shieldMesh.scale.setScalar(1 + Math.sin(time * 4) * 0.04); }
  p.fireCd = Math.max(0, p.fireCd - dt);
  if (D.fire) $('#btnFire').style.setProperty('--cd', (p.fireCd / D.fireCd).toFixed(3));

  // spawn
  p.untilRow -= dz;
  if (p.untilRow <= 0 && mode === 'play') {
    const G = 14.5 - 5 * d;
    p.untilRow += G;
    spawnRow(SPAWN_Z);
    if (Math.random() < 0.5) spawnCoins(SPAWN_Z + G / 2);
  }

  scrollDecos(dz);

  // obstacles
  const hx = p.x, hy = p.y;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    if (o.dead) { obstacles.splice(i, 1); continue; }
    o.z += dz;
    if (o.type === 'ball') {
      if (o.vx) { o.x += o.vx * dt; if (o.x > XR) { o.x = XR; o.vx *= -1; } if (o.x < -XR) { o.x = -XR; o.vx *= -1; } }
      o.y = o.baseY + Math.sin(time * 2 + o.phase) * o.bob;
      o.mesh.rotation.y += dt * 1.5; o.mesh.rotation.x = Math.sin(time + o.phase) * 0.3;
    }
    o.mesh.position.set(o.x, o.y, o.z);
    if (o.shadow) { o.shadow.position.set(o.x, 0.04, o.z); const k = 1 / (1 + o.y * 0.12); o.shadow.material.opacity = 1; o.shadow.scale.x = (o.type === 'bar' ? o.hx * 2.2 : 1.6) * k; }
    if (o.z > 5) { scene.remove(o.mesh); if (o.shadow) scene.remove(o.shadow); obstacles.splice(i, 1); continue; }
    if (mode === 'play' && Math.abs(o.z) < 3.5) {
      if (overlap(o, hx, hy, 0.2, 0.62) || overlap(o, hx, hy + 0.2, -1.6, 0.42)) hitPlayer();
    }
  }

  // coins
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.z += dz;
    if (D.magnet && mode === 'play') {
      const dx = p.x - c.x, dy = p.y - c.y, dzz = 0 - c.z;
      const dd = Math.hypot(dx, dy, dzz);
      if (dd < 6.5 || c.pulled) {
        c.pulled = true;
        const sp = Math.min(1, dt * 9);
        c.x += dx * sp; c.y += dy * sp; c.z += dzz * sp;
      }
    }
    c.mesh.position.set(c.x, c.y + Math.sin(time * 3 + c.z * 0.3) * 0.1, c.z);
    c.mesh.rotation.y += dt * 3.2;
    if (mode === 'play') {
      const dx = p.x - c.x, dy = p.y + 0.15 - c.y, dzz = c.z;
      if (dx * dx + dy * dy + dzz * dzz < 1.25 * 1.25) { collect(c); scene.remove(c.mesh); coins.splice(i, 1); continue; }
    }
    if (c.z > 5) { scene.remove(c.mesh); coins.splice(i, 1); }
  }

  // fireballs
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const f = fireballs[i];
    f.life -= dt;
    f.g.position.z -= 58 * dt;
    f.g.rotation.x += dt * 9; f.g.rotation.y += dt * 7;
    burst(f.g.position.x, f.g.position.y, f.g.position.z + 0.4, [0xffd23f, 0xff7a2f, 0xff4d3a], 1, 1.5, 0.16, -1, 0.3, false, true);
    let hit = false;
    for (const o of obstacles) {
      if (!o.dead && overlap(o, f.g.position.x, f.g.position.y, f.g.position.z, 0.7)) { destroyObstacle(o); hit = true; break; }
    }
    if (hit || f.life <= 0) { scene.remove(f.g); fireballs.splice(i, 1); }
  }

  $('#dist').textContent = Math.floor(p.dist);
  p.shake = Math.max(0, p.shake - dt);
  return dz;
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'loading') return;
  time += dt;
  let dz = 0;
  if (mode === 'play' || mode === 'dying') dz = updatePlay(dt);
  else if (mode === 'menu' || mode === 'shop') {
    dz = 7 * dt; scrollDecos(dz);
    playerRoot.position.y = 4 + Math.sin(time * 1.6) * 0.18;
    p.y = playerRoot.position.y; p.x = 0;
    playerRoot.position.x = 0;
  } else if (mode === 'hatch') { updateHatch(dt); scrollDecos(2 * dt); }
  else if (mode === 'over') {
    playerRoot.position.y += Math.sin(time * 1.6) * 0.002;
  }
  if (mode === 'pause') dt = 0;
  updateParticles(dt, dz);
  if (playerModel && mode !== 'pause') animDragon(playerModel, time, mode === 'play' ? 11 : 7);

  // shadow under the dragon
  const sy = playerRoot.position.y;
  playerShadow.position.set(mode === 'hatch' ? 0 : playerRoot.position.x, 0.04, 0);
  const sk = 1 / (1 + sy * 0.15);
  playerShadow.scale.set(2.8 * sk, 1, 2.8 * sk);

  // camera
  if (mode === 'play' || mode === 'dying' || mode === 'over' || mode === 'pause') {
    tmpPos.set(p.x * 0.55, p.y * 0.55 + 4.1, 9.5 + camExtra);
    tmpLook.set(p.x * 0.72, p.y * 0.72 + 1.0, -12);
  } else if (mode === 'hatch') {
    tmpPos.set(0, 5.4, 7 + camExtra * 0.7);
    tmpLook.set(0, 4.3, 0);
  } else {
    const a = time * 0.22 + 0.6, r = 7.6 + camExtra * 0.8;
    tmpPos.set(Math.sin(a) * r, 5.3 + Math.sin(time * 0.3) * 0.5, Math.cos(a) * r);
    tmpLook.set(0, 4.5, 0);
  }
  const ce = 1 - Math.exp(-dt * 3.5);
  camera.position.lerp(tmpPos, mode === 'pause' ? 0 : ce);
  camLook.lerp(tmpLook, mode === 'pause' ? 0 : ce);
  camera.lookAt(camLook);
  if (p.shake > 0 && !reduceMotion) { camera.position.x += (Math.random() - 0.5) * p.shake; camera.position.y += (Math.random() - 0.5) * p.shake; }

  renderer.render(scene, camera);
}
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  const aspect = w / Math.max(1, h);
  camera.aspect = aspect;
  camera.fov = aspect < 1 ? 66 : 60;
  camera.updateProjectionMatrix();
  XR = aspect < 0.8 ? 4.6 : aspect < 1.25 ? 5.6 : 7;
  camExtra = aspect < 1 ? (1 - aspect) * 9 : 0;
  p.tx = clamp(p.tx, -XR, XR);
}
window.addEventListener('resize', resize);

/* ---------- Thumbnails for the shop ---------- */
function makeThumbs() {
  let tr;
  try { tr = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); }
  catch (e) { return; }
  tr.setPixelRatio(1); tr.setSize(240, 240); tr.setClearColor(0x000000, 0);
  const ts = new THREE.Scene();
  ts.add(new THREE.HemisphereLight(0xffffff, 0xa8c4b0, 0.95));
  const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(-2, 5, 6); ts.add(dl);
  const tc = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  DRAGONS.forEach((D, i) => {
    const egg = buildEgg(D, 0.16); egg.rotation.y = 0.5; ts.add(egg);
    tc.position.set(0, 0.5, 4.6); tc.lookAt(0, 0, 0);
    tr.render(ts, tc); thumbs.egg[i] = tr.domElement.toDataURL('image/png');
    ts.remove(egg);
    const m = getDragon(i);
    m.root.position.set(0, -0.35, 0); m.root.rotation.set(0.08, Math.PI - 0.75, 0); m.root.scale.setScalar(1);
    animDragon(m, 0.4, 1);
    ts.add(m.root);
    tc.position.set(0, 1.1, 9.4); tc.lookAt(0, 0.1, 0);
    tr.render(ts, tc); thumbs.dragon[i] = tr.domElement.toDataURL('image/png');
    ts.remove(m.root);
    m.root.position.set(0, 0, 0); m.root.rotation.set(0, 0, 0);
  });
  tr.dispose();
  try { tr.forceContextLoss(); } catch (e) { /* ignore */ }
}

/* =========================================================
   Boot
   ========================================================= */
function start(data) {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (e) { /* no storage */ }
  if (data && data.save && (!data.save.coins || data.save.coins >= save.coins)) save = Object.assign(save, data.save);
  if (!Array.isArray(save.owned) || !save.owned.includes(0)) save.owned = [0].concat(Array.isArray(save.owned) ? save.owned : []);
  if (!save.owned.includes(save.sel)) save.sel = 0;
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ save })); } catch (e) { /* not in viewer */ }
  resize();
  initDecos();
  makeThumbs();
  renderSoundBtn();
  $('#loading').hidden = true;
  goMenu();
  camera.position.set(4, 6, 8);
  requestAnimationFrame((t) => { last = t; frame(t); });
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
