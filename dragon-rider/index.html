<title>조시훈의 드래곤 라이더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-bleed voxel sky (3D canvas) with chunky block-style panels floating on top */
:root {
  --sky: #8fd3f7;
  --ink: #1d2a4a;
  --panel: #f3faff;
  --panel-line: #c9def0;
  --sun: #ffc93c;
  --sun-deep: #d8920c;
  --leaf: #4fbf5a;
  --leaf-deep: #2b8538;
  --berry: #ff5a6e;
  --berry-deep: #b92a43;
  --muted: #5d6a88;
  --white: #ffffff;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); }
body {
  font-family: var(--font-display);
  color: var(--ink);
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: none;
  overscroll-behavior: none;
}
#app { position: fixed; inset: 0; overflow: hidden; }
html.rot #app { inset: auto; top: 0; left: 0; transform-origin: top left; }
html.rot.land #app { transform: rotate(90deg) translateY(-100%); }
html.rot.port #app { transform: rotate(-90deg) translateX(-100%); }
#btnOrient {
  position: fixed; z-index: 30;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(max(14px, env(safe-area-inset-top, 0px)) + 112px);
}
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-bottom, 0px));
  pointer-events: none;
  box-sizing: border-box;
}
.screen > * { pointer-events: auto; }
.screen.center { align-items: center; justify-content: safe center; background: rgba(29, 42, 74, 0.28); overflow-y: auto; touch-action: pan-y; }
.spacer { flex: 1; pointer-events: none !important; }

/* ---------- Blocks & buttons ---------- */
.panel {
  background: var(--panel);
  border: 4px solid var(--ink);
  border-radius: 8px;
  box-shadow: 0 8px 0 rgba(29, 42, 74, 0.35);
  padding: 22px 20px;
  width: min(440px, 100%);
  box-sizing: border-box;
  display: flex; flex-direction: column; gap: 14px;
  text-align: center;
}
.panel h2 { margin: 0; font-size: 30px; font-weight: 400; text-wrap: balance; line-height: 1.15; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

.btn {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--ink);
  background: var(--sun);
  border: 3px solid var(--ink);
  border-radius: 8px;
  padding: 12px 22px;
  box-shadow: 0 6px 0 var(--sun-deep), 0 6px 0 3px var(--ink);
  cursor: pointer;
  transform: translateY(0);
  transition: transform .06s, box-shadow .06s;
  margin-bottom: 9px;
  position: relative;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--sun-deep), 0 1px 0 3px var(--ink); }
.btn:focus-visible { outline: 4px solid var(--white); outline-offset: 4px; }
.btn.big { font-size: 30px; padding: 14px 28px; }
.btn.alt { background: var(--leaf); color: var(--white); box-shadow: 0 6px 0 var(--leaf-deep), 0 6px 0 3px var(--ink); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.btn.alt:active { box-shadow: 0 1px 0 var(--leaf-deep), 0 1px 0 3px var(--ink); }
.btn.ghost { background: var(--white); box-shadow: 0 6px 0 var(--panel-line), 0 6px 0 3px var(--ink); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--panel-line), 0 1px 0 3px var(--ink); }
.btn.small { font-size: 18px; padding: 8px 14px; }
.btn[disabled] { background: #d9dfea; color: var(--muted); box-shadow: 0 6px 0 #aeb7c9, 0 6px 0 3px var(--ink); cursor: default; }
.btn[disabled]:active { transform: none; }

.coinpill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--white); border: 3px solid var(--ink); border-radius: 999px;
  padding: 4px 14px 4px 6px; font-size: 22px;
  box-shadow: 0 4px 0 rgba(29,42,74,.3);
  font-variant-numeric: tabular-nums;
}
.coinpill svg { width: 26px; height: 26px; }
.coinpill.bump { animation: bump .25s; }
@keyframes bump { 50% { transform: scale(1.18); } }

.iconbtn {
  width: 48px; height: 48px; border-radius: 8px;
  border: 3px solid var(--ink); background: var(--white);
  box-shadow: 0 4px 0 rgba(29,42,74,.3);
  display: grid; place-items: center; cursor: pointer; padding: 0;
  font-family: var(--font-display); color: var(--ink);
}
.iconbtn svg { width: 26px; height: 26px; }
.iconbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(29,42,74,.3); }
#btnSound {
  position: fixed; z-index: 30;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(max(14px, env(safe-area-inset-top, 0px)) + 56px);
}

/* ---------- Menu ---------- */
.menu-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.logo { display: flex; flex-direction: column; gap: 2px; }
.logo small { font-size: 18px; color: var(--ink); background: var(--sun); border: 3px solid var(--ink); border-radius: 6px; padding: 2px 10px; align-self: flex-start; transform: rotate(-3deg); }
.logo h1 {
  margin: 0; font-weight: 400; font-size: clamp(34px, min(12vw, 11vh), 76px); line-height: 1;
  color: var(--white);
  text-shadow: 0 4px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 3px 4px 0 var(--ink), -3px 4px 0 var(--ink), 0 9px 0 rgba(29,42,74,.3);
  letter-spacing: 1px; word-break: keep-all; text-wrap: balance;
}
.menu-bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.dragon-tag {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: rgba(255,255,255,.88); border: 3px solid var(--ink); border-radius: 8px; padding: 6px 16px;
}
.dragon-tag b { font-size: 24px; font-weight: 400; }
.dragon-tag span { font-size: 15px; color: var(--muted); }
.menu-actions { display: flex; flex-direction: column; gap: 6px; width: min(360px, 100%); }
.menu-actions .btn { width: 100%; }
.badge {
  position: absolute; top: -14px; right: -8px;
  background: var(--berry); color: var(--white); font-size: 15px;
  border: 3px solid var(--ink); border-radius: 999px; padding: 2px 10px;
  animation: wiggle 1.2s infinite;
}
@keyframes wiggle { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg) scale(1.06); } }
.best { margin: 0; font-size: 17px; color: var(--ink); background: rgba(255,255,255,.7); border-radius: 999px; padding: 3px 12px; font-variant-numeric: tabular-nums; }

/* ---------- HUD ---------- */
#hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; }
#hud > * { pointer-events: none; }
#hearts { display: flex; flex-wrap: wrap; gap: 3px; max-width: 190px; }
#hearts svg { width: 30px; height: 30px; filter: drop-shadow(0 3px 0 rgba(29,42,74,.3)); }
#hearts svg.lost { opacity: .9; }
#hearts .shield { width: 30px; height: 30px; }
.hud-mid { text-align: center; color: var(--white); text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); font-variant-numeric: tabular-nums; }
.hud-mid b { font-size: 40px; font-weight: 400; line-height: 1; }
.hud-mid small { font-size: 20px; }
.hud-right { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.hud-right .iconbtn { pointer-events: auto; }
#hint {
  position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 128px); transform: translateX(-50%);
  background: rgba(29,42,74,.85); color: var(--white); padding: 10px 18px; border-radius: 10px;
  font-size: 17px; text-align: center; width: max-content; max-width: calc(100% - 32px); box-sizing: border-box; word-break: keep-all;
  pointer-events: none; transition: opacity .6s; line-height: 1.4;
}
#hint.fade { opacity: 0; }
#btnFire {
  position: fixed; z-index: 20;
  right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
  bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 22px));
  width: 96px; height: 96px; border-radius: 50%;
  border: 4px solid var(--ink);
  background: conic-gradient(rgba(29,42,74,.55) calc(var(--cd, 0) * 360deg), #ff7a2f 0);
  box-shadow: 0 6px 0 var(--berry-deep), 0 6px 0 4px var(--ink);
  color: var(--white); font-family: var(--font-display); font-size: 19px; text-shadow: 0 2px 0 var(--ink);
  display: grid; place-items: center; cursor: pointer; padding: 0;
  touch-action: none;
}
#btnFire svg { width: 40px; height: 40px; display: block; margin: 0 auto -2px; }
#btnFire:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--berry-deep), 0 2px 0 4px var(--ink); }

/* ---------- Game over ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats > div { background: var(--white); border: 3px solid var(--ink); border-radius: 8px; padding: 10px 6px; display: flex; flex-direction: column; gap: 2px; }
.stats small { font-size: 15px; color: var(--muted); }
.stats b { font-size: 30px; font-weight: 400; font-variant-numeric: tabular-nums; }
.note { margin: 0; font-size: 18px; color: var(--muted); }
.note.good { color: var(--leaf-deep); background: #e3f7e0; border: 3px dashed var(--leaf); border-radius: 8px; padding: 8px; }
.note.record { color: var(--berry-deep); }

/* ---------- Shop ---------- */
#shop { background: rgba(29, 42, 74, 0.35); }
.shop-wrap {
  width: min(760px, 100%); margin: 0 auto; flex: 1; min-height: 0;
  background: var(--panel); border: 4px solid var(--ink); border-radius: 10px;
  box-shadow: 0 8px 0 rgba(29, 42, 74, 0.35);
  display: flex; flex-direction: column; overflow: hidden;
}
.shop-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 3px solid var(--panel-line); flex-wrap: wrap; }
.shop-head h2 { flex: 1; margin: 0; font-size: clamp(20px, 5.4vw, 26px); font-weight: 400; min-width: 0; word-break: keep-all; }
.shop-head .btn { margin-bottom: 4px; }
.shop-sub { margin: 10px 16px 0; font-size: 16px; color: var(--muted); line-height: 1.45; }
.grid {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; align-content: start;
  padding: 14px 14px 22px; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
}
@media (max-width: 460px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 10px 20px; } }
.card {
  background: var(--white); border: 3px solid var(--ink); border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 8px 4px;
  min-width: 0; text-align: center;
}
.card.current { background: #fff6d6; border-color: var(--sun-deep); box-shadow: 0 0 0 3px var(--sun); }
.card img { width: 100%; max-width: 150px; aspect-ratio: 1; object-fit: contain; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #ffffff 0 30%, #d6ecfb 70%); }
.card .nm { font-size: 22px; line-height: 1.1; }
.card .lvl { font-size: 13px; color: var(--muted); }
.card .btn { width: 100%; font-size: 18px; padding: 8px 6px; box-sizing: border-box; }
.card .need { font-size: 13px; color: var(--muted); min-height: 1em; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.chip { font-size: 13px; padding: 2px 8px; border-radius: 999px; border: 2px solid var(--ink); background: #e8f3fc; white-space: nowrap; }
.chip.fire { background: #ffe0cf; } .chip.mag { background: #efe2ff; } .chip.dbl { background: #fff1c2; } .chip.shd { background: #d7fbff; } .chip.hp { background: #ffe1e6; } .chip.spd { background: #dff7dc; }
.price { display: inline-flex; align-items: center; gap: 4px; }
.price svg { width: 20px; height: 20px; }

/* ---------- Hatch ---------- */
.hatch-top { display: flex; justify-content: center; }
#hatchMsg {
  margin: 8px 0 0; font-size: 26px; color: var(--white); text-align: center;
  text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink);
}
.reveal { align-self: center; animation: pop .45s cubic-bezier(.2, 1.6, .5, 1); }
.reveal small { font-size: 18px; color: var(--berry-deep); }
.reveal h2 { font-size: 40px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
#btnView[aria-pressed="true"] { background: var(--sun); }
#hurt { position: fixed; inset: 0; pointer-events: none; z-index: 15; opacity: 0; transition: opacity .6s;
  background: radial-gradient(ellipse at center, rgba(255,60,90,0) 45%, rgba(255,40,70,.6) 100%); }
#hurt.on { opacity: 1; transition: none; }
#toast {
  position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 25; pointer-events: none;
  font-size: clamp(26px, 7vw, 40px); color: var(--sun); white-space: nowrap;
  text-shadow: 0 4px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink);
  animation: toastPop 1.3s ease-out forwards;
}
@keyframes toastPop { 0% { transform: translateX(-50%) scale(.4); opacity: 0; } 15% { transform: translateX(-50%) scale(1.15); opacity: 1; } 30% { transform: translateX(-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
#flash { position: fixed; inset: 0; background: var(--white); opacity: 0; pointer-events: none; z-index: 40; transition: opacity .5s; }
#flash.on { opacity: 1; transition: none; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--sky); font-size: 28px; color: var(--ink); z-index: 50; text-align: center; padding: 16px; }

/* ---------- Gift ---------- */
.gift-btn {
  font-family: var(--font-display); font-size: 20px; color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px;
  background: #ffe1ea; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 16px 6px 8px;
  box-shadow: 0 4px 0 var(--berry-deep); cursor: pointer; animation: wiggle 1.4s infinite;
}
.gift-btn svg { width: 30px; height: 30px; }
#gift .panel small { font-size: 18px; color: var(--berry-deep); }

/* ---------- Together ---------- */
.coop-name { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.coop-name small { font-size: 16px; color: var(--muted); }
.name-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pick {
  font-family: var(--font-display); font-size: 20px; color: var(--ink);
  background: var(--white); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer;
}
.pick[aria-pressed="true"] { background: var(--sun); box-shadow: 0 3px 0 var(--sun-deep); }
.coop-list { display: flex; flex-direction: column; gap: 6px; }
.coop-row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; background: var(--white); border: 3px solid var(--ink); border-radius: 8px; padding: 8px 12px; text-align: left; flex-wrap: wrap; }
.coop-row.me { background: #fff6d6; }
.coop-row b { font-weight: 400; font-size: 20px; }
.coop-row span { font-size: 14px; color: var(--muted); }
#ghostLabels { position: fixed; inset: 0; pointer-events: none; z-index: 12; overflow: hidden; }
.glabel {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  background: var(--white); color: var(--ink); border: 3px solid var(--ink); border-radius: 999px;
  padding: 2px 10px; font-size: 16px; box-shadow: 0 3px 0 rgba(29,42,74,.3);
}
.btn.ghost .badge { background: var(--leaf); }

/* ---------- Phones ---------- */
@media (max-width: 400px) {
  html:not(.rot) #hearts { max-width: 132px; }
  html:not(.rot) #hearts svg, html:not(.rot) #hearts .shield { width: 24px; height: 24px; }
  html:not(.rot) .hud-mid b { font-size: 34px; }
  html:not(.rot) .shop-head h2 { order: 3; flex-basis: 100%; font-size: 22px; }
  html:not(.rot) .shop-head .coinpill { margin-left: auto; }
  html:not(.rot) .shop-sub { font-size: 14px; margin: 8px 12px 0; }
  html:not(.rot) .card .nm { font-size: 19px; }
  html:not(.rot) .card .lvl { font-size: 12px; }
  html:not(.rot) .card .btn { font-size: 16px; }
}
@media (max-height: 640px) and (orientation: portrait) {
  html:not(.rot) .panel { padding: 16px 14px; gap: 10px; }
  html:not(.rot) .panel h2 { font-size: 24px; }
  html:not(.rot) .stats b { font-size: 24px; }
  html:not(.rot) .note { font-size: 15px; }
  html:not(.rot) .btn.big { font-size: 24px; padding: 10px 20px; }
  html:not(.rot) .btn { font-size: 19px; padding: 9px 16px; }
  html:not(.rot) #hint { bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 112px); font-size: 15px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  html:not(.rot) .logo small { font-size: 14px; }
  html:not(.rot) .dragon-tag { display: none; }
  html:not(.rot) .menu-actions { flex-direction: row; width: min(560px, 100%); gap: 12px; }
  html:not(.rot) .menu-actions .btn { flex: 1; }
  html:not(.rot) .btn { font-size: 18px; padding: 8px 16px; }
  html:not(.rot) .btn.big { font-size: 22px; padding: 8px 20px; }
  html:not(.rot) .panel { padding: 12px 16px; gap: 8px; width: min(600px, 100%); }
  html:not(.rot) .panel h2 { font-size: 22px; }
  html:not(.rot) .stats > div { padding: 6px; }
  html:not(.rot) .stats b { font-size: 22px; }
  html:not(.rot) .note { font-size: 15px; }
  html:not(.rot) .shop-sub { display: none; }
  html:not(.rot) .shop-head { padding: 8px 12px; }
  html:not(.rot) .reveal { align-self: flex-end; width: min(330px, 100%); }
  html:not(.rot) .reveal h2 { font-size: 28px; }
  html:not(.rot) #hatchMsg { font-size: 20px; }
  html:not(.rot) #btnFire { width: 80px; height: 80px; }
  html:not(.rot) #hint { bottom: max(12px, env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 280px); font-size: 15px; }
}
/* the same compact layout when the game is turned sideways on a portrait phone */
  html.rot.land .logo small { font-size: 14px; }
  html.rot.land .dragon-tag { display: none; }
  html.rot.land .menu-actions { flex-direction: row; width: min(560px, 100%); gap: 12px; }
  html.rot.land .menu-actions .btn { flex: 1; }
  html.rot.land .btn { font-size: 18px; padding: 8px 16px; }
  html.rot.land .btn.big { font-size: 22px; padding: 8px 20px; }
  html.rot.land .panel { padding: 12px 16px; gap: 8px; width: min(600px, 100%); }
  html.rot.land .panel h2 { font-size: 22px; }
  html.rot.land .stats > div { padding: 6px; }
  html.rot.land .stats b { font-size: 22px; }
  html.rot.land .note { font-size: 15px; }
  html.rot.land .shop-sub { display: none; }
  html.rot.land .shop-head { padding: 8px 12px; }
  html.rot.land .reveal { align-self: flex-end; width: min(330px, 100%); }
  html.rot.land .reveal h2 { font-size: 28px; }
  html.rot.land #hatchMsg { font-size: 20px; }
  html.rot.land #btnFire { width: 80px; height: 80px; }
  html.rot.land #hint { bottom: max(12px, env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 280px); font-size: 15px; }

@media (prefers-reduced-motion: reduce) {
  .badge, .reveal, .coinpill.bump { animation: none; }
}
</style>

<div id="app">
<canvas id="c"></canvas>

<div id="loading">시훈이의 드래곤을 깨우는 중...</div>

<section id="menu" class="screen" hidden>
  <div class="menu-top">
    <div class="logo">
      <small>조시훈의</small>
      <h1>드래곤 라이더</h1>
    </div>
    <div class="coinpill" id="menuCoinPill"><span class="ico-coin"></span><b id="menuCoins">0</b></div>
  </div>
  <div class="spacer"></div>
  <div class="menu-bottom">
    <button id="btnGift" class="gift-btn" hidden><span class="ico-gift"></span>아빠 선물이 왔어요!</button>
    <div class="dragon-tag"><b id="menuDragonName">풀잎이</b><span id="menuDragonDesc"></span></div>
    <div class="menu-actions">
      <button id="btnPlay" class="btn big">출발!</button>
      <button id="btnShop" class="btn alt">드래곤 알 상점<span class="badge" id="shopBadge" hidden>살 수 있어요!</span></button>
      <button id="btnCoop" class="btn ghost">같이 날기<span class="badge" id="coopBadge" hidden>누가 기다려요!</span></button>
    </div>
    <p class="best">최고 기록 <b id="menuBest">0</b>m</p>
  </div>

function updateHatch(dt) {

const NAME_KEY = 'dragon-rider-name';

const NAMES = ['시훈이', '아빠', '엄마', '친구'];

function sendPresence(extra) {

}

async function connectRoom() {
  if (coop.tried) return;

    const room = await window.claude.use('room');

function onPeersChange(change) {

    if (!go || typeof go.id !== 'string' || !/^[a-z0-9]{4,16}$/.test(go.id) || ps.st !== 'count') continue;
    const seed = Number(go.seed) >>> 0;
    if (mode === 'coop' && !coop.seenGo.has(go.id)) { coop.seenGo.add(go.id); beginCoopRun(go.id, seed, false); }
    else if (coop.on && coop.starter && mode === 'play' && p.freeze > 0 && go.id < coop.runId) {

/* ---------- other players' dragons ---------- */
function speedAt(d) { return 15 + 13 * Math.min(1, d / 2600); }
const ghostMat = new THREE.MeshLambertMaterial({ vertexColors: true, transparent: true, opacity: 0.7, depthWrite: false });
function makeGhost(dr) {
  const m = buildCreature(DRAGONS[dr]);
  m.root.traverse((o) => { if (o.isMesh) o.material = ghostMat; });
  const holder = new THREE.Group(); holder.scale.setScalar(PLAY_SCALE); holder.add(m.root);
  scene.add(holder);
  const label = document.createElement('div'); label.className = 'glabel'; $('#ghostLabels').appendChild(label);
  return { m, holder, label, dr, sx: 0, sy: 4, sd: 0, tx: 0, ty: 4, td: 0, tAt: 0, lastUpd: -1, alive: true, phase: Math.random() * 3, nm: '', fresh: true };
}
function removeGhost(g) {

}

const projV = new THREE.Vector3();
function updateGhosts(dt) {

    const ps = pr.presence;
    if (ps.run !== coop.runId || !Array.isArray(ps.f) || ps.f.length < 5) continue;
    const f = ps.f.map(Number);
    if (!f.every(Number.isFinite)) continue;
    seen.add(pr.peer);
    const dr = safeDragon(ps.dr);
    let g = coop.ghosts.get(pr.peer);
    if (!g || g.dr !== dr) { if (g) removeGhost(g); g = makeGhost(dr); coop.ghosts.set(pr.peer, g); }
    g.nm = safeName(ps.nm);
    const alive = f[4] === 1;
    if (g.alive && !alive && !g.fresh && (mode === 'play' || mode === 'over')) toast(g.nm + ' 쿵!');
    g.alive = alive;
    if (pr.updatedAt !== g.lastUpd) {
      g.lastUpd = pr.updatedAt;

    }
    const expD = g.td + (g.alive && !(p.freeze > 0) ? speedAt(g.td) * 0.5 * Math.min(1, time - g.tAt) : 0);

    const z = -(g.sd - p.dist) * 2;
    g.holder.position.set(g.sx, g.alive ? g.sy : Math.max(0.5, g.sy - 1), z);
    g.holder.visible = z > -95 && z < 12;
    animDragon(g.m, time + g.phase, 11);
    g.m.root.rotation.z = g.alive ? 0 : g.m.root.rotation.z + dt * 6;
    // name tag over their head
    projV.set(g.sx, g.sy + 1.5, z).project(camera);
    const onScreen = (mode === 'play' || mode === 'dying') && g.holder.visible && projV.z < 1 && Math.abs(projV.x) < 1.1 && Math.abs(projV.y) < 1.1;

    if (onScreen) {

      g.label.style.transform = `translate(${((projV.x + 1) / 2) * vw()}px, ${((1 - projV.y) / 2) * vh()}px) translate(-50%, -100%)`;

function coopTick(now) {

  const st = coopState();
  const key = st + '|' + myName + '|' + save.sel + '|' + (coop.on ? coop.runId : '');

    coop.lastSend = now;
    coop.room.presence({ f: [Math.round(p.x * 100) / 100, Math.round(p.y * 100) / 100, Math.round(p.dist * 10) / 10, p.hearts, mode === 'play' || mode === 'pause' ? 1 : 0] }).catch(() => {});
  }
}
function renderCoopOver() {

  el.hidden = false;
  const lines = [];

  const order = ['auto', 'land', 'port'];
  save.orient = order[(order.indexOf(save.orient || 'auto') + 1) % 3];
  persist(); SFX.click();
  resize();
  const tip = save.orient === 'land' ? (window.innerHeight > window.innerWidth ? '가로 화면! 휴대폰을 왼쪽으로 눕혀요' : '가로 화면')
    : save.orient === 'port' ? (window.innerWidth > window.innerHeight ? '세로 화면! 휴대폰을 세워요' : '세로 화면') : '화면: 휴대폰 방향 따라가기';
  toast(tip);
}
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  applyOrientation();
  const w = vw(), h = vh();
  renderer.setSize(w, h, false);
  const aspect = w / Math.max(1, h);
  camera.aspect = aspect;
  baseFov = aspect < 1 ? 66 : 60;
  camera.fov = baseFov + (save.fps && (mode === 'play' || mode === 'pause') ? 12 : 0);
  camera.updateProjectionMatrix();
  baseXR = aspect < 0.8 ? 5 : aspect < 1.25 ? 5.8 : 7;
  if (!(coop.on && (mode === 'play' || mode === 'dying' || mode === 'pause'))) XR = baseXR;
  camExtra = aspect < 1 ? (1 - aspect) * 9 : 0;
  p.tx = clamp(p.tx, -XR, XR);
}
window.addEventListener('resize', resize);

/* ---------- Thumbnails for the shop ---------- */
function makeThumbs() {
  let tr;
  try { tr = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); }
  catch (e) { return; }
  tr.setPixelRatio(1); tr.setSize(240, 240); tr.setClearColor(0x000000, 0);
  const ts = new THREE.Scene();
  ts.add(new THREE.HemisphereLight(0xffffff, 0xa8c4b0, 0.95));
  const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(-2, 5, 6); ts.add(dl);
  const tc = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  DRAGONS.forEach((D, i) => {
    const egg = buildEgg(D, 0.16); egg.rotation.y = 0.5; ts.add(egg);
    tc.position.set(0, 0.5, 4.6); tc.lookAt(0, 0, 0);
    tr.render(ts, tc); thumbs.egg[i] = tr.domElement.toDataURL('image/png');
    ts.remove(egg);
    const m = getDragon(i);
    m.root.position.set(0, -0.35, 0); m.root.rotation.set(0.08, Math.PI - 0.75, 0); m.root.scale.setScalar(1);
    animDragon(m, 0.4, 1);
    ts.add(m.root);
    tc.position.set(0, 1.1, 9.4); tc.lookAt(0, 0.1, 0);
    tr.render(ts, tc); thumbs.dragon[i] = tr.domElement.toDataURL('image/png');
    ts.remove(m.root);
    m.root.position.set(0, 0, 0); m.root.rotation.set(0, 0, 0);
  });
  tr.dispose();
  try { tr.forceContextLoss(); } catch (e) { /* ignore */ }
}

   Boot
   ========================================================= */
function start(data) {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (e) { /* no storage */ }
  if (data && data.save && (!data.save.coins || data.save.coins >= save.coins)) save = Object.assign(save, data.save);
  if (!Array.isArray(save.owned) || !save.owned.includes(0)) save.owned = [0].concat(Array.isArray(save.owned) ? save.owned : []);
  if (!save.owned.includes(save.sel)) save.sel = 0;
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ save })); } catch (e) { /* not in viewer */ }
  resize();
  makeThumbs();
  renderSoundBtn();
  renderViewBtn();
  $('#loading').hidden = true;
  goMenu();
  connectRoom();
  camera.position.set(4, 6, 8);
  requestAnimationFrame((t) => { last = t; frame(t); });
}
window.__dragonCoop = () => ({ zone: curZone, mode, on: coop.on, runId: coop.runId, ghosts: coop.ghosts.size, dist: Math.round(p.dist), course: obstacles.slice(0, 6).map((o) => o.type + ':' + o.x.toFixed(2)) });
window.__dragonTest = {
  warp(zi) { p.courseDist = zi * ZONE_LEN - 50; p.dist = zi * ZONE_LEN - 50; p.nextMile = Math.ceil(p.dist / 100) * 100; clearPortals(); applyZone(zi, true); p.rowZone = zi; for (const o of obstacles.slice()) { scene.remove(o.mesh); if (o.shadow) scene.remove(o.shadow); } obstacles = []; },
  star() { p.star = 60; },
  near(zi) { p.courseDist = zi * ZONE_LEN - 70; p.dist = zi * ZONE_LEN - 70; p.rowZone = zi - 1; applyZone(zi - 1, false); },
};
window.__dragonAudio = () => ({ ctx: AC.ctx ? AC.ctx.state : 'none', music: Music.track, playing: !!Music.timer });
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
