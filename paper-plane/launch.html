<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#9aa9b6">
<title>종이비행기 새총</title>
<style>
  :root {
    color-scheme: light;
    --bg: #9aa9b6;
    --card: #f3e6c8;
    --card-ink: #4a3620;
    --card-line: #d8c294;
    --accent: #ff8a1f;
    --good: #35c24a;
    --gold: #ffc933;
    --white: #fffdf6;
    --outline: rgba(40, 28, 14, .85);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, sans-serif; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .ui { position: fixed; inset: 0; pointer-events: none; color: var(--white); font-weight: 800;
    text-shadow: 0 2px 0 var(--outline), 0 0 6px rgba(0,0,0,.35); -webkit-text-stroke: .5px rgba(40,28,14,.6); }
  #top { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  #dist { font-size: 40px; line-height: 1; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  #dist small { font-size: 18px; margin-left: 3px; }
  #best { font-size: 13px; opacity: .85; margin-top: 4px; }
  #coinBox { display: flex; align-items: center; gap: 8px; background: rgba(40,28,14,.55); border-radius: 999px; padding: 6px 14px 6px 8px;
    font-size: 20px; text-shadow: none; -webkit-text-stroke: 0; font-variant-numeric: tabular-nums; }
  #coinBox i { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3a8, var(--gold) 55%, #c98a00); border: 2px solid #8a5a00; display: block; }
  #coinBox.bump { animation: bump .25s ease-out; }
  @keyframes bump { 50% { transform: scale(1.18); } }
  #run { font-size: 15px; opacity: .95; margin-top: 4px; text-align: right; }
  #power { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: 58%; transform: translateY(-50%); width: 120px; height: 120px; display: none; }
  #power b { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-size: 34px; font-style: italic; }
  #power::before, #power::after { content: ""; position: absolute; left: 30px; width: 58px; height: 38px; border-left: 3px solid var(--white); filter: drop-shadow(0 1px 0 var(--outline)); }
  #power::before { top: -4px; border-top: 3px solid var(--white); }
  #power::after { bottom: -4px; border-bottom: 3px solid var(--white); }
  #power.max b { color: #ffe36a; }
  #hint { position: absolute; left: 0; right: 0; bottom: max(60px, calc(env(safe-area-inset-bottom, 0px) + 40px)); text-align: center; font-size: 17px; transition: opacity .4s; padding: 0 24px; }
  #toast { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: 36px; font-style: italic; opacity: 0; transform: scale(.8); }
  #toast.show { animation: pop .9s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 18% { opacity: 1; transform: scale(1.1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1) translateY(-14px); } }
  #title { position: absolute; left: 0; right: 0; top: 14%; text-align: center; font-size: 30px; transition: opacity .5s; }
  #title small { display: block; font-size: 14px; opacity: .85; margin-top: 6px; letter-spacing: 2px; }
  #result { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; pointer-events: auto;
    background: rgba(30, 22, 12, .45); text-shadow: none; -webkit-text-stroke: 0; }
  #result.show { display: flex; }
  .card { width: min(100%, 380px); background: var(--card); color: var(--card-ink); border-radius: 22px; padding: 20px 18px 18px;
    box-shadow: 0 10px 0 #c8b07a, 0 18px 40px rgba(0,0,0,.35); border: 3px solid var(--card-line); }
  .card h2 { margin: 0 0 2px; font-size: 24px; text-align: center; }
  .card .sub { text-align: center; font-size: 13px; opacity: .75; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .stat { background: #fff8e6; border: 2px solid var(--card-line); border-radius: 14px; padding: 8px 10px; text-align: center; }
  .stat span { display: block; font-size: 12px; opacity: .7; }
  .stat b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat.wide { grid-column: span 2; }
  .ups { display: grid; gap: 8px; margin-bottom: 14px; }
  .up { display: flex; align-items: center; gap: 10px; background: #fff8e6; border: 2px solid var(--card-line); border-radius: 14px; padding: 8px 10px; }
  .up .t { flex: 1; min-width: 0; }
  .up .t b { display: block; font-size: 15px; }
  .up .t span { font-size: 12px; opacity: .7; }
  .pips { display: flex; gap: 3px; margin-top: 4px; }
  .pips i { width: 14px; height: 6px; border-radius: 3px; background: #e2d2ac; }
  .pips i.on { background: var(--accent); }
  .up button { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 9px 12px; min-width: 76px; color: #fff; background: var(--good);
    box-shadow: 0 3px 0 #228a33; cursor: pointer; font-size: 15px; }
  .up button:disabled { background: #bfae86; box-shadow: 0 3px 0 #9b8b66; color: #f6ecd0; cursor: default; }
  .go { display: block; width: 100%; font: inherit; font-weight: 900; font-size: 20px; border: 0; border-radius: 16px; padding: 14px; color: #fff; background: var(--accent);
    box-shadow: 0 5px 0 #c4640a; cursor: pointer; }
  .go:active, .up button:active { transform: translateY(2px); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="ui">
  <div id="top">
    <div><div id="dist">0<small>m</small></div><div id="best"></div></div>
    <div><div id="coinBox"><i></i><span id="coinN">0</span></div><div id="run"></div></div>
  </div>
  <div id="title">종이비행기 새총<small>PAPER PLANE SLINGSHOT</small></div>
  <div id="power"><b id="pw">0%</b></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="result">
    <div class="card">
      <h2 id="rTitle">착지!</h2>
      <div class="sub" id="rSub"></div>
      <div class="stats">
        <div class="stat wide"><span>날아간 거리</span><b id="rDist">0 m</b></div>
        <div class="stat"><span>모은 코인</span><b id="rCoins">0</b></div>
        <div class="stat"><span>최고 기록</span><b id="rBest">0 m</b></div>
      </div>
      <div class="ups" id="ups"></div>
      <button class="go" id="again">다시 날리기</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const THREE = window.THREE;
const qs = new URLSearchParams(location.search);
const BOT = qs.has('bot');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);

/* ═════════ 저장 ═════════ */
let save = { coins: 0, best: 0, up: { power: 0, wing: 0, magnet: 0 } };
try { const s = JSON.parse(localStorage.getItem('pp3_save') || 'null'); if (s) save = Object.assign(save, s, { up: Object.assign(save.up, s.up || {}) }); } catch (e) {}
const persist = () => { try { localStorage.setItem('pp3_save', JSON.stringify(save)); } catch (e) {} };

/* ═════════ 소리 ═════════ */
let AC = null, windG = null, windF = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  if (AC && !windG) {
    try {
      const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      windF = AC.createBiquadFilter(); windF.type = 'bandpass'; windF.Q.value = 0.8;
      windG = AC.createGain(); windG.gain.value = 0;
      src.connect(windF); windF.connect(windG); windG.connect(AC.destination); src.start();
    } catch (e) { windG = null; }
  }
}
function wind(v, on) {
  if (!windG) return;
  const n = AC.currentTime;
  windG.gain.setTargetAtTime(on ? 0.01 + 0.05 * clamp((v - 12) / 40, 0, 1) : 0, n, 0.15);
  windF.frequency.setTargetAtTime(300 + v * 9, n, 0.15);
}
function tone(f0, f1, dur, type = 'sine', vol = 0.05) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
}
function burst(dur, freq, vol) {
  if (!AC) return;
  const len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.7;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
}
const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

/* ═════════ 렌더러 / 장면 ═════════ */
const cv = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
const SKY = 0xa9b8c5;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 50, 185);
const camera = new THREE.PerspectiveCamera(68, 1, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 0.95));
const sun = new THREE.DirectionalLight(0xfff1d8, 0.85); sun.position.set(-10, 24, 12); scene.add(sun);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

let baseFov = 68;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  baseFov = camera.aspect < 0.8 ? 74 : camera.aspect < 1.2 ? 66 : 56;     // 세로 화면은 시야를 넓게
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ═════════ 질감 (캔버스로 직접 그림) ═════════ */
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.encoding = THREE.sRGBEncoding; t.anisotropy = Math.min(4, maxAniso);
  return t;
}
function grain(g, w, h, n, col, a) {
  g.strokeStyle = col; g.globalAlpha = a;
  for (let i = 0; i < n; i++) { const x = Math.random() * w, y = Math.random() * h, l = 8 + Math.random() * 30; g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + (Math.random() - .5) * 2); g.stroke(); }
  g.globalAlpha = 1;
}
const texFloor = canvasTex(256, 256, (g, w, h) => {        // 나무 바닥 판자
  const cols = ['#cfae7a', '#c6a46d', '#d3b484', '#c19e67'];
  for (let i = 0; i < 4; i++) { g.fillStyle = cols[i]; g.fillRect(0, i * 64, w, 64); }
  g.lineWidth = 1.2; grain(g, w, h, 140, '#9c7b4a', .35);
  g.strokeStyle = '#8f6f40'; g.lineWidth = 3;
  for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(0, i * 64 + 1.5); g.lineTo(w, i * 64 + 1.5); g.stroke(); }
  g.lineWidth = 2; for (let i = 0; i < 4; i++) { const x = (i * 97 + 40) % w; g.beginPath(); g.moveTo(x, i * 64); g.lineTo(x, i * 64 + 64); g.stroke(); }
}, 4, 4);
const texCrate = canvasTex(128, 128, (g, w, h) => {        // 나무 상자
  g.fillStyle = '#b68c52'; g.fillRect(0, 0, w, h);
  grain(g, w, h, 60, '#8c6636', .5);
  g.strokeStyle = '#6f4f26'; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10);
  g.lineWidth = 8; g.beginPath(); g.moveTo(8, 8); g.lineTo(w - 8, h - 8); g.moveTo(w - 8, 8); g.lineTo(8, h - 8); g.stroke();
  g.fillStyle = '#4e3718'; for (const [x, y] of [[12, 12], [w - 12, 12], [12, h - 12], [w - 12, h - 12]]) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }
});
const texCard = canvasTex(128, 128, (g, w, h) => {         // 골판지 상자
  g.fillStyle = '#c9a06a'; g.fillRect(0, 0, w, h);
  grain(g, w, h, 90, '#a37c46', .35);
  g.fillStyle = '#e3c590'; g.fillRect(0, h * .45, w, h * .1);
  g.strokeStyle = '#a07a45'; g.lineWidth = 3; g.strokeRect(2, 2, w - 4, h - 4);
  g.fillStyle = '#7a5b30'; g.fillRect(18, 22, 26, 5); g.fillRect(18, 32, 16, 4);
  g.beginPath(); g.arc(w - 26, h - 24, 10, 0, 7); g.lineWidth = 3; g.stroke();
});
const texWall = canvasTex(256, 128, (g, w, h) => {         // 회색 철판 벽
  g.fillStyle = '#8d949b'; g.fillRect(0, 0, w, h);
  grain(g, w, h, 160, '#767d84', .3);
  g.strokeStyle = '#5d646b'; g.lineWidth = 4;
  for (let x = 0; x <= w; x += 64) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let y = 0; y <= h; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
});
const texChev = canvasTex(64, 128, (g, w, h) => {          // 초록 화살표 무늬
  g.clearRect(0, 0, w, h);
  g.lineJoin = 'round'; g.lineCap = 'round';
  for (const [lw, col] of [[22, 'rgba(120,255,70,.35)'], [11, 'rgba(190,255,120,1)']]) {
    g.strokeStyle = col; g.lineWidth = lw;
    g.beginPath(); g.moveTo(8, h * .72); g.lineTo(w / 2, h * .32); g.lineTo(w - 8, h * .72); g.stroke();
  }
});
const texStripe = () => canvasTex(16, 64, (g, w, h) => {   // 빨강-하양 줄무늬 기둥
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#d9302b';
  for (let i = -1; i < 4; i++) { g.beginPath(); g.moveTo(0, i * 32); g.lineTo(w, i * 32 - 10); g.lineTo(w, i * 32 + 6); g.lineTo(0, i * 32 + 16); g.fill(); }
});

const M = {
  floor: new THREE.MeshLambertMaterial({ map: texFloor }),
  crate: new THREE.MeshLambertMaterial({ map: texCrate }),
  card: new THREE.MeshLambertMaterial({ map: texCard }),
  cardDark: new THREE.MeshLambertMaterial({ map: texCard, color: 0xcaa073 }),
  wall: new THREE.MeshLambertMaterial({ map: texWall }),
  gold: new THREE.MeshLambertMaterial({ color: 0xffc72c, emissive: 0x6b4300 }),
  green: new THREE.MeshBasicMaterial({ color: 0x77ff3c }),
  white: new THREE.MeshLambertMaterial({ color: 0xf7f4ec }),
  dark: new THREE.MeshLambertMaterial({ color: 0x3b3027 }),
  concrete: new THREE.MeshLambertMaterial({ color: 0xb9b5ab }),
  red: new THREE.MeshLambertMaterial({ color: 0xd2402f }),
  steel: new THREE.MeshLambertMaterial({ color: 0x6e757c }),
  arrow: new THREE.MeshBasicMaterial({ map: texChev, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }),
};
const G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 14),
  coin: new THREE.CylinderGeometry(0.62, 0.62, 0.16, 18).rotateX(Math.PI / 2),
  torus: new THREE.TorusGeometry(2.5, 0.24, 8, 28),
  floor: null, shadow: new THREE.CircleGeometry(1.5, 18).rotateX(-Math.PI / 2),
};
function addBox(parent, w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(G.box, mat); m.scale.set(w, h, d); m.position.set(x, y, z); parent.add(m); return m;
}

/* ═════════ 종이비행기 (코가 -Z 방향) ═════════ */
function makePlane() {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const flaps = [];
  addBox(body, 0.7, 0.55, 3.3, M.card, 0, 0, 0);                       // 동체
  addBox(body, 0.5, 0.4, 0.7, M.cardDark, 0, -0.04, -1.9);             // 코
  addBox(body, 4.7, 0.09, 1.35, M.card, 0, 0.05, 0.1);                 // 날개
  for (let i = 0; i < 9; i++) {                                         // 날개 뒷전 골판지 조각
    const f = addBox(body, 0.36, 0.1, 0.38, M.cardDark, -2.0 + i * 0.5, 0.0, 0.9);
    flaps.push(f);
  }
  addBox(body, 0.09, 0.95, 0.75, M.card, 0, 0.7, 1.55);                // 수직 꼬리
  addBox(body, 1.9, 0.08, 0.6, M.card, 0, 0.15, 1.55);                 // 수평 꼬리
  for (const sx of [-1, 1]) {                                           // 바퀴
    const w = new THREE.Mesh(G.cyl, M.dark); w.scale.set(0.3, 0.2, 0.3); w.rotation.z = Math.PI / 2; w.position.set(sx * 0.55, -0.42, -0.5); body.add(w);
    addBox(body, 0.08, 0.35, 0.08, M.cardDark, sx * 0.5, -0.25, -0.5);
  }
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 10), M.white); head.position.set(0, 0.78, -0.1); body.add(head);
  addBox(body, 0.55, 0.42, 0.45, M.white, 0, 0.45, 0);                  // 조종사 몸
  for (const sx of [-1, 1]) { const a = addBox(body, 0.14, 0.5, 0.14, M.white, sx * 0.38, 0.72, -0.05); a.rotation.z = -sx * 0.6; }   // 만세 팔
  root.userData = { body, flaps };
  return root;
}
const plane = makePlane(); scene.add(plane);
const shadow = new THREE.Mesh(G.shadow, new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
scene.add(shadow);

/* ═════════ 시작 구역: 바닥, 새총, 벽 ═════════ */
const CH = 44, WX = 18;                                       // 조각 길이, 벽 위치
const startFloor = new THREE.Mesh(new THREE.PlaneGeometry(WX * 2 + 2, 30), M.floor);
startFloor.material = M.floor.clone(); startFloor.material.map = texFloor.clone(); startFloor.material.map.repeat.set(4, 2.7); startFloor.material.map.needsUpdate = true;
startFloor.rotation.x = -Math.PI / 2; startFloor.position.set(0, 0, 15); scene.add(startFloor);
addBox(scene, WX * 2 + 2, 18, 1, M.wall, 0, 9, 30.5);                 // 뒷벽 (카메라 뒤)
for (const sx of [-1, 1]) addBox(scene, 1, 18, 30, M.wall, sx * (WX + 0.5), 9, 15);
const posts = [];
for (const sx of [-1, 1]) {
  const g = new THREE.Group(); g.position.set(sx * 5.2, 0, 0);
  addBox(g, 1.6, 1.2, 1.2, M.concrete, 0, 0.6, 0);
  addBox(g, 1.62, 0.28, 1.22, M.red, 0, 0.9, 0);
  const pole = new THREE.Mesh(G.cyl, new THREE.MeshLambertMaterial({ map: texStripe() })); pole.scale.set(0.15, 2.0, 0.15); pole.position.set(0, 2.1, 0);
  pole.material.map.repeat.set(1, 3); g.add(pole);
  scene.add(g); posts.push(g);
}
const bands = [0, 1].map(() => {
  const mat = new THREE.MeshLambertMaterial({ map: texStripe() });
  const m = new THREE.Mesh(G.cyl, mat); m.scale.set(0.1, 1, 0.1); scene.add(m); return m;
});
const UP = new THREE.Vector3(0, 1, 0), tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion();
function stretchBand(m, a, b) {
  tmpV.subVectors(b, a); const len = tmpV.length();
  m.position.copy(a).addScaledVector(tmpV, 0.5);
  m.scale.set(0.1, len, 0.1);
  m.quaternion.copy(tmpQ.setFromUnitVectors(UP, tmpV.normalize()));
  m.material.map.repeat.set(1, Math.max(1, len / 1.4));
}
// 조준 화살표 (바닥에 깔리는 초록 화살표)
const arrow = new THREE.Group();

/* ═════════ 게임 상태 ═════════ */

/* ═════════ 입력 ═════════ */
cv.addEventListener('pointerdown', e => {

/* ═════════ 자동 조종 (테스트용) ═════════ */

  let best = [false, 0], bs = -1e9;
  for (const h0 of [0, 1]) for (const h1 of [0, 1]) for (const st of [-1, 0, 1]) for (const sw of [0.25, 0.6]) {
    const s = Object.assign({}, S); let t = 0, alive = 1.6;
    while (t < 1.6) { flight(s, t < sw ? !!h0 : !!h1, st, 1 / 20, 0); t += 1 / 20; const h = hitTest(s); if (h) { alive = h === 'land' ? t * 0.8 : t; break; } }

/* ═════════ 업데이트 ═════════ */

  if (mode === 'aim') {

    S.x = REST.x - dirx * pull; S.z = REST.z - dirz * pull; S.y = REST.y + Math.sin(tNow * 1.8) * 0.05 * (1 - p);

    setHint(p > 0.02 ? (p >= 0.98 ? '최대 파워! 손을 놓으세요' : '손을 놓으면 발사!') : '아래로 당겼다 놓아서 날리세요', 1);

    if (Math.abs(S.x) > WX - 1.2) { const sg = Math.sign(S.x); S.x = sg * (WX - 1.2); S.psi -= sg * 0.04; S.v *= 0.995; shake = Math.max(shake, 0.15); }
    // 코인 / 링
    const magR = 1.9 + 1.4 * save.up.magnet;
    for (let k = kc - 1; k <= kc + 1; k++) {
      const c = chunks.get(k); if (!c) continue;
      for (const co of c.coins) {
        if (co.got) continue;
        const dx = co.x - S.x, dy = co.y - S.y, dz = co.z - S.z, d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < (magR + 4) * (magR + 4) && save.up.magnet > 0 && d2 > 1) { co.x -= dx * 6 * dt; co.y -= dy * 6 * dt; co.z -= dz * 6 * dt; co.mesh.position.set(co.x, co.y, co.z); }
        if (d2 < (1.9 + 0.35 * save.up.magnet) * (1.9 + 0.35 * save.up.magnet)) {
          co.got = true; co.mesh.visible = false; runCoins++; hudCoins(); $('run').textContent = '+' + runCoins;
          tone(1040 + Math.min(runCoins, 12) * 30, 1560, 0.14, 'triangle', 0.05); buzz(6);
        }
      }
      for (const r of c.rings) {
        if (!r.used && prevZ > r.z && S.z <= r.z) {
          const dx = S.x - r.x, dy = S.y - r.y;
          if (dx * dx + dy * dy < 3.0 * 3.0) { r.used = true; S.v = Math.min(72, S.v + 9); fovKick = 14; shake = Math.max(shake, 0.25); toast('BOOST!'); tone(300, 900, 0.3, 'sawtooth', 0.05); burst(0.3, 1200, 0.08); buzz([10, 20, 10]); }
          else r.used = true;
        }
      }
    }
    // 충돌 / 착지
    const h = BOT && S.y > 0.55 ? hitTest(S) : hitTest(S);
    if (h) endFlight(h);
    wind(S.v, true);
    const d = dist(); if (d !== hudDist) { hudDist = d; $('dist').innerHTML = d + '<small>m</small>'; }
    if (hintT < 5) setHint('누르고 있으면 위로 · 좌우로 끌면 방향', clamp(2.2 - hintT * 0.45, 0, 1)); else setHint('', 0);
    cameraChase(rdt);
  } else if (mode === 'end' || mode === 'result') {
    endT += rdt; wind(0, false);
    const w = wreck;
    if (w && mode === 'end') {
      if (w.fall) w.vy -= 24 * dt;
      S.x += w.vx * dt; S.z += w.vz * dt; S.y += w.vy * dt;
      w.vx *= (1 - 1.6 * dt); w.vz *= (1 - 1.6 * dt);
      if (S.y < 0.5) { S.y = 0.5; w.vy = 0; w.fall = false; w.vx *= 0.9; w.vz *= 0.9; }
      S.gam += (-0.1 - S.gam) * Math.min(1, 3 * dt); if (w.spin) { S.bank += w.spin * dt; w.spin *= (1 - 2.5 * dt); }
      S.v = 0;
    }
    if (mode === 'end' && endT > 1.25) showResult();
    cameraChase(rdt, true);
  }
  // 비행기와 그림자
  plane.position.set(S.x, S.y, S.z);
  plane.rotation.set(S.gam, -S.psi, -S.bank, 'YXZ');
  const flutter = Math.sin(tNow * 40) * 0.12 * clamp(S.v / 30, 0, 1);
  plane.userData.flaps.forEach((f, i) => { f.rotation.x = flutter * (i % 2 ? 1 : -1); });
  shadow.position.set(S.x, 0.04, S.z); const sc = 1 / (1 + Math.max(0, S.y - 0.5) * 0.12); shadow.scale.set(sc * 1.1, 1, sc * 1.1);
  // 고무줄
  const aiming = mode === 'aim';
  bands.forEach((b, i) => b.visible = aiming || (mode === 'fly' && false));
  if (aiming) {
    const back = new THREE.Vector3(Math.sin(S.psi), 0, -Math.cos(S.psi)).multiplyScalar(-1.1);
    const att = new THREE.Vector3(S.x + back.x, S.y + 0.1, S.z + back.z);
    stretchBand(bands[0], new THREE.Vector3(-5.2, 3.0, 0), att.clone().add(new THREE.Vector3(-1.9, 0, 0)));
    stretchBand(bands[1], new THREE.Vector3(5.2, 3.0, 0), att.clone().add(new THREE.Vector3(1.9, 0, 0)));
  }
  // 코인 회전
  for (const [, c] of chunks) for (const co of c.coins) if (!co.got) co.mesh.rotation.y = tNow * 3 + co.z;
  for (const [, c] of chunks) for (const r of c.rings) { if (!r.used) r.mesh.scale.setScalar(1 + Math.sin(tNow * 4) * 0.04); else r.mesh.visible = false; r.glow.visible = !r.used; }
}

function cameraAim(rdt) {
  const p = aim.pull;
  const tp = new THREE.Vector3(S.x * 0.2, 6.4 + p * 0.5, 14.5 + p * 1.2);
  camPos.lerp(tp, 1 - Math.exp(-8 * rdt));
  camLook.lerp(new THREE.Vector3(0, 2.4, -16), 1 - Math.exp(-8 * rdt));
  applyCamera(rdt, 0);
}
function cameraChase(rdt, still) {
  const fx = Math.sin(S.psi), fz = -Math.cos(S.psi);
  const back = still ? 9 : 9.5 + clamp(S.v / 30, 0, 1.2) * 2;
  const tp = new THREE.Vector3(S.x - fx * back, Math.max(2.2, S.y + 3.2 + (still ? 1.5 : 0)), S.z - fz * back);
  camPos.lerp(tp, 1 - Math.exp(-(still ? 2.5 : 6) * rdt));
  const look = new THREE.Vector3(S.x + fx * 14, S.y + Math.sin(S.gam) * 8 + 0.4, S.z + fz * 14);
  camLook.lerp(look, 1 - Math.exp(-7 * rdt));
  applyCamera(rdt, clamp((S.v - 18) / 40, 0, 1) * 7 + fovKick);
}
function applyCamera(rdt, fovAdd) {
  camera.position.copy(camPos);
  if (shake > 0) camera.position.add(tmpV.set((Math.random() - .5) * shake * 0.5, (Math.random() - .5) * shake * 0.5, 0));
  camera.position.y = Math.max(1.0, camera.position.y);
  camera.lookAt(camLook);
  const f = baseFov + fovAdd;
  if (Math.abs(camera.fov - f) > 0.05) { camera.fov += (f - camera.fov) * Math.min(1, 8 * rdt); camera.updateProjectionMatrix(); }
}

/* ═════════ 시작 ═════════ */
camera.fov = baseFov; camera.updateProjectionMatrix();
camPos.set(0, 6.4, 14.5);
resetAim();
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  step(dt); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__g = {
  step, render: () => renderer.render(scene, camera),
  get: () => ({ mode, x: S.x, y: S.y, z: S.z, v: S.v, gam: S.gam, dist: dist(), runCoins, flightT, endType, chunks: chunks.size, calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
  aimTo: (p, psi) => { aim.pull = p; aim.psi = psi || 0; aim.down = true; },
  fire: () => { aim.down = false; launch(aim.pull, aim.psi); },
  setHold: v => { held = v; }, setSteer: v => { steer = v; },
  save: () => save, setSave: s => { save = s; }, bot: BOT,
};
})();
</script>
</body>
</html>
