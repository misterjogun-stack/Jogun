<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>종이비행기 날리기</title>
<style>
  :root { color-scheme: dark; --bg: #000; }
  html, body { margin: 0; padding-left: 0; padding-right: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; outline: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const qs  = new URLSearchParams(location.search);
const BOT = qs.has('bot');                       // 자동 조종 테스트용 (?bot)

/* ───────── 난수 (?seed=숫자 로 고정 가능) ───────── */
let seedState = (Number(qs.get('seed')) || (Math.random() * 4294967296)) >>> 0;
function rnd() {
  seedState = (seedState + 0x6D2B79F5) | 0;
  let t = Math.imul(seedState ^ (seedState >>> 15), 1 | seedState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const R = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ───────── 화면 / 좌표계 ─────────
   논리 좌표 단위로 게임을 만들고 화면 크기에 맞춰 확대합니다.
   가로 480 x 세로 700 이상이 항상 보이도록 맞춥니다.            */
const BASE_W = 480, BASE_H = 700;
const FL = 34;          // 바닥 두께
const PS = 34;          // 비행기 크기 (논리 단위)
const BAND_MAX = 720;   // 비행 구역(천장~바닥) 최대 높이. 세로로 긴 화면은 가운데만 사용
let W = BASE_W, H = BASE_H, S = 1, PX = 140, lockedH = 0, BT = 0, BH = BASE_H;
const floorY = () => BT + BH - FL;
const ceilY  = () => BT;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = cv.clientWidth || innerWidth, ch = cv.clientHeight || innerHeight;   // 부모(화면) 크기를 따라감
  cv.width  = Math.max(2, Math.round(cw * dpr));
  cv.height = Math.max(2, Math.round(ch * dpr));
  S = lockedH ? cv.height / lockedH                       // 플레이 중에는 세로 길이를 고정
              : Math.min(cv.width / BASE_W, cv.height / BASE_H);
  W = cv.width / S;  H = cv.height / S;
  BH = Math.min(H, BAND_MAX); BT = (H - BH) / 2;
  PX = Math.min(W * 0.28, 240);                            // 비행기의 화면상 가로 위치
}
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => {
  // 캔버스 픽셀 크기를 바꾸면 다시 관찰되므로, CSS 크기가 실제로 달라졌을 때만 처리
  if (cv.clientWidth !== lastCW || cv.clientHeight !== lastCH) { lastCW = cv.clientWidth; lastCH = cv.clientHeight; resize(); }
}).observe(cv);
let lastCW = 0, lastCH = 0;

/* ───────── 소리 (처음 누를 때 켜짐) ───────── */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type = 'sine', vol = 0.05) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur);
}

/* ───────── 최고 기록 ───────── */
let best = 0;
try { best = Number(localStorage.getItem('paperplane_best')) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('paperplane_best', String(best)); } catch (e) {} }

/* ───────── 게임 상태 ───────── */
const P = { X: 0, y: 0, ang: 0, slow: 0 };   // X = 비행기가 날아간 거리(월드 좌표)
let mode = 'title';                           // title | play | over
let t = 0, overT = 0;
let held = false;
let obs = [], rings = [], fx = [], debris = [], hist = [], trail = [];
let nextX = 0;
let planes = 3, inv = 0, shake = 0, flash = 0;
let bonus = 0, streak = 0, newBest = false, hintT = 0;

const stars = Array.from({ length: 80 }, () => ({ x: Math.random(), y: Math.random(), z: 0.1 + Math.random() * 0.5 }));

/* ───────── 비행 물리 ─────────
   누르면 기수를 들어 올라가고, 떼면 기수가 내려가며 활강합니다.
   내려갈수록 빠르고, 올라갈수록 느려집니다.                    */
const baseSpeed = x => 250 + 120 * Math.min(1, x / 36000);
function advance(s, holdNow, dt) {
  const target = holdNow ? -0.68 : 0.62;
  s.ang += (target - s.ang) * Math.min(1, 6 * dt);
  const sn = Math.sin(s.ang);
  s.y += sn * 500 * dt;
  const v = baseSpeed(s.X) * (1 + 0.5 * sn) * (s.slow > 0 ? 0.55 : 1);
  s.X += v * Math.cos(s.ang) * dt;
  const top = ceilY() + 26;
  if (s.y < top) { s.y = top; if (s.ang < 0) s.ang *= 0.3; }  // 천장
}

/* ───────── 충돌 ───────── */
// 비행기 판정점 (비행기 좌표계, PS 배수): 코, 몸통, 윗날개 끝, 아랫날개 끝
const HIT = [[1.06, -0.14], [0, 0], [-0.35, -0.32], [0.14, 0.33], [-0.16, -0.11]];
function inPoly(px, py, p) {
  let c = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const a = p[i], b = p[j];
    if ((a[1] > py) !== (b[1] > py) && px < (b[0] - a[0]) * (py - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
  }
  return c;
}
function edgeDist(px, py, p) {
  let m = 1e9;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const a = p[i], b = p[j], dx = b[0] - a[0], dy = b[1] - a[1];
    const u = clamp(((px - a[0]) * dx + (py - a[1]) * dy) / (dx * dx + dy * dy), 0, 1);
    m = Math.min(m, Math.hypot(px - (a[0] + u * dx), py - (a[1] + u * dy)));
  }
  return m;
}
function hits(s) {
  if (s.y > floorY() - 12) return 'floor';
  const c = Math.cos(s.ang), sn = Math.sin(s.ang);
  const pts = HIT.map(h => [s.X + (h[0] * c - h[1] * sn) * PS, s.y + (h[0] * sn + h[1] * c) * PS]);
  for (const o of obs) {
    if (o.x1 < s.X - PS * 1.5 || o.x0 > s.X + PS * 1.5) continue;
    for (const q of pts) if (inPoly(q[0], q[1], o.p)) return 'obs';
    if (edgeDist(pts[1][0], pts[1][1], o.p) < PS * 0.36) return 'obs';
    if (edgeDist(pts[0][0], pts[0][1], o.p) < 3) return 'obs';
  }
  return false;
}

/* ───────── 장애물 만들기 (접은 종이 느낌의 삼각형·마름모) ───────── */
function poly(pts) {
  let x0 = 1e9, x1 = -1e9;
  for (const q of pts) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); }
  return { p: pts, x0, x1 };
}
function peakFloor(x, w, h, skew = 0) { const fy = floorY(); obs.push(poly([[x - w / 2, fy + 1], [x + w / 2, fy + 1], [x + skew, fy - h]])); }
function peakCeil (x, w, h, skew = 0) { const cy = ceilY(); obs.push(poly([[x - w / 2, cy - 1], [x + w / 2, cy - 1], [x + skew, cy + h]])); }
function ring(x, y) { rings.push({ x, y, r: 34, got: false, miss: false, pop: 0, spin: Math.random() * 6 }); }

function spawn() {
  const x = nextX, d = clamp(x / 36000, 0, 1), fy = floorY(), cl = ceilY(), r = rnd();
  const lo = cl + 70, hi = fy - 70;                 // 링을 둘 수 있는 세로 범위
  if (r < 0.34) {                                   // 문: 위아래 봉우리 사이 통과
    const gap = clamp(BH * 0.44, 260, 370) - 80 * d;
    const c = R(cl + gap / 2 + 70, fy - gap / 2 - 50);
    peakCeil(x, R(170, 250), c - gap / 2 - cl, R(-40, 40));
    peakFloor(x + R(-70, 70), R(170, 250), fy - (c + gap / 2), R(-40, 40));
    ring(x, c);
  } else if (r < 0.52) {                            // 바닥 봉우리
    const h = R(0.26, 0.46) * BH;
    peakFloor(x, R(190, 290), h, R(-40, 40));
    if (rnd() < 0.55) ring(x + R(-30, 30), Math.max(lo, fy - h - 95));
  } else if (r < 0.70) {                            // 천장 봉우리
    const h = R(0.26, 0.46) * BH;
    peakCeil(x, R(190, 290), h, R(-40, 40));
    if (rnd() < 0.55) ring(x + R(-30, 30), Math.min(hi, cl + h + 95));
  } else if (r < 0.85) {                            // 떠 있는 마름모
    const cy = cl + R(0.32, 0.62) * BH, hh = R(70, 105), hw = R(42, 62);
    obs.push(poly([[x, cy - hh], [x + hw, cy], [x, cy + hh], [x - hw, cy]]));
    ring(x + R(120, 200), clamp(cy + (rnd() < 0.5 ? -1 : 1) * (hh + 80), lo, hi));
  } else {                                          // 링 물결
    const base = cl + R(0.3, 0.62) * BH, amp = R(50, 110);
    for (let i = 0; i < 5; i++) ring(x + i * 115, clamp(base + Math.sin(i * 1.1) * amp, lo, hi));
  }
  nextX += R(560, 700) - 90 * d;
}

/* ───────── 게임 진행 ───────── */
function start() {
  mode = 'play';
  lockedH = H; resize();
  Object.assign(P, { X: 0, y: BT + BH * 0.45, ang: 0, slow: 0 });
  obs = []; rings = []; fx = []; debris = []; hist = []; trail = [];
  nextX = 950; planes = 3; inv = 0; shake = 0; flash = 0;
  bonus = 0; streak = 0; newBest = false; hintT = 0; t = 0;
}
const score = () => Math.floor(P.X / 30) + bonus;

function pose(delay) {                              // 편대 비행기가 지나간 자리 (시간차)
  const target = t - delay;
  for (let i = hist.length - 1; i >= 0; i--) if (hist[i].t <= target) return hist[i];
  return hist[0] || { X: P.X, y: P.y, ang: P.ang };
}
function dropPlane(e, size) {
  debris.push({ x: e.X, y: e.y, vx: 70, vy: -140, rot: e.ang, vr: (Math.random() - 0.5) * 6, size, life: 1.6 });
}
function loseLife(kind) {
  streak = 0; shake = 0.7; flash = 0.7; tone(190, 50, 0.3, 'sawtooth', 0.08);
  if (planes <= 1) {                                // 마지막 한 대 → 끝
    planes = 0; mode = 'over'; overT = 0; lockedH = 0;
    dropPlane({ X: P.X, y: P.y, ang: P.ang }, PS);
    const sc = score(); if (sc > best) { best = sc; newBest = true; saveBest(); }
    return;
  }
  const e = pose(0.27 * (planes - 1));
  dropPlane(e, planes === 3 ? PS * 0.5 : PS * 0.73);   // 가장 작은 비행기부터 떨어짐
  planes--; inv = 1.8; P.slow = 0.5;
  if (kind === 'floor') { P.y = floorY() - 110; P.ang = -0.6; trail = []; }
}

function step(dt) {
  t += dt;
  shake = Math.max(0, shake - dt * 2.2);
  flash = Math.max(0, flash - dt * 2.5);

  // 떨어지는 조각 / 떠오르는 점수 글자
  for (const d of debris) { d.vy += 900 * dt; d.y += d.vy * dt; d.x += d.vx * dt; d.rot += d.vr * dt; d.life -= dt; }
  debris = debris.filter(d => d.life > 0);
  for (const f of fx) { f.y -= 40 * dt; f.life -= dt * 1.1; }
  fx = fx.filter(f => f.life > 0);

  if (mode === 'over') { overT += dt; return; }

  // 조종
  let holdNow = held;
  if (mode === 'title') holdNow = P.y > BT + BH * 0.5 + Math.sin(t * 0.8) * 60;    // 타이틀 화면 자동 비행
  else if (BOT) holdNow = botHold();

  advance(P, holdNow, dt);
  P.slow = Math.max(0, P.slow - dt);
  inv = Math.max(0, inv - dt);

  hist.push({ t, X: P.X, y: P.y, ang: P.ang });
  while (hist.length > 2 && hist[1].t < t - 1.5) hist.shift();
  trail.push({ x: P.X - Math.cos(P.ang) * PS * 0.8, y: P.y - Math.sin(P.ang) * PS * 0.8 });
  if (trail.length > 46) trail.shift();

  if (mode !== 'play') return;
  hintT += dt;

  while (nextX < P.X + W + 400) spawn();
  obs   = obs.filter(o => o.x1 > P.X - PX - 120);
  rings = rings.filter(r => r.x > P.X - PX - 120 || (r.got && r.pop < 0.5));

  // 링 통과
  for (const r of rings) {
    if (r.got) { r.pop += dt; continue; }
    const dx = r.x - P.X, dy = r.y - P.y;
    if (dx * dx + dy * dy < (r.r + 14) * (r.r + 14)) {
      r.got = true; streak++;
      const pts = 10 * Math.min(streak, 5);
      bonus += pts;
      fx.push({ x: r.x, y: r.y - 24, txt: '+' + pts, life: 1 });
      tone(650 + 110 * Math.min(streak, 6), 1500, 0.18);
    } else if (!r.miss && r.x < P.X - 70) { r.miss = true; r.got = true; r.pop = 9; streak = 0; }
  }

  // 충돌
  if (inv <= 0) { const h = hits(P); if (h) loseLife(h); }
}

/* ───────── 자동 조종 (테스트용) ───────── */
function botHold() {
  let tgt = BT + BH * 0.5;
  for (const r of rings) if (!r.got && r.x > P.X - 20 && r.x - P.X < 700) { tgt = r.y; break; }
  let bestH = 0, bestS = -1e9;
  for (const h0 of [0, 1]) for (const h1 of [0, 1]) for (const tsw of [0.12, 0.3, 0.55]) {
    if (h0 === h1 && tsw !== 0.12) continue;
    const s = { X: P.X, y: P.y, ang: P.ang, slow: 0 };
    let tt = 0, alive = 1.4;
    while (tt < 1.4) { advance(s, tt < tsw ? !!h0 : !!h1, 1 / 30); tt += 1 / 30; if (hits(s)) { alive = tt; break; } }
    const sc = alive * 100 - Math.abs(s.y - tgt) * 0.05;
    if (sc > bestS) { bestS = sc; bestH = h0; }
  }
  return !!bestH;
}

/* ───────── 그리기 도구 ───────── */
const sxOf = wx => wx - P.X + PX;

function glow(draw, w, a = 1) {                      // 겹쳐 그려서 네온 번짐 표현
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(60,255,220,${0.07 * a})`; ctx.lineWidth = w * 7;   draw(); ctx.stroke();
  ctx.strokeStyle = `rgba(60,255,220,${0.17 * a})`; ctx.lineWidth = w * 3.2; draw(); ctx.stroke();
  ctx.strokeStyle = `rgba(214,255,247,${a})`;       ctx.lineWidth = w;       draw(); ctx.stroke();
  ctx.restore();
}
function text(str, x, y, size, alpha = 1, weight = 300, ls = 0, align = 'center') {
  ctx.save();
  ctx.font = `${weight} ${size}px "Helvetica Neue", system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = ls + 'px';
  ctx.shadowColor = 'rgba(70,255,225,.9)'; ctx.shadowBlur = size * 0.45 * S;
  ctx.fillStyle = `rgba(222,255,249,${alpha})`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

// 레퍼런스 사진의 종이비행기 윤곽 (코가 +x 방향)
const PLANE = [[1, 0], [-0.74, -0.39], [-0.42, -0.04], [-0.57, 0.42], [-0.28, 0.21], [0.07, 0.70]].map(p => [p[0] + 0.16, p[1] - 0.15]);
function plane(x, y, ang, size, alpha = 1) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang); ctx.scale(size, size);
  const outline = () => { ctx.beginPath(); PLANE.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };
  ctx.fillStyle = `rgba(0,0,0,${0.9 * alpha})`; outline(); ctx.fill();
  glow(() => {
    outline();
    ctx.moveTo(PLANE[0][0], PLANE[0][1]); ctx.lineTo(PLANE[2][0], PLANE[2][1]);   // 접힌 선
    ctx.moveTo(PLANE[0][0], PLANE[0][1]); ctx.lineTo(PLANE[4][0], PLANE[4][1]);
  }, 2.1 / size, alpha);
  ctx.restore();
}

/* ───────── 장면 그리기 ───────── */
function drawStars() {
  ctx.fillStyle = '#bff';
  for (const s of stars) {
    const x = (((s.x * W - P.X * s.z * 0.5) % W) + W) % W;
    ctx.globalAlpha = 0.12 + s.z * 0.6;
    ctx.fillRect(x, s.y * H, 0.8 + s.z * 2, 0.8 + s.z * 2);
  }
  ctx.globalAlpha = 1;
}
function drawFloor() {
  const fy = floorY(), cy = ceilY();
  ctx.strokeStyle = 'rgba(110,255,230,.2)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let x = -(P.X % 64); x < W + 64; x += 64) { ctx.moveTo(x, fy + 8); ctx.lineTo(x - 16, fy + FL - 4); }
  ctx.stroke();
  glow(() => { ctx.beginPath(); ctx.moveTo(-10, fy); ctx.lineTo(W + 10, fy); }, 2, 0.85);        // 바닥선
  glow(() => { ctx.beginPath(); ctx.moveTo(-10, cy); ctx.lineTo(W + 10, cy); }, 1.2, 0.3);       // 천장선(은은하게)
}
function drawObs(o) {
  const q = o.p.map(p => [sxOf(p[0]), p[1]]);
  if (q.every(p => p[0] < -40) || q.every(p => p[0] > W + 40)) return;
  const path = () => { ctx.beginPath(); q.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };
  ctx.fillStyle = 'rgba(0,0,0,.92)'; path(); ctx.fill();
  glow(() => {
    path();
    if (q.length === 3) {                            // 삼각형: 꼭짓점에서 밑변 가운데로 접힌 선
      ctx.moveTo(q[2][0], q[2][1]); ctx.lineTo((q[0][0] + q[1][0]) / 2, (q[0][1] + q[1][1]) / 2);
    } else {                                         // 마름모: 십자 접힌 선
      ctx.moveTo(q[0][0], q[0][1]); ctx.lineTo(q[2][0], q[2][1]);
      ctx.moveTo(q[1][0], q[1][1]); ctx.lineTo(q[3][0], q[3][1]);
    }
  }, 2.3, 0.92);
}
function drawRing(r) {
  const x = sxOf(r.x);
  if (x < -80 || x > W + 80 || (r.got && r.pop > 0.45)) return;
  const k = r.got ? r.pop / 0.45 : 0;
  const a = 1 - k, rad = r.r * (1 + k * 0.9);
  r.spin += 0.02;
  glow(() => {
    ctx.beginPath();
    ctx.arc(x, r.y, rad, r.spin, r.spin + Math.PI * 0.8);
    ctx.moveTo(x + Math.cos(r.spin + Math.PI) * rad, r.y + Math.sin(r.spin + Math.PI) * rad);
    ctx.arc(x, r.y, rad, r.spin + Math.PI, r.spin + Math.PI * 1.8);
  }, 2.2, a * 0.95);
  glow(() => { ctx.beginPath(); ctx.arc(x, r.y, rad * 0.62, 0, Math.PI * 2); }, 1, a * 0.28);
}
function drawTrail() {
  if (trail.length < 2) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  // 꼬리는 월드에서 흘러가므로 비행기와의 상대 거리를 직접 계산
  const n = trail.length;
  for (let i = 1; i < n; i++) {
    const a = (i / n) * 0.35;
    ctx.strokeStyle = `rgba(110,255,232,${a})`; ctx.lineWidth = 1 + i / n * 1.6;
    ctx.beginPath(); ctx.moveTo(sxOf(trail[i - 1].x), trail[i - 1].y); ctx.lineTo(sxOf(trail[i].x), trail[i].y); ctx.stroke();
  }
  ctx.restore();
}
function drawPlanes() {
  // 편대: 남은 목숨만큼 뒤따라 날아옴 (큰 것 · 중간 · 작은 것)
  const sizes = [PS, PS * 0.73, PS * 0.5];
  for (let i = planes - 1; i >= 1; i--) {
    const e = pose(0.27 * i);
    plane(sxOf(e.X), e.y, e.ang, sizes[i], 0.9);
  }
  if (planes > 0) {
    const blink = inv > 0 && Math.floor(t * 14) % 2 === 0;
    plane(PX, P.y, P.ang, PS, blink ? 0.35 : 1);
  }
}
function drawDebris() {
  for (const d of debris) plane(sxOf(d.x), d.y, d.rot, d.size, clamp(d.life, 0, 1));
}
function drawHUD() {
  text(String(score()), W / 2, 46, 40, 1, 200, 2);
  if (best > 0) text('BEST ' + best, W - 18, 24, 14, 0.55, 300, 2, 'right');
  if (streak >= 2) text('×' + Math.min(streak, 5) + ' COMBO', W / 2, 82, 14, 0.8, 400, 3);
  if (hintT < 4.5) text('누르고 있으면 위로 · 떼면 아래로', W / 2, H * 0.84, 15, clamp(2 - hintT * 0.45, 0, 0.8), 300, 1);
  for (const f of fx) text(f.txt, sxOf(f.x), f.y, 20, clamp(f.life, 0, 1), 400);
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);

  drawStars();
  drawFloor();
  obs.forEach(drawObs);
  rings.forEach(drawRing);
  drawTrail();
  drawPlanes();
  drawDebris();

  if (mode === 'play') drawHUD();

  if (mode === 'title') {
    text('종이비행기', W / 2, H * 0.22, 54, 1, 200, 6);
    text('PAPER  FLIGHT', W / 2, H * 0.22 + 52, 14, 0.7, 300, 8);
    const blink = 0.55 + 0.45 * Math.sin(t * 3);
    text('화면을 눌러 시작', W / 2, H * 0.78, 18, blink, 300, 2);
    text('꾹 누르면 위로 · 떼면 아래로 · 링을 통과하면 점수', W / 2, H * 0.78 + 30, 12, 0.5, 300, 1);
    if (best > 0) text('BEST ' + best, W / 2, H * 0.78 + 58, 13, 0.6, 300, 3);
  }
  if (mode === 'over' && overT > 0.5) {
    const a = clamp((overT - 0.5) * 2, 0, 1);
    ctx.fillStyle = `rgba(0,0,0,${0.72 * a})`; ctx.fillRect(-20, -20, W + 40, H + 40);   // 글자가 잘 읽히게 장면을 어둡게
    text('추락했어요', W / 2, H * 0.3, 40, a, 200, 4);
    text(String(score()), W / 2, H * 0.3 + 70, 64, a, 200, 2);
    text(newBest ? '★ 새 기록 ★' : 'BEST ' + best, W / 2, H * 0.3 + 124, 16, a * 0.8, 300, 4);
    if (overT > 1.0) text('화면을 눌러 다시 날리기', W / 2, H * 0.74, 18, (0.55 + 0.45 * Math.sin(t * 3)) * a, 300, 2);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(210,255,248,${flash * 0.28})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
}

/* ───────── 입력 ───────── */
function press() {
  audio();
  if (mode === 'title') start();
  else if (mode === 'over' && overT > 1.0) start();
  held = true;
}
function release() { held = false; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('blur', release);
addEventListener('contextmenu', e => e.preventDefault());
const KEYS = ['Space', 'ArrowUp', 'KeyW'];
addEventListener('keydown', e => { if (KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); } });
addEventListener('keyup',   e => { if (KEYS.includes(e.code)) release(); });

/* ───────── 시작 ───────── */
resize();
P.y = BT + BH * 0.5;
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  step(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (BOT) window.__g = { step, start, draw, get: () => ({ mode, planes, score: score(), X: P.X, y: P.y, H, W }) };
})();
</script>
</body>
</html>
