<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F6FA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FILO" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- SEO / OG -->
  <title>FILO 약제 재고</title>
  <meta name="description" content="살롱 약제 재고와 거래처별 발주를 자동화하는 프리미엄 시스템. 월말 재고조사 한 번으로 거래처별 발주 문자가 완성됩니다." />
  <meta property="og:title" content="FILO 약제 재고" />
  <meta property="og:description" content="약 꺼낼 때 한 번 누르면 재고가 줄고, 떨어지면 거래처별 발주 문자가 완성됩니다." />
  <meta property="og:type" content="website" />

  <!-- Fonts: Pretendard (한글 본문) + Space Grotesk (숫자·영문 디스플레이) + JetBrains Mono (라벨) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['Inter', '"Pretendard Variable"', 'Pretendard', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    };
  </script>
  <script>
    // 저장된 테마(없으면 기기 설정)를 렌더 전에 적용해 깜빡임 방지
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('filo_theme')); } catch (e) {}
      if (t !== 'night' && t !== 'studio') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'night' : 'studio';
      }
      document.documentElement.setAttribute('data-filo-theme', t);
    })();
  </script>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (JSX 트랜스파일) -->
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>

  <style>
    /* ============================================
       FILO — Salon Dispensary
       Layout: 약장 선반처럼 품목이 한 줄씩 놓이고, 각 줄의 재고 게이지에
       적정선 눈금이 새겨진 구조. 모바일은 엄지로 닿는 하단 탭바.
       ============================================ */
    :root, :root[data-filo-theme="studio"] {
      --f-bg: #F4F6FA;
      --f-surface: #FFFFFF;
      --f-surface-2: #F1F4F9;
      --f-field: #FFFFFF;
      --f-ink: #0F172A;
      --f-sub: #64748B;
      --f-line: #E6EAF0;
      --f-line-strong: #D6DCE6;
      --f-accent: #2563EB;          /* 포인트 블루 */
      --f-accent-hover: #1D4ED8;
      --f-on-accent: #FFFFFF;
      --f-accent-soft: #EAF1FF;
      --f-alert: #E5484D;           /* 품절 */
      --f-alert-soft: #FDECEC;
      --f-warn: #EA8A0C;            /* 발주 필요 */
      --f-warn-soft: #FEF3E2;
      --f-ok: #16A34A;
      --f-ok-soft: #E7F6EC;
      --f-side-bg: #0B1220;         /* 사이드바: 두 테마 공통 네이비 */
      --f-side-ink: #E2E8F0;
      --f-side-sub: #8B95A7;
      --f-side-line: rgba(255, 255, 255, 0.07);
      --f-side-active: rgba(59, 130, 246, 0.18);
      --f-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px -8px rgba(15, 23, 42, 0.08);
      --f-radius: 16px;
      --f-radius-sm: 10px;
      --f-font-display: 'Inter', 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
      --f-font-mono: 'JetBrains Mono', ui-monospace, monospace;
      color-scheme: light;
    }
    :root[data-filo-theme="night"] {
      --f-bg: #0A0F1C;
      --f-surface: #111827;
      --f-surface-2: #172033;
      --f-field: #0F1626;
      --f-ink: #E5E7EB;
      --f-sub: #94A3B8;
      --f-line: #1F2A3D;
      --f-line-strong: #2B3850;
      --f-accent: #3B82F6;
      --f-accent-hover: #60A5FA;
      --f-on-accent: #FFFFFF;
      --f-accent-soft: #15244A;
      --f-alert: #F87171;
      --f-alert-soft: #3A1A1E;
      --f-warn: #FBBF24;
      --f-warn-soft: #3A2C12;
      --f-ok: #34D399;
      --f-ok-soft: #0F3127;
      --f-side-bg: #070B14;
      --f-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
    html, body { background: var(--f-bg); color: var(--f-ink); }
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }

    /* iOS safe area */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }


    /* Input number — 스피너 제거 (현장 미용실 깔끔함) */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] { -moz-appearance: textfield; }

    /* 로딩 페이드인 */
    #root {
      animation: filoFadeIn 0.5s ease-out;
    }
    @keyframes filoFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 초기 로딩 스크린 (React 마운트 전) */
    .filo-loader {
      position: fixed;
      inset: 0;
      background: var(--f-bg);
      color: var(--f-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 9999;
      font-family: var(--f-font-display);
      letter-spacing: 0.3em;
      transition: opacity 0.4s ease;
    }
    .filo-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .filo-loader-line {
      width: 32px;
      height: 1px;
      background: var(--f-accent);
      opacity: 0.6;
      animation: filoLine 1.6s ease-in-out infinite;
    }
    @keyframes filoLine {
      0%, 100% { width: 16px; opacity: 0.3; }
      50% { width: 48px; opacity: 0.8; }
    }

    /* 스크롤바 미니멀 */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 2px; }

    /* 가로 스크롤바 숨기기 (탭 메뉴) */
    .overflow-x-auto::-webkit-scrollbar { display: none; }

    /* 토스트 애니메이션 */
    @keyframes filoToast {
      0%   { opacity: 0; transform: translate(-50%, 10px); }
      10%  { opacity: 1; transform: translate(-50%, 0); }
      90%  { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -4px); }
    }

    /* 인라인 편집 펼침 애니메이션 */
    @keyframes filoExpand {
      from {
        opacity: 0;
        max-height: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        max-height: 600px;
        transform: translateY(0);
      }
    }

    /* 모달 페이드인 */
    @keyframes filoModalIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* 발주 경고 펄스 */
    @keyframes filoPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.0); }
      50%      { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15); }
    }

    /* 업로드 중 펄스 */
    @keyframes filoPulse {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }
    .filo-uploading { animation: filoPulse 1s ease-in-out infinite; }

    /* 편집 중인 카드 강조 (시각적 hairline glow) */
    .filo-editing {
      box-shadow: inset 0 0 0 1px currentColor;
      opacity: 1 !important;
    }

    /* ---------- 공통 형태 ---------- */
    #root .border:not(.rounded-full) { border-radius: var(--f-radius-sm); }
    #root input, #root textarea, #root select { border-radius: var(--f-radius-sm); }
    #root :focus-visible { outline: 2px solid var(--f-accent); outline-offset: 2px; }
    #root .font-display { letter-spacing: -0.01em; }
    #root h2.text-xl { font-size: 1.375rem; letter-spacing: -0.02em; }
    .f-num { font-family: var(--f-font-display); font-variant-numeric: tabular-nums; }
    .filo-cat-active { background: var(--f-surface-2); }

    /* ---------- 앱 골격 ---------- */
    .f-topbar {
      position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: -16px -16px 16px; padding: 12px 16px;
      background: var(--f-bg);
      border-bottom: 1px solid var(--f-line);
    }
    .f-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .f-brand-mark {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: #fff;
      box-shadow: 0 4px 12px -4px rgba(37, 99, 235, 0.6);
    }
    .f-brand-name { font: 800 17px/1.1 var(--f-font-display); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .f-brand-sub { font: 500 10px/1.2 var(--f-font-mono); color: var(--f-sub); letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .f-icon-btn {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      display: grid; place-items: center; color: var(--f-sub);
      transition: background .15s, color .15s;
    }
    .f-icon-btn:hover { background: var(--f-surface-2); color: var(--f-ink); }

    .f-tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
      background: var(--f-surface);
      border-top: 1px solid var(--f-line);
    }
    .f-tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 2px; border-radius: 12px; color: var(--f-sub);
      font-size: 11px; font-weight: 600; letter-spacing: -0.01em;
      position: relative;
    }
    .f-tab.is-active { color: var(--f-accent); }
    .f-tab.is-active .f-tab-icon { background: var(--f-accent-soft); }
    .f-tab-icon { width: 40px; height: 28px; border-radius: 999px; display: grid; place-items: center; transition: background .15s; }
    .f-tab-dot {
      position: absolute; top: 4px; left: calc(50% + 10px);
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
      background: var(--f-alert); color: #fff;
      font: 700 10px/16px var(--f-font-display); text-align: center;
    }

    @media (min-width: 768px) {
      .f-topbar, .f-tabbar { display: none; }
    }

    .f-sidebar { background: var(--f-side-bg); color: var(--f-side-ink); border-right: 1px solid var(--f-side-line); }
    .f-sidebar .f-brand-name { color: #fff; }
    .f-sidebar .f-brand-sub { color: var(--f-side-sub); }
    .f-side-label { font: 600 11px/1 var(--f-font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--f-side-sub); opacity: .7; padding: 0 12px 8px; }
    .f-side-nav { display: flex; flex-direction: column; gap: 4px; }
    .f-side-link {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 11px 12px; border-radius: 12px;
      font-size: 14px; font-weight: 500; color: var(--f-side-sub);
      transition: background .15s, color .15s;
    }
    .f-side-link:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .f-side-link.is-active { background: var(--f-side-active); color: #fff; font-weight: 600; box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.18); }
    .f-side-link.is-active svg { color: #60A5FA; }
    .f-side-foot { border-top: 1px solid var(--f-side-line); }
    .f-side-user { display: flex; align-items: center; gap: 10px; padding: 12px; margin-top: 8px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); }
    .f-avatar { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; background: linear-gradient(135deg, #1E293B, #334155); color: #fff; font-weight: 700; font-size: 14px; }
    .f-side-user b { display: block; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .f-side-user small { color: var(--f-side-sub); font-size: 11px; }
    .f-side-link .f-tab-dot { position: static; margin-left: auto; }

    /* ---------- 빠른 차감 ---------- */
    .f-page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .f-eyebrow { font: 500 11px/1.2 var(--f-font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--f-sub); margin-bottom: 4px; }
    .f-title { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
    .f-chip-btn {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      height: 36px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--f-line-strong); background: var(--f-surface);
      font-size: 13px; font-weight: 600; color: var(--f-ink);
    }
    .f-chip-btn:hover { border-color: var(--f-ink); }

    .f-status {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      background: var(--f-surface); border: 1px solid var(--f-line);
      border-radius: var(--f-radius); overflow: hidden; margin-bottom: 18px;
      box-shadow: var(--f-shadow);
    }
    .f-status-cell {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      padding: 14px 14px 12px; text-align: left; min-width: 0;
    }
    .f-status-cell + .f-status-cell { border-left: 1px solid var(--f-line); }
    .f-status-label { font-size: 12px; font-weight: 600; color: var(--f-sub); display: flex; align-items: center; gap: 6px; }
    .f-status-value { font: 600 28px/1 var(--f-font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .f-status-value small { font: 500 13px/1 'Pretendard Variable', Pretendard, sans-serif; color: var(--f-sub); margin-left: 3px; letter-spacing: 0; }
    .f-status-cta { font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
    button.f-status-cell:hover { background: var(--f-surface-2); }
    .f-status-cell.is-alert { background: var(--f-warn-soft); color: var(--f-warn); }
    .f-status-cell.is-alert .f-status-label { color: var(--f-warn); }
    .f-status-cell.is-pending .f-status-value { color: var(--f-accent); }

    .f-chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 2px 16px; scrollbar-width: none; }
    .f-chips::-webkit-scrollbar { display: none; }
    .f-chip {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      height: 34px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--f-line-strong); background: var(--f-surface);
      font-size: 13px; font-weight: 600; color: var(--f-ink); white-space: nowrap;
    }
    .f-chip .f-num { color: var(--f-sub); font-weight: 500; font-size: 12px; }
    .f-chip.is-empty { color: var(--f-sub); }
    .f-chip.is-active { background: var(--f-accent-soft); border-color: var(--f-accent); color: var(--f-accent); }
    .f-chip.is-active .f-num { color: inherit; opacity: .7; }
    .f-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--cat, var(--f-sub)); flex-shrink: 0; display: inline-block; }

    .f-toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
    .f-search {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 14px; border-radius: 12px;
      background: var(--f-field); border: 1px solid var(--f-line-strong); color: var(--f-sub);
    }
    .f-search:focus-within { border-color: var(--f-accent); }
    #root .f-search input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: none; color: var(--f-ink); font-size: 15px; border-radius: 0; }
    .f-ghost-btn {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      height: 44px; padding: 0 14px; border-radius: 12px;
      border: 1px solid var(--f-line-strong); background: var(--f-surface);
      font-size: 14px; font-weight: 600; color: var(--f-ink);
    }
    .f-ghost-btn:disabled { opacity: .35; cursor: not-allowed; }

    .f-notice {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
      padding: 12px 12px 12px 16px; border-radius: var(--f-radius);
      background: var(--f-surface); border: 1px solid var(--f-line-strong);
      font-size: 13px; line-height: 1.5; color: var(--f-sub);
    }
    .f-notice p { flex: 1; min-width: 0; }
    .f-notice b { color: var(--f-ink); }
    .f-notice.is-demo { background: var(--f-accent-soft); border-color: color-mix(in srgb, var(--f-accent) 25%, transparent); color: var(--f-ink); }
    .f-notice.is-demo b { color: var(--f-accent); }
    .f-notice-btn {
      flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 10px;
      background: var(--f-accent); color: var(--f-on-accent); font-size: 13px; font-weight: 700;
    }
    .f-notice-btn:hover { background: var(--f-accent-hover); }

    .f-list { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
    .f-empty { padding: 40px 16px; text-align: center; color: var(--f-sub); font-size: 14px; background: var(--f-surface); border: 1px dashed var(--f-line-strong); border-radius: var(--f-radius); }
    .f-item {
      display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 12px; row-gap: 10px;
      padding: 14px; background: var(--f-surface);
      border: 1px solid var(--f-line); border-radius: var(--f-radius);
      box-shadow: var(--f-shadow);
    }
    .f-item.is-out { border-color: color-mix(in srgb, var(--f-alert) 35%, var(--f-line)); }
    .f-thumb { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: var(--f-surface-2); }
    .f-mono {
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--cat, var(--f-sub)) 14%, var(--f-surface));
      color: var(--cat, var(--f-sub));
      font-size: 16px; font-weight: 700;
    }
    .f-item-body { min-width: 0; }
    .f-item-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--f-sub); margin-bottom: 3px; min-width: 0; }
    .f-cat { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }

    /* ---------- 홈 대시보드 ---------- */

      border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 0 0 30px rgba(255, 255, 255, 0.02), 0 0 0 60px rgba(255, 255, 255, 0.015);

    .f-hero p { color: #B6C2D9; font-size: 14px; margin-top: 6px; }
    .f-hero-btn {
      position: relative; z-index: 1;
      display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px;
      background: #fff; color: #0B1220; font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .f-hero-btn:hover { background: #E8EEF9; }

    .f-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    @media (min-width: 1024px) { .f-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; } }
    .f-kpi {
      background: var(--f-surface); border: 1px solid var(--f-line); border-radius: var(--f-radius);
      padding: 16px; box-shadow: var(--f-shadow); text-align: left; display: flex; flex-direction: column; gap: 12px; min-width: 0;
    }
    button.f-kpi:hover { border-color: var(--f-line-strong); }
    .f-kpi-icon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--tone-soft); color: var(--tone); }
    .f-kpi-label { font-size: 12.5px; color: var(--f-sub); font-weight: 600; }
    .f-kpi-value { font: 700 26px/1.1 var(--f-font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: 4px; }
    .f-kpi-value small { font: 600 13px/1 'Pretendard Variable', Pretendard, sans-serif; color: var(--f-sub); margin-left: 3px; letter-spacing: 0; }
    .tone-blue { --tone: var(--f-accent); --tone-soft: var(--f-accent-soft); }
    .tone-green { --tone: var(--f-ok); --tone-soft: var(--f-ok-soft); }
    .tone-orange { --tone: var(--f-warn); --tone-soft: var(--f-warn-soft); }
    .tone-red { --tone: var(--f-alert); --tone-soft: var(--f-alert-soft); }

    .f-panels { display: grid; gap: 14px; margin-bottom: 16px; }
    @media (min-width: 1024px) { .f-panels { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); } }
    .f-panel { background: var(--f-surface); border: 1px solid var(--f-line); border-radius: var(--f-radius); padding: 18px; box-shadow: var(--f-shadow); min-width: 0; }

    .f-link-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--f-accent); white-space: nowrap; }

    .f-donut-wrap { display: flex; align-items: center; gap: 20px; }

    .f-donut svg { transform: rotate(-90deg); }
    .f-donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
    .f-donut-center b { display: block; font: 800 26px/1 var(--f-font-display); letter-spacing: -0.03em; }
    .f-donut-center small { font-size: 11px; color: var(--f-sub); font-weight: 600; }
    .f-legend { flex: 1; min-width: 0; display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
    .f-legend li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--f-sub); }

    .f-legend i { width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0; }

    .f-bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 140px; padding-top: 8px; border-bottom: 1px solid var(--f-line); background-image: linear-gradient(var(--f-line) 1px, transparent 1px); background-size: 100% 35px; background-position: 0 -1px; }
    .f-bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
    .f-bar span { font: 600 11px/1 var(--f-font-display); color: var(--f-sub); font-variant-numeric: tabular-nums; }
    .f-bar i { width: min(26px, 70%); border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, #60A5FA, var(--f-accent)); min-height: 2px; }
    .f-bar.is-today i { background: linear-gradient(180deg, #93C5FD, #1D4ED8); box-shadow: 0 0 0 3px var(--f-accent-soft); }
    .f-bar.is-zero i { background: var(--f-line-strong); }
    .f-bar-labels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 6px; font-size: 11px; color: var(--f-sub); text-align: center; font-variant-numeric: tabular-nums; }
    .f-chart-empty { font-size: 12px; color: var(--f-sub); margin-top: 10px; }

    .f-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .f-table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--f-sub); padding: 10px 12px; background: var(--f-surface-2); white-space: nowrap; }
    .f-table th:first-child { border-radius: 10px 0 0 10px; }
    .f-table th:last-child { border-radius: 0 10px 10px 0; }
    .f-table td { padding: 12px; border-bottom: 1px solid var(--f-line); vertical-align: middle; }
    .f-table tr:last-child td { border-bottom: 0; }
    .f-table td.f-td-name { font-weight: 600; }
    .f-table .f-num { white-space: nowrap; }
    @media (max-width: 640px) { .f-table .f-hide-sm { display: none; } }

    .f-quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (min-width: 1024px) { .f-quick-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .f-quick {
      display: flex; align-items: center; gap: 12px; padding: 14px; text-align: left;
      background: var(--f-surface); border: 1px solid var(--f-line); border-radius: 14px; box-shadow: var(--f-shadow);
      font-size: 14px; font-weight: 600;
    }
    .f-quick:hover { border-color: var(--f-accent); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>

<body>
  <!-- 초기 로딩 스크린 -->
  <div id="filo-loader" class="filo-loader">
    <div style="font-size: 22px; font-weight: 300;">FILO</div>
    <div class="filo-loader-line"></div>
    <div style="font-size: 11px; opacity: 0.6; letter-spacing: 0.1em;">불러오는 중</div>
  </div>

  <div id="root"></div>

  <script type="text/babel" data-presets="react" data-type="module">
    const { useState, useEffect, useMemo } = React;

    // ============================================
    // 0. CONSTANTS — 카테고리 / 컬러 / 헬퍼
    // ============================================

    // 카테고리 시스템 (4가지 고정 대분류)
    const CATEGORIES = [
      {
        key: '펌제',
        color: { hex: '#D2583C', bg: 'filo-cat-active', border: 'border-[#D2583C]', text: '', dot: 'bg-[#D2583C]', solid: 'bg-[#D2583C]' }
      },
      {
        key: '염색',
        color: { hex: '#4A63D8', bg: 'filo-cat-active', border: 'border-[#4A63D8]', text: '', dot: 'bg-[#4A63D8]', solid: 'bg-[#4A63D8]' }
      },
      {
        key: '헤어케어',
        color: { hex: '#1F9A80', bg: 'filo-cat-active', border: 'border-[#1F9A80]', text: '', dot: 'bg-[#1F9A80]', solid: 'bg-[#1F9A80]' }
      },
      {
        key: '스타일링',
        color: { hex: '#C0901C', bg: 'filo-cat-active', border: 'border-[#C0901C]', text: '', dot: 'bg-[#C0901C]', solid: 'bg-[#C0901C]' }
      }
    ];

    const getCategoryStyle = (cat) => CATEGORIES.find(c => c.key === cat) || null;

    // 선 아이콘 (24px 그리드, currentColor)
    const ICON_PATHS = {
      quick: ['M13 2 4 14h7l-1 8 9-12h-7l1-8z'],
      stocktake: ['M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z', 'M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2', 'm9 14 2 2 4-4'],
      dashboard: ['m22 2-7 20-4-9-9-4z', 'M22 2 11 13'],
      manage: ['M21 8 12 3 3 8v8l9 5 9-5V8z', 'M3 8l9 5 9-5', 'M12 13v8'],
      settings: ['M4 21v-7', 'M4 10V3', 'M12 21v-9', 'M12 8V3', 'M20 21v-5', 'M20 12V3', 'M1 14h6', 'M9 8h6', 'M17 16h6'],
      sun: ['M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z', 'M12 2v2', 'M12 20v2', 'm4.9 4.9 1.4 1.4', 'm17.7 17.7 1.4 1.4', 'M2 12h2', 'M20 12h2', 'm4.9 19.1 1.4-1.4', 'm17.7 6.3 1.4-1.4'],
      moon: ['M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z'],
      undo: ['M9 14 4 9l5-5', 'M4 9h10.5a5.5 5.5 0 0 1 0 11H11'],
      search: ['M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z', 'm21 21-4.3-4.3'],
      list: ['M8 6h13', 'M8 12h13', 'M8 18h13', 'M3 6h.01', 'M3 12h.01', 'M3 18h.01'],
      arrow: ['M5 12h14', 'm12 5 7 7-7 7'],
      minus: ['M5 12h14'],
      home: ['M3 10.5 12 3l9 7.5', 'M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5'],
      logo: ['M21 8 12 3 3 8v8l9 5 9-5V8z', 'M3 8l9 5 9-5', 'M12 13v8'],
      check: ['M22 11.1V12a10 10 0 1 1-5.9-9.1', 'm22 4-10 10-3-3'],
      alert: ['M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', 'M12 9v4', 'M12 17h.01'],
      clock: ['M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z', 'M12 6v6l4 2'],
      plus: ['M12 5v14', 'M5 12h14'],
    };
    const Icon = ({ name, size = 20, strokeWidth = 1.75, className = '' }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
        {(ICON_PATHS[name] || []).map((d, i) => <path key={i} d={d} />)}
      </svg>
    );
    function ProductThumb({ product, size = 44 }) {
      const [failed, setFailed] = useState(false);
      const cat = getCategoryStyle(product.category);
      const hasPhoto = product.image && product.image !== FALLBACK_IMAGE && !failed;
      const style = { width: size, height: size, flexShrink: 0, ...(cat ? { '--cat': cat.color.hex } : {}) };
      if (hasPhoto) {
        return <img src={product.image} alt="" loading="lazy" className="f-thumb" style={style} onError={() => setFailed(true)} />;
      }
      return (
        <div className="f-thumb f-mono" style={style} aria-hidden="true">
          {(cat ? cat.key : (product.name || '?')).trim().charAt(0)}
        </div>
      );
    }

    const NAV_ITEMS = [
      { key: 'home', label: '홈' },
      { key: 'quick', label: '빠른 차감' },
      { key: 'stocktake', label: '재고조사' },
      { key: 'dashboard', label: '발주' },
      { key: 'manage', label: '품목 관리' },
    ];

    // 전화번호 자동 포맷팅 (010-1234-5678 / 02-123-4567)
    const formatPhone = (raw) => {
      const digits = String(raw || '').replace(/[^0-9]/g, '');
      if (digits.length === 0) return '';
      if (digits.length <= 3) return digits;
      // 휴대폰 11자리
      if (digits.length === 11) {
        return `${digits.slice(0, 3)}-${digits.slice(3, 7)}-${digits.slice(7)}`;
      }
      // 서울 02
      if (digits.startsWith('02') && digits.length === 10) {
        return `${digits.slice(0, 2)}-${digits.slice(2, 6)}-${digits.slice(6)}`;
      }
      if (digits.startsWith('02') && digits.length === 9) {
        return `${digits.slice(0, 2)}-${digits.slice(2, 5)}-${digits.slice(5)}`;
      }
      // 일반 지역번호 10자리
      if (digits.length === 10) {
        return `${digits.slice(0, 3)}-${digits.slice(3, 6)}-${digits.slice(6)}`;
      }
      // 짧은 경우 중간 하이픈만
      if (digits.length > 3 && digits.length <= 7) {
        return `${digits.slice(0, 3)}-${digits.slice(3)}`;
      }
      return `${digits.slice(0, digits.length - 4)}-${digits.slice(-4)}`;
    };

    // ============================================
    // 1. THEME PRESETS — 색 값은 CSS 토큰(data-filo-theme)에서 결정
    // ============================================
    const themes = {
      studio: {
        name: "Studio",
        bg: "bg-[color:var(--f-bg)]",
        surface: "bg-[color:var(--f-surface)] border-[color:var(--f-line)]",
        text: "text-[color:var(--f-ink)]",
        subText: "text-[color:var(--f-sub)]",
        inputBg: "bg-[color:var(--f-field)] border-[color:var(--f-line-strong)] text-[color:var(--f-ink)]",
        pointBtn: "bg-[color:var(--f-accent)] text-[color:var(--f-on-accent)] hover:bg-[color:var(--f-accent-hover)] font-semibold",
        badge: "text-[color:var(--f-accent)]",
        activeTab: "bg-[color:var(--f-ink)] text-[color:var(--f-bg)] font-semibold",
        border: "border-[color:var(--f-line)]"
      },
      night: {
        name: "Night",
        bg: "bg-[color:var(--f-bg)]",
        surface: "bg-[color:var(--f-surface)] border-[color:var(--f-line)]",
        text: "text-[color:var(--f-ink)]",
        subText: "text-[color:var(--f-sub)]",
        inputBg: "bg-[color:var(--f-field)] border-[color:var(--f-line-strong)] text-[color:var(--f-ink)]",
        pointBtn: "bg-[color:var(--f-accent)] text-[color:var(--f-on-accent)] hover:bg-[color:var(--f-accent-hover)] font-semibold",
        badge: "text-[color:var(--f-accent)]",
        activeTab: "bg-[color:var(--f-ink)] text-[color:var(--f-bg)] font-semibold",
        border: "border-[color:var(--f-line)]"
      }
    };

    // ============================================
    // 2. SEED DATA — 살롱 현장 실제 제품군
    // ============================================
    // 010-0000-xxxx 대역은 실제로 발급되지 않는 번호라 체험 중 문자 버튼을 눌러도 안전
    const defaultProducts = [
      { id: 1, name: "아이롱 펌제 1제 (건강모용)", company: "동양상사", phone: "01000001234", category: "펌제", currentStock: 12, safeStock: 20, image: "" },
      { id: 2, name: "치오 크림 펌제 1제", company: "동양상사", phone: "01000001234", category: "펌제", currentStock: 4, safeStock: 10, image: "" },
      { id: 3, name: "펌 2제 브롬산", company: "동양상사", phone: "01000001234", category: "펌제", currentStock: 9, safeStock: 6, image: "" },
      { id: 4, name: "알칼리 염모제 7.1 애쉬브라운", company: "미래헤어랩", phone: "01000005678", category: "염색", currentStock: 8, safeStock: 6, image: "" },
      { id: 5, name: "산화제 6% 1000ml", company: "미래헤어랩", phone: "01000005678", category: "염색", currentStock: 3, safeStock: 4, image: "" },
      { id: 6, name: "케라틴 pH 밸런서", company: "미래헤어랩", phone: "01000005678", category: "헤어케어", currentStock: 1, safeStock: 5, image: "" },
      { id: 7, name: "매트 텍스처 왁스", company: "한빛뷰티", phone: "01000009012", category: "스타일링", currentStock: 7, safeStock: 3, image: "" },
    ];

    const FALLBACK_IMAGE = "https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?q=80&w=200&auto=format&fit=crop";

    // ============================================
    // 3. 안전한 localStorage 래퍼 (사파리 시크릿모드 + 용량 초과 대응)
    // ============================================
    const safeStorage = {
      get(key, fallback) {
        try {
          const v = localStorage.getItem(key);
          return v ? JSON.parse(v) : fallback;
        } catch (e) {
          return fallback;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return { ok: true };
        } catch (e) {
          // QuotaExceededError 등
          console.warn('Storage error:', e);
          return { ok: false, error: e };
        }
      },
      // 사용량 추정 (KB 단위)
      usageKB() {
        let total = 0;
        try {
          for (const key in localStorage) {
            if (localStorage.hasOwnProperty(key) && key.startsWith('filo_')) {
              total += (localStorage.getItem(key) || '').length;
              total += key.length;
            }
          }
        } catch (e) {}
        return Math.round(total / 1024);
      }
    };

    // ============================================
    // ============================================
    // 4. SUB COMPONENTS — 인라인 편집 에디터들
    // ============================================

    // 제품 정보 인라인 편집기
    function ProductEditor({ theme, product, onSave, onCancel, onImageUpload, companyList = [], categoryList = [] }) {
      const [draft, setDraft] = useState({
        name: product.name,
        company: product.company,
        phone: product.phone,
        category: product.category || '',
        currentStock: product.currentStock,
        safeStock: product.safeStock,
        image: product.image
      });
      const [uploading, setUploading] = useState(false);

      // 부모에서 이미지가 업데이트되면 draft에도 즉시 반영 (미리보기 동기화)
      useEffect(() => {
        setDraft(prev => ({ ...prev, image: product.image }));
      }, [product.image]);

      const handleImg = async (file) => {
        if (!file) return;
        setUploading(true);
        try {
          await onImageUpload(file);
        } finally {
          setUploading(false);
        }
      };

      const handleSubmit = () => {
        if (!draft.name.trim() || !draft.company.trim() || !draft.phone.trim()) {
          alert('필수 항목을 비울 수 없습니다 (이름/거래처/전화번호)');
          return;
        }
        onSave({
          name: draft.name.trim(),
          company: draft.company.trim(),
          phone: draft.phone.replace(/[^0-9]/g, ''),
          category: (draft.category || '').trim(),
          currentStock: Math.max(0, Number(draft.currentStock) || 0),
          safeStock: Math.max(1, Number(draft.safeStock) || 1),
          image: draft.image
        });
      };

      return (
        <div className={`px-4 pb-4 border-t ${theme.border} space-y-3`} style={{animation: 'filoExpand 0.25s ease-out'}}>
          <div className="pt-3 grid grid-cols-1 gap-3">
            {/* 이미지 + 업로드 */}
            <div className="flex items-center gap-3">
              <div className="relative">
                <img
                  src={draft.image}
                  alt=""
                  className={`w-16 h-16 object-cover border border-current opacity-90 flex-shrink-0 ${uploading ? 'filo-uploading' : ''}`}
                />
                {uploading && (
                  <div className="absolute inset-0 flex items-center justify-center bg-black/40 text-xs tracking-widest font-mono uppercase">
                    압축중
                  </div>
                )}
              </div>
              <div className="flex-1 grid grid-cols-2 gap-2">
                <label className={`p-2 text-xs text-center tracking-wider border border-current opacity-70 hover:opacity-100 transition-all cursor-pointer ${uploading ? 'pointer-events-none opacity-40' : ''}`}>
                  촬영
                  <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    className="hidden"
                    disabled={uploading}
                    onChange={(e) => handleImg(e.target.files?.[0])}
                  />
                </label>
                <label className={`p-2 text-xs text-center tracking-wider border border-current opacity-70 hover:opacity-100 transition-all cursor-pointer ${uploading ? 'pointer-events-none opacity-40' : ''}`}>
                  갤러리
                  <input
                    type="file"
                    accept="image/*"
                    className="hidden"
                    disabled={uploading}
                    onChange={(e) => handleImg(e.target.files?.[0])}
                  />
                </label>
              </div>
            </div>

            <div>
              <label className="block text-xs uppercase tracking-wider mb-1 opacity-60">제품 이름</label>
              <input
                type="text"
                value={draft.name}
                onChange={e => setDraft({...draft, name: e.target.value})}
                className={`w-full p-2 text-sm focus:outline-none border ${theme.inputBg}`}
              />
            </div>

            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="block text-xs uppercase tracking-wider mb-1 opacity-60">거래처</label>
                <input
                  type="text"
                  list="filo-company-list-editor"
                  value={draft.company}
                  onChange={e => setDraft({...draft, company: e.target.value})}
                  className={`w-full p-2 text-sm focus:outline-none border ${theme.inputBg}`}
                />
                <datalist id="filo-company-list-editor">
                  {companyList.map(c => <option key={c} value={c} />)}
                </datalist>
              </div>
              <div>
                <label className="block text-xs uppercase tracking-wider mb-1 opacity-60">전화번호</label>
                <input
                  type="tel"
                  inputMode="numeric"
                  value={formatPhone(draft.phone)}
                  onChange={e => setDraft({...draft, phone: e.target.value.replace(/[^0-9]/g, '')})}
                  className={`w-full p-2 text-sm focus:outline-none border ${theme.inputBg}`}
                />
              </div>
            </div>

            <div>
              <label className="block text-xs uppercase tracking-wider mb-1 opacity-60">카테고리 (선택)</label>
              <div className="grid grid-cols-4 gap-1.5">
                {CATEGORIES.map(c => {
                  const active = draft.category === c.key;
                  return (
                    <button
                      type="button"
                      key={c.key}
                      onClick={() => setDraft({...draft, category: active ? '' : c.key})}
                      className={`py-2.5 text-sm tracking-wide transition-all border-2 ${
                        active
                          ? `${c.color.bg} ${c.color.text} font-semibold`
                          : 'border-current opacity-30 hover:opacity-70'
                      }`}
                      style={active ? { borderColor: c.color.hex } : {}}
                    >
                      {c.key}
                    </button>
                  );
                })}
              </div>
              {draft.category && (
                <p className={`text-xs ${theme.subText} mt-1.5`}>
                  선택 해제하려면 같은 카테고리를 다시 누르세요
                </p>
              )}
            </div>

            <div className="grid grid-cols-2 gap-2">
              <div>
                <label className="block text-xs uppercase tracking-wider mb-1 opacity-60">현재고</label>
                <input
                  type="number"
                  inputMode="numeric"
                  min="0"
                  value={draft.currentStock}
                  onChange={e => setDraft({...draft, currentStock: e.target.value})}
                  className={`w-full p-2 text-sm text-center focus:outline-none border ${theme.inputBg}`}
                />
              </div>
              <div>
                <label className="block text-xs uppercase tracking-wider mb-1 opacity-60">적정선</label>
                <input
                  type="number"
                  inputMode="numeric"
                  min="1"
                  value={draft.safeStock}
                  onChange={e => setDraft({...draft, safeStock: e.target.value})}
                  className={`w-full p-2 text-sm text-center focus:outline-none border ${theme.inputBg}`}
                />
              </div>
            </div>

            <div className="flex gap-2 pt-1">
              <button
                onClick={onCancel}
                className="flex-1 py-2 text-sm tracking-wider border border-current opacity-60 hover:opacity-100 transition-all"
              >
                취소
              </button>
              <button
                onClick={handleSubmit}
                className={`flex-1 py-2 text-sm tracking-wider font-medium ${theme.pointBtn}`}
              >
                저장
              </button>
            </div>
          </div>
        </div>
      );
    }

    // 거래처 정보 인라인 편집기 (같은 거래처의 모든 제품에 일괄 적용)
    function CompanyEditor({ theme, originalName, originalPhone, onSave, onCancel }) {

              <label className="block text-xs uppercase tracking-wider mb-1 opacity-60">거래처명</label>
              <input
                type="text"

                onChange={e => setName(e.target.value)}

            <div>
              <label className="block text-xs uppercase tracking-wider mb-1 opacity-60">전화번호</label>
              <input
                type="tel"
                inputMode="numeric"
                value={phone}
                onChange={e => setPhone(e.target.value)}
                className={`w-full p-2 text-sm focus:outline-none border ${theme.inputBg}`}

            </p>
            <div className="flex gap-2 pt-1">
              <button
                onClick={onCancel}
                className="flex-1 py-2 text-sm tracking-wider border border-current opacity-60 hover:opacity-100 transition-all"
              >
                취소
              </button>
              <button
                onClick={() => onSave(name, phone)}
                className={`flex-1 py-2 text-sm tracking-wider font-medium ${theme.pointBtn}`}

                저장

    // 직접 수량 입력 모달 (빠른 차감 탭에서 숫자 탭하면)
    function QuickInputModal({ theme, product, onSave, onCancel }) {
      const [value, setValue] = useState(String(product.currentStock));

      const handleSubmit = () => {
        const num = parseInt(value);
        if (isNaN(num)) {
          alert('숫자를 입력해주세요');
          return;
        }
        onSave(num);
      };

      // 입력시 엔터키로 저장
      const handleKey = (e) => {
        if (e.key === 'Enter') handleSubmit();
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70"
          onClick={onCancel}
        >
          <div
            className={`${theme.surface} border max-w-xs w-full`}
            onClick={e => e.stopPropagation()}
          >
            <div className="p-5">
              <p className={`text-xs ${theme.subText} tracking-widest uppercase font-mono mb-2`}>수량 직접 설정</p>
              <h4 className="text-base font-medium mb-1 truncate">{product.name}</h4>
              <p className={`text-xs ${theme.subText} mb-4`}>
                적정선 {product.safeStock}개 · 현재 {product.currentStock}개
              </p>

              <input
                type="number"
                inputMode="numeric"
                autoFocus
                value={value}
                onChange={e => setValue(e.target.value)}
                onKeyDown={handleKey}
                onFocus={e => e.target.select()}
                className={`w-full p-3 text-center text-2xl font-mono font-semibold focus:outline-none border ${theme.inputBg}`}
              />

              {/* 일괄 차감/증가 빠른 버튼 */}
              <div className="grid grid-cols-6 gap-1 mt-3">
                {[-10, -5, -1, +1, +5, +10].map(d => (
                  <button
                    key={d}
                    onClick={() => {
                      const cur = parseInt(value) || 0;
                      setValue(String(Math.max(0, cur + d)));
                    }}
                    className={`py-1.5 text-xs font-mono border border-current opacity-60 hover:opacity-100 active:scale-95 transition-all ${d < 0 ? theme.badge : ''}`}
                  >
                    {d > 0 ? '+' : ''}{d}
                  </button>
                ))}
              </div>

              <div className="flex gap-2 mt-4">
                <button
                  onClick={onCancel}
                  className="flex-1 py-2 text-sm tracking-wider border border-current opacity-60 hover:opacity-100 transition-all"
                >
                  취소
                </button>
                <button
                  onClick={handleSubmit}
                  className={`flex-1 py-2 text-sm tracking-wider font-medium ${theme.pointBtn}`}
                >
                  저장
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // 발주서 미리보기 + 편집 모달
    // ============================================

            <div className={`p-5 border-b ${theme.border} flex items-center justify-between`}>
              <div>
                <h3 className="text-base font-light tracking-wide">발주서 미리보기</h3>
                <p className={`text-xs ${theme.subText} mt-1 font-mono tracking-widest uppercase`}>
                  {company} · {info.items.length}개 품목
                </p>
              </div>
              <button
                onClick={onClose}
                className="text-lg opacity-50 hover:opacity-100 w-8 h-8 flex items-center justify-center"
              >
                ✕
              </button>
            </div>

            <div className="p-5 space-y-4">
              <div>
                <label className="block text-xs uppercase tracking-wider mb-1.5 opacity-60">
                  메시지 내용 (편집 가능)
                </label>
                <textarea
                  value={text}
                  onChange={e => setText(e.target.value)}
                  rows="10"
                  maxLength="500"
                  className={`w-full p-3 text-sm focus:outline-none border resize-none leading-relaxed font-mono ${theme.inputBg}`}
                />
                <div className={`text-[11px] ${theme.subText} text-right mt-1 font-mono`}>

              <div className={`text-xs ${theme.subText} p-3 border ${theme.border} leading-relaxed`}>

                <p className="mt-1 opacity-80">예: "이번 주에 빨리 부탁드려요" / "오후 3시 이후 전화드립니다"</p>

                  ✉ 문자 전송

                ↺ 기본 메시지로 초기화

            </div>
          </div>
        </div>
      );

    // ============================================
    // 발주 이력 모달
    // ============================================
    function OrderHistoryModal({ theme, history, onClose, onClear }) {
      // 날짜별 그룹핑
      const grouped = useMemo(() => {
        const groups = {};
        history.forEach(entry => {
          const d = new Date(entry.t);
          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          if (!groups[key]) groups[key] = [];
          groups[key].push(entry);
        });
        return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
      }, [history]);

      const channelLabel = {
        sms: '📱 문자',
        copy: '복사',
        preview: '미리보기'
      };

      const fmtDate = (key) => {
        const [y, m, d] = key.split('-');
        const dt = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        return `${parseInt(m)}월 ${parseInt(d)}일 (${days[dt.getDay()]})`;
      };

      const fmtTime = (t) => {
        const d = new Date(t);
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70"
          onClick={onClose}
        >
          <div
            className={`${theme.surface} border max-w-lg w-full max-h-[85vh] overflow-y-auto`}
            onClick={e => e.stopPropagation()}
          >
            <div className={`p-5 border-b ${theme.border} flex items-center justify-between sticky top-0 ${theme.surface} z-10`}>
              <div>
                <h3 className="text-base font-light tracking-wide">발주 이력</h3>
                <p className={`text-xs ${theme.subText} mt-1 font-mono tracking-widest uppercase`}>
                  총 {history.length}건
                </p>
              </div>
              <button
                onClick={onClose}
                className="text-lg opacity-50 hover:opacity-100 w-8 h-8 flex items-center justify-center"
              >
                ✕
              </button>
            </div>

            <div className="p-5">
              {history.length === 0 ? (
                <div className={`text-center py-12 border ${theme.border} ${theme.subText} text-sm`}>
                  아직 발주 이력이 없습니다.<br/>
                  문자 발주 또는 복사 버튼을 누르면 자동 기록됩니다.
                </div>
              ) : (
                <div className="space-y-4">
                  {grouped.map(([dateKey, entries]) => (
                    <div key={dateKey}>
                      <p className={`text-xs ${theme.subText} tracking-widest uppercase font-mono mb-2`}>
                        {fmtDate(dateKey)} · {entries.length}건
                      </p>
                      <div className="space-y-2">
                        {entries.map(entry => (
                          <div key={entry.id} className={`p-3 border ${theme.border}`}>
                            <div className="flex items-start justify-between gap-2 mb-1.5">
                              <div className="flex-1 min-w-0">
                                <p className="text-sm font-medium truncate">{entry.company}</p>
                                <p className={`text-xs ${theme.subText} font-mono`}>
                                  {fmtTime(entry.t)} · {channelLabel[entry.channel] || entry.channel}
                                </p>
                              </div>
                              <span className={`text-xs ${theme.subText} font-mono whitespace-nowrap`}>
                                {entry.totalQty}개
                              </span>
                            </div>
                            <div className="space-y-0.5">
                              {entry.items.map((it, i) => (
                                <p key={i} className={`text-xs ${theme.subText} truncate`}>
                                  · {it.name}: {it.qty}개
                                </p>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {history.length > 0 && (
                <button
                  onClick={() => {
                    if (window.confirm(`발주 이력 ${history.length}건을 모두 삭제하시겠습니까?`)) {
                      onClear();
                      onClose();
                    }
                  }}
                  className="w-full mt-4 py-1.5 text-xs tracking-widest uppercase opacity-40 hover:opacity-100 transition-all"
                >
                  이력 전체 삭제
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

                />
              </div>

              <div>

              <div>
                <label className="block text-sm uppercase tracking-wider mb-1 opacity-70">메모 (선택)</label>

                />

              <div className="grid grid-cols-2 gap-2 pt-2">
                <button
                  onClick={onClose}
                  className="py-2.5 text-sm tracking-wider border border-current opacity-60 hover:opacity-100 transition-all"
                >
                  취소
                </button>
                <button
                  onClick={handleSubmit}
                  disabled={!name.trim() || !phone.trim()}
                  className={`py-2.5 text-sm tracking-wider font-medium uppercase transition-all ${
                    name.trim() && phone.trim() ? theme.pointBtn : 'opacity-30 cursor-not-allowed border border-current'
                  }`}
                >
                  등록
                </button>
              </div>
            </div>
          </div>

    // ============================================
    // 오늘 사용 히스토리 모달
    // ============================================
    function TodayUsageModal({ theme, usage, onClose }) {
      // 제품별 집계
      const summary = useMemo(() => {
        const byProduct = {};
        usage.forEach(u => {
          if (!byProduct[u.productName]) {
            byProduct[u.productName] = { name: u.productName, qty: 0, count: 0, firstT: u.t, lastT: u.t };
          }
          byProduct[u.productName].qty += Math.abs(u.delta);
          byProduct[u.productName].count += 1;
          if (u.t < byProduct[u.productName].firstT) byProduct[u.productName].firstT = u.t;
          if (u.t > byProduct[u.productName].lastT) byProduct[u.productName].lastT = u.t;
        });
        return Object.values(byProduct).sort((a, b) => b.qty - a.qty);
      }, [usage]);

      const totalQty = usage.reduce((s, u) => s + Math.abs(u.delta), 0);

      const fmtTime = (t) => {
        const d = new Date(t);
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      };

      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70"
          onClick={onClose}
        >
          <div
            className={`${theme.surface} border max-w-md w-full max-h-[85vh] overflow-y-auto`}
            onClick={e => e.stopPropagation()}
          >
            <div className={`p-5 border-b ${theme.border} flex items-center justify-between sticky top-0 ${theme.surface} z-10`}>
              <div>
                <h3 className="text-base font-bold tracking-tight">📋 오늘 사용 내역</h3>
                <p className={`text-xs ${theme.subText} mt-1 font-mono tracking-widest uppercase`}>
                  {new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' })} · 차감(−)만 집계
                </p>
              </div>
              <button
                onClick={onClose}
                className="text-lg opacity-50 hover:opacity-100 w-8 h-8 flex items-center justify-center"
              >
                ✕
              </button>
            </div>

            <div className="p-5">
              {usage.length === 0 ? (
                <div className={`text-center py-12 border ${theme.border} ${theme.subText} text-sm`}>
                  오늘 아직 차감한 약품이 없습니다.<br/>
                  빠른 차감 탭에서 <span className="font-bold">−</span> 버튼을 눌러보세요.<br/>
                  <span className="text-xs opacity-70">※ 재입고(+)는 사용으로 집계되지 않습니다</span>
                </div>
              ) : (
                <div className="space-y-5">
                  {/* 합계 */}
                  <div className={`p-4 border ${theme.border} flex items-center justify-between`}>
                    <div>
                      <p className={`text-xs ${theme.subText} tracking-widest uppercase font-mono`}>오늘 차감 총합</p>
                      <p className="text-2xl font-light mt-1 font-mono">{totalQty}<span className="text-sm ml-1 opacity-60">개</span></p>
                    </div>
                    <div className="text-right">
                      <p className={`text-xs ${theme.subText} tracking-widest uppercase font-mono`}>제품 종류</p>
                      <p className="text-2xl font-light mt-1 font-mono">{summary.length}</p>
                    </div>
                  </div>

                  {/* 제품별 집계 */}
                  <div>
                    <p className={`text-xs ${theme.subText} tracking-widest uppercase font-mono mb-2`}>제품별 사용량</p>
                    <div className="space-y-1.5">
                      {summary.map((s, i) => (
                        <div key={s.name} className={`flex items-center justify-between p-2.5 border ${theme.border}`}>
                          <div className="flex-1 min-w-0">
                            <p className="text-sm truncate">{s.name}</p>
                            <p className={`text-xs ${theme.subText} font-mono`}>
                              {s.count}회 · {fmtTime(s.firstT)}{s.count > 1 && ` ~ ${fmtTime(s.lastT)}`}
                            </p>
                          </div>
                          <span className="font-mono font-medium ml-3">{s.qty}<span className="text-xs opacity-60 ml-0.5">개</span></span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 시간순 상세 */}
                  <div>
                    <p className={`text-xs ${theme.subText} tracking-widest uppercase font-mono mb-2`}>시간순 상세 ({usage.length}건)</p>
                    <div className={`p-3 border ${theme.border} space-y-1 max-h-48 overflow-y-auto`}>
                      {usage.map((u, idx) => (
                        <div key={`${u.id}-${u.t}-${idx}`} className="flex justify-between text-sm">
                          <span className="truncate flex-1 mr-2">{u.productName}</span>
                          <span className={`font-mono ${theme.subText} flex-shrink-0`}>{fmtTime(u.t)} · {Math.abs(u.delta)}개</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================
    // 사용 가이드 모달 (첫 방문 + 수동 열기)
    // ============================================
    function GuideModal({ theme, onClose, stockCycle, setStockCycle, onStartEmpty, onStartSample }) {
      const [step, setStep] = useState(0);

      const steps = [
        { type: 'welcome' },
        { type: 'cycle' },
        {
          type: 'info',
          title: '약품 등록',

        },

          title: '자동 발주',

          detail: '거래처별로 자동 분류되어\n문자 발주·텍스트 복사·미리보기로 보낼 수 있습니다.\n\n발주 후 완료 버튼을 누르면 깔끔하게 정리됩니다.'
        },
        { type: 'start' }

        handleClose();

        <div

        >
          <div
            className={`${theme.surface} border max-w-md w-full`}
            onClick={e => e.stopPropagation()}
          >
            <div className={`p-5 border-b ${theme.border} flex items-center justify-between`}>
              <span className={`text-sm ${theme.subText} font-mono tracking-[0.2em] uppercase`}>

                onClick={handleClose}
                className="text-lg opacity-40 hover:opacity-100 w-8 h-8 flex items-center justify-center"
                title="건너뛰기"
              >
                ✕
              </button>
            </div>

            <div className="p-8">
              {/* 환영 */}
              {current.type === 'welcome' && (
                <div className="text-center space-y-5">

                  <div className={`w-12 h-px mx-auto ${theme.border} border-t`}></div>

                      className={`p-5 border-2 transition-all ${

                          : `${theme.border} opacity-60 hover:opacity-100`

                      <div className="text-2xl font-light mb-1">주</div>
                      <div className="text-sm tracking-wide font-medium">주 단위</div>

                      <div className="text-sm tracking-wide font-medium">월 단위</div>

                      </div>
                    </button>
                  </div>

                  <p className={`text-sm ${theme.subText} text-center opacity-70`}>
                    나중에 설정에서 언제든 변경할 수 있습니다.
                  </p>
                </div>
              )}

              {/* 정보 단계 */}
              {current.type === 'info' && (
                <div className="space-y-4">

                    <span className={`text-2xl font-light ${theme.badge}`}>{String(step - 1).padStart(2, '0')}</span>

                      <div className="text-base font-medium mb-1">샘플로 둘러보기</div>
                      <div className={`text-sm ${theme.subText} leading-relaxed`}>
                        예시 약품으로 먼저 기능을 체험. 나중에 설정에서 초기화 가능.
                      </div>
                    </button>
                  </div>
                </div>
              )}

              {/* 진행 도트 */}
              <div className="flex justify-center gap-1.5 mt-6">
                {steps.map((_, i) => (
                  <button
                    key={i}
                    onClick={() => setStep(i)}

            {/* 하단 버튼: 시작 단계에서는 숨김 (위에서 선택) */}
            {current.type !== 'start' && (
              <div className={`p-4 border-t ${theme.border} grid grid-cols-2 gap-2`}>

                  <button

    // ============================================
    // 5. MAIN APP
    // ============================================
    function App() {
      const [products, setProducts] = useState(() => {
        const saved = safeStorage.get('filo_products', []);
        // 판매 페이지의 '체험하기'로 들어왔고 아직 내 데이터가 없으면 샘플로 바로 시작
        if (saved.length === 0 && /[?&]demo\b/.test(window.location.search)) {
          safeStorage.set('filo_guide_seen', true);
          safeStorage.set('filo_demo', true);
          return defaultProducts;
        }
        return saved;
      });
      const [isDemo, setIsDemo] = useState(() => safeStorage.get('filo_demo', false));
      useEffect(() => { safeStorage.set('filo_demo', isDemo); }, [isDemo]);
      useEffect(() => {
        if (/[?&]demo\b/.test(window.location.search)) {
          try { window.history.replaceState(null, '', window.location.pathname); } catch (e) {}
        }
      }, []);

      // 재고 파악 주기 (weekly / monthly)
      const [stockCycle, setStockCycle] = useState(() => safeStorage.get('filo_stock_cycle', 'monthly'));
      useEffect(() => { safeStorage.set('filo_stock_cycle', stockCycle); }, [stockCycle]);

      // 주기 라벨 헬퍼
      const cycleLabel = stockCycle === 'weekly'
        ? { this: '이번 주', last: '지난 주', unit: '주' }
        : { this: '이번 달', last: '지난 달', unit: '월' };

      const [currentThemeKey, setCurrentThemeKey] = useState(() => {
        // head 스크립트가 정한 값(저장값 또는 기기 설정)을 그대로 사용. 구 테마 키(cream/forest 등)는 studio로 이전됨.
        const attr = document.documentElement.getAttribute('data-filo-theme');
        return themes[attr] ? attr : 'studio';
      });
      useEffect(() => {
        document.documentElement.setAttribute('data-filo-theme', currentThemeKey);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', currentThemeKey === 'night' ? '#0A0F1C' : '#F4F6FA');
      }, [currentThemeKey]);
      const toggleTheme = () => setCurrentThemeKey(k => (k === 'night' ? 'studio' : 'night'));

      const [viewMode, setViewMode] = useState('home');
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [stockSearch, setStockSearch] = useState('');         // 재고조사 탭 검색

      const [newProd, setNewProd] = useState({

            `현재 사용량: 약 ${safeStorage.usageKB()}KB`

      useEffect(() => { safeStorage.set('filo_theme', currentThemeKey); }, [currentThemeKey]);

      // 테마 메타컬러 동기화 (iOS 상태바)
      useEffect(() => {
        const meta = document.querySelector('meta[name="theme-color"]');

      const theme = themes[currentThemeKey];

      // ----- 토스트 (사용자 액션 피드백) -----

      // ----- 히스토리 로깅 (예측 기능 원료) -----
      const logHistory = (productId, productName, delta, source) => {

      // ----- 햅틱 피드백 (모바일 지원시) -----
      const haptic = (ms = 10) => {

      // ----- 핸들러들 -----
      const handleStockChange = (id, value) => {
        const num = value === '' ? 0 : Math.max(0, Number(value));
        setProducts(prev => prev.map(p => p.id === id ? { ...p, currentStock: num } : p));
      };

      // 빠른 차감/증가 (일일 사용용) + Undo 스택 적재
      const handleQuickAdjust = (id, delta) => {
        const product = products.find(p => p.id === id);
        if (!product) return;
        const newStock = Math.max(0, product.currentStock + delta);
        if (newStock === product.currentStock) return;

        const previousStock = product.currentStock;
        setProducts(prev => prev.map(p =>
          p.id === id ? { ...p, currentStock: newStock } : p
        ));
        logHistory(id, product.name, delta, 'quick');
        haptic(delta < 0 ? 8 : 15);

        // Undo 스택 — 최근 10개만 유지
        setUndoStack(prev => {
          const next = [...prev, { id, previousStock, productName: product.name, t: Date.now() }];
          if (next.length > 10) next.shift();
          return next;
        });

        // 알림 강화: 적정선 진입 (이전엔 충분 → 이제 부족)
        if (delta < 0 && newStock < product.safeStock && previousStock >= product.safeStock) {
          haptic(40); // 강한 진동
          showToast(`🔔 ${product.name.slice(0, 16)} — 발주 대상 진입`, 'warn');
        }
        // 알림 강화: 재고 0 도달 (품절)
        else if (delta < 0 && newStock === 0 && previousStock > 0) {
          haptic(60); // 가장 강한 진동
          showToast(`⚠ ${product.name.slice(0, 16)} — 품절! 즉시 발주 필요`, 'error');
        }
      };

      // ----- Undo 마지막 차감 액션 -----
      const handleUndo = () => {
        if (undoStack.length === 0) {
          showToast('되돌릴 작업이 없습니다', 'info');
          return;
        }
        const last = undoStack[undoStack.length - 1];
        setProducts(prev => prev.map(p =>
          p.id === last.id ? { ...p, currentStock: last.previousStock } : p
        ));
        setUndoStack(prev => prev.slice(0, -1));
        logHistory(last.id, last.productName, 0, 'undo');
        haptic(20);
        showToast(`되돌리기: ${last.productName.slice(0, 14)}`, 'success');
      };

      // ----- 이미지 압축 (Base64, max 400px, 평균 30KB) -----
      const compressImage = (file, maxSize = 400, quality = 0.72) => {
        return new Promise((resolve, reject) => {
          if (!file.type.startsWith('image/')) {
            reject(new Error('이미지 파일이 아닙니다'));
            return;
          }
          // 파일 자체가 너무 크면 거부 (10MB 초과)
          if (file.size > 10 * 1024 * 1024) {
            reject(new Error('파일이 너무 큽니다 (10MB 이하)'));
            return;
          }

          const reader = new FileReader();
          reader.onerror = () => reject(new Error('파일 읽기 실패'));
          reader.onload = (e) => {
            const img = new Image();
            img.onerror = () => reject(new Error('이미지 로드 실패'));
            img.onload = () => {
              let { width, height } = img;
              // 비율 유지하며 max 안에 들어가도록
              if (width > height) {
                if (width > maxSize) { height *= maxSize / width; width = maxSize; }
              } else {
                if (height > maxSize) { width *= maxSize / height; height = maxSize; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(width);
              canvas.height = Math.round(height);
              const ctx = canvas.getContext('2d');
              // 부드러운 리사이즈
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              const dataUrl = canvas.toDataURL('image/jpeg', quality);
              resolve(dataUrl);
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      };

      // ----- 제품 정보 일괄 수정 (모든 필드) -----
      const handleUpdateProduct = (id, patch) => {
        setProducts(prev => prev.map(p =>
          p.id === id ? { ...p, ...patch } : p

      const handleUpdateCompany = (oldName, newName, newPhone) => {

      // ----- 브랜딩 초기화 -----
      const resetBranding = () => {

      };
      // ----- 발주 완료 처리 -----
      // 거래처+발주 품목 해시로 고유 키 생성 (재고가 다시 채워지면 자동으로 같은 발주가 사라짐)
      const makeOrderKey = (company, items) => {

      useEffect(() => {

      // 거래처 목록 (자동완성용)
      const companyList = useMemo(() => {

      }, [products]);

      // ----- 전체 데이터 초기화 (위험 작업, 이중 확인) -----
      const handleResetAll = () => {
        const first = window.confirm(

          '· 브랜딩 (앱 이름/로고)\n\n' +
          '이 작업은 되돌릴 수 없습니다. 계속하시겠습니까?'
        );
        if (!first) return;
        const second = window.confirm('정말 모든 데이터를 삭제합니다. 한 번 더 확인합니다.');
        if (!second) return;

        try {
          // filo_ 로 시작하는 모든 데이터 삭제 (거래처·발주 이력 포함). 첫 방문 가이드 표시 여부는 유지.
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);

          }
          keys.forEach(k => localStorage.removeItem(k));
          showToast('모든 데이터가 삭제되었습니다. 새로고침합니다...', 'info');
          setTimeout(() => window.location.reload(), 1200);
        } catch (e) {
          showToast('초기화 실패: ' + e.message, 'error');
        }
      };

      // ----- 빈 상태로 시작 (가이드 · 샘플 배너 공용) -----
      const startEmpty = () => {
        setProducts([]);
        setCompanies([]);
        setOrderHistory([]);
        setCompletedOrders({});
        try { localStorage.removeItem('filo_history'); } catch (e) {}
        setIsDemo(false);
        showToast('내 약제를 등록해 시작하세요', 'success');
        setViewMode('manage');
      };

      // ----- 전체 백업 (JSON) / 복원 -----
      // 제품·거래처·발주 이력·사용 히스토리·설정까지 filo_ 데이터를 모두 한 파일로 저장합니다.
      const BACKUP_EXCLUDE = ['filo_last_backup'];
      const BACKUP_KEEP_ON_RESTORE = ['filo_last_backup', 'filo_guide_seen'];

      const downloadBackup = () => {
        try {
          const data = {};
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (!k || !k.startsWith('filo_') || BACKUP_EXCLUDE.includes(k)) continue;
            const raw = localStorage.getItem(k);
            try { data[k] = JSON.parse(raw); } catch (e) { data[k] = raw; }
          }
          if (Object.keys(data).length === 0) {
            showToast('백업할 데이터가 없습니다', 'error');
            return;
          }
          const now = new Date();
          const payload = {
            app: 'filo',
            version: 1,
            exportedAt: now.toISOString(),
            data
          };
          const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
          const pad = (n) => String(n).padStart(2, '0');
          const ts = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `filo_backup_${ts}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          const iso = now.toISOString();
          safeStorage.set('filo_last_backup', iso);
          setLastBackup(iso);
          const n = Array.isArray(data.filo_products) ? data.filo_products.length : 0;
          showToast(`전체 백업 완료 (제품 ${n}개)`, 'success');
        } catch (e) {
          showToast('백업 실패: ' + e.message, 'error');
        }
      };

      const handleBackupRestore = (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onerror = () => showToast('파일을 읽을 수 없습니다', 'error');
        reader.onload = (ev) => {
          let parsed;
          try {
            parsed = JSON.parse(ev.target.result);
          } catch (err) {
            showToast('백업 파일이 아닙니다 (JSON 형식 오류)', 'error');
            return;
          }
          const data = parsed && parsed.app === 'filo' && parsed.data && typeof parsed.data === 'object' ? parsed.data : null;
          const keys = data ? Object.keys(data).filter(k => k.startsWith('filo_') && !BACKUP_EXCLUDE.includes(k)) : [];
          if (!data || keys.length === 0) {
            showToast('FILO 백업 파일이 아닙니다', 'error');
            return;
          }
          const count = Array.isArray(data.filo_products) ? data.filo_products.length : 0;
          const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString('ko-KR') : '알 수 없음';
          const ok = window.confirm(
            '백업 파일로 복원합니다.\n\n' +
            '· 백업 시각: ' + when + '\n' +
            '· 제품: ' + count + '개\n\n' +
            '현재 이 기기의 데이터는 백업 내용으로 완전히 교체됩니다.\n' +
            '(복원 전에 현재 데이터를 먼저 백업해 두는 것을 권장합니다)\n\n' +
            '계속하시겠습니까?'
          );
          if (!ok) return;

          // 실패 시 되돌릴 수 있도록 현재 상태 스냅샷
          const snapshot = {};
          try {
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.startsWith('filo_')) snapshot[k] = localStorage.getItem(k);
            }
            Object.keys(snapshot)
              .filter(k => !keys.includes(k) && !BACKUP_KEEP_ON_RESTORE.includes(k))
              .forEach(k => localStorage.removeItem(k));
            keys.forEach(k => localStorage.setItem(k, JSON.stringify(data[k])));
            showToast('복원 완료. 새로고침합니다...', 'success');
            setTimeout(() => window.location.reload(), 900);
          } catch (err) {
            // 롤백
            try {
              Object.keys(snapshot).forEach(k => localStorage.setItem(k, snapshot[k]));
              keys.filter(k => !(k in snapshot)).forEach(k => localStorage.removeItem(k));
            } catch (e2) {}
            showToast('복원 실패 (기존 데이터는 유지됨): ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
      };

      // ----- CSV Export -----
      const downloadCSV = () => {
        const header = ['제품명', '거래처', '전화번호', '현재고', '적정선', '이미지URL'];
        const rows = products.map(p => [
          p.name, p.company, p.phone, p.currentStock, p.safeStock, p.image
        ]);
        const csv = [header, ...rows]
          .map(row => row.map(cell => {
            const s = String(cell ?? '');
            // 콤마/따옴표/개행 포함시 따옴표로 감싸기
            return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
          }).join(','))
          .join('\n');

        // BOM 추가 (엑셀 한글 호환)
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const ts = new Date().toISOString().slice(0, 10);
        a.download = `filo_inventory_${ts}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`CSV 내보내기 완료 (${products.length}개)`, 'success');
      };

      // ----- CSV Import (간단한 파서) -----
      const parseCSV = (text) => {
        // BOM 제거
        text = text.replace(/^\uFEFF/, '').trim();
        const lines = text.split(/\r?\n/);
        if (lines.length < 2) return [];

        const parseLine = (line) => {
          const result = [];
          let cur = '';
          let inQuote = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (inQuote) {
              if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
              else if (ch === '"') inQuote = false;
              else cur += ch;
            } else {
              if (ch === '"') inQuote = true;
              else if (ch === ',') { result.push(cur); cur = ''; }
              else cur += ch;
            }
          }
          result.push(cur);
          return result;
        };

        // 첫 줄은 헤더 (스킵)
        return lines.slice(1).filter(l => l.trim()).map(line => {
          const [name, company, phone, currentStock, safeStock, image] = parseLine(line);
          return {
            name: (name || '').trim(),
            company: (company || '').trim(),
            phone: (phone || '').replace(/[^0-9]/g, ''),
            currentStock: Math.max(0, parseInt(currentStock) || 0),
            safeStock: Math.max(1, parseInt(safeStock) || 5),
            image: (image || '').trim()
          };
        }).filter(p => p.name && p.company);
      };

      const handleCSVUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = parseCSV(ev.target.result);
            if (parsed.length === 0) {
              showToast('CSV에서 유효한 데이터를 찾을 수 없습니다', 'error');
              return;
            }
            setCsvPreview(parsed);
          } catch (err) {
            showToast('CSV 파싱 실패: ' + err.message, 'error');
          }
        };
        reader.readAsText(file, 'UTF-8');
        e.target.value = ''; // 같은 파일 재선택 가능
      };

      const confirmCSVImport = (mode) => {
        if (!csvPreview) return;

      const handleAddProduct = (e) => {

          company: newProd.company.trim(),

      const handleDeleteProduct = (id) => {
        if (window.confirm('선택하신 제품을 마스터 리스트에서 완전히 지우시겠습니까?')) {

      // 거래처별 발주 분류
      const groupedOrders = useMemo(() => {
        const needed = products.filter(p => p.currentStock < p.safeStock);
        const groups = {};
        needed.forEach(p => {

      }, [products]);

      // 발주중인 제품명 Set (발주 완료 처리된 거래처에 속한 제품들)
      const orderingProductNames = useMemo(() => {
        const set = new Set();
        Object.entries(groupedOrders).forEach(([company, info]) => {

      }, [groupedOrders, completedOrders]);

      // 발주서 텍스트 생성 (SMS / 복사 공통)
      const buildOrderText = (company, info) => {
        const itemString = info.items.map(item => `- ${item.name}: ${item.qty}개`).join('\n');
        return `[${branding.appName} 살롱 발주 요청]\n\n안녕하세요 사장님,\n아래 제품 발주 요청드립니다.\n\n${itemString}\n\n확인 후 배송 부탁드립니다. 감사합니다.`;
      };

      // SMS 딥링크 — 사용자 커스텀 앱 이름 반영 + 이력 로깅
      const sendSmsMessage = (company, info, customText) => {
        const textBody = customText || buildOrderText(company, info);
