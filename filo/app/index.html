  <script>
    // 저장된 테마(없으면 기기 설정)를 렌더 전에 적용해 깜빡임 방지
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('filo_theme')); } catch (e) {}
      if (t !== 'night' && t !== 'studio') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'night' : 'studio';
      }
      document.documentElement.setAttribute('data-filo-theme', t);
    })();
  </script>

  <!-- React 18 -->
  <script src="vendor/react.production.min.js"></script>

  <!-- 미리 빌드한 스타일 (filo/tools 에서 npm run build) -->
  <link rel="stylesheet" href="app.css?v=b9f6e87f6a" />

  <style>
    /* ============================================
       ZERO COUNT — 살롱 재고 · 재고조사
       Layout: 약장 선반처럼 품목이 한 줄씩 놓이고, 각 줄의 재고 게이지에
       적정선 눈금이 새겨진 구조. 모바일은 엄지로 닿는 하단 탭바.
       ============================================ */
    :root, :root[data-filo-theme="studio"] {
      --f-bg: #F4F6FA;
      --f-surface: #FFFFFF;
      --f-surface-2: #F1F4F9;
      --f-field: #FFFFFF;
      --f-ink: #0F172A;
      --f-sub: #64748B;
      --f-line: #E6EAF0;
      --f-line-strong: #D6DCE6;
      --f-accent: #2563EB;          /* 포인트 블루 */
      --f-accent-hover: #1D4ED8;
      --f-on-accent: #FFFFFF;
      --f-accent-soft: #EAF1FF;
      --f-alert: #E5484D;           /* 품절 */
      --f-alert-soft: #FDECEC;
      --f-warn: #EA8A0C;            /* 발주 필요 */
      --f-warn-soft: #FEF3E2;
      --f-ok: #16A34A;
      --f-ok-soft: #E7F6EC;
      --f-side-bg: #0B1220;         /* 사이드바: 두 테마 공통 네이비 */
      --f-side-ink: #E2E8F0;
      --f-side-sub: #8B95A7;
      --f-side-line: rgba(255, 255, 255, 0.07);
      --f-side-active: rgba(59, 130, 246, 0.18);
      --f-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px -8px rgba(15, 23, 42, 0.08);
      --f-radius: 16px;
      --f-radius-sm: 10px;
      --f-font-display: 'Inter', 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
      --f-font-mono: 'JetBrains Mono', ui-monospace, monospace;
      color-scheme: light;
    }
    :root[data-filo-theme="night"] {
      --f-bg: #0A0F1C;
      --f-surface: #111827;
      --f-surface-2: #172033;
      --f-field: #0F1626;
      --f-ink: #E5E7EB;
      --f-sub: #94A3B8;
      --f-line: #1F2A3D;
      --f-line-strong: #2B3850;
      --f-accent: #3B82F6;
      --f-accent-hover: #60A5FA;
      --f-on-accent: #FFFFFF;
      --f-accent-soft: #15244A;
      --f-alert: #F87171;
      --f-alert-soft: #3A1A1E;
      --f-warn: #FBBF24;
      --f-warn-soft: #3A2C12;
      --f-ok: #34D399;
      --f-ok-soft: #0F3127;
      --f-side-bg: #070B14;
      --f-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
    html, body { background: var(--f-bg); color: var(--f-ink); }
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }

    /* iOS safe area */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }


    /* Input number — 스피너 제거 (현장 미용실 깔끔함) */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] { -moz-appearance: textfield; }

    /* 로딩 페이드인 */
    #root {
      animation: filoFadeIn 0.5s ease-out;
    }
    @keyframes filoFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 초기 로딩 스크린 (React 마운트 전) */
    .filo-loader {
      position: fixed;
      inset: 0;
      background: var(--f-bg);
      color: var(--f-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 9999;
      font-family: var(--f-font-display);
      letter-spacing: 0.3em;
      transition: opacity 0.4s ease;
    }
    .filo-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .filo-loader-line {
      width: 32px;
      height: 1px;
      background: var(--f-accent);
      opacity: 0.6;
      animation: filoLine 1.6s ease-in-out infinite;
    }
    @keyframes filoLine {
      0%, 100% { width: 16px; opacity: 0.3; }
      50% { width: 48px; opacity: 0.8; }
    }

    /* 스크롤바 미니멀 */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 2px; }

    /* 가로 스크롤바 숨기기 (탭 메뉴) */
    .overflow-x-auto::-webkit-scrollbar { display: none; }

    /* 토스트 애니메이션 */
    @keyframes filoToast {
      0%   { opacity: 0; transform: translate(-50%, 10px); }
      10%  { opacity: 1; transform: translate(-50%, 0); }
      90%  { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -4px); }
    }

    /* 인라인 편집 펼침 애니메이션 */
    @keyframes filoExpand {
      from {
        opacity: 0;
        max-height: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        max-height: 600px;
        transform: translateY(0);
      }
    }

    /* 모달 페이드인 */
    @keyframes filoModalIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* 발주 경고 펄스 */
    @keyframes filoPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.0); }
      50%      { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15); }
    }

    /* 업로드 중 펄스 */
    @keyframes filoPulse {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }
    .filo-uploading { animation: filoPulse 1s ease-in-out infinite; }

    /* 편집 중인 카드 강조 (시각적 hairline glow) */
    .filo-editing {
      box-shadow: inset 0 0 0 1px currentColor;
      opacity: 1 !important;
    }

    /* 연타해도 두 번 탭 확대가 일어나지 않게 */
    button, a, label, input, select, textarea, [role="button"] { touch-action: manipulation; }
    /* 폰에서 입력칸을 누를 때 화면이 자동 확대되지 않게 (16px 미만이면 iOS가 확대함) */
    @media (max-width: 767px) {
      #root input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), #root select, #root textarea { font-size: 16px !important; }
    }

    /* ---------- 공통 형태 ---------- */
    #root .border:not(.rounded-full) { border-radius: var(--f-radius-sm); }
    #root input, #root textarea, #root select { border-radius: var(--f-radius-sm); }
    #root :focus-visible { outline: 2px solid var(--f-accent); outline-offset: 2px; }
    #root .font-display { letter-spacing: -0.01em; }
    #root h2.text-xl { font-size: 1.375rem; letter-spacing: -0.02em; }
    .f-num { font-family: var(--f-font-display); font-variant-numeric: tabular-nums; }
    .filo-cat-active { background: var(--f-surface-2); }

    /* ---------- 앱 골격 ---------- */
    .f-topbar {
      position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: -16px -16px 16px; padding: 12px 16px;
      background: var(--f-bg);
      border-bottom: 1px solid var(--f-line);
    }
    .f-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .f-brand-mark {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center;
      background: #05070D; color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 4px 12px -6px rgba(2, 6, 23, 0.6);
    }
    .zc-wordmark { font-family: 'Michroma', var(--f-font-display); font-size: 14px; line-height: 1; letter-spacing: 0.03em; white-space: nowrap; }
    .zc-wordmark b { font-weight: 400; color: inherit; }
    .zc-wordmark i { font-style: normal; color: var(--f-sub); }
    .f-sidebar .zc-wordmark b, .zc-scan .zc-wordmark b { color: #fff; }
    .f-sidebar .zc-wordmark i, .zc-scan .zc-wordmark i { color: #A7AFBC; }
    .f-brand-name { font: 800 17px/1.1 var(--f-font-display); letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .f-brand-sub { font: 500 10px/1.2 var(--f-font-mono); color: var(--f-sub); letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .f-icon-btn {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      display: grid; place-items: center; color: var(--f-sub);
      transition: background .15s, color .15s;
    }
    .f-icon-btn:hover { background: var(--f-surface-2); color: var(--f-ink); }

    .f-tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
      background: var(--f-surface);
      border-top: 1px solid var(--f-line);
    }
    .f-tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 2px; border-radius: 12px; color: var(--f-sub);
      font-size: 11px; font-weight: 600; letter-spacing: -0.01em;
      position: relative;
    }
    .f-tab.is-active { color: var(--f-accent); }
    .f-tab.is-active .f-tab-icon { background: var(--f-accent-soft); }
    .f-tab-icon { width: 40px; height: 28px; border-radius: 999px; display: grid; place-items: center; transition: background .15s; }
    .f-tab-dot {
      position: absolute; top: 4px; left: calc(50% + 10px);
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
      background: var(--f-alert); color: #fff;
      font: 700 10px/16px var(--f-font-display); text-align: center;
    }

    @media (min-width: 768px) {
      .f-topbar, .f-tabbar { display: none; }
    }

    .f-sidebar { background: var(--f-side-bg); color: var(--f-side-ink); border-right: 1px solid var(--f-side-line); }
    .f-sidebar .f-brand-name { color: #fff; }
    .f-sidebar .f-brand-sub { color: var(--f-side-sub); }
    .f-side-label { font: 600 11px/1 var(--f-font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--f-side-sub); opacity: .7; padding: 0 12px 8px; }
    .f-side-nav { display: flex; flex-direction: column; gap: 4px; }
    .f-side-link {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 11px 12px; border-radius: 12px;
      font-size: 14px; font-weight: 500; color: var(--f-side-sub);
      transition: background .15s, color .15s;
    }
    .f-side-link:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .f-side-link.is-active { background: var(--f-side-active); color: #fff; font-weight: 600; box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.18); }
    .f-side-link.is-active svg { color: #60A5FA; }
    .f-side-foot { border-top: 1px solid var(--f-side-line); }
    .f-side-user { display: flex; align-items: center; gap: 10px; padding: 12px; margin-top: 8px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); }
    .f-avatar { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; background: linear-gradient(135deg, #1E293B, #334155); color: #fff; font-weight: 700; font-size: 14px; }
    .f-side-user b { display: block; color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .f-side-user small { color: var(--f-side-sub); font-size: 11px; }
    .f-side-link .f-tab-dot { position: static; margin-left: auto; }

    /* ---------- 빠른 차감 ---------- */
    .f-page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .f-eyebrow { font: 500 11px/1.2 var(--f-font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--f-sub); margin-bottom: 4px; }
    .f-title { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
    .f-chip-btn {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      height: 36px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--f-line-strong); background: var(--f-surface);
      font-size: 13px; font-weight: 600; color: var(--f-ink);
    }
    .f-chip-btn:hover { border-color: var(--f-ink); }

    .f-status {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      background: var(--f-surface); border: 1px solid var(--f-line);
      border-radius: var(--f-radius); overflow: hidden; margin-bottom: 18px;
      box-shadow: var(--f-shadow);
    }
    .f-status-cell {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      padding: 14px 14px 12px; text-align: left; min-width: 0;
    }
    .f-status-cell + .f-status-cell { border-left: 1px solid var(--f-line); }
    .f-status-label { font-size: 12px; font-weight: 600; color: var(--f-sub); display: flex; align-items: center; gap: 6px; }
    .f-status-value { font: 600 28px/1 var(--f-font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .f-status-value small { font: 500 13px/1 'Pretendard Variable', Pretendard, sans-serif; color: var(--f-sub); margin-left: 3px; letter-spacing: 0; }
    .f-status-cta { font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
    button.f-status-cell:hover { background: var(--f-surface-2); }
    .f-status-cell.is-alert { background: var(--f-warn-soft); color: var(--f-warn); }
    .f-status-cell.is-alert .f-status-label { color: var(--f-warn); }
    .f-status-cell.is-pending .f-status-value { color: var(--f-accent); }

    .f-chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 12px; padding: 2px 16px; scrollbar-width: none; }
    .f-chips::-webkit-scrollbar { display: none; }
    .f-chip {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      height: 34px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--f-line-strong); background: var(--f-surface);
      font-size: 13px; font-weight: 600; color: var(--f-ink); white-space: nowrap;
    }
    .f-chip .f-num { color: var(--f-sub); font-weight: 500; font-size: 12px; }
    .f-chip.is-empty { color: var(--f-sub); }
    .f-chip.is-active { background: var(--f-accent-soft); border-color: var(--f-accent); color: var(--f-accent); }
    .f-chip.is-active .f-num { color: inherit; opacity: .7; }
    .f-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--cat, var(--f-sub)); flex-shrink: 0; display: inline-block; }

    .f-toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
    .f-search {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 14px; border-radius: 12px;
      background: var(--f-field); border: 1px solid var(--f-line-strong); color: var(--f-sub);
    }
    .f-search:focus-within { border-color: var(--f-accent); }
    #root .f-search input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: none; color: var(--f-ink); font-size: 15px; border-radius: 0; }
    .f-ghost-btn {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      height: 44px; padding: 0 14px; border-radius: 12px;
      border: 1px solid var(--f-line-strong); background: var(--f-surface);
      font-size: 14px; font-weight: 600; color: var(--f-ink);
    }
    .f-ghost-btn:disabled { opacity: .35; cursor: not-allowed; }

    .f-notice {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
      padding: 12px 12px 12px 16px; border-radius: var(--f-radius);
      background: var(--f-surface); border: 1px solid var(--f-line-strong);
      font-size: 13px; line-height: 1.5; color: var(--f-sub);
    }
    .f-notice p { flex: 1; min-width: 0; }
    .f-notice b { color: var(--f-ink); }
    .f-notice.is-demo { background: var(--f-accent-soft); border-color: color-mix(in srgb, var(--f-accent) 25%, transparent); color: var(--f-ink); }
    .f-notice.is-demo b { color: var(--f-accent); }
    .f-notice-btn {
      flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 10px;
      background: var(--f-accent); color: var(--f-on-accent); font-size: 13px; font-weight: 700;
    }
    .f-notice-btn:hover { background: var(--f-accent-hover); }

    .f-list { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
    .f-empty { padding: 40px 16px; text-align: center; color: var(--f-sub); font-size: 14px; background: var(--f-surface); border: 1px dashed var(--f-line-strong); border-radius: var(--f-radius); }
    .f-item {
      display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 12px; row-gap: 10px;
      padding: 14px; background: var(--f-surface);
      border: 1px solid var(--f-line); border-radius: var(--f-radius);
      box-shadow: var(--f-shadow);
    }
    .f-item.is-out { border-color: color-mix(in srgb, var(--f-alert) 35%, var(--f-line)); }
    .f-thumb { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: var(--f-surface-2); }
    .f-mono {
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--cat, var(--f-sub)) 14%, var(--f-surface));
      color: var(--cat, var(--f-sub));
      font-size: 16px; font-weight: 700;
    }
    .f-item-body { min-width: 0; }
    .f-item-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--f-sub); margin-bottom: 3px; min-width: 0; }
    .f-cat { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .f-badge { flex-shrink: 0; margin-left: auto; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; display: inline-block; }
    .f-badge.is-low { background: var(--f-warn-soft); color: var(--f-warn); }
    .f-badge.is-ok { background: var(--f-ok-soft); color: var(--f-ok); }
    .f-badge.is-out { background: var(--f-alert); color: #fff; }
    .f-badge.is-pending { background: var(--f-accent-soft); color: var(--f-accent); }
    .f-item-name { font-size: 16px; font-weight: 650; line-height: 1.35; letter-spacing: -0.015em; overflow-wrap: anywhere; }

    .f-item-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
    .f-gauge-wrap { flex: 1; min-width: 0; }
    .f-gauge { position: relative; height: 6px; border-radius: 999px; background: var(--f-surface-2); box-shadow: inset 0 0 0 1px var(--f-line); }
    .f-gauge-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--f-accent); transition: width .25s ease; }
    .f-item.is-low .f-gauge-fill { background: var(--f-warn); }
    .f-item.is-out .f-gauge-fill { background: var(--f-alert); }
    .f-item.is-pending .f-gauge-fill { background: var(--f-accent); }
    .f-gauge-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--f-ink); opacity: .55; }
    .f-gauge-label { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--f-sub); }
    .f-gauge-label b { font-weight: 600; color: var(--f-ink); }

    .f-stepper { display: flex; align-items: center; flex-shrink: 0; border: 1px solid var(--f-line-strong); border-radius: 12px; overflow: hidden; background: var(--f-field); }
    .f-step { width: 44px; height: 44px; display: grid; place-items: center; color: var(--f-ink); transition: background .12s; }
    .f-step:hover { background: var(--f-surface-2); }
    .f-step:active { background: var(--f-accent-soft); }
    .f-step:disabled { opacity: .25; cursor: not-allowed; }
    .f-count {
      min-width: 52px; height: 44px; padding: 0 6px;
      border-left: 1px solid var(--f-line); border-right: 1px solid var(--f-line);
      font: 600 20px/44px var(--f-font-display); font-variant-numeric: tabular-nums; text-align: center;
    }
    .f-item.is-low .f-count { color: var(--f-warn); }
    .f-item.is-out .f-count { color: var(--f-alert); }

    /* ---------- 홈 대시보드 ---------- */
    .f-hero {
      position: relative; overflow: hidden; border-radius: 20px; padding: 24px;
      background: radial-gradient(120% 140% at 100% 0%, rgba(59, 130, 246, 0.35) 0%, rgba(59, 130, 246, 0) 55%), linear-gradient(135deg, #0B1220 0%, #111C33 100%);
      color: #fff; margin-bottom: 16px;
      display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;
    }
    .f-hero::after {
      content: ""; position: absolute; right: -40px; bottom: -60px; width: 240px; height: 240px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 0 0 30px rgba(255, 255, 255, 0.02), 0 0 0 60px rgba(255, 255, 255, 0.015);
      pointer-events: none;
    }
    .f-hero-date { font-size: 13px; color: #93A4C3; font-weight: 500; }
    .f-hero h2 { font-size: 26px; line-height: 1.25; font-weight: 800; letter-spacing: -0.03em; margin-top: 6px; }
    .f-hero p { color: #B6C2D9; font-size: 14px; margin-top: 6px; }
    .f-hero-btn {
      position: relative; z-index: 1;
      display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px;
      background: #fff; color: #0B1220; font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .f-hero-btn:hover { background: #E8EEF9; }

    .f-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    @media (min-width: 1024px) { .f-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; } }
    .f-kpi {
      background: var(--f-surface); border: 1px solid var(--f-line); border-radius: var(--f-radius);
      padding: 16px; box-shadow: var(--f-shadow); text-align: left; display: flex; flex-direction: column; gap: 12px; min-width: 0;
    }
    button.f-kpi:hover { border-color: var(--f-line-strong); }
    .f-kpi-icon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--tone-soft); color: var(--tone); }
    .f-kpi-label { font-size: 12.5px; color: var(--f-sub); font-weight: 600; }
    .f-kpi-value { font: 700 26px/1.1 var(--f-font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: 4px; }
    .f-kpi-value small { font: 600 13px/1 'Pretendard Variable', Pretendard, sans-serif; color: var(--f-sub); margin-left: 3px; letter-spacing: 0; }
    .tone-blue { --tone: var(--f-accent); --tone-soft: var(--f-accent-soft); }
    .tone-green { --tone: var(--f-ok); --tone-soft: var(--f-ok-soft); }
    .tone-orange { --tone: var(--f-warn); --tone-soft: var(--f-warn-soft); }
    .tone-red { --tone: var(--f-alert); --tone-soft: var(--f-alert-soft); }

    .f-panels { display: grid; gap: 14px; margin-bottom: 16px; }
    @media (min-width: 1024px) { .f-panels { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); } }
    .f-panel { background: var(--f-surface); border: 1px solid var(--f-line); border-radius: var(--f-radius); padding: 18px; box-shadow: var(--f-shadow); min-width: 0; }
    .f-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .f-panel-title { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
    .f-panel-sub { font-size: 12px; color: var(--f-sub); }
    .f-link-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--f-accent); white-space: nowrap; }

    .f-donut-wrap { display: flex; align-items: center; gap: 20px; }
    .f-donut { position: relative; width: 132px; height: 132px; flex-shrink: 0; }
    .f-donut svg { transform: rotate(-90deg); }
    .f-donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
    .f-donut-center b { display: block; font: 800 26px/1 var(--f-font-display); letter-spacing: -0.03em; }
    .f-donut-center small { font-size: 11px; color: var(--f-sub); font-weight: 600; }
    .f-legend { flex: 1; min-width: 0; display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
    .f-legend li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--f-sub); }
    .f-legend li b { margin-left: auto; color: var(--f-ink); font: 700 15px var(--f-font-display); font-variant-numeric: tabular-nums; }
    .f-legend i { width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0; }

    .f-bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 140px; padding-top: 8px; border-bottom: 1px solid var(--f-line); background-image: linear-gradient(var(--f-line) 1px, transparent 1px); background-size: 100% 35px; background-position: 0 -1px; }
    .f-bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
    .f-bar span { font: 600 11px/1 var(--f-font-display); color: var(--f-sub); font-variant-numeric: tabular-nums; }
    .f-bar i { width: min(26px, 70%); border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, #60A5FA, var(--f-accent)); min-height: 2px; }
    .f-bar.is-today i { background: linear-gradient(180deg, #93C5FD, #1D4ED8); box-shadow: 0 0 0 3px var(--f-accent-soft); }
    .f-bar.is-zero i { background: var(--f-line-strong); }
    .f-bar-labels { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 6px; font-size: 11px; color: var(--f-sub); text-align: center; font-variant-numeric: tabular-nums; }
    .f-chart-empty { font-size: 12px; color: var(--f-sub); margin-top: 10px; }

    .f-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .f-table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--f-sub); padding: 10px 12px; background: var(--f-surface-2); white-space: nowrap; }
    .f-table th:first-child { border-radius: 10px 0 0 10px; }
    .f-table th:last-child { border-radius: 0 10px 10px 0; }
    .f-table td { padding: 12px; border-bottom: 1px solid var(--f-line); vertical-align: middle; }
    .f-table tr:last-child td { border-bottom: 0; }
    .f-table td.f-td-name { font-weight: 600; }
    .f-table .f-num { white-space: nowrap; }
    @media (max-width: 640px) { .f-table .f-hide-sm { display: none; } }

    .f-quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (min-width: 1024px) { .f-quick-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .f-quick {
      display: flex; align-items: center; gap: 12px; padding: 14px; text-align: left;
      background: var(--f-surface); border: 1px solid var(--f-line); border-radius: 14px; box-shadow: var(--f-shadow);
      font-size: 14px; font-weight: 600;
    }
    .f-quick:hover { border-color: var(--f-accent); }
    .f-quick .f-kpi-icon { width: 34px; height: 34px; }

    /* ---------- 재고조사 · 스캐너 · 엑셀 ---------- */
    .zc-btn-primary, .zc-btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0;
      height: 44px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 700; white-space: nowrap;
    }
    .zc-btn-primary { background: var(--f-accent); color: var(--f-on-accent); box-shadow: 0 6px 16px -8px rgba(37, 99, 235, 0.7); }
    .zc-btn-primary:hover { background: var(--f-accent-hover); }
    .zc-btn-primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
    .zc-btn-ghost { border: 1px solid var(--f-line-strong); background: var(--f-surface); color: var(--f-ink); }
    .zc-btn-ghost:hover { border-color: var(--f-ink); }
    .zc-btn-ghost:disabled { opacity: .4; }
    .zc-back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--f-sub); margin-bottom: 10px; }
    .zc-back:hover { color: var(--f-ink); }
    .zc-title-input { width: 100%; font-size: 24px; font-weight: 800; letter-spacing: -0.03em; background: transparent; border: 0; border-bottom: 1px dashed var(--f-line-strong); color: var(--f-ink); padding: 2px 0; border-radius: 0 !important; }
    .zc-title-input:focus { outline: none; border-bottom-color: var(--f-accent); }

    .zc-progress { position: relative; display: block; height: 8px; border-radius: 99px; background: var(--f-surface-2); overflow: hidden; }
    .zc-progress i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--f-accent); transition: width .3s; }
    .zc-cell-progress { display: flex; align-items: center; gap: 8px; min-width: 110px; }
    .zc-cell-progress .zc-progress { flex: 1; height: 6px; }
    .zc-cell-progress .f-num { font-size: 12px; color: var(--f-sub); width: 34px; text-align: right; }
    .zc-click { cursor: pointer; }
    .zc-click:hover td { background: var(--f-surface-2); }

    .zc-active-card {
      width: 100%; display: flex; align-items: center; gap: 16px; text-align: left; margin-bottom: 16px;
      padding: 16px 18px; border-radius: var(--f-radius); background: var(--f-surface);
      border: 1px solid color-mix(in srgb, var(--f-accent) 35%, var(--f-line)); box-shadow: var(--f-shadow);
    }
    .zc-active-card:hover { border-color: var(--f-accent); }
    .zc-active-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .zc-active-left b { font-size: 16px; letter-spacing: -0.02em; }
    .zc-active-left small { font-size: 12px; color: var(--f-sub); }
    .zc-active-right { width: 34%; max-width: 220px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .zc-active-right .zc-progress { width: 100%; }
    .zc-pct { font: 800 24px/1 var(--f-font-display); color: var(--f-accent); letter-spacing: -0.03em; }

    .zc-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 28px 12px; }
    .zc-empty .f-kpi-icon { width: 48px; height: 48px; border-radius: 14px; }
    .zc-empty p { font-size: 13px; color: var(--f-sub); max-width: 26em; }

    .zc-progress-grid { display: grid; gap: 12px; margin-bottom: 14px; }
    @media (min-width: 768px) { .zc-progress-grid { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
    .zc-progress-card { display: flex; align-items: center; gap: 20px; }

    .zc-scan-cta {
      width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; margin-bottom: 14px;
      padding: 14px 16px; border-radius: var(--f-radius); color: #fff;
      background: radial-gradient(120% 140% at 100% 0%, rgba(59, 130, 246, 0.45) 0%, rgba(59, 130, 246, 0) 60%), linear-gradient(135deg, #0B1220, #14213D);
    }
    .zc-scan-cta b { display: block; font-size: 15px; }
    .zc-scan-cta small { font-size: 12px; color: #A9B6CD; }
    .zc-scan-cta > span:nth-child(2) { flex: 1; min-width: 0; }
    .zc-scan-cta-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); flex-shrink: 0; }

    .zc-count-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px;
      background: var(--f-surface); border: 1px solid var(--f-line); border-radius: 14px;
    }
    .zc-count-row.is-over, .zc-count-row.is-under { border-color: color-mix(in srgb, var(--f-alert) 35%, var(--f-line)); background: color-mix(in srgb, var(--f-alert-soft) 45%, var(--f-surface)); }
    .zc-count-info { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; }
    .zc-count-info b { font-size: 15px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.35; overflow-wrap: anywhere; }
    .zc-count-info small { font-size: 12px; color: var(--f-sub); }
    .zc-count-nums { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .zc-num-box { width: 64px; height: 50px; border-radius: 10px; background: var(--f-surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
    .zc-num-box span, .zc-num-box label { font-size: 10.5px; color: var(--f-sub); font-weight: 600; }
    .zc-num-box b { font-size: 18px; line-height: 1.1; }
    .zc-num-box.is-input { background: var(--f-field); border: 1.5px solid var(--f-accent); }
    #root .zc-num-box input { width: 100%; text-align: center; border: 0; background: transparent; color: var(--f-ink); font: 700 18px/1.1 var(--f-font-display); padding: 0; outline: none; }
    .zc-count-row.is-left .zc-num-box.is-input { border-color: var(--f-line-strong); border-style: dashed; }
    .zc-diff { width: 60px; display: flex; justify-content: center; }
    .zc-diff-pill { min-width: 52px; text-align: center; padding: 6px 8px; border-radius: 10px; font: 700 14px/1 var(--f-font-display); }
    .zc-diff-pill.is-match { background: var(--f-ok-soft); color: var(--f-ok); font-size: 12.5px; font-family: inherit; }
    .zc-diff-pill.is-over { background: var(--f-accent-soft); color: var(--f-accent); }
    .zc-diff-pill.is-under { background: var(--f-alert-soft); color: var(--f-alert); }
    .zc-diff-pill.is-left { color: var(--f-sub); font-size: 12px; font-family: inherit; }
    .zc-same-btn { min-width: 52px; padding: 7px 8px; border-radius: 10px; font-size: 12.5px; font-weight: 700; border: 1px solid var(--f-line-strong); color: var(--f-sub); }
    .zc-same-btn:hover { border-color: var(--f-ok); color: var(--f-ok); }

    .zc-count-actions {
      position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 20;
      display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 16px; padding: 10px;
      background: color-mix(in srgb, var(--f-bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--f-line); border-radius: 16px;
    }
    @media (min-width: 768px) { .zc-count-actions { bottom: 16px; } }
    @media (max-width: 480px) { .zc-count-actions > * { flex: 1 1 auto; } }

    .zc-excel-grid { display: grid; gap: 10px; grid-template-columns: 1fr; margin-bottom: 4px; }
    @media (min-width: 640px) { .zc-excel-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .zc-excel-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; border: 1px solid var(--f-line); background: var(--f-surface); text-align: left; cursor: pointer; }
    .zc-excel-card:hover { border-color: var(--tone); }
    .zc-excel-card:disabled { opacity: .45; cursor: not-allowed; }
    .zc-excel-card.is-busy { opacity: .6; pointer-events: none; }
    .zc-excel-card b { display: block; font-size: 14px; }
    .zc-excel-card small { font-size: 12px; color: var(--f-sub); }
    .zc-scan-btn { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; padding: 0 12px; border-radius: 10px; background: var(--f-ink); color: var(--f-bg); font-size: 13px; font-weight: 700; }

    .zc-modal-bg { position: fixed; inset: 0; z-index: 60; background: rgba(2, 6, 23, 0.6); display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
    @media (min-width: 640px) { .zc-modal-bg { align-items: center; } }
    .zc-modal { width: min(560px, 100%); max-height: calc(100vh - 24px); overflow: auto; background: var(--f-surface); color: var(--f-ink); border-radius: 20px; padding: 20px; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.5); }
    .zc-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .zc-modal-head h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .zc-modal-head p { font-size: 13px; color: var(--f-sub); margin-top: 2px; overflow-wrap: anywhere; }
    .zc-modal-note { font-size: 12.5px; color: var(--f-sub); margin-top: 12px; line-height: 1.55; }
    .zc-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .zc-import-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .zc-import-kpis div { padding: 12px; border-radius: 12px; background: var(--tone-soft); color: var(--tone); }
    .zc-import-kpis span { display: block; font-size: 12px; font-weight: 700; }
    .zc-import-kpis b { font: 800 22px/1.2 var(--f-font-display); }
    .zc-import-list { margin-top: 12px; max-height: 300px; overflow: auto; display: grid; gap: 6px; }
    .zc-import-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--f-surface-2); font-size: 13px; }
    .zc-import-row b { display: block; font-weight: 650; }
    .zc-import-row small { color: var(--f-sub); font-size: 12px; overflow-wrap: anywhere; }

    /* 스캐너: 레퍼런스처럼 어두운 전체 화면 */
    .zc-scan {
      position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column;
      background: #0B1220; color: #fff;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    .zc-scan-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .zc-scan-brand { display: flex; align-items: center; gap: 10px; }
    .zc-scan-brand .zc-wordmark { font-size: 12px; }
    .zc-scan-close { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #CBD5E1; }
    .zc-scan-close:hover { background: rgba(255, 255, 255, 0.08); }
    .zc-scan-body { flex: 1; overflow: auto; width: min(520px, 100%); margin: 0 auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
    .zc-scan-title { text-align: center; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.35; }
    .zc-scan-hint { text-align: center; font-size: 12px; color: #93A4C3; margin-top: -8px; }
    .zc-cam { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 20px; overflow: hidden; background: radial-gradient(80% 80% at 50% 30%, #1E2A44, #0F172A); }
