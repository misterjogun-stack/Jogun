<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="description" content="미용실 매출·급여·세금 마감. 하루 세 칸만 넣으면 세금과 남는 돈까지 계산돼요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZeroBalance">
<meta property="og:title" content="ZeroBalance · 미용실 마감 앱">
<meta property="og:description" content="하루 마감 세 칸이면, 세금과 남는 돈까지.">
<meta property="og:image" content="https://zerobalance-salon.vercel.app/og-image.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<style>
/* ZeroBalance(제로밸런스) · 네이비 히어로 + 화이트 카드 + 블루 포인트 */
:root{
  --bg:#F3F5F9;--panel:#FFFFFF;--panel2:#F5F7FA;--ink:#131A26;--ink2:#333D4B;--mute:#5F6B7A;--mute2:#667180;--line:#E7EBF0;--line2:#D9DFE7;
  --pri:#2B67F8;--pri-text:#2459E6;--pri2:#5B8CFF;--pri-soft:#EDF2FF;--pri-dark:#1D4ED8;
  --navy:#0A1428;--navy2:#13264F;
  --ok:#0F7A3C;--ok-soft:#E7F7EE;--warn:#A85A07;--warn-soft:#FFF4E5;--bad:#C2363B;--bad-soft:#FDECEC;
  --gt:var(--pri);--gold:var(--pri);--gold-ink:#fff;
  --c1:#2F6BFF;--c2:#8DB0FF;--c3:#C9D8FF;--c4:#F5A524;--c5:#FFD18A;--c6:#E5484D;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --serif:var(--sans);
  --r:20px;--r2:14px;--r3:10px;--rp:999px;
  --sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);
  /* 하단 탭 아래 여백 (예전 Netlify 배지용). Vercel에는 배지가 없어서 0 */
  --tab-lift:0px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + var(--tab-lift) + env(safe-area-inset-bottom,0px));
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
a{color:var(--pri-text)}
.i{width:20px;height:20px;flex:none;display:block}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* 헤더 */
.top{position:sticky;top:0;z-index:5;background:rgba(243,245,249,.88);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:8px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#5B8CFF,#2459F0);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.35)}
.logo i .i{width:18px;height:18px;stroke-width:2.6}
.logo i{background:radial-gradient(90% 90% at 100% 0%,rgba(47,107,255,.55),transparent 70%),#050A18;box-shadow:0 4px 12px rgba(5,10,24,.35)}
.logo i img{width:84%;height:auto;display:block}
.wm{display:flex;flex-direction:column;line-height:1.02;letter-spacing:.16em;font-size:10.5px;font-weight:800}
.wm b{color:var(--ink);font-weight:800}.wm em{font-style:normal;color:var(--pri-text)}
.lmk{height:26px;width:auto;display:block}
.lwm{height:13px;width:auto;display:block}
.hwm{display:none;height:14px;width:auto}
@media (min-width:1024px){.top .wm{display:none}.hwm{display:block}}
.brandline{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brandline .bm{height:40px;width:auto}.brandline .bw{height:13px;width:auto;opacity:.95}
.hr-right{display:flex;align-items:center;gap:8px}
.mnav{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--rp);padding:3px;box-shadow:var(--sh)}
.mnav button{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--mute)}
.mnav button:active{background:var(--panel2)}
.mnav b{font-size:14px;font-weight:700;min-width:88px;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink2);box-shadow:var(--sh);flex:none}
.backbtn{display:flex;align-items:center;gap:4px;background:none;border:0;padding:8px 0;font-weight:700;color:var(--ink2)}
@media (max-width:419px){.logo{font-size:15px}.mnav b{min-width:78px;font-size:13.5px}.mnav button{width:36px;height:40px}}
@media (max-width:359px){.logo span{display:none}}
@media (min-width:1024px){.wm{flex-direction:row;gap:.5em;font-size:13px}}

/* 하단 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--tab-lift))}
.tabbar .wrap{display:flex;padding:0 6px}
.tabbar button{flex:1;background:none;border:0;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute2)}
.tabbar button .i{width:23px;height:23px}
.tabbar button[aria-current=page]{color:var(--pri-text)}

/* 제목 */
h1,h2,h3{margin:0}
.eyebrow{font-size:13px;font-weight:700;color:var(--pri-text);margin:26px 0 6px}
.ttl{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.3;margin:24px 0 0}
.eyebrow+.ttl{margin-top:0}
.sub{color:var(--mute);font-size:14.5px;margin-top:6px;line-height:1.6}
.sechead{margin-top:34px}

/* 카드 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:14px;box-shadow:var(--sh)}
.card.plain{background:transparent;box-shadow:none}
.card.soft{background:var(--pri-soft);border-color:#D6E2FF}
.sec{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cap{font-size:12.5px;color:var(--mute2);margin:-10px 0 14px}
.big{font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.big small{font-size:17px;font-weight:700;color:var(--mute);margin-left:2px}
.note{font-size:13px;color:var(--mute);line-height:1.65}
.empty{text-align:center;padding:26px 16px}
.hr{height:1px;background:var(--line);margin:16px 0}

/* 히어로 (네이비) */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px 20px;margin-top:14px;color:#fff;
  background:radial-gradient(120% 70% at 100% 0%,rgba(76,125,255,.42),transparent 60%),linear-gradient(165deg,#15295A 0%,#0A1428 72%);box-shadow:0 14px 34px rgba(10,20,40,.22)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%)}
.hero>*{position:relative}
.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:var(--rp);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:12.5px;font-weight:600;color:#D6E0FF;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#7EA2FF;box-shadow:0 0 0 3px rgba(126,162,255,.25);flex:none}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.28;margin:18px 0 10px}
.hero h2{font-size:14.5px;font-weight:600;color:#AFC0E6;margin:18px 0 2px}
.hero .big{color:#fff;font-size:38px}
.hero .big small{color:#C8D4F0;font-size:18px}
.hero .big.neg{color:#FFB4B7}
.hero p,.hero .hsub{font-size:14px;color:#A7B6D8;margin:6px 0 0;line-height:1.65}
.hero .btns{margin-top:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tile{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 14px 13px;min-width:0}
.tile .i{width:20px;height:20px;color:#86A8FF}
.tile .tl{font-size:12px;color:#9FB0D6;margin-top:10px}
.tile .tv{font-size:20px;font-weight:800;margin-top:1px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tile .tv.sm{font-size:16.5px}
.tile .tv small{font-size:12.5px;font-weight:600;color:#B9C6E4;margin-left:1px}
.tile .td{font-size:12px;margin-top:2px;color:#9FB0D6}
.tile .td.up{color:#7EE2A8}.tile .td.dn{color:#FFA3A6}
.hfoot{font-size:11.5px;color:#7F90B5;text-align:right;margin-top:12px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:#fff;border:0;padding:0 18px;height:48px;font-size:15px;font-weight:700;border-radius:var(--r2);box-shadow:0 4px 12px rgba(47,107,255,.22);text-decoration:none;white-space:nowrap;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn .i{width:18px;height:18px}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line2);box-shadow:none}
.btn.white{background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.btn.glass{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid #F7C9CA;box-shadow:none}
.btn.pill{border-radius:var(--rp)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:var(--r3)}
.btn.sm .i{width:16px;height:16px}
.btn.block{width:100%;display:flex}
.btn[disabled]{opacity:.55}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.col{flex-direction:column}
.toggle{background:none;border:0;color:var(--pri-text);font-size:14px;padding:0;min-height:44px;display:inline-flex;align-items:center;font-weight:700}
.linkback{display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--mute);font-size:14px;font-weight:600;padding:18px 0 0}
.linkback .i{width:18px;height:18px}

/* 입력 */
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;font:inherit;font-size:16px;font-weight:600;border-radius:12px;text-align:right;min-width:0;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s,background .15s}
.inp::placeholder{color:#B4BCC7;font-weight:500}
.inp:focus{outline:0;border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px rgba(47,107,255,.12)}
.inp.txt,textarea.inp,select.inp{text-align:left;font-weight:500}
textarea.inp{min-height:96px;resize:vertical;line-height:1.55}
input[type=file].inp{font-size:14px;padding:10px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.fld{display:grid;gap:7px;font-size:13px;font-weight:600;color:var(--ink2);min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stk{display:grid;gap:14px}
.seg{display:flex;background:#E9EDF3;border-radius:var(--r2);padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:9px 6px;font-size:13.5px;font-weight:600;border-radius:10px;min-width:0;line-height:1.35}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(16,24,40,.12)}
.card .seg{background:var(--panel2);border:1px solid var(--line)}
.chk{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--ink2);font-weight:500;min-height:40px}
.chk input{width:20px;height:20px;accent-color:var(--pri);margin:0;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line2);color:var(--ink2);padding:7px 12px;font-size:13px;font-weight:600;border-radius:var(--rp)}
.chip[aria-pressed=true]{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-text)}
.chip:active{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-text)}
.item{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .chk{grid-column:1/-1;font-size:13px;color:var(--mute)}
.x{width:44px;height:44px;border-radius:10px;background:var(--panel2);border:0;color:var(--mute);font-size:19px;line-height:1;display:grid;place-items:center}

/* 행 · 상태 */
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{color:var(--mute);font-size:14px;min-width:0}
.row .v{font-size:15.5px;font-weight:700;color:var(--ink);text-align:right;white-space:nowrap}
.row.strong .k{color:var(--ink);font-weight:700}
.row.strong .v{font-size:18px;color:var(--pri-text);font-weight:800}
.row.mute .v{color:var(--mute);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--rp);background:var(--panel2);color:var(--mute);white-space:nowrap;line-height:1.3}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.pri{background:var(--pri-soft);color:var(--pri-text)}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:middle}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri-text);flex:none}
.ic .i{width:22px;height:22px}
.ic.o{background:var(--warn-soft);color:var(--warn)}.ic.g{background:var(--ok-soft);color:var(--ok)}.ic.r{background:var(--bad-soft);color:var(--bad)}
.sumbox{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--pri-soft);border-radius:var(--r2);padding:14px 16px;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat .sl{font-size:12px;color:var(--mute);font-weight:600}
.stat .sv{font-size:18px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .sv small{font-size:12px;font-weight:600;color:var(--mute);margin-left:1px}
.flow{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px}
.flow .fn{width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}
.flow b{display:block;font-size:15px}.flow span:not(.fn){display:block;font-size:13px;color:var(--mute);line-height:1.6}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.mwarn{margin:0;color:var(--warn);font-weight:600}.mwarn:empty{display:none}
.lockscr{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));color:#fff;text-align:center;overflow:auto;
  background:radial-gradient(120% 60% at 100% 0%,rgba(76,125,255,.42),transparent 60%),linear-gradient(165deg,#15295A 0%,#0A1428 72%)}
.lockscr .lm{height:52px;width:auto;margin-bottom:22px}
.lockscr h1{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:0}
.lockscr p{color:#B4C2E2;font-size:14.5px;line-height:1.75;margin:14px 0 0}
.pindots{display:flex;gap:18px;margin:24px 0 6px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.pindots i.on{background:#fff;border-color:#fff}
.pindots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lockmsg{min-height:24px;color:#FFB4B7!important;font-weight:600;margin:6px 0 0!important}
.keypad{display:grid;grid-template-columns:repeat(3,74px);gap:14px 22px;margin-top:14px}
.keypad button{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.keypad button:active{background:rgba(255,255,255,.22)}
.keypad button.txt{background:none;border:0;font-size:15px;font-weight:600;color:#C8D4F0}
.keypad button[disabled]{opacity:.35}
.hintbox{margin:20px 0 0;padding:14px 20px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);max-width:320px;width:100%}
.hintbox span{display:block;font-size:12.5px;color:#9FB0D6}
.hintbox b{display:block;font-size:19px;margin-top:4px;word-break:keep-all}
.lockforgot{background:none;border:0;color:#9FB0D6;font-size:14px;margin-top:26px;text-decoration:underline;text-underline-offset:3px}
.lockbtns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:26px}
@media (max-width:419px){.lockbtn{display:none}}
.cpr{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer}
.cpr .t small{color:var(--mute);font-weight:500;font-size:12.5px}
.cpr .v{font-weight:700;white-space:nowrap}
.cpr.done .t{color:var(--ink)}.cpr:not(.done) .t,.cpr:not(.done) .v{color:var(--mute2)}
.card.soft .x{background:#fff}
.warnline{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(245,165,36,.14);border:1px solid rgba(245,165,36,.38);color:#FFE2B3;font-size:13px;line-height:1.5}
.warnline>.i{color:#F5B14A;flex:none}
.warnline b{display:block;color:#fff;font-size:14px}
.warnline .btn{margin-left:auto;flex:none}
.card.slim{padding:14px 16px}
.sumbox span{font-size:14px;font-weight:700;color:var(--ink2)}
.sumbox b{font-size:21px;font-weight:800;color:var(--pri-text);letter-spacing:-.03em}

/* 오늘 마감 카드 (홈) */
.today{display:flex;align-items:center;gap:14px}
.today .tt{flex:1;min-width:0}
.today .tt b{display:block;font-size:15.5px}
.today .tt span{font-size:13px;color:var(--mute)}

/* 7일 막대 */
.week{position:relative;display:flex;align-items:flex-end;gap:8px;height:158px;padding-top:6px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 38px;background-position:0 6px}
.week .c{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.week .a{font-size:11.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.week .bar{width:72%;max-width:30px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#6E9BFF,#2F6BFF);min-height:4px}
.week .bar.z{background:var(--line2)}
.week .lb{font-size:12px;color:var(--mute2);font-weight:600;background:var(--panel);padding:2px 0 0}
.week .lb.t{color:var(--pri-text);font-weight:800}

/* 도넛 */
.donut{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.donut svg{width:124px;height:124px;flex:none;transform:rotate(-90deg)}
.donut .dc{min-width:0}
.donut .dc .big{font-size:34px;color:var(--pri-text)}
.donut .dc .note{margin-top:2px}
.lgrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.lgrow:last-child{border-bottom:0}
.lgrow .k{color:var(--ink2)}
.lgrow .v{font-weight:700;white-space:nowrap}
.lgrow .v small{color:var(--mute2);font-weight:600;font-size:12px;margin-left:6px;display:inline-block;min-width:38px;text-align:right}

/* 6개월 추이 */
.trend{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:4px}
.trend .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0}
.trend .bars{display:flex;align-items:flex-end;gap:3px;height:110px;width:100%;justify-content:center}
.trend .bars i{display:block;width:38%;max-width:16px;border-radius:5px 5px 2px 2px;background:#D5E1FF;min-height:2px}
.trend .bars i.b{background:linear-gradient(180deg,#6E9BFF,#2F6BFF)}
.trend span{font-size:12px;color:var(--mute2);font-weight:600}
.trend .col.on span{color:var(--pri-text);font-weight:800}

/* 세금 흐름 */
.wf{display:grid;grid-template-columns:72px 1fr 104px;gap:10px;align-items:center;padding:8px 0;font-size:13.5px}
.wf>span:first-child{color:var(--ink2);font-weight:600}
.wf .bar{height:10px;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden}
.wf .bar i{position:absolute;left:0;top:0;bottom:0;background:#FFB3B5;border-radius:6px}
.wf .bar i.g{background:linear-gradient(90deg,#6E9BFF,#2F6BFF)}
.wf .v{text-align:right;font-weight:700}

/* 일정 */
.sch{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sch:last-of-type{border-bottom:0}
.dbox{width:48px;height:52px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;flex:none}
.dbox small{font-size:11px;color:var(--mute);font-weight:600}
.dbox b{font-size:19px;font-weight:800}
.sch .st{flex:1;min-width:0}
.sch .st b{display:block;font-size:15px}
.sch .st span{display:block;font-size:12.5px;color:var(--mute);line-height:1.5}

/* 체크리스트 */
.ck{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--panel2);color:var(--mute2);border:1px solid var(--line2)}
.ck .dot .i{width:15px;height:15px;stroke-width:3}
.ck.done .dot{background:var(--pri);border-color:var(--pri);color:#fff}
.ck .t{flex:1;font-weight:600;font-size:14.5px}
.ck.done .t{color:var(--mute)}
.prog{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:-4px 0 6px}
.prog i{display:block;height:100%;background:var(--pri);border-radius:3px}

/* 시작 단계 */
.step .stepb{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--pri-text);background:var(--pri-soft);padding:4px 10px;border-radius:var(--rp)}
.step h3{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:14px 0 6px}
.step p{margin:0 0 14px;color:var(--mute);font-size:14px;line-height:1.65}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;text-align:center;color:var(--mute2);font-weight:700;padding:2px 0 6px}
.cal .wd.sun{color:var(--bad)}.cal .wd.sat{color:var(--pri-text)}
.cal button{height:52px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7px 0 0;gap:1px;font-size:14px;font-weight:600;color:var(--ink2);min-width:0}
.cal button .a{font-size:10.5px;font-weight:700;color:var(--pri-text);letter-spacing:-.04em;white-space:nowrap;overflow:hidden;max-width:100%}
.cal button.has{background:var(--pri-soft)}
.cal button.fu{color:#7C8695}
.cal button.td{box-shadow:inset 0 0 0 1.5px var(--pri);color:var(--pri-text)}
.cal button.on{background:var(--pri);color:#fff;box-shadow:0 4px 10px rgba(47,107,255,.3)}
.cal button.on .a{color:#DCE6FF}

/* 직원 */
.staffhead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;text-align:left}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;background:var(--pri-soft);color:var(--pri-text)}
.av.o{background:var(--warn-soft);color:var(--warn)}
.staffhead .meta{flex:1;min-width:0}
.staffhead .nm{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.staffhead .d{display:block;font-size:12.5px;color:var(--mute)}
.staffhead .amt{font-size:16px;font-weight:800;white-space:nowrap}
.staffhead .chev{color:var(--mute2);transition:transform .2s}
.staffhead[aria-expanded=true] .chev{transform:rotate(90deg)}

/* 더보기 메뉴 · FAQ */
.menu{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;text-align:left;color:var(--ink);font-size:15.5px}
.menu:first-child{padding-top:2px}.menu:last-child{border-bottom:0;padding-bottom:2px}
.menu .mt{flex:1;min-width:0}
.menu b{display:block;font-weight:700}
.menu span.d{display:block;color:var(--mute);font-size:12.5px;margin-top:1px}
.menu>.i{color:var(--mute2)}
.faq details{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-top:10px;box-shadow:var(--sh)}
.faq summary{list-style:none;padding:17px 18px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;font-weight:300;color:var(--mute);line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0;padding:0 18px 18px;color:var(--mute);font-size:14px;line-height:1.75}
.foot{margin:34px 0 0;padding:20px 0 4px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);line-height:1.7}
.foot a{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:700;text-decoration:none;margin-top:8px}
.foot a .i{width:18px;height:18px}

/* 알림 카드 */
.alert{background:var(--warn-soft);border:1px solid #F8DDB6;border-radius:16px;padding:16px}
.card.alert{background:var(--warn-soft);border-color:#F8DDB6;box-shadow:none}
.alert .at{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:0 0 6px;color:#8A4B00}
.alert .at .i{color:var(--warn)}
.steps{margin:10px 0 12px;padding-left:20px;font-size:14px;line-height:1.8}
.install{margin:0;padding-left:20px}
.install li{margin:0 0 6px;font-size:14px}

/* 모달 (아래에서 올라오는 시트) */
.over{position:fixed;inset:0;z-index:20;background:rgba(10,20,40,.5);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0}
.modal::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 16px}
.modal img{width:100%;display:block;margin:14px 0 6px;border-radius:14px;border:1px solid var(--line)}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mh .t1{font-size:18px;font-weight:800}
@media (min-width:700px){.over{align-items:center;padding:24px}.modal{border-radius:24px;padding:24px}.modal::before{display:none}}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--tab-lift) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#131A26;color:#fff;padding:12px 18px;font-size:14px;font-weight:600;z-index:30;border-radius:var(--rp);max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
pre.draft{white-space:pre-wrap;word-break:keep-all;font:14px/1.75 var(--sans);margin:0}
.tip h3{font-size:16.5px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
.tip p{margin:0;font-size:14px;line-height:1.75;color:var(--ink2)}

/* 데스크톱 (매장 모니터) */
@media (min-width:1024px){
  :root{--tab-lift:0px}
  body{font-size:16px;padding-bottom:120px}
  .wrap{max-width:1120px;padding:0 32px}
  .top .wrap{height:72px}
  .tabbar{left:50%;right:auto;bottom:20px;transform:translateX(-50%);width:540px;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(16,24,40,.12);padding-bottom:0}
  .tabbar button{padding:10px 0 9px;font-size:12.5px}
  main.wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;align-items:start;padding-bottom:20px}
  main.wrap>*{grid-column:1/-1}
  main.wrap>.card{grid-column:auto}
  main.wrap>.card.alert,main.wrap>.card.empty,main.wrap>.card.soft,main.v-pay>.card,main.v-settings>.card.wide{grid-column:1/-1}
  main.wrap>.seg{max-width:560px;width:100%}
  main.v-pay .card .stk{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px;align-items:start}
  main.v-pay .card .stk>.hr,main.v-pay .card .stk>.sec,main.v-pay .card .stk>.g2,main.v-pay .card .stk>.btns{grid-column:1/-1}
  .ttl{font-size:32px}
  .hero{padding:30px 32px 28px}
  .hero .big{font-size:52px}
  .hero h1{font-size:38px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tile .tv{font-size:22px}
  .card{padding:24px 26px}
  .modal{max-width:560px}
  .toast{bottom:110px}
}
@media (prefers-reduced-motion:no-preference){
  .card,.hero{animation:in .28s ease both}
  @keyframes in{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
  .over{animation:fade .2s ease both}.modal{animation:up .26s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.5}}
}
</style>

  for(const k in b){o[k]=(a&&typeof a[k]==='object'&&!Array.isArray(a[k]))?deepMerge(a[k],b[k]):b[k]}

}

/* ---------- 기기 맞추기 (반자동 동기화) ----------
   기록을 '단위'로 나눠 언제 고쳤는지(stamp) 적어 둔다.
   다른 기기에서 온 백업을 합칠 때 단위마다 더 최근에 고친 쪽을 남긴다.
   단위: set(설정) · staff:<id> · day:<날짜> · mm:<월>(월 매출 직접 입력분·손님 수) · pur:<월> · exp:<월> · pay:<월>:<직원id>
   기록이 없는데 stamp가 더 최근이면 '지운 것'으로 보고 지운 상태를 남긴다. */
function stamp(u){if(!u)return;(state.stamp||(state.stamp={}))[u]=Date.now()}

    case 'day':return 'day:'+pickDay();

    case 'pay':return 'pay:'+k+':'+d.id;

  }

}
const clone=o=>JSON.parse(JSON.stringify(o));
/* 키 순서·빈 값(0, 빈 칸)과 상관없이 내용이 같은지 비교 */
const canon=v=>{if(Array.isArray(v))return '['+v.map(canon).join(',')+']';if(v&&typeof v==='object'){return '{'+Object.keys(v).filter(k=>v[k]!==undefined&&v[k]!==0&&v[k]!=='').sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'}return JSON.stringify(v===undefined?null:v)};
const same=(a,b)=>canon(a)===canon(b);
function dayKeys(days){const s=new Set();for(const o of Object.values(days||{}))for(const c in o)if(c!=='cnt')s.add(c);return s}
function manualOf(m){/* 월 매출 중 '오늘 마감'이 아닌, 월 화면에서 직접 넣은 몫 */
  const out={},days=m.days||{},keys=new Set([...Object.keys(m.sales||{}),...dayKeys(days)]);
  for(const c of keys){let s=0;for(const o of Object.values(days))s+=n(o[c]);const v=Math.max(0,n((m.sales||{})[c])-s);if(v)out[c]=v}
  return out;
}
function mergeState(L0,R0){
  const L=clone(L0),R=clone(R0),Ls=L.stamp||{},Rs=R.stamp||{},sum={newDay:0,upDay:0,delDay:0,keep:0,staff:0,lists:0,set:false};
  const pick=(u,hasL,hasR,a,b)=>{
    if(!hasL&&!hasR)return 'L';
    if(hasL&&hasR&&same(a,b))return 'L';
    const tl=n(Ls[u]),tr=n(Rs[u]);
    if(tl>tr)return 'L';if(tr>tl)return 'R';
    if(!hasL)return 'R';
    if(hasR)sum.keep++;
    return 'L';
  };
  const out=clone(L);out.stamp={};
  for(const u of new Set([...Object.keys(Ls),...Object.keys(Rs)]))out.stamp[u]=Math.max(n(Ls[u]),n(Rs[u]));

  if(pick('set',!same(L.settings,D),!same(R.settings,D),L.settings,R.settings)==='R'){out.settings=R.settings;sum.set=true}
  // 직원
  const ids=[...new Set([...L.staff.map(s=>s.id),...R.staff.map(s=>s.id)])];
  out.staff=[];
  for(const id of ids){const a=L.staff.find(s=>s.id===id),b=R.staff.find(s=>s.id===id),w=pick('staff:'+id,!!a,!!b,a,b);
    const v=w==='L'?a:b;if(v)out.staff.push(v);if(w==='R'&&!same(a,b))sum.staff++}
  // 달
  out.months={};
  const E=()=>({sales:{},purchases:[],expenses:[],pay:{},days:{}});
  for(const k of new Set([...Object.keys(L.months||{}),...Object.keys(R.months||{})])){
    const a=Object.assign(E(),L.months[k]),b=Object.assign(E(),R.months[k]),m=Object.assign(E(),clone(a));
    // 날짜별
    m.days={};
    for(const ds of new Set([...Object.keys(a.days),...Object.keys(b.days)])){
      const x=a.days[ds],y=b.days[ds],w=pick('day:'+ds,!!x,!!y,x,y),v=w==='L'?x:y;
      if(v)m.days[ds]=v;
      if(w==='R'&&!same(x,y)){if(!x)sum.newDay++;else if(!y)sum.delDay++;else sum.upDay++}
    }
    // 월 화면 직접 입력분 + 손님 수
    const ma={man:manualOf(a),custs:a.custs||0},mb={man:manualOf(b),custs:b.custs||0};
    const has=o=>Object.keys(o.man).length>0||n(o.custs)>0;
    const mm=pick('mm:'+k,has(ma),has(mb),ma,mb)==='L'?ma:mb;

    // 지출 목록 · 급여 입력
    for(const [li,u] of [['purchases','pur:'],['expenses','exp:']]){
      const w=pick(u+k,a[li].length>0,b[li].length>0,a[li],b[li]);m[li]=w==='L'?a[li]:b[li];if(w==='R'&&!same(a[li],b[li]))sum.lists++}
    m.pay={};
    for(const id of new Set([...Object.keys(a.pay),...Object.keys(b.pay)])){
      const w=pick('pay:'+k+':'+id,id in a.pay,id in b.pay,a.pay[id],b.pay[id]),v=w==='L'?a.pay[id]:b.pay[id];if(v)m.pay[id]=v}
    // 월 매출 = 직접 입력분 + 날짜별 합
    m.sales={};
    for(const c of new Set([...Object.keys(mm.man),...dayKeys(m.days)])){let s=n(mm.man[c]);for(const o of Object.values(m.days))s+=n(o[c]);if(s)m.sales[c]=s}

}

/* ---------- 계산: 손님 수 · 객단가 ----------
   월 매출 화면에 '이번 달 손님 수'를 직접 넣었으면 그 값과 월 총매출로 계산.
   아니면 오늘 마감에 손님 수를 넣은 날만 모아서 (그날 매출 합 ÷ 손님 수)로 계산. */
function custOf(k){
  const m=M(k),days=m.days||{};
  if(n(m.custs)>0){const sales=salesTotal(m);return {cnt:n(m.custs),sales,avg:sales/n(m.custs),days:0,src:'month'}}
  let cnt=0,sales=0,dd=0;
  for(const ds in days){const v=n(days[ds].cnt);if(v>0){cnt+=v;sales+=dayTotal(days[ds]);dd++}}
  return {cnt,sales,avg:cnt?sales/cnt:0,days:dd,src:'day'};
}

const salesTotal=m=>CH.reduce((t,[k])=>t+n(m.sales[k]),0);

const purchTotal=m=>m.purchases.reduce((t,i)=>t+n(i.amt),0);
const purchTaxable=m=>m.purchases.reduce((t,i)=>t+(i.taxable!==false?n(i.amt):0),0);
const purchVat=m=>purchTaxable(m)/11;
const purchSupply=m=>m.purchases.reduce((t,i)=>t+(i.taxable!==false?n(i.amt)/1.1:n(i.amt)),0);
const expTotal=m=>m.expenses.reduce((t,i)=>t+n(i.amt),0);

/* ---------- 계산: 직원 ---------- */
function tierList(st){
  const raw=Array.isArray(st.tiers)&&st.tiers.length?st.tiers:DEFAULT_TIERS;
  const t=raw.map((x,i)=>({upto:i===raw.length-1?Infinity:Math.max(0,n(x.upto)),rate:Math.max(0,n(x.rate))}));
  for(let i=1;i<t.length;i++)if(t[i].upto<t[i-1].upto)t[i].upto=t[i-1].upto;
  return t;
}
function tierIncentive(base,st){
  const t=tierList(st);
  if(st.tierWay==='prog'){
    let inc=0,prev=0;
    for(const x of t){const part=Math.max(0,Math.min(base,x.upto)-prev);inc+=part*x.rate/100;prev=x.upto;if(base<=x.upto)break}
    inc=Math.round(inc);
    return {inc,txt:'구간별 계산'+(base>0?' · 평균 '+pc(inc/base*100):'')};
  }
  const x=t.find(x=>base<=x.upto)||t[t.length-1];
  return {inc:Math.round(base*x.rate/100),txt:'구간 '+pc(x.rate)};
}
function calcStaff(st,key){
  const m=M(key),inp=m.pay[st.id]||{},S=state.settings;
  if(st.kind==='designer'){
    const sales=inp.sales||{};let gross=0,net=0;
    for(const [k] of CH){const a=n(sales[k]);gross+=a;net+=st.feeDeduct===false?a:a*(1-n(S.fees[k])/100)}
    const base0=st.vat==='off'?net:net/1.1;
    const matDed=Math.min(base0,st.mat==='pct'?Math.round(base0*n(st.matPct)/100):st.mat==='amt'?Math.max(0,n(inp.mat)):0);
    const base=Math.max(0,base0-matDed);
    const ti=st.mode==='tier'?tierIncentive(base,st):{inc:Math.round(base*n(st.rate)/100),txt:pc(n(st.rate))};
    const incentive=ti.inc;
    const prodSales=Math.max(0,n(inp.prod)),prodInc=Math.round((st.vat==='off'?prodSales:prodSales/1.1)*n(st.prodRate)/100);
    const earned=incentive+prodInc,baseAmt=Math.max(0,n(st.base));
    const topup=st.baseWay==='max'?Math.max(0,baseAmt-earned):0;
    const fixed=st.baseWay==='max'?0:baseAmt;
    const pay=Math.max(0,fixed+earned+topup+n(inp.extra)-n(inp.deduct));
    const tax=floor10(pay*0.03)+floor10(pay*0.003);
    const tip=st.tip?n(inp.tip):0;
    const tipTax=st.tip?floor10(tip*0.05)+floor10(tip*0.005):0;
    return {kind:'designer',sales:gross,net,base0,matDed,base,incentive,rateTxt:ti.txt,prodSales,prodInc,fixed,topup,pay,tax,ded:tax,takeHome:pay-tax,tip,tipTax,tipHome:tip-tipTax,
      total:pay-tax+tip-tipTax,cost:pay,employer:0,wh:tax+tipTax,
      pension:0,health:0,ltc:0,emp:0,itax:0,ltax:0,tax33:tax};
  }
  const dim=daysIn(key);let gross=0,ratio=1,from=1,to=dim,juhyu=0,juHrs=0,juWeeks=0;
  if(st.type==='hourly'){
    gross=n(st.rate)*n(inp.hours);
    /* 주휴수당: 1주 소정근로 15시간 이상이면 (1주 근로시간 ÷ 40 × 8)시간분을 주마다 지급 */
    const wh=Math.min(40,n(st.weekHours));
    if(st.juhyu&&wh>=15){juHrs=Math.round(wh/40*8*10)/10;juWeeks=n(inp.juWeeks)>0?n(inp.juWeeks):Math.round(dim/7*10)/10;juhyu=Math.round(n(st.rate)*juHrs*juWeeks);gross+=juhyu}
  }
  else if(st.type==='daily')gross=n(st.rate)*n(inp.days);
  else{
    from=Math.min(dim,Math.max(1,Math.round(n(inp.startDay))||1));
    to=Math.min(dim,Math.max(1,Math.round(n(inp.endDay))||dim));
    ratio=to>=from?(to-from+1)/dim:0;
    gross=Math.round(n(st.rate)*ratio);
  }
  gross=Math.max(0,gross+n(inp.extra)-n(inp.deduct));
  const IR=S.ins;let pension=0,health=0,ltc=0,emp=0,itax=0,ltax=0,tax33=0,employer=0;
  if(st.deduct==='ins'){
    pension=floor10(gross*n(IR.pension)/100);
    health=floor10(gross*n(IR.health)/100);
    ltc=floor10(health*n(IR.ltc)/100);
    emp=floor10(gross*n(IR.emp)/100);
    itax=floor10(n(inp.incomeTax));
    ltax=floor10(itax*0.1);
    employer=floor10(gross*n(IR.pension)/100)+floor10(gross*n(IR.health)/100)+floor10(floor10(gross*n(IR.health)/100)*n(IR.ltc)/100)+floor10(gross*n(IR.empEr)/100)+floor10(gross*n(IR.accident)/100);
  }else if(st.deduct==='tax33'){
    tax33=floor10(gross*0.03)+floor10(gross*0.003);
  }
  const ded=pension+health+ltc+emp+itax+ltax+tax33;
  return {kind:'worker',pay:gross,juhyu,juHrs,juWeeks,ratio,from,to,dim,pension,health,ltc,emp,itax,ltax,tax33,ded,takeHome:gross-ded,
    total:gross-ded,cost:gross,employer,tip:0,tipTax:0,tipHome:0,sales:0,net:0,base:0,incentive:0,
    wh:tax33+itax+ltax};
}
function laborOf(key){
  let pay=0,er=0,tip=0,wh=0;
  for(const st of state.staff){const r=calcStaff(st,key);pay+=r.cost;er+=r.employer;tip+=r.tip;wh+=r.wh}
  return {pay,er,tip,wh,total:pay+er};
}

/* ---------- 계산: 세금 ---------- */
const BRK=[[14e6,.06,0],[50e6,.15,1.26e6],[88e6,.24,5.76e6],[150e6,.35,15.44e6],[300e6,.38,19.94e6],[500e6,.40,25.94e6],[1e9,.42,35.94e6],[Infinity,.45,65.94e6]];
function incomeTaxAnnual(x){if(x<=0)return 0;for(const [lim,r,d] of BRK){if(x<=lim)return Math.round(x*r-d)}return 0}
function marginal(x){for(const [lim,r] of BRK){if(x<=lim)return r}return .45}
function calcTax(key){
  const m=M(key),S=state.settings;
  const sales=salesTotal(m),pt=purchTotal(m),ex=expTotal(m),lab=laborOf(key),fee=feeTotal(m);
  const supply=sales/1.1,outVat=sales-supply,inVat=purchVat(m);
  const receiptSales=RECEIPT_CH.reduce((t,k)=>t+n(m.sales[k]),0);
  const credit=Math.min(receiptSales*crRate(),crCap()/12);
  let rawVat;
  const exempt=S.taxType==='simple'&&sales*12<SIMPLE_EXEMPT;
  if(S.taxType==='simple'){rawVat=exempt?0:sales*0.30*0.10-purchTaxable(m)*0.005-credit}
  else{rawVat=outVat-inVat-credit}
  const vat=Math.max(0,Math.round(rawVat)),refund=Math.max(0,Math.round(-rawVat));
  const profit=supply-purchSupply(m)-ex-lab.total-fee;
  const annualProfit=profit*12;
  const taxable=Math.max(0,annualProfit-n(S.basicDeduction)*10000);
  const itAnnual=incomeTaxAnnual(taxable);
  const itMonthly=Math.round(itAnnual*1.1/12);
  const net=sales-pt-ex-lab.total-fee-vat-itMonthly;
  return {sales,pt,ex,lab,fee,supply,outVat,inVat,receiptSales,credit,rawVat,vat,refund,exempt,profit,annualProfit,taxable,itAnnual,itMonthly,
    net,tax:vat+itMonthly,rate:marginal(taxable)};
}
const isActive=key=>{const m=state.months[key];return !!m&&(salesTotal(m)>0||m.purchases.length||m.expenses.length||Object.keys(m.pay).length)};

/* ---------- 입력 바인딩 ---------- */
function target(el){
  const d=el.dataset;let obj;
  if(d.scope==='month')obj=getMonth();
  else if(d.scope==='set')obj=state.settings;
  else if(d.scope==='staff')obj=state.staff.find(s=>s.id===d.id);
  else if(d.scope==='pay'){const m=getMonth();obj=m.pay[d.id]||(m.pay[d.id]={})}
  else if(d.scope==='item'){obj=getMonth()[d.list].find(i=>i.id===d.id)}
  return obj?{obj,path:d.path}:null;
}
function setPath(o,path,v){const p=path.split('.');for(let i=0;i<p.length-1;i++){o=o[p[i]]||(o[p[i]]={})}o[p[p.length-1]]=v}
function getPath(o,path){return path.split('.').reduce((a,k)=>a==null?undefined:a[k],o)}
function commit(el){
  if(el.dataset.scope==='day'){const ds=pickDay();setDayVal(ds,el.dataset.path,parseMoney(el.value));stamp('day:'+ds);save();return}
  if(el.dataset.scope==='staff'&&/^tiers\./.test(el.dataset.path||'')){const st=state.staff.find(x=>x.id===el.dataset.id);if(st&&!(Array.isArray(st.tiers)&&st.tiers.length))st.tiers=DEFAULT_TIERS.map(x=>({...x}))}
  const t=target(el);if(!t)return;
  const ty=el.dataset.t;let v=el.value;
  if(el.type==='checkbox')v=el.checked;
  else if(ty==='money')v=parseMoney(v);
  else if(ty==='num'||ty==='pct')v=parseNum(v);
  setPath(t.obj,t.path,v);stamp(unitOf(el));save();
}
const attrs=(scope,path,extra)=>{extra=extra||{};return `data-scope="${scope}" data-path="${path}"`+(extra.id?` data-id="${extra.id}"`:'')+(extra.list?` data-list="${extra.list}"`:'')+(extra.rr?' data-rr="1"':'')};
const IN={

  seg:(scope,path,val,opts,ex)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-act="seg" ${attrs(scope,path,ex)} data-val="${v}" aria-pressed="${val===v}">${l}</button>`).join('')}</div>`
};
const row=(k,v,cls)=>`<div class="row ${cls||''}"><span class="k">${k}</span><span class="v num">${v}</span></div>`;
const lrow=(k,key,cls)=>`<div class="row ${cls||''}"><span class="k">${k}</span><span class="v num" data-live="${key}"></span></div>`;

function liveVal(key){
  const p=key.split(':'),k=ui.month,m=M(k);
  switch(p[0]){
    case 'sales':
      if(p[1]==='total')return wonT(salesTotal(m));
      if(p[1]==='fee')return wonT(p[2]?feeOf(m,p[2]):feeTotal(m));
      if(p[1]==='share'){const t=salesTotal(m);return t?pc(n(m.sales[p[2]])/t*100):'-'}
      if(p[1]==='delta'){const a=salesTotal(m),b=salesTotal(M(shiftMonth(k,-1)));return b?((a-b)/b*100>=0?'+':'')+pc((a-b)/b*100)+' (전월 대비)':'전월 데이터 없음'}
      break;
    case 'purch':return wonT(p[1]==='vat'?purchVat(m):purchTotal(m));
    case 'exp':return wonT(expTotal(m));
    case 'labor':{const l=laborOf(k);return wonT(p[1]==='pay'?l.pay:p[1]==='er'?l.er:p[1]==='wh'?l.wh:l.total)}
    case 'sum':{const t=calcTax(k);return wonT(t.pt+t.ex+t.lab.total+t.fee)}
    case 'pay':{const st=state.staff.find(s=>s.id===p[1]);if(!st)return '';const v=calcStaff(st,k)[p[2]];return typeof v==='string'?v:(p[3]==='neg'?'−':'')+wonT(v)}
    case 'pct':return pc(n(state.settings.fees[p[1]]));
    case 'day':{const ds=pickDay(),o=(M(ds.slice(0,7)).days||{})[ds]||{};
      if(p[1]==='avg'){const c=n(o.cnt);return c?wonT(dayTotal(o)/c):'-'}
      return wonT(dayTotal(o))}
    case 'cust':{const c=custOf(k);if(p[1]==='avg')return c.cnt?wonT(c.avg):'-';return fmt(c.cnt)+'명'}
    case 'dayrow':{const x=p.slice(1).join(':');return wonT(dayTotal((M(x.slice(0,7)).days||{})[x]))}
    case 'daysum':{const ds=Object.values(M(k).days||{});return wonT(ds.reduce((a,o)=>a+dayTotal(o),0))}
    case 'mw':{const st=state.staff.find(s=>s.id===p[1]);if(!st||st.kind!=='worker'||!n(st.rate))return '';const mw=minWage(k),y=k.slice(0,4);if(!mw)return '';
      if(st.type==='hourly'&&n(st.rate)<mw)return `⚠ ${y}년 최저시급(${fmt(mw)}원)보다 낮아요. 시급을 확인해 주세요.`;
      if((st.type||'monthly')==='monthly'&&n(st.rate)<mw*209)return `주 40시간 기준 ${y}년 최저 월급(${fmt(mw*209)}원)보다 적어요. 단시간 근무라면 괜찮아요.`;
      return ''}
    case 'cal':{const x=p.slice(1).join(':'),v=dayTotal((M(x.slice(0,7)).days||{})[x]);return v?man(v):''}
  }
  return '';
}
function live(){document.querySelectorAll('[data-live]').forEach(el=>{
  const v=liveVal(el.dataset.live);
  if(el.classList.contains('big')){el.innerHTML=esc(v).replace(/원$/,'<small>원</small>')}else el.textContent=v;

/* ---------- 잠금 (비밀번호 4자리) ----------
   다른 사람이 화면을 보지 못하게 하는 기능. 기록 자체를 암호화하지는 않는다.
   비밀번호는 이 기기에만(해시로) 저장하고 백업 파일에는 넣지 않는다. */
const LOCKKEY='zerobalance-lock-v1';
function lockLoad(){try{const o=JSON.parse(localStorage.getItem(LOCKKEY)||'null');return o&&o.hash&&o.salt?o:null}catch(e){return null}}
let lock=lockLoad();
const lockSave=()=>{try{lock?localStorage.setItem(LOCKKEY,JSON.stringify(lock)):localStorage.removeItem(LOCKKEY)}catch(e){}};
async function pinHash(pin,salt){
  const txt='zb:'+salt+':'+pin;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=2166136261;for(const c of txt){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return 'f'+h.toString(16);
}
const lockWait=()=>lock&&n(lock.waitUntil)>Date.now()?Math.ceil((n(lock.waitUntil)-Date.now())/1000):0;
let lockTimer;
function vLock(){
  clearTimeout(lockTimer);
  if(ui.lockForgot)return `<div class="lockscr" role="dialog" aria-modal="true" aria-label="비밀번호 찾기"><img class="lm" src="${MARK}" alt="">
    <h1>비밀번호를 잊으셨나요?</h1>
    ${lock&&lock.hint?`<div class="hintbox"><span>내가 적어 둔 힌트</span><b>${esc(lock.hint)}</b></div>`:''}
    <p>${lock&&lock.hint?'힌트를 보고 기억이 나면 아래에서 다시 입력해 보세요.<br>':''}비밀번호는 이 ${DEV}에만 있어서 찾아 드릴 수 없어요.<br>끝내 기억나지 않으면 이 ${DEV}의 기록을 모두 지워야 풀려요.<br>백업 파일이 있으면 지운 뒤 더보기 › 기기 맞추기에서 되돌릴 수 있어요.</p>
    <div class="lockbtns"><button class="btn white pill block" data-act="lockBack">비밀번호 다시 입력</button><button class="btn ${ui.lockForgot===2?'danger':'glass'} pill block" data-act="lockWipe">${ui.lockForgot===2?'정말 모두 지우고 풀기':'기록 지우고 잠금 풀기'}</button></div></div>`;
  const w=lockWait();
  if(w)lockTimer=setTimeout(()=>{if(ui.locked)render(true)},1000);
  const dots=[0,1,2,3].map(i=>`<i class="${i<ui.pinIn.length?'on':''}"></i>`).join('');
  const keys=['1','2','3','4','5','6','7','8','9','','0','back'];
  return `<div class="lockscr" role="dialog" aria-modal="true" aria-label="잠금"><img class="lm" src="${MARK}" alt="">
    <h1>비밀번호를 입력하세요</h1>
    <div class="pindots ${ui.lockShake?'shake':''}" aria-label="${ui.pinIn.length}자리 입력됨">${dots}</div>
    <p class="lockmsg" role="status">${w?`여러 번 틀렸어요. ${w>=60?Math.ceil(w/60)+'분':w+'초'} 뒤에 다시 입력해 주세요.`:esc(ui.lockMsg||'')}</p>
    <div class="keypad">${keys.map(k=>k===''?'<span></span>':`<button type="button" data-act="pinKey" data-val="${k}" ${w?'disabled':''} ${k==='back'?'class="txt" aria-label="지우기"':''}>${k==='back'?'지우기':k}</button>`).join('')}</div>
    <button class="lockforgot" data-act="lockForgot">비밀번호를 잊었어요</button></div>`;
}
async function pinPress(k){
  if(!ui.locked||ui.lockForgot||lockWait())return;
  ui.lockShake=false;
  if(k==='back'){ui.pinIn=ui.pinIn.slice(0,-1);render(true);return}
  if(!/^\d$/.test(k)||ui.pinIn.length>=4)return;
  ui.pinIn+=k;ui.lockMsg='';render(true);
  if(ui.pinIn.length<4)return;
  const ok=(await pinHash(ui.pinIn,lock.salt))===lock.hash;
  ui.pinIn='';
  if(ok){ui.locked=false;lock.fails=0;lock.rounds=0;lock.waitUntil=0;lockSave();render(false);return}
  lock.fails=n(lock.fails)+1;
  if(lock.fails>=5){const W=[30,60,300,600],r=n(lock.rounds);lock.fails=0;lock.rounds=r+1;lock.waitUntil=Date.now()+W[Math.min(r,W.length-1)]*1000}
  lockSave();ui.lockMsg='비밀번호가 달라요';ui.lockShake=true;render(true);
}
function lockNow(){if(!lock)return;ui.locked=true;ui.pinIn='';ui.lockMsg='';ui.lockForgot=0;ui.modal=null;render(false)}
function lockCard(){
  const pf=(id,label,ph)=>`<label class="fld"><span>${label}</span><input class="inp" id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="${ph||'숫자 4자리'}"></label>`;
  let h=`<div class="card" id="lockcard"><div class="sec"><span>잠금</span>${lock?'<span class="pill ok">켜짐</span>':'<span class="pill">꺼짐</span>'}</div>

  const ck=[[t.sales>0,'매출','sales'],[m.purchases.length+m.expenses.length>0,'지출 (매입·경비)','exp'],[state.staff.length>0,'급여 (직원 등록)','pay']],done=ck.filter(c=>c[0]).length;
  if(done<3)h+=`<div class="card"><div class="sec"><span>이번 달 입력 현황</span><span class="pill pri">${done} / 3</span></div><div class="prog"><i style="width:${done/3*100}%"></i></div>${ck.map(([ok,l,tab])=>`<div class="ck ${ok?'done':''}"><span class="dot">${I('check')}</span><span class="t">${l}</span>${ok?'<span class="pill ok">입력됨</span>':`<button class="btn sm ghost" data-act="tab" data-tab="${tab}">입력하기</button>`}</div>`).join('')}</div>`;
  const keys=[];for(let i=5;i>=0;i--)keys.push(shiftMonth(k,-i));
  if(calcYear(k).months<2&&keys.filter(isActive).length>=2){
    const rows=keys.map(x=>({x,s:isActive(x)?salesTotal(M(x)):0,nt:isActive(x)?Math.max(0,calcTax(x).net):0}));
    const mx=Math.max(1,...rows.map(r=>r.s));
    h+=`<div class="card"><div class="sec">최근 6개월</div><div class="trend">${rows.map(r=>`<div class="col ${r.x===k?'on':''}"><div class="bars"><i style="height:${r.s/mx*100}%" title="매출 ${wonT(r.s)}"></i><i class="b" style="height:${r.nt/mx*100}%" title="남는 돈 ${wonT(r.nt)}"></i></div><span>${Number(r.x.split('-')[1])}월</span></div>`).join('')}</div><div class="note" style="margin-top:10px"><span class="sw" style="background:#D5E1FF"></span>매출 &nbsp; <span class="sw" style="background:var(--pri)"></span>남는 돈</div></div>`;
  }
  return h+`<p class="note" style="margin:18px 0 0">세금은 입력값으로 계산한 추정치예요. 실제 신고는 세무사 확인을 거치세요.</p>`;
}

  }
  return h+`<p class="note" style="margin:14px 0 0">폰에서 보내고 → PC에서 합치고 → PC에서 다시 보내 → 폰에서 합치면 양쪽이 똑같아져요. 같은 날짜를 양쪽에서 고쳤다면 더 나중에 고친 쪽이 남아요.</p></div>`;

function vInput(){

  const seg=`<div class="seg" style="margin-top:16px">${[['day','오늘 마감'],['sales','월 매출'],['exp','지출']].map(([v,l])=>`<button data-act="inSub" data-val="${v}" aria-pressed="${sub===v}">${l}</button>`).join('')}</div>`;
  const ins=h=>{const i=h.indexOf('</div>',h.indexOf('class="sub"'))+6;return h.slice(0,i)+seg+h.slice(i)};
  if(sub==='sales')return ins(vSales());

}
function calHtml(k,sel){
  const [y,mo]=k.split('-').map(Number),first=new Date(y,mo-1,1).getDay(),dim=daysIn(k),days=M(k).days||{},td=todayStr();
  let h=`<div class="cal">`+WD.map((w,i)=>`<div class="wd ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('');
  for(let i=0;i<first;i++)h+='<span></span>';
  for(let d=1;d<=dim;d++){
    const ds=k+'-'+pad(d),amt=dayTotal(days[ds]);
    h+=`<button type="button" class="${amt?'has ':''}${ds===sel?'on ':''}${ds===td?'td ':''}${ds>td?'fu':''}" data-act="pickDay" data-val="${ds}" aria-pressed="${ds===sel}" aria-label="${dayLabel(ds)}${amt?' 매출 '+wonT(amt):''}"><span>${d}</span><span class="a num" data-live="cal:${ds}"></span></button>`;
  }
  return h+'</div>';
}
function vDay(seg){
  const k=ui.month,ds=pickDay(),m=M(k),days=m.days||{},d=days[ds]||{};
  const others=CH.filter(([c])=>!MAIN_CH.includes(c));
  const showAll=ui.moreAll||others.some(([c])=>n(d[c]));
  let h=head('입력','오늘 마감','하루 끝날 때 결제수단별 매출만 넣어요. 월 합계에 자동으로 더해져요.')+seg;
  h+=`<div class="card"><div class="sec"><span>${dayLabel(ds)}</span>${ds===todayStr()?'<span class="pill pri">오늘</span>':ds>todayStr()?'<span class="pill warn">미래 날짜</span>':''}</div><div class="stk">`;
  for(const [c,l] of CH.filter(([c])=>MAIN_CH.includes(c)).sort((a,b)=>MAIN_CH.indexOf(a[0])-MAIN_CH.indexOf(b[0])))h+=fld(l,IN.money('day',c,d[c]));

  h+=`</div>${showAll?'':`<button class="toggle" data-act="moreCh">+ 다른 결제수단 (네이버페이·카카오페이 등)</button>`}
  <div class="hr"></div>${fld('손님 수 (명)',`<input class="inp" inputmode="numeric" autocomplete="off" placeholder="0" data-t="num" data-scope="day" data-path="cnt" value="${n(d.cnt)||''}">`)}
  <div class="sumbox"><span>이날 매출 합계</span><b class="num" data-live="day:total"></b></div>
  <div class="row" style="padding:12px 4px 0;border:0"><span class="k">객단가 (1명당)</span><span class="v num" data-live="day:avg"></span></div>
  <p class="note" style="margin:10px 0 0">입력하는 즉시 저장돼요.</p>`;
  if(days[ds])h+=`<div class="btns" style="margin-top:12px">${ui.confirmDel==='day:'+ds?`<button class="btn sm danger" data-act="delDay" data-val="${ds}">정말 ${dayLabel(ds)} 기록 삭제</button>`:`<button class="btn sm ghost" data-act="delDay" data-val="${ds}">이날 기록 삭제</button>`}</div>`;
  h+=`</div>`;
  const cnt=Object.keys(days).length;
  h+=`<div class="card"><div class="sec"><span>${Number(k.split('-')[1])}월 마감 달력</span><span class="pill ${cnt?'pri':''}">${cnt}일 기록</span></div><div class="cap">날짜를 누르면 그날 매출을 넣거나 고칠 수 있어요.</div>${calHtml(k,ds)}
  <div class="hr"></div><div class="row"><span class="k">일별 기록 합계</span><span class="v num" data-live="daysum"></span></div></div>`;
  return h;
}

function itemRows(list,m,withTax){

  return m[list].map(i=>`<div class="item">
    ${IN.text('item','name',i.name,{id:i.id,list},withTax?'거래처 / 품목':'항목')}

    <button class="x" data-act="delItem" data-list="${list}" data-id="${i.id}" aria-label="삭제">×</button>
    ${withTax?`<div class="chk">${IN.chk('item','taxable',i.taxable!==false,'과세 매입 (부가세 포함 금액)',{id:i.id,list,rr:1})}</div>`:''}
  </div>`).join('');
}
/* 지난달 지출 불러오기: 지출이 있는 가장 가까운 지난달(최대 12개월 전)에서 항목을 골라 복사 */
function prevExpMonth(k){for(let i=1;i<=12;i++){const p=shiftMonth(k,-i),m=state.months[p];if(m&&(m.purchases.length||m.expenses.length))return p}return null}
function copyItems(){
  const p=prevExpMonth(ui.month);if(!p)return null;
  const pm=M(p),cm=M(ui.month),nm=s=>String(s||'').trim();
  const has=(list,name)=>cm[list].some(i=>nm(i.name)&&nm(i.name)===nm(name));
  const items=[];
  for(const list of ['purchases','expenses'])for(const i of pm[list]){if(!nm(i.name)&&!n(i.amt))continue;items.push({key:p+':'+list+':'+i.id,list,item:i,exists:has(list,i.name)})}
  return {p,items};
}
function copyCard(){
  const c=copyItems();if(!c||!c.items.length)return '';
  const sel=ui.copySel||{},on=x=>x.key in sel?sel[x.key]:!x.exists;
  const fresh=c.items.filter(x=>!x.exists);
  const mon=Number(c.p.slice(5))+'월';
  if(!ui.copyOpen){
    if(!fresh.length)return '';
    return `<div class="card soft"><div class="today"><span class="ic">${I('copy')}</span><div class="tt"><b>${mon} 지출 불러오기</b><span>월세·관리비처럼 매달 같은 항목 ${fresh.length}개 · ${wonT(fresh.reduce((a,x)=>a+n(x.item.amt),0))}</span></div><button class="btn sm" data-act="copyOpen">보기</button></div></div>`;
  }
  const cnt=c.items.filter(on).length;
  return `<div class="card soft"><div class="sec"><span>${mon} 지출 불러오기</span><button class="x" data-act="copyClose" aria-label="닫기">×</button></div><div class="cap">불러올 항목을 고르세요. 금액은 그대로 복사돼요. 이번 달에 달라졌으면 불러온 뒤 고쳐 주세요.</div>
  ${c.items.map(x=>`<button type="button" class="ck cpr ${on(x)?'done':''}" data-act="copyTog" data-val="${x.key}" aria-pressed="${on(x)}"><span class="dot">${I('check')}</span><span class="t">${esc(x.item.name||'(이름 없음)')} <small>${x.list==='purchases'?'매입':'경비'}</small>${x.exists?' <span class="pill">이미 있음</span>':''}</span><span class="v num">${wonT(x.item.amt)}</span></button>`).join('')}
  <div class="btns" style="margin-top:14px"><button class="btn sm" data-act="copyDo" ${cnt?'':'disabled'}>선택한 ${cnt}개 불러오기</button><button class="btn sm ghost" data-act="copyClose">닫기</button></div></div>`;
}
function copyDo(){
  const c=copyItems();if(!c)return;
  const sel=ui.copySel||{},on=x=>x.key in sel?sel[x.key]:!x.exists,m=getMonth();let k=0;const lists=new Set();
  for(const x of c.items)if(on(x)){const o=Object.assign({},x.item,{id:uid()});m[x.list].push(o);lists.add(x.list);k++}
  for(const l of lists)stamp((l==='purchases'?'pur:':'exp:')+ui.month);
  ui.copyOpen=false;ui.copySel=null;save();render(true);
  toast(k?`${k}개 불러왔어요. 금액이 달라졌으면 고쳐 주세요.`:'선택한 항목이 없어요');
}

/* 세금 */
/* ---------- 올해 누적 ----------
   그 해 1월부터 보고 있는 달까지 더한다. 종합소득세는 '기록한 달의 월평균 × 12'로 1년을 추정하고,
   지금까지 쌓아 둬야 할 몫(연 세액 × 기록한 달 수 / 12)을 보여 준다.
   부가세는 반기(일반) 또는 1년(간이) 단위로 모아서 계산하고, 카드 발행세액공제 연 한도를 한 번만 적용한다. */
function calcYear(k){
  const [y,mo]=k.split('-').map(Number),keys=[];for(let i=1;i<=mo;i++)keys.push(y+'-'+pad(i));
  const S=state.settings,simple=S.taxType==='simple',rows=[];
  const T={sales:0,pt:0,ex:0,lab:0,fee:0,profit:0,out:0,inv:0,rcpt:0,ptax:0,cnt:0,cntSales:0};
  const H=[{out:0,inv:0,rcpt:0},{out:0,inv:0,rcpt:0}];
  for(const key of keys){
    const t=calcTax(key),m=M(key),c=custOf(key),act=isActive(key);
    T.sales+=t.sales;T.pt+=t.pt;T.ex+=t.ex;T.lab+=t.lab.total;T.fee+=t.fee;T.profit+=t.profit;
    T.out+=t.outVat;T.inv+=t.inVat;T.rcpt+=t.receiptSales;T.ptax+=purchTaxable(m);T.cnt+=c.cnt;T.cntSales+=c.sales;
    const h=H[Number(key.slice(5))<=6?0:1];h.out+=t.outVat;h.inv+=t.inVat;h.rcpt+=t.receiptSales;
    rows.push({key,act,sales:t.sales,profit:t.profit,cnt:c.cnt,avg:c.avg});
  }
  const months=rows.filter(r=>r.act).length;
  let vat,vatRows=[],cap=crCap();
  if(simple){
    const ann=months?T.sales/months*12:0,exempt=ann<SIMPLE_EXEMPT,cr=Math.min(T.rcpt*crRate(),cap);
    vat=exempt?0:Math.max(0,Math.round(T.sales*0.03-T.ptax*0.005-cr));
    vatRows=[{l:'1년분 (간이)',v:vat,cr,exempt}];
  }else{
    vat=0;
    H.forEach((h,i)=>{if(i===1&&mo<7)return;const cr=Math.min(h.rcpt*crRate(),cap);cap-=cr;const raw=h.out-h.inv-cr;vatRows.push({l:i?'7~'+mo+'월 (하반기)':'1~'+Math.min(6,mo)+'월 (상반기)',v:Math.round(raw),cr});vat+=Math.max(0,Math.round(raw))});
  }
  const avgProfit=months?T.profit/months:0,annual=avgProfit*12;
  const taxable=Math.max(0,annual-n(S.basicDeduction)*10000),itYear=Math.round(incomeTaxAnnual(taxable)*1.1);
  const itToDate=Math.round(itYear*months/12);
  const net=T.sales-T.pt-T.ex-T.lab-T.fee-vat-itToDate;
  return {y,mo,keys,rows,months,simple,...T,vat,vatRows,avgProfit,annual,taxable,itYear,itToDate,rate:marginal(taxable),tax:vat+itToDate,net,avg:T.cnt?T.cntSales/T.cnt:0};
}

  // 부가세

  else if(S.taxType!=='simple'&&t.sales>0&&t.sales*12<lim)tips.push(['과세유형 점검',`연 환산 매출이 ${wonT(t.sales*12)}이에요. 간이과세 기준(1억 400만원) 아래라서 간이과세 대상인지 세무 담당자에게 물어볼 만해요.`]);

function settleData(st){
  const k=ui.month,r=calcStaff(st,k),rows=[];
  const R=(a,b,t)=>rows.push({k:a,v:b,t:t||''});
  if(st.kind==='designer'){
    R('총 매출',wonT(r.sales));
    if(st.feeDeduct!==false)R('수수료 차감 후',wonT(r.net));
    if(st.vat!=='off')R('부가세 제외 기준',wonT(r.base0));
    if(r.matDed)R(st.mat==='pct'?`재료비 공제 (${pc(n(st.matPct))})`:'재료비 공제','−'+wonT(r.matDed));
    if(r.matDed)R('인센티브 기준 매출',wonT(r.base));
    R(`인센티브 (${r.rateTxt})`,wonT(r.incentive));
    if(r.prodInc)R(`점판 인센티브 (${pc(n(st.prodRate))})`,wonT(r.prodInc));
    if(r.fixed)R('기본급',wonT(r.fixed));
    if(r.topup)R(`보장급 보전 (보장 ${wonT(st.base)})`,wonT(r.topup));
    const inp=M(k).pay[st.id]||{};
    if(n(inp.extra))R('추가 지급',wonT(inp.extra));
    if(n(inp.deduct))R('차감','−'+wonT(inp.deduct));
    R('지급 합계',wonT(r.pay),'b');
    R('원천세 3.3%','−'+wonT(r.tax));
    R('급여 실수령',wonT(r.takeHome),'b');
    if(st.tip){R('','', 'sep');R('봉사료',wonT(r.tip));R('봉사료 원천세 5.5%','−'+wonT(r.tipTax));R('봉사료 실수령',wonT(r.tipHome),'b')}
    return {rows,total:wonT(r.total),totalLabel:st.tip?'총 입금액 (급여 + 봉사료)':'입금액'};
  }
  const inp=M(k).pay[st.id]||{};
  if(st.type==='hourly'){R(`시급 ${fmt(st.rate)}원 × ${n(inp.hours)}시간`,wonT(n(st.rate)*n(inp.hours)));if(r.juhyu)R(`주휴수당 (${r.juHrs}시간 × ${r.juWeeks}주)`,wonT(r.juhyu))}
  else if(st.type==='daily')R(`일당 ${fmt(st.rate)}원 × ${n(inp.days)}일`,wonT(n(st.rate)*n(inp.days)));
  else R(r.ratio<1?`월 급여 (${r.from}일~${r.to}일 일할)`:'월 급여',wonT(Math.round(n(st.rate)*r.ratio)));
  if(n(inp.extra))R('추가 지급',wonT(inp.extra));
  if(n(inp.deduct))R('차감','−'+wonT(inp.deduct));
  R('지급 합계',wonT(r.pay),'b');
  if(st.deduct==='ins'){R('국민연금','−'+wonT(r.pension));R('건강보험','−'+wonT(r.health));R('장기요양','−'+wonT(r.ltc));R('고용보험','−'+wonT(r.emp));if(r.itax)R('근로소득세','−'+wonT(r.itax));if(r.ltax)R('지방소득세','−'+wonT(r.ltax))}
  if(st.deduct==='tax33')R('원천세 3.3%','−'+wonT(r.tax33));
  R('공제 합계','−'+wonT(r.ded));
  return {rows,total:wonT(r.takeHome),totalLabel:'실수령액'};
}

function drawSettle(st){
  const data=settleData(st),W=750,P=56,LH=62,rows=data.rows,HH=268;
  const H=HH+40+rows.length*LH+36+176+120;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');if(!x)return null;
  const C={bg:'#FFFFFF',ink:'#131A26',mute:'#6B7684',pri:'#2F6BFF',soft:'#EDF2FF',line:'#E7EBF0',navy:'#0A1428',navy2:'#15295A'};
  const F=(s,w)=>`${w||400} ${s}px "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,W,HH);g.addColorStop(0,C.navy2);g.addColorStop(1,C.navy);x.fillStyle=g;x.fillRect(0,0,W,HH);
  x.strokeStyle='rgba(255,255,255,.05)';x.lineWidth=1;for(let i=0;i<W;i+=34){x.beginPath();x.moveTo(i,0);x.lineTo(i,HH);x.stroke()}for(let j=0;j<HH;j+=34){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
  x.textBaseline='alphabetic';
  if(markImg.complete&&markImg.naturalWidth){const mw=150,mh=mw*markImg.naturalHeight/markImg.naturalWidth;x.globalAlpha=.9;x.drawImage(markImg,W-P-mw,P+6,mw,mh);x.globalAlpha=1}
  x.fillStyle='#86A8FF';x.font=F(24,700);x.fillText(state.settings.shop||'미용실',P,P+30);
  x.fillStyle='#FFFFFF';x.font=F(46,800);x.fillText(`${mlabel(ui.month)} 정산내역`,P,P+104);
  x.fillStyle='#A7B6D8';x.font=F(28,500);x.fillText(`${st.name||''}${st.kind==='designer'?' 디자이너':''}님`,P,P+156);
  let y=HH+40+LH-22;
  for(const r of rows){
    if(r.t==='sep'){x.fillStyle=C.line;x.fillRect(P,y-34,W-P*2,2);y+=LH/2;continue}
    const b=r.t==='b';
    x.font=F(28,b?700:500);x.fillStyle=b?C.ink:C.mute;x.fillText(r.k,P,y);
    x.font=F(28,b?800:600);x.fillStyle=b?C.pri:C.ink;x.textAlign='right';x.fillText(r.v,W-P,y);x.textAlign='left';
    x.fillStyle=C.line;x.fillRect(P,y+22,W-P*2,2);y+=LH;
  }
  y+=14;rr(P,y,W-P*2,150,28);x.fillStyle=C.soft;x.fill();
  x.fillStyle=C.pri;x.font=F(26,700);x.fillText(data.totalLabel,P+32,y+52);
  x.font=F(58,800);x.textAlign='right';x.fillText(data.total,W-P-32,y+118);x.textAlign='left';
  y+=150+70;
  /* 아래 로고: 흰 바탕용 ZB 마크 + 글자 로고 (이미지를 못 불러오면 글자로) */
  {const ok=i=>i.complete&&i.naturalWidth,mh=34,wh=19;
   const lw=ok(markLightImg)?Math.round(mh*markLightImg.naturalWidth/markLightImg.naturalHeight):0;
   if(ok(wordLightImg)){const ww=Math.round(wh*wordLightImg.naturalWidth/wordLightImg.naturalHeight),sx=(W-(lw?lw+16:0)-ww)/2;
     if(lw)x.drawImage(markLightImg,sx,y-28,lw,mh);x.drawImage(wordLightImg,sx+(lw?lw+16:0),y-11-wh/2,ww,wh);}
   else{x.font=F(24,800);const w1=x.measureText('ZERO ').width,w2=x.measureText('BALANCE').width,sx=(W-(lw?lw+14:0)-w1-w2)/2;
     if(lw)x.drawImage(markLightImg,sx,y-28,lw,mh);const tx=sx+(lw?lw+14:0);x.fillStyle=C.ink;x.fillText('ZERO',tx,y);x.fillStyle=C.pri;x.fillText('BALANCE',tx+w1,y);}}
  return cv;
}

function copyText(t){
  const done=()=>toast('복사했어요');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));return}
  fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done()}catch(e){toast('복사할 수 없어요. 직접 선택해 복사하세요.')}ta.remove();
}
let toastT;
function toast(msg){
  const old=$('.toast');if(old)old.remove();
  const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);
  clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200);
}

/* ---------- 백업 ---------- */
function prepImport(txt){
  const p=parseBackup(txt);if(!p)return null;
  if(p.state.sample){toast('예시 데이터가 든 백업이라 합칠 수 없어요.');return null}
  const base=state.sample?defaults():state;
  p.merge=mergeState(base,deepMerge(defaults(),p.state));
  return p;
}
function backupJSON(){return JSON.stringify({app:'ZeroBalance',backup:1,exportedAt:new Date().toISOString(),state})}
function markBackup(){meta.lastBackup=new Date().toISOString();metaSave();if(ui.tab==='home'||ui.tab==='more'||ui.view==='settings')render(true)}
function parseBackup(txt){
  try{
    let o=JSON.parse(String(txt||'').trim());let when='';
    /* 예전 이름(CLOSING)으로 만든 백업도 그대로 열려요 */
    if(o&&(o.app==='ZeroBalance'||o.app==='CLOSING')&&o.state){when=o.exportedAt||'';o=o.state}
    if(!o||o.v!==1||typeof o.months!=='object'||!Array.isArray(o.staff))return null;
    const mk=Object.keys(o.months).sort();
    const info=(when?'백업한 날: '+when.slice(0,10)+' · ':'')+(o.settings&&o.settings.shop?'상호: '+o.settings.shop+' · ':'')+'기록된 달 '+mk.length+'개'+(mk.length?' ('+mlabel(mk[0])+(mk.length>1?' ~ '+mlabel(mk[mk.length-1]):'')+')':'')+' · 직원 '+o.staff.length+'명';
    return {state:o,info};
  }catch(e){return null}
}
async function backupShare(){
  const txt=backupJSON(),name='ZeroBalance_backup_'+todayStr()+'.json';
  let file=null;
  try{
    if(navigator.canShare){
      for(const [nm,ty] of [[name,'application/json'],[name.replace(/\.json$/,'.txt'),'text/plain']]){
        try{const f=new File([txt],nm,{type:ty});if(navigator.canShare({files:[f]})){file=f;break}}catch(e){}
      }
    }
    if(file&&navigator.share){
      await navigator.share({files:[file],title:'ZeroBalance 기록'});markBackup();toast('백업했어요');return;
    }
  }catch(e){if(e&&e.name==='AbortError'){toast('백업을 취소했어요');return}}
  try{
    const blob=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);markBackup();toast('백업 파일을 저장했어요');
  }catch(e){toast('파일로 저장할 수 없어요. 백업 내용 복사를 이용하세요.')}
}
/* ---------- 이벤트 ---------- */
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.path)return;
  if(el.type==='checkbox'||el.tagName==='SELECT')return;
  if(el.dataset.t==='money')fmtLive(el);
  commit(el);live();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='dayPick'){const v=el.value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ui.day=v;ui.month=v.slice(0,7);ui.confirmDel=null;ui.moreAll=false;render(true)}return}
  if(el.id==='restoreFile'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const p=prepImport(r.result);if(p){ui.pendingRestore=p;render(true)}else{toast('ZeroBalance 백업 파일이 아니거나 손상된 파일이에요.');el.value=''}};r.onerror=()=>toast('파일을 읽지 못했어요.');r.readAsText(f);return}
  if(!el.dataset||!el.dataset.path)return;
  if(el.type==='checkbox'||el.tagName==='SELECT'){commit(el);if(el.dataset.rr)render(true);else live()}
});
document.addEventListener('focusout',e=>{
  const el=e.target;if(el.dataset&&el.dataset.t==='money'){let v=parseMoney(el.value);
    /* 월 매출 칸은 '오늘 마감'에 넣은 금액을 포함한 합계라서, 그보다 적게는 둘 수 없다 */
    if(el.dataset.scope==='month'&&/^sales\./.test(el.dataset.path||'')){
      const c=el.dataset.path.slice(6),m=getMonth(),ds=Object.values(m.days||{}).reduce((t,o)=>t+n(o[c]),0);
      if(v<ds){v=ds;setPath(m,el.dataset.path,v);stamp('mm:'+ui.month);save();live();toast('오늘 마감에 넣은 금액('+wonT(ds)+')보다 적게는 못 넣어요. 그 금액으로 맞췄어요.')}
    }
    el.value=v?fmt(v):''}
});
/* 금액 입력 중에도 1,000 단위 쉼표를 넣고 커서 위치는 유지 */
function fmtLive(el){
  try{
    const pos=el.selectionStart==null?el.value.length:el.selectionStart,digits=el.value.slice(0,pos).replace(/[^\d]/g,'').length;
    const v=parseMoney(el.value),out=v?fmt(v):'';if(out===el.value)return;el.value=out;
    let i=0,c=0;while(i<out.length&&c<digits){if(/\d/.test(out[i]))c++;i++}
    el.setSelectionRange(i,i);
  }catch(e){}
}
function addFocus(sel){const el=$(sel);if(el)el.focus()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const d=b.dataset;
  switch(d.act){
    case 'tab':
      if(d.tab==='sales'||d.tab==='exp'){ui.tab='input';ui.inSub=d.tab}
      else if(d.tab==='aid'){ui.tab='aid'}
      else ui.tab=d.tab;
      ui.view=null;ui.confirmDel=null;ui.pendingRestore=null;render(false);break;
    case 'inSub':ui.inSub=d.val;ui.confirmDel=null;render(false);break;
    case 'goDay':ui.tab='input';ui.inSub='day';ui.day=todayStr();ui.month=todayStr().slice(0,7);ui.view=null;render(false);break;
    case 'goAid':ui.tab='aid';ui.view=null;render(false);break;
    case 'taxView':ui.taxView=d.val;render(false);break;
    case 'goYear':ui.tab='tax';ui.taxView='year';ui.view=null;render(false);break;
    case 'goMonth':ui.month=d.val;ui.taxView='month';render(false);break;
    case 'goBackup':{const el=$('#backup');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break}
    case 'pickDay':ui.day=d.val;ui.confirmDel=null;ui.moreAll=false;render(true);break;
    case 'moreCh':ui.moreAll=true;render(true);break;
    case 'delDay':
      if(ui.confirmDel==='day:'+d.val){delDay(d.val);stamp('day:'+d.val);ui.confirmDel=null;save();toast('삭제했어요. 월 합계에서도 빠졌어요.');render(true)}
      else{ui.confirmDel='day:'+d.val;render(true)}break;
    case 'installLater':meta.installLater=new Date().toISOString();metaSave();render(true);break;
    case 'backupShare':backupShare();break;
    case 'restoreYes':{const pr=ui.pendingRestore;if(pr){state=deepMerge(defaults(),pr.state);ensureLegacyCH();ui.pendingRestore=null;ui.open={};ui.day='';flush();toast('백업으로 되돌렸어요');ui.view=null;ui.tab='home';render(false)}break}
    case 'restoreNo':ui.pendingRestore=null;render(true);break;
    case 'mergeYes':{const pr=ui.pendingRestore;if(!pr||!pr.merge)break;
      state=deepMerge(defaults(),pr.merge.state);ensureLegacyCH();ui.pendingRestore=null;ui.day='';
      meta.lastMerge=new Date().toISOString();metaSave();flush();
      toast(pr.merge.changed?'합쳤어요. 이 기기에서 다시 보내면 양쪽이 똑같아져요':'이미 같은 내용이라 바뀐 게 없어요');render(true);break}
    case 'restoreAll':if(ui.pendingRestore){ui.pendingRestore.full=true;render(true)}break;
    case 'pasteBox':ui.pasteOpen=!ui.pasteOpen;render(true);break;
    case 'mprev':ui.month=shiftMonth(ui.month,-1);ui.copyOpen=false;ui.copySel=null;render(false);break;
    case 'mnext':ui.month=shiftMonth(ui.month,1);ui.copyOpen=false;ui.copySel=null;render(false);break;
    case 'settings':ui.view='settings';ui.confirmReset=false;render(false);break;
    case 'settingsAdv':ui.view='settings';ui.confirmReset=false;ui.advOpen=true;render(false);break;
    case 'advToggle':ui.advOpen=!ui.advOpen;render(true);break;
    case 'syncToggle':ui.syncOpen=!ui.syncOpen;render(true);break;
    case 'back':ui.view=null;render(false);break;
    case 'seg':{const t=target(b);if(t){setPath(t.obj,t.path,d.val);if(t.path==='mode'&&d.val==='tier'&&!(Array.isArray(t.obj.tiers)&&t.obj.tiers.length))t.obj.tiers=DEFAULT_TIERS.map(x=>({...x}));if(t.path==='mat'&&d.val==='pct'&&t.obj.matPct==null)t.obj.matPct=10;stamp(unitOf(b));save();render(true)}break}
    case 'addItem':{
      const m=getMonth(),id=uid();
      m[d.list].push(d.list==='purchases'?{id,name:d.name||'',amt:0,taxable:true}:{id,name:d.name||'',amt:0});
      stamp((d.list==='purchases'?'pur:':'exp:')+ui.month);save();render(true);
      addFocus(`[data-id="${id}"][data-path="${d.name?'amt':'name'}"]`);break}
    case 'delItem':{const m=getMonth();m[d.list]=m[d.list].filter(i=>i.id!==d.id);stamp((d.list==='purchases'?'pur:':'exp:')+ui.month);save();render(true);break}
    case 'addStaff':{
      const id=uid();
      state.staff.push(d.kind==='designer'?{id,kind:'designer',name:'',rate:40,base:0,vat:'on',feeDeduct:true,tip:false}:{id,kind:'worker',name:'',type:'monthly',rate:0,deduct:'ins'});
      ui.open[id]=true;stamp('staff:'+id);save();render(true);addFocus(`[data-id="${id}"][data-path="name"]`);break}
    case 'tierAdd':case 'tierDel':{
      const st=state.staff.find(s=>s.id===d.id);if(!st)break;
      let t=(Array.isArray(st.tiers)&&st.tiers.length?st.tiers:DEFAULT_TIERS).map(x=>({upto:n(x.upto),rate:n(x.rate)}));
      if(d.act==='tierAdd'&&t.length<5){const pv=t.length>1?t[t.length-2]:{upto:0,rate:t[0].rate};const nu=(pv.upto||3000000)+2000000;t.splice(t.length-1,0,{upto:nu,rate:t[t.length-1].rate})}
      if(d.act==='tierDel'&&t.length>2){t.splice(t.length-2,1)}
      st.tiers=t;stamp('staff:'+st.id);save();render(true);break}
    case 'toggleStaff':ui.open[d.id]=!ui.open[d.id];ui.confirmDel=null;render(true);break;
    case 'delStaff':
      if(ui.confirmDel===d.id){state.staff=state.staff.filter(s=>s.id!==d.id);stamp('staff:'+d.id);ui.confirmDel=null;save();render(true)}
      else{ui.confirmDel=d.id;render(true)}break;
    case 'settle':ui.modal={type:'settle',id:d.id};render(true);break;
    case 'closeModal':if(b.classList.contains('over')&&e.target!==b)break;ui.modal=null;render(true);break;
    case 'shareImg':{const st=state.staff.find(s=>s.id===d.id);if(st)shareImage(st);break}
    case 'copySettle':{const st=state.staff.find(s=>s.id===d.id);if(st)copyText(settleText(st));break}
    case 'pinKey':pinPress(d.val);break;
    case 'missGo':ui.tab='input';ui.inSub='day';ui.day=d.val;ui.month=d.val.slice(0,7);ui.view=null;render(false);break;
    case 'missOff':meta.closedDays=meta.closedDays||{};for(const x of String(d.val).split(','))meta.closedDays[x]=1;metaSave();render(true);break;
    case 'missNever':meta.noMiss=true;metaSave();toast('마감 알림을 껐어요');render(true);break;
    case 'staffAdv':{const st=state.staff.find(x=>x.id===d.id);if(!st)break;ui.adv=ui.adv||{};ui.adv[d.id]=!advOpen(st);render(true);break}
    case 'staffMore':ui.smore=ui.smore||{};ui.smore[d.id]=true;render(true);break;
    case 'copyOpen':ui.copyOpen=true;ui.copySel=null;render(true);break;
    case 'copyClose':ui.copyOpen=false;ui.copySel=null;render(true);break;
    case 'copyTog':{const c=copyItems();if(!c)break;const x=c.items.find(i=>i.key===d.val);if(!x)break;ui.copySel=ui.copySel||{};const cur=d.val in ui.copySel?ui.copySel[d.val]:!x.exists;ui.copySel[d.val]=!cur;render(true);break}
    case 'copyDo':copyDo();break;
    case 'lockNow':lockNow();break;
    case 'lockForgot':ui.lockForgot=1;ui.pinIn='';render(true);break;
    case 'lockBack':ui.lockForgot=0;render(true);break;
    case 'lockWipe':
      if(ui.lockForgot!==2){ui.lockForgot=2;render(true);break}
      try{localStorage.removeItem(KEY)}catch(e){}
      state=defaults();lock=null;lockSave();ui.locked=false;ui.lockForgot=0;ui.tab='home';ui.view=null;flush();
      render(false);toast('기록을 지우고 잠금을 풀었어요. 백업 파일이 있으면 더보기에서 되돌릴 수 있어요.');break;
    case 'pinSet':pinSet();break;
    case 'pinChange':ui.pinChange=true;render(true);break;
    case 'pinChangeNo':ui.pinChange=false;render(true);break;
    case 'pinOffAsk':ui.pinOff=true;render(true);break;
    case 'pinOffNo':ui.pinOff=false;render(true);break;
    case 'pinOff':pinOff();break;
    case 'lockAfter':if(lock){lock.after=Number(d.val);lockSave();render(true)}break;
    case 'goLock':ui.view='settings';render(false);setTimeout(()=>{const el=$('#lockcard');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},30);break;
    case 'fbCat':{const box=$('#fbText');ui.fbText=box?box.value:'';ui.fbCat=d.val;render(true);break}
    case 'fbSend':fbSend();break;
    case 'goFb':ui.tab='more';ui.view=null;render(false);setTimeout(()=>{const el=$('#fb');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},30);break;
    case 'sample':if(anyData()){toast('이미 기록이 있어서 예시를 불러오지 않았어요.');break}loadSample();render(false);break;
    case 'clearSample':state.months={};state.staff=[];state.settings.shop='';state.sample=false;state.stamp={};save();render(false);break;
    case 'backupCopy':copyText(backupJSON());markBackup();break;
    case 'restore':{
      const box=$('#restoreBox');const r=prepImport(box?box.value:'');
      if(r){ui.pendingRestore=r;render(true)}else toast('백업 내용을 읽을 수 없어요. 전체를 다시 복사해 붙여넣어 주세요.');break}
    case 'reset':
      if(ui.confirmReset){state=defaults();ui.confirmReset=false;ui.open={};ui.view=null;ui.modal=null;save();toast('모든 데이터를 지웠어요');render(false)}
      else{ui.confirmReset=true;render(true)}break;
  }
});
document.addEventListener('keydown',e=>{
  if(ui.locked&&!ui.lockForgot){if(/^\d$/.test(e.key)){e.preventDefault();pinPress(e.key)}else if(e.key==='Backspace'){e.preventDefault();pinPress('back')}return}
  if(e.key==='Escape'&&ui.modal){ui.modal=null;render(true)}});

window.__app={get lock(){return lock},pinHash,pinPress,lockNow,calcYear,canon,mergeState,prepImport,stamp,setDayVal,delDay,parseBackup,backupJSON,get meta(){return meta},safetyCards,pickDay,todayStr,drawSettlePng:st=>{const c=drawSettle(st);return c?c.toDataURL('image/png'):null},get state(){return state},ui,calcStaff,calcTax,laborOf,salesTotal,incomeTaxAnnual,settleData,render,loadSample,getMonth};
try{const q=new URLSearchParams(location.search);
  if(q.has('sample')){if(!anyData()){loadSample();ui.tab='home'}history.replaceState(null,'',location.pathname)}}catch(e){}
ui.locked=!!lock;
render(false);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
