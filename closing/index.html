<style>
/* Quiet luxury: matte black / warm ivory / champagne gold. Sharp 2px corners, hairlines, serif numerals. */
:root{
  --bg:#0E0E0D;--panel:#161615;--panel2:#1E1E1C;--ink:#EDE9E0;--mute:#9B968A;--line:#2C2B27;
  --gold:#C9B27C;--gold-ink:#0E0E0D;--ok:#8CC5A6;--warn:#DDAA62;--bad:#DE8C7C;
  --c1:#C9B27C;--c2:#8F8B80;--c3:#5E5B53;--c4:#B7A58A;--c5:#7A6F58;--c6:#EDE9E0;
  --serif:"Didot","Bodoni 72","Hoefler Text","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --gt:#C9B27C;--r:2px;--rp:99px;--bw:1px;--shadow:none;--btnb:0 solid transparent;--btns:none;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{--bg:#F2F0EA;--panel:#FFFFFF;--panel2:#EAE7DF;--ink:#151513;--mute:#6C675C;--line:#D8D3C7;
    --gold:#86692A;--gold-ink:#FFFFFF;--ok:#2D6A4C;--warn:#92580F;--bad:#A03A2C;
    --gt:#86692A;--c1:#86692A;--c2:#8A867B;--c3:#BDB8AC;--c4:#6E5A33;--c5:#A89A78;--c6:#151513;color-scheme:light}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);
  padding-bottom:calc(132px + env(safe-area-inset-bottom,0px));
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.brand{font-size:12px;letter-spacing:.18em;color:var(--mute)}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{background:none;border:0;padding:8px 10px;color:var(--mute);font-size:18px;line-height:1}
.mnav b{font-weight:500;min-width:92px;text-align:center;letter-spacing:.02em}
.gear{background:none;border:0;color:var(--mute);font-size:13px;letter-spacing:.04em;padding:8px 0 8px 10px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:flex;padding:0}
.tabbar button{flex:1;background:none;border:0;padding:15px 0 13px;font-size:12.5px;color:var(--mute);position:relative;letter-spacing:.03em}
.tabbar button[aria-current=page]{color:var(--ink)}
.tabbar button[aria-current=page]::after{content:"";position:absolute;left:30%;right:30%;top:-1px;height:2px;background:var(--gold)}
.card{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:18px 16px;margin-top:14px;box-shadow:var(--shadow)}
.card.plain{background:transparent}
h1,h2,h3{margin:0}
.sec{font-size:12px;letter-spacing:.14em;color:var(--gt);font-weight:600;margin-bottom:12px}
.ttl{font-size:20px;font-weight:500;letter-spacing:-.01em;margin:22px 0 2px}
.sub{color:var(--mute);font-size:13.5px}
.num{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;letter-spacing:.01em}
.big{font-family:var(--serif);font-size:42px;line-height:1.1;font-weight:400;font-variant-numeric:lining-nums tabular-nums}
.big small{font-family:var(--sans);font-size:15px;color:var(--mute);margin-left:4px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{color:var(--mute);font-size:14px}
.row .v{font-size:17px;text-align:right;white-space:nowrap}
.row.strong .k{color:var(--ink)}
.row.strong .v{font-size:20px;color:var(--gt)}
.row.mute .v{color:var(--mute)}
.inp{width:100%;background:var(--panel2);border:var(--bw) solid var(--line);color:var(--ink);padding:11px 12px;font:inherit;font-size:16px;border-radius:var(--r);text-align:right;min-width:0}
.inp.txt{text-align:left}
textarea.inp{text-align:left;min-height:84px;resize:vertical;line-height:1.5}
.inp:focus,button:focus-visible,select:focus-visible{outline:1px solid var(--gold);outline-offset:1px;border-color:var(--gt)}
select.inp{text-align:left}
.fld{display:grid;gap:6px;font-size:12.5px;color:var(--mute);min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stk{display:grid;gap:12px}
.btn{background:var(--gold);color:var(--gold-ink);border:var(--btnb);box-shadow:var(--btns);padding:12px 16px;font-weight:600;border-radius:var(--r);letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--ink);border:var(--bw) solid var(--line);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:13.5px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:9px 6px;font-size:13.5px}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);font-weight:600}
.pill{font-size:11.5px;padding:2px 9px;border:1px solid var(--line);border-radius:var(--rp);color:var(--mute);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.note{font-size:12.5px;color:var(--mute);line-height:1.65}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:transparent;border:var(--bw) solid var(--line);color:var(--mute);padding:6px 11px;font-size:13px;border-radius:var(--rp)}
.item{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .chk{grid-column:1/-1}
.x{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;padding:6px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--mute)}
.chk input{width:18px;height:18px;accent-color:var(--gt);margin:0}
.stack{display:flex;height:10px;gap:2px;margin:6px 0 14px}
.stack i{display:block;height:100%;min-width:2px}
.sw{display:inline-block;width:9px;height:9px;margin-right:8px;vertical-align:middle}
.trend{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:6px}
.trend .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.trend .bars{display:flex;align-items:flex-end;gap:3px;height:100px;width:100%;justify-content:center}
.trend .bars i{display:block;width:40%;max-width:18px;background:var(--c3)}
.trend .bars i.b{background:var(--gold)}
.trend span{font-size:11.5px;color:var(--mute)}
.staffhead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left}
.staffhead .nm{font-size:16.5px;font-weight:500}
.hr{height:1px;background:var(--line);margin:14px 0}
.over{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--panel);box-shadow:var(--shadow);border:var(--bw) solid var(--line);width:100%;max-width:440px;max-height:100%;overflow:auto;padding:20px 18px;border-radius:var(--r)}
.modal img{width:100%;display:block;margin:10px 0}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-size:13.5px;z-index:30;border-radius:var(--r);max-width:86%;text-align:center}
pre.draft{white-space:pre-wrap;word-break:keep-all;font:13.5px/1.75 var(--sans);margin:0;color:var(--ink)}
.empty{text-align:center;padding:26px 6px}
.wf{display:grid;grid-template-columns:90px 1fr 110px;gap:8px;align-items:center;padding:7px 0;font-size:13.5px}
.wf .bar{height:8px;background:var(--panel2);position:relative}
.wf .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c2)}
.wf .bar i.g{background:var(--gold)}
.wf .v{text-align:right}
a{color:var(--gt)}

.aiout{white-space:pre-wrap;word-break:keep-all;font-size:14.5px;line-height:1.8;margin:0}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.install{counter-reset:s}
.install li{margin:0 0 8px;font-size:14px}

/* ===== 데이터 보호 · 일별 입력 · 더보기 ===== */
.alert{border-left:4px solid var(--gt)!important}
.alert .at{font-weight:800;font-size:15px;margin:0 0 6px}
.steps{margin:8px 0 12px;padding-left:20px;font-size:14px;line-height:1.75}
.dayhead{display:flex;gap:10px;align-items:center}
.dayhead .inp{text-align:left;flex:1}
.daylist .row{cursor:pointer}
.daylist .row.on .k{color:var(--gt);font-weight:800}
.menu{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px dashed var(--line);padding:15px 0;text-align:left;color:var(--ink);font-size:15.5px}
.menu:last-child{border-bottom:0}
.menu span.d{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.menu i{font-style:normal;color:var(--mute)}
.linkback{background:none;border:0;color:var(--mute);font-size:13px;padding:14px 0 0}
.toggle{background:none;border:0;color:var(--gt);font-size:13.5px;padding:8px 0;font-weight:700}
/* 하단 탭: 오른쪽 아래 'Powered by Netlify' 배지에 가리지 않게 위로 올림 */
.tabbar{padding-bottom:max(64px,calc(env(safe-area-inset-bottom,0px) + 30px))}
/* ===== CLOSING · RECEIPT ===== */
main.wrap::before{display:block;content:"CLOSING";margin-top:18px}
html[data-skin=receipt]{--bg:#DAD6CD;--panel:#FFFEFA;--panel2:#F4F2EC;--ink:#1A1A1A;--mute:#6E6C66;--line:#BDB9AF;

html[data-skin=receipt] .card::after{bottom:-9px;background-image:linear-gradient(45deg,transparent 50%,var(--panel) 50%),linear-gradient(-45deg,transparent 50%,var(--panel) 50%);background-image:linear-gradient(315deg,transparent 50%,var(--panel) 50%),linear-gradient(45deg,transparent 50%,var(--panel) 50%)}
html[data-skin=receipt] .sec{text-align:center;color:var(--ink);letter-spacing:.08em;font-size:12px;font-weight:800;padding-bottom:10px;border-bottom:1px dashed var(--ink)}
html[data-skin=receipt] .sec::before{content:"[ "}html[data-skin=receipt] .sec::after{content:" ]"}
html[data-skin=receipt] .big{text-align:center;font-weight:800;font-size:40px;letter-spacing:-.04em;color:var(--gt)}

<script>
(()=>{
'use strict';

const RECEIPT_CH=['cashReceipt','card','naverPay','naverDeposit','kakaoPay','local']; // 발행세액공제 대상 추정

const n=v=>{v=Number(v);return isFinite(v)?v:0};
const fmt=v=>String(Math.round(n(v))).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const won=v=>fmt(v)+'<small>원</small>';
const wonT=v=>fmt(v)+'원';
const pc=v=>(Math.round(n(v)*10)/10)+'%';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

const shiftMonth=(k,d)=>{const [y,m]=k.split('-').map(Number);return ym(new Date(y,m-1+d,1))};

function deepMerge(a,b){
  if(Array.isArray(b)||typeof b!=='object'||b===null) return b;
  const o=Array.isArray(a)?[]:Object.assign({},a);
  for(const k in b){o[k]=(a&&typeof a[k]==='object'&&!Array.isArray(a[k]))?deepMerge(a[k],b[k]):b[k]}
  return o;
}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===1)return deepMerge(defaults(),s)}catch(e){}
  return defaults();
}

const DAY_MS=86400000;
function daysSince(iso){if(!iso)return Infinity;const t=Date.parse(iso);return isFinite(t)?Math.floor((Date.now()-t)/DAY_MS):Infinity}

const ui={inSub:'day',day:'',moreAll:false,pendingRestore:null,month:ym(new Date()),view:null,open:{},sub:'save',modal:null,confirmDel:null,confirmReset:false,aiOut:'',aiErr:'',aiBusy:false};

/* ---------- 일별 입력 ---------- */
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const WD=['일','월','화','수','목','금','토'];
const dayLabel=ds=>{const [y,m,d]=ds.split('-').map(Number);return m+'월 '+d+'일 ('+WD[new Date(y,m-1,d).getDay()]+')'};
const dayTotal=o=>CH.reduce((t,[k])=>t+n((o||{})[k]),0);
function pickDay(){
  const k=ui.month,t=todayStr();
  if(ui.day&&ui.day.slice(0,7)===k)return ui.day;
  if(t.slice(0,7)===k)return ui.day=t;
  const ds=Object.keys(M(k).days||{}).sort();
  return ui.day=ds.length?ds[ds.length-1]:k+'-01';
}
function setDayVal(ds,ch,v){
  const m=getMonth(ds.slice(0,7));m.days=m.days||{};
  const d=m.days[ds]||(m.days[ds]={});
  const old=n(d[ch]);v=Math.max(0,Math.round(n(v)));
  m.sales[ch]=Math.max(0,n(m.sales[ch])+v-old);
  if(v)d[ch]=v;else delete d[ch];
  if(!Object.keys(d).length)delete m.days[ds];
}
function delDay(ds){
  const m=getMonth(ds.slice(0,7)),d=(m.days||{})[ds];if(!d)return;
  for(const ch of Object.keys(d))m.sales[ch]=Math.max(0,n(m.sales[ch])-n(d[ch]));
  delete m.days[ds];
}
/* ---------- 계산: 매출/지출 ---------- */
const salesTotal=m=>CH.reduce((t,[k])=>t+n(m.sales[k]),0);
const feeOf=(m,k)=>n(m.sales[k])*n(state.settings.fees[k])/100;
const feeTotal=m=>CH.reduce((t,[k])=>t+feeOf(m,k),0);
const purchTotal=m=>m.purchases.reduce((t,i)=>t+n(i.amt),0);
const purchTaxable=m=>m.purchases.reduce((t,i)=>t+(i.taxable!==false?n(i.amt):0),0);
const purchVat=m=>purchTaxable(m)/11;
const purchSupply=m=>m.purchases.reduce((t,i)=>t+(i.taxable!==false?n(i.amt)/1.1:n(i.amt)),0);
const expTotal=m=>m.expenses.reduce((t,i)=>t+n(i.amt),0);

/* ---------- 계산: 직원 ---------- */
function tierList(st){
  const raw=Array.isArray(st.tiers)&&st.tiers.length?st.tiers:DEFAULT_TIERS;
  const t=raw.map((x,i)=>({upto:i===raw.length-1?Infinity:Math.max(0,n(x.upto)),rate:Math.max(0,n(x.rate))}));
  for(let i=1;i<t.length;i++)if(t[i].upto<t[i-1].upto)t[i].upto=t[i-1].upto;
  return t;
}
function tierIncentive(base,st){
  const t=tierList(st);
  if(st.tierWay==='prog'){
    let inc=0,prev=0;
    for(const x of t){const part=Math.max(0,Math.min(base,x.upto)-prev);inc+=part*x.rate/100;prev=x.upto;if(base<=x.upto)break}
    inc=Math.round(inc);
    return {inc,txt:'구간별 계산'+(base>0?' · 평균 '+pc(inc/base*100):'')};
  }
  const x=t.find(x=>base<=x.upto)||t[t.length-1];
  return {inc:Math.round(base*x.rate/100),txt:'구간 '+pc(x.rate)};
}
function calcStaff(st,key){
  const m=M(key),inp=m.pay[st.id]||{},S=state.settings;
  if(st.kind==='designer'){
    const sales=inp.sales||{};let gross=0,net=0;
    for(const [k] of CH){const a=n(sales[k]);gross+=a;net+=st.feeDeduct===false?a:a*(1-n(S.fees[k])/100)}
    const base0=st.vat==='off'?net:net/1.1;
    const matDed=Math.min(base0,st.mat==='pct'?Math.round(base0*n(st.matPct)/100):st.mat==='amt'?Math.max(0,n(inp.mat)):0);
    const base=Math.max(0,base0-matDed);
    const ti=st.mode==='tier'?tierIncentive(base,st):{inc:Math.round(base*n(st.rate)/100),txt:pc(n(st.rate))};
    const incentive=ti.inc;
    const prodSales=Math.max(0,n(inp.prod)),prodInc=Math.round((st.vat==='off'?prodSales:prodSales/1.1)*n(st.prodRate)/100);
    const earned=incentive+prodInc,baseAmt=Math.max(0,n(st.base));
    const topup=st.baseWay==='max'?Math.max(0,baseAmt-earned):0;
    const fixed=st.baseWay==='max'?0:baseAmt;
    const pay=Math.max(0,fixed+earned+topup+n(inp.extra)-n(inp.deduct));
    const tax=floor10(pay*0.03)+floor10(pay*0.003);
    const tip=st.tip?n(inp.tip):0;
    const tipTax=st.tip?floor10(tip*0.05)+floor10(tip*0.005):0;
    return {kind:'designer',sales:gross,net,base0,matDed,base,incentive,rateTxt:ti.txt,prodSales,prodInc,fixed,topup,pay,tax,ded:tax,takeHome:pay-tax,tip,tipTax,tipHome:tip-tipTax,
      total:pay-tax+tip-tipTax,cost:pay,employer:0,wh:tax+tipTax,
      pension:0,health:0,ltc:0,emp:0,itax:0,ltax:0,tax33:tax};
  }
  const dim=daysIn(key);let gross=0,ratio=1,from=1,to=dim;
  if(st.type==='hourly')gross=n(st.rate)*n(inp.hours);
  else if(st.type==='daily')gross=n(st.rate)*n(inp.days);
  else{
    from=Math.min(dim,Math.max(1,Math.round(n(inp.startDay))||1));
    to=Math.min(dim,Math.max(1,Math.round(n(inp.endDay))||dim));
    ratio=to>=from?(to-from+1)/dim:0;
    gross=Math.round(n(st.rate)*ratio);
  }
  gross=Math.max(0,gross+n(inp.extra)-n(inp.deduct));
  const I=S.ins;let pension=0,health=0,ltc=0,emp=0,itax=0,ltax=0,tax33=0,employer=0;
  if(st.deduct==='ins'){
    pension=floor10(gross*n(I.pension)/100);
    health=floor10(gross*n(I.health)/100);
    ltc=floor10(health*n(I.ltc)/100);
    emp=floor10(gross*n(I.emp)/100);
    itax=floor10(n(inp.incomeTax));
    ltax=floor10(itax*0.1);
    employer=floor10(gross*n(I.pension)/100)+floor10(gross*n(I.health)/100)+floor10(floor10(gross*n(I.health)/100)*n(I.ltc)/100)+floor10(gross*n(I.empEr)/100)+floor10(gross*n(I.accident)/100);
  }else if(st.deduct==='tax33'){
    tax33=floor10(gross*0.03)+floor10(gross*0.003);
  }
  const ded=pension+health+ltc+emp+itax+ltax+tax33;
  return {kind:'worker',pay:gross,ratio,from,to,dim,pension,health,ltc,emp,itax,ltax,tax33,ded,takeHome:gross-ded,
    total:gross-ded,cost:gross,employer,tip:0,tipTax:0,tipHome:0,sales:0,net:0,base:0,incentive:0,
    wh:tax33+itax+ltax};
}
function laborOf(key){
  let pay=0,er=0,tip=0,wh=0;
  for(const st of state.staff){const r=calcStaff(st,key);pay+=r.cost;er+=r.employer;tip+=r.tip;wh+=r.wh}
  return {pay,er,tip,wh,total:pay+er};
}

/* ---------- 계산: 세금 ---------- */
const BRK=[[14e6,.06,0],[50e6,.15,1.26e6],[88e6,.24,5.76e6],[150e6,.35,15.44e6],[300e6,.38,19.94e6],[500e6,.40,25.94e6],[1e9,.42,35.94e6],[Infinity,.45,65.94e6]];
function incomeTaxAnnual(x){if(x<=0)return 0;for(const [lim,r,d] of BRK){if(x<=lim)return Math.round(x*r-d)}return 0}
function marginal(x){for(const [lim,r] of BRK){if(x<=lim)return r}return .45}
function calcTax(key){
  const m=M(key),S=state.settings;
  const sales=salesTotal(m),pt=purchTotal(m),ex=expTotal(m),lab=laborOf(key),fee=feeTotal(m);
  const supply=sales/1.1,outVat=sales-supply,inVat=purchVat(m);
  const receiptSales=RECEIPT_CH.reduce((t,k)=>t+n(m.sales[k]),0);
  const credit=Math.min(receiptSales*0.013,CARD_CREDIT_CAP/12);
  let rawVat;
  const exempt=S.taxType==='simple'&&sales*12<SIMPLE_EXEMPT;
  if(S.taxType==='simple'){rawVat=exempt?0:sales*0.30*0.10-purchTaxable(m)*0.005-credit}
  else{rawVat=outVat-inVat-credit}
  const vat=Math.max(0,Math.round(rawVat)),refund=Math.max(0,Math.round(-rawVat));
  const profit=supply-purchSupply(m)-ex-lab.total-fee;
  const annualProfit=profit*12;
  const taxable=Math.max(0,annualProfit-n(S.basicDeduction)*10000);
  const itAnnual=incomeTaxAnnual(taxable);
  const itMonthly=Math.round(itAnnual*1.1/12);
  const net=sales-pt-ex-lab.total-fee-vat-itMonthly;
  return {sales,pt,ex,lab,fee,supply,outVat,inVat,receiptSales,credit,rawVat,vat,refund,exempt,profit,annualProfit,taxable,itAnnual,itMonthly,
    net,tax:vat+itMonthly,rate:marginal(taxable)};
}
const isActive=key=>{const m=state.months[key];return !!m&&(salesTotal(m)>0||m.purchases.length||m.expenses.length||Object.keys(m.pay).length)};

/* ---------- 입력 바인딩 ---------- */
function target(el){
  const d=el.dataset;let obj;
  if(d.scope==='month')obj=getMonth();
  else if(d.scope==='set')obj=state.settings;
  else if(d.scope==='staff')obj=state.staff.find(s=>s.id===d.id);
  else if(d.scope==='pay'){const m=getMonth();obj=m.pay[d.id]||(m.pay[d.id]={})}
  else if(d.scope==='plan')obj=state.plan;
  else if(d.scope==='ai')obj=ai;
  else if(d.scope==='item'){obj=getMonth()[d.list].find(i=>i.id===d.id)}
  return obj?{obj,path:d.path}:null;
}
function setPath(o,path,v){const p=path.split('.');for(let i=0;i<p.length-1;i++){o=o[p[i]]||(o[p[i]]={})}o[p[p.length-1]]=v}
function getPath(o,path){return path.split('.').reduce((a,k)=>a==null?undefined:a[k],o)}
function commit(el){
  if(el.dataset.scope==='day'){const ds=pickDay();setDayVal(ds,el.dataset.path,parseMoney(el.value));save();return}
  if(el.dataset.scope==='staff'&&/^tiers\./.test(el.dataset.path||'')){const st=state.staff.find(x=>x.id===el.dataset.id);if(st&&!(Array.isArray(st.tiers)&&st.tiers.length))st.tiers=DEFAULT_TIERS.map(x=>({...x}))}
  const t=target(el);if(!t)return;
  const ty=el.dataset.t;let v=el.value;
  if(el.type==='checkbox')v=el.checked;
  else if(ty==='money')v=parseMoney(v);
  else if(ty==='num'||ty==='pct')v=parseNum(v);
  setPath(t.obj,t.path,v);if(el.dataset.scope==='ai')aiSave();else save();
}
const attrs=(scope,path,extra)=>{extra=extra||{};return `data-scope="${scope}" data-path="${path}"`+(extra.id?` data-id="${extra.id}"`:'')+(extra.list?` data-list="${extra.list}"`:'')+(extra.rr?' data-rr="1"':'')};
const IN={
  money:(scope,path,val,ex)=>`<input class="inp" inputmode="numeric" autocomplete="off" placeholder="0" data-t="money" ${attrs(scope,path,ex)} value="${val?fmt(val):''}">`,
  num:(scope,path,val,ex,ph)=>`<input class="inp" inputmode="decimal" autocomplete="off" placeholder="${ph||'0'}" data-t="num" ${attrs(scope,path,ex)} value="${val?esc(val):''}">`,
  pct:(scope,path,val,ex)=>`<input class="inp" inputmode="decimal" autocomplete="off" placeholder="0" data-t="pct" ${attrs(scope,path,ex)} value="${val||val===0?esc(val):''}">`,
  text:(scope,path,val,ex,ph)=>`<input class="inp txt" type="text" autocomplete="off" placeholder="${esc(ph||'')}" ${attrs(scope,path,ex)} value="${esc(val)}">`,
  area:(scope,path,val,ex,ph)=>`<textarea class="inp" placeholder="${esc(ph||'')}" ${attrs(scope,path,ex)}>${esc(val)}</textarea>`,
  chk:(scope,path,val,label,ex)=>`<label class="chk"><input type="checkbox" ${attrs(scope,path,ex)} ${val?'checked':''}>${label}</label>`,
  seg:(scope,path,val,opts,ex)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-act="seg" ${attrs(scope,path,ex)} data-val="${v}" aria-pressed="${val===v}">${l}</button>`).join('')}</div>`
};
const row=(k,v,cls)=>`<div class="row ${cls||''}"><span class="k">${k}</span><span class="v num">${v}</span></div>`;
const lrow=(k,key,cls)=>`<div class="row ${cls||''}"><span class="k">${k}</span><span class="v num" data-live="${key}"></span></div>`;
const fld=(label,html)=>`<label class="fld"><span>${label}</span>${html}</label>`;

/* ---------- 실시간 갱신 ---------- */
function liveVal(key){
  const p=key.split(':'),k=ui.month,m=M(k);
  switch(p[0]){
    case 'sales':
      if(p[1]==='total')return wonT(salesTotal(m));
      if(p[1]==='fee')return wonT(p[2]?feeOf(m,p[2]):feeTotal(m));
      if(p[1]==='share'){const t=salesTotal(m);return t?pc(n(m.sales[p[2]])/t*100):'-'}
      if(p[1]==='delta'){const a=salesTotal(m),b=salesTotal(M(shiftMonth(k,-1)));return b?((a-b)/b*100>=0?'+':'')+pc((a-b)/b*100)+' (전월 대비)':'전월 데이터 없음'}
      break;
    case 'purch':return wonT(p[1]==='vat'?purchVat(m):purchTotal(m));
    case 'exp':return wonT(expTotal(m));
    case 'labor':{const l=laborOf(k);return wonT(p[1]==='pay'?l.pay:p[1]==='er'?l.er:p[1]==='wh'?l.wh:l.total)}
    case 'sum':{const t=calcTax(k);return wonT(t.pt+t.ex+t.lab.total+t.fee)}
    case 'pay':{const st=state.staff.find(s=>s.id===p[1]);if(!st)return '';const v=calcStaff(st,k)[p[2]];return typeof v==='string'?v:(p[3]==='neg'?'−':'')+wonT(v)}
    case 'pct':return pc(n(state.settings.fees[p[1]]));
    case 'day':{const ds=pickDay();return wonT(dayTotal((M(ds.slice(0,7)).days||{})[ds]))}
    case 'dayrow':{const x=p.slice(1).join(':');return wonT(dayTotal((M(x.slice(0,7)).days||{})[x]))}
    case 'daysum':{const ds=Object.values(M(k).days||{});return wonT(ds.reduce((a,o)=>a+dayTotal(o),0))}
  }
  return '';
}
function live(){document.querySelectorAll('[data-live]').forEach(el=>{
  const v=liveVal(el.dataset.live);
  if(el.classList.contains('big')){el.innerHTML=esc(v).replace(/원$/,'<small>원</small>')}else el.textContent=v;
})}

/* ---------- 화면 ---------- */
function shell(){
  const settings=ui.view==='settings';
  const head=`<header class="top"><div class="wrap">${
    settings?`<button class="gear" style="padding-left:0" data-act="back">← 돌아가기</button><span class="brand">설정</span><span style="width:64px"></span>`
    :`<div class="mnav"><button data-act="mprev" aria-label="이전 달">‹</button><b class="num">${mlabel(ui.month)}</b><button data-act="mnext" aria-label="다음 달">›</button></div><button class="gear" data-act="settings">설정</button>`
  }</div></header>`;
  const body=settings?vSettings():(({home:vHome,input:vInput,pay:vPay,tax:vTax,aid:vAid,more:vMore}[ui.tab])||vHome)();
  const cur=ui.tab==='aid'?'more':ui.tab;
  const tabs=settings?'':`<nav class="tabbar" aria-label="메뉴"><div class="wrap">${TABS.map(([k,l])=>`<button data-act="tab" data-tab="${k}" ${cur===k?'aria-current="page"':''}>${l}</button>`).join('')}</div></nav>`;
  return head+`<main class="wrap v-${settings?'settings':ui.tab}">${body}</main>`+tabs+(ui.modal?vModal():'');
}
function render(keep){
  const y=window.scrollY||0;
  $('#app').innerHTML=shell();
  try{window.scrollTo(0,keep===false?0:y)}catch(e){}
  live();
}
const shopTitle=()=>esc(state.settings.shop||'우리 미용실');

/* 홈 */
function vHome(){
  const k=ui.month,m=M(k),t=calcTax(k);
  const empty=!t.sales&&!state.staff.length&&!m.purchases.length&&!m.expenses.length;
  let h=`<div class="ttl">${shopTitle()}</div><div class="sub">${mlabel(k)} 한눈에 보기</div>`+safetyCards();
  if(k===todayStr().slice(0,7)&&!state.sample){const td=dayTotal((M(k).days||{})[todayStr()]);
    h+=`<div class="card"><div class="sec">오늘 마감 · ${dayLabel(todayStr())}</div>${td?`<div class="row strong"><span class="k">오늘 입력한 매출</span><span class="v num">${wonT(td)}</span></div><div class="btns" style="margin-top:12px"><button class="btn sm ghost" data-act="goDay">수정하기</button></div>`:`<p class="note" style="margin:0 0 12px">하루 끝날 때 카드·현금·계좌 세 칸만 넣으면 돼요.</p><button class="btn block" data-act="goDay">오늘 매출 입력</button>`}</div>`}
  if(state.sample)h+=`<div class="card" style="border-color:var(--gt)"><div class="note" style="color:var(--ink)">지금 보이는 숫자는 <b>예시 데이터</b>예요. 둘러본 뒤 지우고 내 데이터를 입력하세요.</div><div class="btns" style="margin-top:10px"><button class="btn sm" data-act="clearSample">예시 지우기</button></div></div>`;
  if(empty){
    return h+`<div class="card empty"><div class="sec">시작하기</div><p style="margin:0 0 6px;font-size:17px">매출 · 지출 · 급여 세 가지만 입력하면<br>세금과 남는 돈이 자동으로 계산돼요.</p><p class="note" style="margin:0 0 16px">저장은 이 ${DEV} 안에서만 이뤄져요. 백업은 더보기에서 할 수 있어요.</p><div class="btns" style="justify-content:center"><button class="btn ghost" data-act="tab" data-tab="sales">한 달 합계로 입력</button><button class="btn ghost" data-act="sample">예시 데이터로 둘러보기</button></div></div>`;
  }
  h+=`<div class="card"><div class="sec">남는 돈 (세후 추정)</div><div class="big" style="${t.net<0?'color:var(--bad)':''}">${won(t.net)}</div>
  <div class="note" style="margin-top:8px">총매출 ${wonT(t.sales)} · 세금 적립 ${wonT(t.tax)}</div></div>`;
  // 돈의 흐름
  const parts=[['매입',t.pt,'--c2'],['경비',t.ex,'--c3'],['인건비',t.lab.total,'--c4'],['결제 수수료',t.fee,'--c5'],['세금',t.tax,'--c6'],['남는 돈',Math.max(0,t.net),'--c1']];
  const baseAmt=Math.max(t.sales,parts.reduce((a,p)=>a+p[1],0))||1;
  h+=`<div class="card"><div class="sec">매출 100원은 어디로</div><div class="stack">${parts.map(p=>`<i style="width:${p[1]/baseAmt*100}%;background:var(${p[2]})"></i>`).join('')}</div>${
    parts.map(p=>`<div class="row"><span class="k"><span class="sw" style="background:var(${p[2]})"></span>${p[0]}</span><span class="v num" style="font-size:15px">${wonT(p[1])} <span style="color:var(--mute);font-size:13px">${pc(p[1]/baseAmt*100)}</span></span></div>`).join('')}</div>`;
  // 입력 현황
  const hasPay=state.staff.length>0;
  const st=(ok,label,tab)=>`<div class="row"><span class="k">${label}</span>${ok?'<span class="pill ok">입력됨</span>':`<button class="btn sm ghost" data-act="tab" data-tab="${tab}">입력하기</button>`}</div>`;
  h+=`<div class="card"><div class="sec">이번 달 입력 현황</div>${st(t.sales>0,'매출','sales')}${st(m.purchases.length+m.expenses.length>0,'지출 (매입·경비)','exp')}${st(hasPay,'급여 (직원 등록)','pay')}</div>`;
  // 추이
  const keys=[];for(let i=5;i>=0;i--)keys.push(shiftMonth(k,-i));
  const act=keys.filter(isActive);
  if(act.length>=2||(act.length===1)){
    const rows=keys.map(x=>({x,s:isActive(x)?salesTotal(M(x)):0,nt:isActive(x)?Math.max(0,calcTax(x).net):0}));
    const mx=Math.max(1,...rows.map(r=>r.s));
    h+=`<div class="card"><div class="sec">최근 6개월</div><div class="trend">${rows.map(r=>`<div class="col"><div class="bars"><i style="height:${r.s/mx*100}%" title="매출"></i><i class="b" style="height:${r.nt/mx*100}%" title="남는 돈"></i></div><span>${Number(r.x.split('-')[1])}월</span></div>`).join('')}</div><div class="note" style="margin-top:8px"><span class="sw" style="background:var(--c3)"></span>매출 &nbsp; <span class="sw" style="background:var(--gold)"></span>남는 돈</div></div>`;
  }
  return h+`<p class="note" style="margin:18px 0 0">세금은 입력값으로 계산한 추정치예요. 실제 신고는 세무사 확인을 거치세요.</p>`;
}


/* 안전 카드 (홈 화면 추가 · 백업) */
function safetyCards(){
  let h='';
  if(!STORE_AVAILABLE)h+=`<div class="card alert"><p class="at">이 브라우저에서는 저장이 안 돼요</p><p class="note" style="margin:0">개인정보 보호(시크릿) 모드에서는 입력한 내용이 저장되지 않아요. 일반 모드의 Safari나 Chrome으로 열어 주세요.</p></div>`;
  if(installDue()){
    h+=`<div class="card alert"><p class="at">홈 화면에 추가해 두세요</p><p class="note" style="margin:0">아이폰은 웹사이트에 한동안 들어가지 않으면 저장된 데이터를 지울 수 있어요. 홈 화면에 추가해서 쓰면 더 안전해요.</p>
    ${IS_IOS_OTHER?`<ol class="steps"><li>오른쪽 아래 <b>⋯</b> 또는 공유 메뉴에서 <b>Safari로 열기</b></li><li>Safari 아래쪽 <b>공유</b> 버튼 → <b>홈 화면에 추가</b></li></ol>`:`<ol class="steps"><li>아래쪽 <b>공유</b> 버튼(네모에 위쪽 화살표)을 눌러요</li><li>목록에서 <b>홈 화면에 추가</b>를 눌러요</li><li>홈 화면의 <b>CLOSING</b> 아이콘으로 열어요</li></ol>`}
    <div class="btns"><button class="btn sm ghost" data-act="installLater">나중에 할게요</button></div></div>`;
  }
  if(STORE_AVAILABLE&&backupDue()){
    const d=daysSince(meta.lastBackup);
    h+=`<div class="card alert"><p class="at">${d===Infinity?'아직 백업한 적이 없어요':'마지막 백업이 '+d+'일 전이에요'}</p><p class="note" style="margin:0 0 12px">데이터는 이 ${DEV} 안에만 있어요. 백업 파일을 카톡 나에게 보내기나 파일 앱에 저장해 두면 기기를 바꿔도 되살릴 수 있어요.</p><button class="btn block" data-act="backupShare">지금 백업하기</button></div>`;
  }
  return h;
}
function backupCard(){
  const d=daysSince(meta.lastBackup);
  const pr=ui.pendingRestore;
  return `<div class="card" id="backup"><div class="sec">백업 · 복원</div>
  <div class="row"><span class="k">마지막 백업</span><span class="v num" style="font-size:15px">${d===Infinity?'없음':(d===0?'오늘':d+'일 전')}</span></div>
  <p class="note" style="margin:10px 0 12px">데이터는 이 ${DEV}의 브라우저 안에만 저장돼요. 2주에 한 번은 백업 파일을 카톡 나에게 보내기, 메모, 파일 앱 등에 저장해 두세요.</p>
  <button class="btn block" data-act="backupShare">백업 파일 보내기 · 저장</button>
  <div class="btns" style="margin-top:8px"><button class="btn sm ghost" data-act="backupCopy">백업 내용 복사</button></div>
  <div class="hr"></div>
  ${pr?`<div class="alert" style="padding-left:12px"><p class="at">이 백업으로 되돌릴까요?</p><p class="note" style="margin:0 0 10px">${esc(pr.info)}<br>지금 이 ${DEV}에 있는 데이터는 이 백업 내용으로 바뀌어요.</p><div class="btns"><button class="btn sm" data-act="restoreYes">되돌리기</button><button class="btn sm ghost" data-act="restoreNo">취소</button></div></div>`:

  <div class="hr"></div>${fld('또는 복사해 둔 백업 붙여넣기','<textarea class="inp" id="restoreBox" placeholder="백업 내용을 붙여넣고 아래 버튼을 누르세요"></textarea>')}
  <div class="btns" style="margin-top:10px"><button class="btn sm ghost" data-act="restore">붙여넣은 내용으로 되돌리기</button></div>`}

/* 입력 (오늘 마감 · 월 매출 · 지출) */
function vInput(){
  const sub=['day','sales','exp'].includes(ui.inSub)?ui.inSub:'day';
  const seg=`<div class="seg" style="margin-top:14px">${[['day','오늘 마감'],['sales','월 매출'],['exp','지출']].map(([v,l])=>`<button data-act="inSub" data-val="${v}" aria-pressed="${sub===v}">${l}</button>`).join('')}</div>`;
  const ins=h=>{const i=h.indexOf('</div>',h.indexOf('class="sub"'))+6;return h.slice(0,i)+seg+h.slice(i)};
  if(sub==='sales')return ins(vSales());
  if(sub==='exp')return ins(vExp());
  return vDay(seg);
}
function vDay(seg){
  const k=ui.month,ds=pickDay(),m=M(k),days=m.days||{},d=days[ds]||{};
  const others=CH.filter(([c])=>!MAIN_CH.includes(c));
  const showAll=ui.moreAll||others.some(([c])=>n(d[c]));
  const [y,mo]=k.split('-').map(Number);const last=daysIn(k);
  let h=`<div class="ttl">오늘 마감</div><div class="sub">하루 끝날 때 결제수단별 매출만 넣어요. 월 합계에 자동으로 더해져요.</div>${seg}
  <div class="card"><div class="sec">날짜</div><div class="dayhead"><input class="inp" type="date" id="dayPick" value="${ds}" min="${k}-01" max="${k}-${pad(last)}" aria-label="날짜 선택"></div>
  <p class="note" style="margin:8px 0 0">${dayLabel(ds)}${ds===todayStr()?' · 오늘':''}</p></div>
  <div class="card"><div class="sec">매출 입력</div><div class="stk">`;
  for(const [c,l] of CH.filter(([c])=>MAIN_CH.includes(c)).sort((a,b)=>MAIN_CH.indexOf(a[0])-MAIN_CH.indexOf(b[0])))h+=fld(l,IN.money('day',c,d[c]));
  if(showAll)for(const [c,l] of others)h+=fld(l,IN.money('day',c,d[c]));
  h+=`</div>${showAll?'':`<button class="toggle" data-act="moreCh">+ 다른 결제수단 (네이버페이 등)</button>`}
  <div class="hr"></div><div class="row strong"><span class="k">이날 매출 합계</span><span class="v num" data-live="day:total"></span></div>
  <p class="note" style="margin:8px 0 0">입력하는 즉시 저장돼요.</p></div>`;
  const list=Object.keys(days).sort().reverse();
  h+=`<div class="card daylist"><div class="sec">${mlabel(k)} 일별 기록</div>`;
  if(!list.length)h+=`<p class="note" style="margin:0">아직 일별 기록이 없어요.</p>`;
  else{
    h+=list.map(x=>`<div class="row ${x===ds?'on':''}" data-act="pickDay" data-val="${x}"><span class="k">${dayLabel(x)}</span><span class="v num" style="font-size:15px" data-live="dayrow:${x}"></span></div>`).join('');
    h+=`<div class="hr"></div><div class="row"><span class="k">일별 기록 합계 (${list.length}일)</span><span class="v num" data-live="daysum"></span></div>`;
  }
  if(days[ds])h+=`<div class="btns" style="margin-top:12px">${ui.confirmDel==='day:'+ds?`<button class="btn sm ghost" style="color:var(--bad);border-color:var(--bad)" data-act="delDay" data-val="${ds}">정말 ${dayLabel(ds)} 기록 삭제</button>`:`<button class="btn sm ghost" data-act="delDay" data-val="${ds}">${dayLabel(ds)} 기록 삭제</button>`}</div>`;
  return h+`</div>`;
}

  return m[list].map(i=>`<div class="item">
    ${IN.text('item','name',i.name,{id:i.id,list},withTax?'거래처 / 품목':'항목')}
    ${IN.money('item','amt',i.amt,{id:i.id,list})}

/* 급여 */
function staffCard(st){
  const k=ui.month,open=!!ui.open[st.id],r=calcStaff(st,k);
  const kindLabel=st.kind==='designer'?'디자이너':'근로자';
  let h=`<div class="card"><button class="staffhead" data-act="toggleStaff" data-id="${st.id}" aria-expanded="${open}"><span><span class="nm">${esc(st.name||'이름 없음')}</span> <span class="pill">${kindLabel}</span></span><span class="num" style="font-size:17px" data-live="pay:${st.id}:total"></span></button>`;
  if(open){
    const inp=getMonth().pay[st.id]||{};
    h+=`<div class="hr"></div><div class="stk">`;
    h+=fld('이름',IN.text('staff','name',st.name,{id:st.id},'예) 김하나'));

async function askGemini(prompt){
  if(!ai.key){const e=new Error('NOKEY');e.code='NOKEY';throw e}
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent((ai.model||AI_MODEL).trim())+':generateContent';
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':ai.key.trim()},
    body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.4}})});
  if(!res.ok){let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||''}catch(e){}const e=new Error(msg||('HTTP '+res.status));e.status=res.status;throw e}
  const j=await res.json();
  const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
  const text=parts.map(x=>x.text||'').join('').trim();
  if(!text){const e=new Error('EMPTY');e.code='EMPTY';throw e}
  return text;
}
function aiErrMsg(e){
  if(e.code==='NOKEY')return '설정에서 Gemini API 키를 먼저 입력해 주세요.';
  if(e.code==='EMPTY')return 'AI가 답을 만들지 못했어요. 질문을 바꿔 다시 시도해 보세요.';
  if(e.status===400)return '요청을 처리하지 못했어요. API 키가 올바른지 설정에서 확인해 주세요.';
  if(e.status===401||e.status===403)return '이 키로는 사용할 수 없어요. 키와 사용 권한을 확인해 주세요.';
  if(e.status===404)return '모델 이름을 찾을 수 없어요. 설정에서 모델 이름을 확인해 주세요.';
  if(e.status===429)return '무료 사용량을 넘었어요. 잠시 뒤에 다시 시도해 주세요.';
  if(e.status>=500)return 'Google 서버가 응답하지 않아요. 잠시 뒤에 다시 시도해 주세요.';
  return '연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
}

function settleData(st){
  const k=ui.month,r=calcStaff(st,k),rows=[];
  const R=(a,b,t)=>rows.push({k:a,v:b,t:t||''});
  if(st.kind==='designer'){

    if(st.feeDeduct!==false)R('수수료 차감 후',wonT(r.net));
    if(st.vat!=='off')R('부가세 제외 기준',wonT(r.base0));
    if(r.matDed)R(st.mat==='pct'?`재료비 공제 (${pc(n(st.matPct))})`:'재료비 공제','−'+wonT(r.matDed));

    R(`인센티브 (${r.rateTxt})`,wonT(r.incentive));
    if(r.prodInc)R(`점판 인센티브 (${pc(n(st.prodRate))})`,wonT(r.prodInc));
    if(r.fixed)R('기본급',wonT(r.fixed));
    if(r.topup)R(`보장급 보전 (보장 ${wonT(st.base)})`,wonT(r.topup));
    const inp=M(k).pay[st.id]||{};
    if(n(inp.extra))R('추가 지급',wonT(inp.extra));
    if(n(inp.deduct))R('차감','−'+wonT(inp.deduct));
    R('지급 합계',wonT(r.pay),'b');
    R('원천세 3.3%','−'+wonT(r.tax));
    R('급여 실수령',wonT(r.takeHome),'b');
    if(st.tip){R('','', 'sep');R('봉사료',wonT(r.tip));R('봉사료 원천세 5.5%','−'+wonT(r.tipTax));R('봉사료 실수령',wonT(r.tipHome),'b')}
    return {rows,total:wonT(r.total),totalLabel:st.tip?'총 입금액 (급여 + 봉사료)':'입금액'};
  }
  const inp=M(k).pay[st.id]||{};
  if(st.type==='hourly')R(`시급 ${fmt(st.rate)}원 × ${n(inp.hours)}시간`,wonT(n(st.rate)*n(inp.hours)));
  else if(st.type==='daily')R(`일당 ${fmt(st.rate)}원 × ${n(inp.days)}일`,wonT(n(st.rate)*n(inp.days)));
  else R(r.ratio<1?`월 급여 (${r.from}일~${r.to}일 일할)`:'월 급여',wonT(Math.round(n(st.rate)*r.ratio)));
  if(n(inp.extra))R('추가 지급',wonT(inp.extra));
  if(n(inp.deduct))R('차감','−'+wonT(inp.deduct));
  R('지급 합계',wonT(r.pay),'b');
  if(st.deduct==='ins'){R('국민연금','−'+wonT(r.pension));R('건강보험','−'+wonT(r.health));R('장기요양','−'+wonT(r.ltc));R('고용보험','−'+wonT(r.emp));if(r.itax)R('근로소득세','−'+wonT(r.itax));if(r.ltax)R('지방소득세','−'+wonT(r.ltax))}
  if(st.deduct==='tax33')R('원천세 3.3%','−'+wonT(r.tax33));
  R('공제 합계','−'+wonT(r.ded));
  return {rows,total:wonT(r.takeHome),totalLabel:'실수령액'};
}

function fallbackCopy(t,done){
  const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done()}catch(e){toast('복사할 수 없어요. 직접 선택해 복사하세요.')}ta.remove();
}
let toastT;
function toast(msg){
  const old=$('.toast');if(old)old.remove();
  const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);
  clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200);
}

function aiGuard(){
  if(!ai.key){toast('설정에서 Gemini API 키를 먼저 입력해 주세요.');return false}
  if(!state.plan.aiConsent){toast('AI 상담 탭에서 전송 동의를 먼저 체크해 주세요.');return false}
  return true;
}
async function runAsk(){
  if(!aiGuard())return;
  const q=(state.plan.aiQ||'').trim();
  if(!q){toast('질문을 입력해 주세요.');return}
  ui.aiBusy=true;ui.aiErr='';ui.aiOut='';render(true);
  try{ui.aiOut=await askGemini(AI_SYS+'\n\n'+aiContext()+'\n\n[질문]\n'+q)}
  catch(e){ui.aiErr=aiErrMsg(e)}
  ui.aiBusy=false;render(true);
}
async function runTest(){
  if(!ai.key){toast('API 키를 먼저 입력해 주세요.');return}
  toast('연결 확인 중');
  try{await askGemini('"연결됨"이라고만 답하세요.');toast('연결됐어요')}catch(e){toast(aiErrMsg(e))}
}

/* ---------- 백업 ---------- */
function backupJSON(){return JSON.stringify({app:'CLOSING',backup:1,exportedAt:new Date().toISOString(),state})}
function markBackup(){meta.lastBackup=new Date().toISOString();metaSave();if(ui.tab==='home'||ui.tab==='more'||ui.view==='settings')render(true)}
function parseBackup(txt){
  try{
    let o=JSON.parse(String(txt||'').trim());let when='';
    if(o&&o.app==='CLOSING'&&o.state){when=o.exportedAt||'';o=o.state}
    if(!o||o.v!==1||typeof o.months!=='object'||!Array.isArray(o.staff))return null;
    const mk=Object.keys(o.months).sort();
    const info=(when?'백업한 날: '+when.slice(0,10)+' · ':'')+(o.settings&&o.settings.shop?'상호: '+o.settings.shop+' · ':'')+'기록된 달 '+mk.length+'개'+(mk.length?' ('+mlabel(mk[0])+(mk.length>1?' ~ '+mlabel(mk[mk.length-1]):'')+')':'')+' · 직원 '+o.staff.length+'명';
    return {state:o,info};
  }catch(e){return null}
}
async function backupShare(){
  const txt=backupJSON(),name='CLOSING_backup_'+todayStr()+'.json';
  let file=null;
  try{
    if(navigator.canShare){
      for(const [nm,ty] of [[name,'application/json'],[name.replace(/\.json$/,'.txt'),'text/plain']]){
        try{const f=new File([txt],nm,{type:ty});if(navigator.canShare({files:[f]})){file=f;break}}catch(e){}
      }
    }
    if(file&&navigator.share){
      await navigator.share({files:[file],title:'CLOSING 백업'});markBackup();toast('백업했어요');return;
    }
  }catch(e){if(e&&e.name==='AbortError'){toast('백업을 취소했어요');return}}
  try{
    const blob=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);markBackup();toast('백업 파일을 저장했어요');
  }catch(e){toast('파일로 저장할 수 없어요. 백업 내용 복사를 이용하세요.')}
}
/* ---------- 이벤트 ---------- */
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.path)return;
  if(el.type==='checkbox'||el.tagName==='SELECT')return;
  commit(el);live();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='dayPick'){const v=el.value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ui.day=v;ui.month=v.slice(0,7);ui.confirmDel=null;ui.moreAll=false;render(true)}return}
  if(el.id==='restoreFile'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const p=parseBackup(r.result);if(p){ui.pendingRestore=p;render(true)}else{toast('CLOSING 백업 파일이 아니거나 손상된 파일이에요.');el.value=''}};r.onerror=()=>toast('파일을 읽지 못했어요.');r.readAsText(f);return}
  if(!el.dataset||!el.dataset.path)return;
  if(el.type==='checkbox'||el.tagName==='SELECT'){commit(el);if(el.dataset.rr)render(true);else live()}
});
document.addEventListener('focusout',e=>{
  const el=e.target;if(el.dataset&&el.dataset.t==='money'){const v=parseMoney(el.value);el.value=v?fmt(v):''}
});
function addFocus(sel){const el=$(sel);if(el)el.focus()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const d=b.dataset;
  switch(d.act){
    case 'tab':
      if(d.tab==='sales'||d.tab==='exp'){ui.tab='input';ui.inSub=d.tab}
      else if(d.tab==='aid'){ui.tab='aid'}
      else ui.tab=d.tab;
      ui.view=null;ui.confirmDel=null;ui.pendingRestore=null;render(false);break;
    case 'inSub':ui.inSub=d.val;ui.confirmDel=null;render(false);break;
    case 'goDay':ui.tab='input';ui.inSub='day';ui.day=todayStr();ui.month=todayStr().slice(0,7);ui.view=null;render(false);break;
    case 'goAid':ui.tab='aid';ui.view=null;render(false);break;
    case 'pickDay':ui.day=d.val;ui.confirmDel=null;ui.moreAll=false;render(true);break;
    case 'moreCh':ui.moreAll=true;render(true);break;
    case 'delDay':
      if(ui.confirmDel==='day:'+d.val){delDay(d.val);ui.confirmDel=null;save();toast('삭제했어요. 월 합계에서도 빠졌어요.');render(true)}
      else{ui.confirmDel='day:'+d.val;render(true)}break;
    case 'installLater':meta.installLater=new Date().toISOString();metaSave();render(true);break;
    case 'backupShare':backupShare();break;
    case 'restoreYes':{const pr=ui.pendingRestore;if(pr){state=deepMerge(defaults(),pr.state);ensureLegacyCH();ui.pendingRestore=null;ui.open={};ui.day='';flush();toast('백업으로 되돌렸어요');ui.view=null;ui.tab='home';render(false)}break}
    case 'restoreNo':ui.pendingRestore=null;render(true);break;
    case 'mprev':ui.month=shiftMonth(ui.month,-1);render(false);break;
    case 'mnext':ui.month=shiftMonth(ui.month,1);render(false);break;
    case 'settings':ui.view='settings';ui.confirmReset=false;render(false);break;
    case 'back':ui.view=null;render(false);break;
    case 'sub':ui.sub=d.val;render(false);break;
    case 'seg':{const t=target(b);if(t){setPath(t.obj,t.path,d.val);if(t.path==='mode'&&d.val==='tier'&&!(Array.isArray(t.obj.tiers)&&t.obj.tiers.length))t.obj.tiers=DEFAULT_TIERS.map(x=>({...x}));if(t.path==='mat'&&d.val==='pct'&&t.obj.matPct==null)t.obj.matPct=10;save();render(true)}break}
    case 'addItem':{
      const m=getMonth(),id=uid();
      m[d.list].push(d.list==='purchases'?{id,name:d.name||'',amt:0,taxable:true}:{id,name:d.name||'',amt:0});
      save();render(true);
      addFocus(`[data-id="${id}"][data-path="${d.name?'amt':'name'}"]`);break}
    case 'delItem':{const m=getMonth();m[d.list]=m[d.list].filter(i=>i.id!==d.id);save();render(true);break}
    case 'addStaff':{
      const id=uid();
      state.staff.push(d.kind==='designer'?{id,kind:'designer',name:'',rate:40,base:0,vat:'on',feeDeduct:true,tip:false}:{id,kind:'worker',name:'',type:'monthly',rate:0,deduct:'ins'});
      ui.open[id]=true;save();render(true);addFocus(`[data-id="${id}"][data-path="name"]`);break}
    case 'tierAdd':case 'tierDel':{
      const st=state.staff.find(s=>s.id===d.id);if(!st)break;
      let t=(Array.isArray(st.tiers)&&st.tiers.length?st.tiers:DEFAULT_TIERS).map(x=>({upto:n(x.upto),rate:n(x.rate)}));
      if(d.act==='tierAdd'&&t.length<5){const pv=t.length>1?t[t.length-2]:{upto:0,rate:t[0].rate};const nu=(pv.upto||3000000)+2000000;t.splice(t.length-1,0,{upto:nu,rate:t[t.length-1].rate})}
      if(d.act==='tierDel'&&t.length>2){t.splice(t.length-2,1)}
      st.tiers=t;save();render(true);break}
    case 'toggleStaff':ui.open[d.id]=!ui.open[d.id];ui.confirmDel=null;render(true);break;
    case 'delStaff':
      if(ui.confirmDel===d.id){state.staff=state.staff.filter(s=>s.id!==d.id);ui.confirmDel=null;save();render(true)}
      else{ui.confirmDel=d.id;render(true)}break;
    case 'settle':ui.modal={type:'settle',id:d.id};render(true);break;
    case 'closeModal':if(b.classList.contains('over')&&e.target!==b)break;ui.modal=null;render(true);break;
    case 'shareImg':{const st=state.staff.find(s=>s.id===d.id);if(st)shareImage(st);break}
    case 'copySettle':{const st=state.staff.find(s=>s.id===d.id);if(st)copyText(settleText(st));break}
    case 'aiPreset':state.plan.aiQ=AI_PRESETS[Number(d.val)]||'';save();render(true);break;
    case 'aiAsk':runAsk();break;
    case 'aiTest':runTest();break;
    case 'copyAi':copyText(ui.aiOut);break;
    case 'sample':loadSample();render(false);break;
    case 'clearSample':state.months={};state.staff=[];state.settings.shop='';state.sample=false;save();render(false);break;
    case 'backupCopy':copyText(backupJSON());markBackup();break;
    case 'restore':{
      const box=$('#restoreBox');const r=parseBackup(box?box.value:'');
      if(r){ui.pendingRestore=r;render(true)}else toast('백업 내용을 읽을 수 없어요. 전체를 다시 복사해 붙여넣어 주세요.');break}
    case 'reset':
      if(ui.confirmReset){state=defaults();ui.confirmReset=false;ui.open={};ui.view=null;ui.modal=null;save();toast('모든 데이터를 지웠어요');render(false)}
      else{ui.confirmReset=true;render(true)}break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render(true)}});

window.__app={setDayVal,delDay,parseBackup,backupJSON,get meta(){return meta},safetyCards,pickDay,todayStr,drawSettlePng:st=>{const c=drawSettle(st);return c?c.toDataURL('image/png'):null},get state(){return state},get ai(){return ai},askGemini,aiContext,runAsk,ui,calcStaff,calcTax,laborOf,salesTotal,incomeTaxAnnual,settleData,render,loadSample,getMonth};
render(false);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
