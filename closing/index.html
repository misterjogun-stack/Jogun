<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CLOSING">
<meta name="theme-color" content="#F3F5F9">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>CLOSING</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* CLOSING · 네이비 히어로 + 화이트 카드 + 블루 포인트 */
:root{
  --bg:#F3F5F9;--panel:#FFFFFF;--panel2:#F5F7FA;--ink:#131A26;--ink2:#333D4B;--mute:#6B7684;--mute2:#9AA3AF;--line:#E7EBF0;--line2:#D9DFE7;
  --pri:#2F6BFF;--pri2:#5B8CFF;--pri-soft:#EDF2FF;--pri-dark:#1D4ED8;
  --navy:#0A1428;--navy2:#13264F;
  --ok:#12A150;--ok-soft:#E7F7EE;--warn:#D97706;--warn-soft:#FFF4E5;--bad:#E5484D;--bad-soft:#FDECEC;
  --gt:var(--pri);--gold:var(--pri);--gold-ink:#fff;
  --c1:#2F6BFF;--c2:#8DB0FF;--c3:#C9D8FF;--c4:#F5A524;--c5:#FFD18A;--c6:#E5484D;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --serif:var(--sans);
  --r:20px;--r2:14px;--r3:10px;--rp:999px;
  --sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05);
  /* 하단 탭을 'Powered by Netlify' 배지 위로 올리는 높이. 배지가 없으면 0px로 바꾸세요 */
  --tab-lift:52px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + var(--tab-lift) + env(safe-area-inset-bottom,0px));
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
a{color:var(--pri)}
.i{width:20px;height:20px;flex:none;display:block}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* 헤더 */
.top{position:sticky;top:0;z-index:5;background:rgba(243,245,249,.88);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:8px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#5B8CFF,#2459F0);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.35)}
.logo i .i{width:18px;height:18px;stroke-width:2.6}
.hr-right{display:flex;align-items:center;gap:8px}
.mnav{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--rp);padding:3px;box-shadow:var(--sh)}
.mnav button{width:32px;height:32px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--mute)}
.mnav button:active{background:var(--panel2)}
.mnav b{font-size:14px;font-weight:700;min-width:94px;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ink2);box-shadow:var(--sh);flex:none}
.backbtn{display:flex;align-items:center;gap:4px;background:none;border:0;padding:8px 0;font-weight:700;color:var(--ink2)}
@media (max-width:379px){.logo span{display:none}}

/* 하단 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--tab-lift))}
.tabbar .wrap{display:flex;padding:0 6px}
.tabbar button{flex:1;background:none;border:0;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mute2)}
.tabbar button .i{width:23px;height:23px}
.tabbar button[aria-current=page]{color:var(--pri)}

/* 제목 */
h1,h2,h3{margin:0}
.eyebrow{font-size:13px;font-weight:700;color:var(--pri);margin:26px 0 6px}
.ttl{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1.3;margin:24px 0 0}
.eyebrow+.ttl{margin-top:0}
.sub{color:var(--mute);font-size:14.5px;margin-top:6px;line-height:1.6}
.sechead{margin-top:34px}

/* 카드 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:14px;box-shadow:var(--sh)}
.card.plain{background:transparent;box-shadow:none}
.card.soft{background:var(--pri-soft);border-color:#D6E2FF}
.sec{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cap{font-size:12.5px;color:var(--mute2);margin:-10px 0 14px}
.big{font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.big small{font-size:17px;font-weight:700;color:var(--mute);margin-left:2px}
.note{font-size:13px;color:var(--mute);line-height:1.65}
.empty{text-align:center;padding:26px 16px}
.hr{height:1px;background:var(--line);margin:16px 0}

/* 히어로 (네이비) */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px 20px;margin-top:14px;color:#fff;
  background:radial-gradient(120% 70% at 100% 0%,rgba(76,125,255,.42),transparent 60%),linear-gradient(165deg,#15295A 0%,#0A1428 72%);box-shadow:0 14px 34px rgba(10,20,40,.22)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%)}
.hero>*{position:relative}
.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:var(--rp);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:12.5px;font-weight:600;color:#D6E0FF;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#7EA2FF;box-shadow:0 0 0 3px rgba(126,162,255,.25);flex:none}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.28;margin:18px 0 10px}
.hero h2{font-size:14.5px;font-weight:600;color:#AFC0E6;margin:18px 0 2px}
.hero .big{color:#fff;font-size:38px}
.hero .big small{color:#C8D4F0;font-size:18px}
.hero .big.neg{color:#FFB4B7}
.hero p,.hero .hsub{font-size:14px;color:#A7B6D8;margin:6px 0 0;line-height:1.65}
.hero .btns{margin-top:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tile{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 14px 13px;min-width:0}
.tile .i{width:20px;height:20px;color:#86A8FF}
.tile .tl{font-size:12px;color:#9FB0D6;margin-top:10px}
.tile .tv{font-size:20px;font-weight:800;margin-top:1px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tile .tv.sm{font-size:16.5px}
.tile .tv small{font-size:12.5px;font-weight:600;color:#B9C6E4;margin-left:1px}
.tile .td{font-size:11.5px;margin-top:2px;color:#9FB0D6}
.tile .td.up{color:#7EE2A8}.tile .td.dn{color:#FFA3A6}
.hfoot{font-size:11.5px;color:#7F90B5;text-align:right;margin-top:12px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:#fff;border:0;padding:0 18px;height:48px;font-size:15px;font-weight:700;border-radius:var(--r2);box-shadow:0 4px 12px rgba(47,107,255,.22);text-decoration:none;white-space:nowrap;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn .i{width:18px;height:18px}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line2);box-shadow:none}
.btn.white{background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.btn.glass{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid #F7C9CA;box-shadow:none}
.btn.pill{border-radius:var(--rp)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:var(--r3)}
.btn.sm .i{width:16px;height:16px}
.btn.block{width:100%;display:flex}
.btn[disabled]{opacity:.55}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.col{flex-direction:column}
.toggle{background:none;border:0;color:var(--pri);font-size:14px;padding:12px 0 0;font-weight:700}
.linkback{display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--mute);font-size:14px;font-weight:600;padding:18px 0 0}
.linkback .i{width:18px;height:18px}

/* 입력 */
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;font:inherit;font-size:16px;font-weight:600;border-radius:12px;text-align:right;min-width:0;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s,background .15s}
.inp::placeholder{color:#B4BCC7;font-weight:500}
.inp:focus{outline:0;border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px rgba(47,107,255,.12)}
.inp.txt,textarea.inp,select.inp{text-align:left;font-weight:500}
textarea.inp{min-height:96px;resize:vertical;line-height:1.55}
input[type=file].inp{font-size:14px;padding:10px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.fld{display:grid;gap:7px;font-size:13px;font-weight:600;color:var(--ink2);min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stk{display:grid;gap:14px}
.seg{display:flex;background:#E9EDF3;border-radius:var(--r2);padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:9px 6px;font-size:13.5px;font-weight:600;border-radius:10px;min-width:0;line-height:1.35}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(16,24,40,.12)}
.card .seg{background:var(--panel2);border:1px solid var(--line)}
.chk{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--ink2);font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--pri);margin:0;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line2);color:var(--ink2);padding:7px 12px;font-size:13px;font-weight:600;border-radius:var(--rp)}
.chip:active{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.item{display:grid;grid-template-columns:minmax(0,1fr) 124px 34px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .chk{grid-column:1/-1;font-size:13px;color:var(--mute)}
.x{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:0;color:var(--mute);font-size:19px;line-height:1;display:grid;place-items:center}

/* 행 · 상태 */
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{color:var(--mute);font-size:14px;min-width:0}
.row .v{font-size:15.5px;font-weight:700;color:var(--ink);text-align:right;white-space:nowrap}
.row.strong .k{color:var(--ink);font-weight:700}
.row.strong .v{font-size:18px;color:var(--pri);font-weight:800}
.row.mute .v{color:var(--mute);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--rp);background:var(--panel2);color:var(--mute);white-space:nowrap;line-height:1.3}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.pri{background:var(--pri-soft);color:var(--pri)}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:middle}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);flex:none}
.ic .i{width:22px;height:22px}
.ic.o{background:var(--warn-soft);color:var(--warn)}.ic.g{background:var(--ok-soft);color:var(--ok)}.ic.r{background:var(--bad-soft);color:var(--bad)}
.sumbox{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--pri-soft);border-radius:var(--r2);padding:14px 16px;margin-top:18px}
.sumbox span{font-size:14px;font-weight:700;color:var(--ink2)}
.sumbox b{font-size:21px;font-weight:800;color:var(--pri);letter-spacing:-.03em}

/* 오늘 마감 카드 (홈) */
.today{display:flex;align-items:center;gap:14px}
.today .tt{flex:1;min-width:0}
.today .tt b{display:block;font-size:15.5px}
.today .tt span{font-size:13px;color:var(--mute)}

/* 7일 막대 */
.week{position:relative;display:flex;align-items:flex-end;gap:8px;height:158px;padding-top:6px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 38px;background-position:0 6px}
.week .c{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.week .a{font-size:10.5px;font-weight:700;color:var(--mute);white-space:nowrap}
.week .bar{width:72%;max-width:30px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#6E9BFF,#2F6BFF);min-height:4px}
.week .bar.z{background:var(--line2)}
.week .lb{font-size:12px;color:var(--mute2);font-weight:600;background:var(--panel);padding:2px 0 0}
.week .lb.t{color:var(--pri);font-weight:800}

/* 도넛 */
.donut{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.donut svg{width:124px;height:124px;flex:none;transform:rotate(-90deg)}
.donut .dc{min-width:0}
.donut .dc .big{font-size:34px;color:var(--pri)}
.donut .dc .note{margin-top:2px}
.lgrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.lgrow:last-child{border-bottom:0}
.lgrow .k{color:var(--ink2)}
.lgrow .v{font-weight:700;white-space:nowrap}
.lgrow .v small{color:var(--mute2);font-weight:600;font-size:12px;margin-left:6px;display:inline-block;min-width:38px;text-align:right}

/* 6개월 추이 */
.trend{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:4px}
.trend .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0}
.trend .bars{display:flex;align-items:flex-end;gap:3px;height:110px;width:100%;justify-content:center}
.trend .bars i{display:block;width:38%;max-width:16px;border-radius:5px 5px 2px 2px;background:#D5E1FF;min-height:2px}
.trend .bars i.b{background:linear-gradient(180deg,#6E9BFF,#2F6BFF)}
.trend span{font-size:12px;color:var(--mute2);font-weight:600}
.trend .col.on span{color:var(--pri);font-weight:800}

/* 세금 흐름 */
.wf{display:grid;grid-template-columns:72px 1fr 104px;gap:10px;align-items:center;padding:8px 0;font-size:13.5px}
.wf>span:first-child{color:var(--ink2);font-weight:600}
.wf .bar{height:10px;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden}
.wf .bar i{position:absolute;left:0;top:0;bottom:0;background:#FFB3B5;border-radius:6px}
.wf .bar i.g{background:linear-gradient(90deg,#6E9BFF,#2F6BFF)}
.wf .v{text-align:right;font-weight:700}

/* 일정 */
.sch{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sch:last-of-type{border-bottom:0}
.dbox{width:48px;height:52px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;flex:none}
.dbox small{font-size:11px;color:var(--mute);font-weight:600}
.dbox b{font-size:19px;font-weight:800}
.sch .st{flex:1;min-width:0}
.sch .st b{display:block;font-size:15px}
.sch .st span{display:block;font-size:12.5px;color:var(--mute);line-height:1.5}

/* 체크리스트 */
.ck{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--panel2);color:var(--mute2);border:1px solid var(--line2)}
.ck .dot .i{width:15px;height:15px;stroke-width:3}
.ck.done .dot{background:var(--pri);border-color:var(--pri);color:#fff}
.ck .t{flex:1;font-weight:600;font-size:14.5px}
.ck.done .t{color:var(--mute)}
.prog{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:-4px 0 6px}
.prog i{display:block;height:100%;background:var(--pri);border-radius:3px}

/* 시작 단계 */
.step .stepb{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--pri);background:var(--pri-soft);padding:4px 10px;border-radius:var(--rp)}
.step h3{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:14px 0 6px}
.step p{margin:0 0 14px;color:var(--mute);font-size:14px;line-height:1.65}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;text-align:center;color:var(--mute2);font-weight:700;padding:2px 0 6px}
.cal .wd.sun{color:var(--bad)}.cal .wd.sat{color:var(--pri)}
.cal button{height:52px;border:0;background:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7px 0 0;gap:1px;font-size:14px;font-weight:600;color:var(--ink2);min-width:0}
.cal button .a{font-size:10.5px;font-weight:700;color:var(--pri);letter-spacing:-.04em;white-space:nowrap;overflow:hidden;max-width:100%}
.cal button.has{background:var(--pri-soft)}
.cal button.fu{color:#C4CAD3}
.cal button.td{box-shadow:inset 0 0 0 1.5px var(--pri);color:var(--pri)}
.cal button.on{background:var(--pri);color:#fff;box-shadow:0 4px 10px rgba(47,107,255,.3)}
.cal button.on .a{color:#DCE6FF}

/* 직원 */
.staffhead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;text-align:left}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;background:var(--pri-soft);color:var(--pri)}
.av.o{background:var(--warn-soft);color:var(--warn)}
.staffhead .meta{flex:1;min-width:0}
.staffhead .nm{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.staffhead .d{display:block;font-size:12.5px;color:var(--mute)}
.staffhead .amt{font-size:16px;font-weight:800;white-space:nowrap}
.staffhead .chev{color:var(--mute2);transition:transform .2s}
.staffhead[aria-expanded=true] .chev{transform:rotate(90deg)}

/* 더보기 메뉴 · FAQ */
.menu{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;text-align:left;color:var(--ink);font-size:15.5px}
.menu:first-child{padding-top:2px}.menu:last-child{border-bottom:0;padding-bottom:2px}
.menu .mt{flex:1;min-width:0}
.menu b{display:block;font-weight:700}
.menu span.d{display:block;color:var(--mute);font-size:12.5px;margin-top:1px}
.menu>.i{color:var(--mute2)}
.faq details{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-top:10px;box-shadow:var(--sh)}
.faq summary{list-style:none;padding:17px 18px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;font-weight:300;color:var(--mute);line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0;padding:0 18px 18px;color:var(--mute);font-size:14px;line-height:1.75}
.foot{margin:34px 0 0;padding:20px 0 4px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);line-height:1.7}
.foot a{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:700;text-decoration:none;margin-top:8px}
.foot a .i{width:18px;height:18px}

/* 알림 카드 */
.alert{background:var(--warn-soft);border:1px solid #F8DDB6;border-radius:16px;padding:16px}
.card.alert{background:var(--warn-soft);border-color:#F8DDB6;box-shadow:none}
.alert .at{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:0 0 6px;color:#8A4B00}
.alert .at .i{color:var(--warn)}
.steps{margin:10px 0 12px;padding-left:20px;font-size:14px;line-height:1.8}
.install{margin:0;padding-left:20px}
.install li{margin:0 0 6px;font-size:14px}

/* 모달 (아래에서 올라오는 시트) */
.over{position:fixed;inset:0;z-index:20;background:rgba(10,20,40,.5);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0}
.modal::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 16px}
.modal img{width:100%;display:block;margin:14px 0 6px;border-radius:14px;border:1px solid var(--line)}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mh .t1{font-size:18px;font-weight:800}
@media (min-width:700px){.over{align-items:center;padding:24px}.modal{border-radius:24px;padding:24px}.modal::before{display:none}}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--tab-lift) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#131A26;color:#fff;padding:12px 18px;font-size:14px;font-weight:600;z-index:30;border-radius:var(--rp);max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
pre.draft{white-space:pre-wrap;word-break:keep-all;font:14px/1.75 var(--sans);margin:0}
.aiout{white-space:pre-wrap;word-break:keep-all;font-size:15px;line-height:1.8;margin:0}
.dots::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.tip h3{font-size:16.5px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
.tip p{margin:0;font-size:14px;line-height:1.75;color:var(--ink2)}

/* 데스크톱 (매장 모니터) */
@media (min-width:1024px){
  :root{--tab-lift:0px}
  body{font-size:16px;padding-bottom:120px}
  .wrap{max-width:1120px;padding:0 32px}
  .top .wrap{height:72px}
  .tabbar{left:50%;right:auto;bottom:20px;transform:translateX(-50%);width:540px;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(16,24,40,.12);padding-bottom:0}
  .tabbar button{padding:10px 0 9px;font-size:12.5px}
  main.wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;align-items:start;padding-bottom:20px}
  main.wrap>*{grid-column:1/-1}
  main.wrap>.card{grid-column:auto}
  main.wrap>.card.alert,main.wrap>.card.empty,main.wrap>.card.soft,main.v-pay>.card,main.v-settings>.card.wide{grid-column:1/-1}
  main.wrap>.seg{max-width:560px;width:100%}
  main.v-pay .card .stk{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px;align-items:start}
  main.v-pay .card .stk>.hr,main.v-pay .card .stk>.sec,main.v-pay .card .stk>.g2,main.v-pay .card .stk>.btns{grid-column:1/-1}
  .ttl{font-size:32px}
  .hero{padding:30px 32px 28px}
  .hero .big{font-size:52px}
  .hero h1{font-size:38px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tile .tv{font-size:22px}
  .card{padding:24px 26px}
  .modal{max-width:560px}
  .toast{bottom:110px}
}
@media (prefers-reduced-motion:no-preference){
  .card,.hero{animation:in .28s ease both}
  @keyframes in{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
  .over{animation:fade .2s ease both}.modal{animation:up .26s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.5}}
}

<script>
(()=>{
'use strict';
/* ---------- 상수 ---------- */
const KEY='misiryo-gagyebu-v1';

const RECEIPT_CH=['cashReceipt','card','naverPay','naverDeposit','kakaoPay','local']; // 발행세액공제 대상 추정
const TABS=[['home','홈','home'],['input','입력','edit'],['pay','급여','users'],['tax','세금','receipt'],['more','더보기','grid']];

const DEFAULT_TIERS=[{upto:5000000,rate:30},{upto:8000000,rate:35},{upto:0,rate:40}];

/* ---------- 유틸 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const n=v=>{v=Number(v);return isFinite(v)?v:0};
const fmt=v=>String(Math.round(n(v))).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const won=v=>fmt(v)+'<small>원</small>';
const wonT=v=>fmt(v)+'원';
const pc=v=>(Math.round(n(v)*10)/10)+'%';
const floor10=v=>Math.floor(Math.max(0,v)/10)*10;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=v=>String(v).padStart(2,'0');
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const shiftMonth=(k,d)=>{const [y,m]=k.split('-').map(Number);return ym(new Date(y,m-1+d,1))};
const daysIn=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const mlabel=k=>{const [y,m]=k.split('-');return y+'년 '+Number(m)+'월'};
const parseMoney=s=>Math.round(Number(String(s).replace(/[^\d]/g,''))||0);
const parseNum=s=>parseFloat(String(s).replace(/[^\d.]/g,''))||0;
/* 짧은 금액: 17,380,000 → 1,738만 */
const man=v=>{v=Math.round(n(v));const a=Math.abs(v);if(a>=100000000)return (Math.round(v/10000000)/10)+'억';if(a>=10000)return fmt(Math.round(v/10000))+'만';return fmt(v)};
const manW=v=>man(v)+'<small>원</small>';
/* 아이콘 (선형) */
const ICON={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><path d="M8 7h8M8 11h8M8 15h5"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',chev:'<path d="m9 18 6-6-6-6"/>',
  wallet:'<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1.5"/>',
  trend:'<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  percent:'<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16v5M16.5 18.5h5"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  insta:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>'
};
const I=(k,c)=>`<svg class="i ${c||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||''}</svg>`;
const head=(eb,t,sub)=>`${eb?`<div class="eyebrow">${eb}</div>`:''}<div class="ttl">${t}</div>${sub?`<div class="sub">${sub}</div>`:''}`;

/* ---------- 상태 ---------- */
const defaults=()=>({v:1,
  settings:{shop:'',owner:'',years:3,taxType:'general',
    fees:{cash:0,cashReceipt:0,card:0.4,account:0,naverPay:2.0,naverDeposit:3.0,kakaoPay:2.0,local:0.5},
    ins:{pension:4.75,health:3.595,ltc:13.14,emp:0.9,empEr:1.15,accident:0.7},
    basicDeduction:150},
  staff:[],months:{},
  plan:{aiConsent:false,aiQ:''},
  sample:false});
function deepMerge(a,b){
  if(Array.isArray(b)||typeof b!=='object'||b===null) return b;
  const o=Array.isArray(a)?[]:Object.assign({},a);
  for(const k in b){o[k]=(a&&typeof a[k]==='object'&&!Array.isArray(a[k]))?deepMerge(a[k],b[k]):b[k]}
  return o;
}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===1)return deepMerge(defaults(),s)}catch(e){}
  return defaults();
}
let state=load();
/* 예전에 '마메드네'로 입력한 금액이 있으면 합계에서 빠지지 않도록 그 기기에서만 다시 보이게 해요 */
function ensureLegacyCH(){
  const used=o=>o&&n(o.mamed)>0;
  const any=Object.values(state.months||{}).some(m=>used(m.sales)||Object.values(m.days||{}).some(used)||Object.values(m.pay||{}).some(p=>used(p.sales)));
  if(any&&!CH.some(c=>c[0]==='mamed'))CH.splice(CH.length-1,0,['mamed','마메드네']);
}
ensureLegacyCH();
const AIKEY='misiryo-gemini-v1',AI_MODEL='gemini-3.8-flash';
function aiLoad(){try{return Object.assign({key:'',model:AI_MODEL},JSON.parse(localStorage.getItem(AIKEY)||'{}'))}catch(e){return {key:'',model:AI_MODEL}}}
let ai=aiLoad();
const aiSave=()=>{try{localStorage.setItem(AIKEY,JSON.stringify(ai))}catch(e){}};
const EMPTY={sales:{},purchases:[],expenses:[],pay:{}};
const M=k=>state.months[k]||EMPTY;
function getMonth(k){k=k||ui.month;return state.months[k]||(state.months[k]={sales:{},purchases:[],expenses:[],pay:{}})}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(flush,200)}
let storeOK=true,storeWarned=false;
function flush(){
  try{localStorage.setItem(KEY,JSON.stringify(state));storeOK=true}
  catch(e){storeOK=false;if(!storeWarned){storeWarned=true;try{toast('저장하지 못했어요. 개인정보 보호 모드이거나 저장 공간이 부족할 수 있어요. 지금 백업해 두세요.')}catch(_){}}}
  askPersist();
}
const METAKEY='closing-meta-v1';
function metaLoad(){try{return Object.assign({lastBackup:'',installLater:''},JSON.parse(localStorage.getItem(METAKEY)||'{}'))}catch(e){return {lastBackup:'',installLater:''}}}
let meta=metaLoad();
const metaSave=()=>{try{localStorage.setItem(METAKEY,JSON.stringify(meta))}catch(e){}};
let persistAsked=false;
function askPersist(){
  if(persistAsked||!hasData())return;persistAsked=true;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>{if(!p)return navigator.storage.persist()}).catch(()=>{})}catch(e){}
}
function storageWorks(){try{const k='__closing_t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}}
const STORE_AVAILABLE=storageWorks();
const UA=navigator.userAgent||'';
const IS_IOS=/iPhone|iPad|iPod/.test(UA)||(/Macintosh/.test(UA)&&navigator.maxTouchPoints>1);
const DEV=(IS_IOS||/Android|Mobile/.test(UA))?'폰':'컴퓨터';
const IS_IOS_OTHER=IS_IOS&&/CriOS|FxiOS|EdgiOS|KAKAOTALK|Instagram|NAVER|DaumApps|FBAN|FBAV|Line\//.test(UA);
function isStandalone(){try{return navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)}catch(e){return false}}
function hasData(){if(state.sample)return false;return state.staff.length>0||Object.keys(state.months).some(k=>isActive(k)||Object.keys(state.months[k].days||{}).length)}
const DAY_MS=86400000;
function daysSince(iso){if(!iso)return Infinity;const t=Date.parse(iso);return isFinite(t)?Math.floor((Date.now()-t)/DAY_MS):Infinity}
function backupDue(){return hasData()&&daysSince(meta.lastBackup)>=14}
function installDue(){return IS_IOS&&!isStandalone()&&daysSince(meta.installLater)>=7}
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

const ui={tab:'home',inSub:'day',day:'',moreAll:false,pendingRestore:null,month:ym(new Date()),view:null,open:{},sub:'save',modal:null,confirmDel:null,confirmReset:false,aiOut:'',aiErr:'',aiBusy:false};

/* ---------- 일별 입력 ---------- */
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const WD=['일','월','화','수','목','금','토'];
const dayLabel=ds=>{const [y,m,d]=ds.split('-').map(Number);return m+'월 '+d+'일 ('+WD[new Date(y,m-1,d).getDay()]+')'};
const dayTotal=o=>CH.reduce((t,[k])=>t+n((o||{})[k]),0);
function pickDay(){
  const k=ui.month,t=todayStr();
  if(ui.day&&ui.day.slice(0,7)===k)return ui.day;
  if(t.slice(0,7)===k)return ui.day=t;
  const ds=Object.keys(M(k).days||{}).sort();
  return ui.day=ds.length?ds[ds.length-1]:k+'-01';
}
function setDayVal(ds,ch,v){
  const m=getMonth(ds.slice(0,7));m.days=m.days||{};
  const d=m.days[ds]||(m.days[ds]={});
  const old=n(d[ch]);v=Math.max(0,Math.round(n(v)));
  m.sales[ch]=Math.max(0,n(m.sales[ch])+v-old);
  if(v)d[ch]=v;else delete d[ch];
  if(!Object.keys(d).length)delete m.days[ds];
}
function delDay(ds){
  const m=getMonth(ds.slice(0,7)),d=(m.days||{})[ds];if(!d)return;
  for(const ch of Object.keys(d))m.sales[ch]=Math.max(0,n(m.sales[ch])-n(d[ch]));
  delete m.days[ds];
}
/* ---------- 계산: 매출/지출 ---------- */
const salesTotal=m=>CH.reduce((t,[k])=>t+n(m.sales[k]),0);
const feeOf=(m,k)=>n(m.sales[k])*n(state.settings.fees[k])/100;
const feeTotal=m=>CH.reduce((t,[k])=>t+feeOf(m,k),0);
const purchTotal=m=>m.purchases.reduce((t,i)=>t+n(i.amt),0);
const purchTaxable=m=>m.purchases.reduce((t,i)=>t+(i.taxable!==false?n(i.amt):0),0);
const purchVat=m=>purchTaxable(m)/11;
const purchSupply=m=>m.purchases.reduce((t,i)=>t+(i.taxable!==false?n(i.amt)/1.1:n(i.amt)),0);
const expTotal=m=>m.expenses.reduce((t,i)=>t+n(i.amt),0);

/* ---------- 계산: 직원 ---------- */
function tierList(st){
  const raw=Array.isArray(st.tiers)&&st.tiers.length?st.tiers:DEFAULT_TIERS;
  const t=raw.map((x,i)=>({upto:i===raw.length-1?Infinity:Math.max(0,n(x.upto)),rate:Math.max(0,n(x.rate))}));
  for(let i=1;i<t.length;i++)if(t[i].upto<t[i-1].upto)t[i].upto=t[i-1].upto;
  return t;
}
function tierIncentive(base,st){
  const t=tierList(st);
  if(st.tierWay==='prog'){
    let inc=0,prev=0;
    for(const x of t){const part=Math.max(0,Math.min(base,x.upto)-prev);inc+=part*x.rate/100;prev=x.upto;if(base<=x.upto)break}
    inc=Math.round(inc);
    return {inc,txt:'구간별 계산'+(base>0?' · 평균 '+pc(inc/base*100):'')};
  }
  const x=t.find(x=>base<=x.upto)||t[t.length-1];
  return {inc:Math.round(base*x.rate/100),txt:'구간 '+pc(x.rate)};
}
function calcStaff(st,key){
  const m=M(key),inp=m.pay[st.id]||{},S=state.settings;
  if(st.kind==='designer'){
    const sales=inp.sales||{};let gross=0,net=0;
    for(const [k] of CH){const a=n(sales[k]);gross+=a;net+=st.feeDeduct===false?a:a*(1-n(S.fees[k])/100)}
    const base0=st.vat==='off'?net:net/1.1;
    const matDed=Math.min(base0,st.mat==='pct'?Math.round(base0*n(st.matPct)/100):st.mat==='amt'?Math.max(0,n(inp.mat)):0);
    const base=Math.max(0,base0-matDed);
    const ti=st.mode==='tier'?tierIncentive(base,st):{inc:Math.round(base*n(st.rate)/100),txt:pc(n(st.rate))};
    const incentive=ti.inc;
    const prodSales=Math.max(0,n(inp.prod)),prodInc=Math.round((st.vat==='off'?prodSales:prodSales/1.1)*n(st.prodRate)/100);
    const earned=incentive+prodInc,baseAmt=Math.max(0,n(st.base));
    const topup=st.baseWay==='max'?Math.max(0,baseAmt-earned):0;
    const fixed=st.baseWay==='max'?0:baseAmt;
    const pay=Math.max(0,fixed+earned+topup+n(inp.extra)-n(inp.deduct));
    const tax=floor10(pay*0.03)+floor10(pay*0.003);
    const tip=st.tip?n(inp.tip):0;
    const tipTax=st.tip?floor10(tip*0.05)+floor10(tip*0.005):0;
    return {kind:'designer',sales:gross,net,base0,matDed,base,incentive,rateTxt:ti.txt,prodSales,prodInc,fixed,topup,pay,tax,ded:tax,takeHome:pay-tax,tip,tipTax,tipHome:tip-tipTax,
      total:pay-tax+tip-tipTax,cost:pay,employer:0,wh:tax+tipTax,
      pension:0,health:0,ltc:0,emp:0,itax:0,ltax:0,tax33:tax};
  }
  const dim=daysIn(key);let gross=0,ratio=1,from=1,to=dim;
  if(st.type==='hourly')gross=n(st.rate)*n(inp.hours);
  else if(st.type==='daily')gross=n(st.rate)*n(inp.days);
  else{
    from=Math.min(dim,Math.max(1,Math.round(n(inp.startDay))||1));
    to=Math.min(dim,Math.max(1,Math.round(n(inp.endDay))||dim));
    ratio=to>=from?(to-from+1)/dim:0;
    gross=Math.round(n(st.rate)*ratio);
  }
  gross=Math.max(0,gross+n(inp.extra)-n(inp.deduct));
  const I=S.ins;let pension=0,health=0,ltc=0,emp=0,itax=0,ltax=0,tax33=0,employer=0;
  if(st.deduct==='ins'){
    pension=floor10(gross*n(I.pension)/100);
    health=floor10(gross*n(I.health)/100);
    ltc=floor10(health*n(I.ltc)/100);
    emp=floor10(gross*n(I.emp)/100);
    itax=floor10(n(inp.incomeTax));
    ltax=floor10(itax*0.1);
    employer=floor10(gross*n(I.pension)/100)+floor10(gross*n(I.health)/100)+floor10(floor10(gross*n(I.health)/100)*n(I.ltc)/100)+floor10(gross*n(I.empEr)/100)+floor10(gross*n(I.accident)/100);
  }else if(st.deduct==='tax33'){
    tax33=floor10(gross*0.03)+floor10(gross*0.003);
  }
  const ded=pension+health+ltc+emp+itax+ltax+tax33;
  return {kind:'worker',pay:gross,ratio,from,to,dim,pension,health,ltc,emp,itax,ltax,tax33,ded,takeHome:gross-ded,
    total:gross-ded,cost:gross,employer,tip:0,tipTax:0,tipHome:0,sales:0,net:0,base:0,incentive:0,
    wh:tax33+itax+ltax};
}
function laborOf(key){
  let pay=0,er=0,tip=0,wh=0;
  for(const st of state.staff){const r=calcStaff(st,key);pay+=r.cost;er+=r.employer;tip+=r.tip;wh+=r.wh}
  return {pay,er,tip,wh,total:pay+er};
}

/* ---------- 계산: 세금 ---------- */
const BRK=[[14e6,.06,0],[50e6,.15,1.26e6],[88e6,.24,5.76e6],[150e6,.35,15.44e6],[300e6,.38,19.94e6],[500e6,.40,25.94e6],[1e9,.42,35.94e6],[Infinity,.45,65.94e6]];
function incomeTaxAnnual(x){if(x<=0)return 0;for(const [lim,r,d] of BRK){if(x<=lim)return Math.round(x*r-d)}return 0}
function marginal(x){for(const [lim,r] of BRK){if(x<=lim)return r}return .45}
function calcTax(key){
  const m=M(key),S=state.settings;
  const sales=salesTotal(m),pt=purchTotal(m),ex=expTotal(m),lab=laborOf(key),fee=feeTotal(m);
  const supply=sales/1.1,outVat=sales-supply,inVat=purchVat(m);
  const receiptSales=RECEIPT_CH.reduce((t,k)=>t+n(m.sales[k]),0);
  const credit=Math.min(receiptSales*0.013,CARD_CREDIT_CAP/12);
  let rawVat;
  const exempt=S.taxType==='simple'&&sales*12<SIMPLE_EXEMPT;
  if(S.taxType==='simple'){rawVat=exempt?0:sales*0.30*0.10-purchTaxable(m)*0.005-credit}
  else{rawVat=outVat-inVat-credit}
  const vat=Math.max(0,Math.round(rawVat)),refund=Math.max(0,Math.round(-rawVat));
  const profit=supply-purchSupply(m)-ex-lab.total-fee;
  const annualProfit=profit*12;
  const taxable=Math.max(0,annualProfit-n(S.basicDeduction)*10000);
  const itAnnual=incomeTaxAnnual(taxable);
  const itMonthly=Math.round(itAnnual*1.1/12);
  const net=sales-pt-ex-lab.total-fee-vat-itMonthly;
  return {sales,pt,ex,lab,fee,supply,outVat,inVat,receiptSales,credit,rawVat,vat,refund,exempt,profit,annualProfit,taxable,itAnnual,itMonthly,
    net,tax:vat+itMonthly,rate:marginal(taxable)};
}

  const ins=h=>{const i=h.indexOf('</div>',h.indexOf('class="sub"'))+6;return h.slice(0,i)+seg+h.slice(i)};
  if(sub==='sales')return ins(vSales());

}
function calHtml(k,sel){

  for(let d=1;d<=dim;d++){
    const ds=k+'-'+pad(d),amt=dayTotal(days[ds]);
    h+=`<button type="button" class="${amt?'has ':''}${ds===sel?'on ':''}${ds===td?'td ':''}${ds>td?'fu':''}" data-act="pickDay" data-val="${ds}" aria-pressed="${ds===sel}" aria-label="${dayLabel(ds)}${amt?' 매출 '+wonT(amt):''}"><span>${d}</span><span class="a num" data-live="cal:${ds}"></span></button>`;

  return h+'</div>';
}

      if(mode==='rate')h+=fld('인센티브율 (%)',IN.pct('staff','rate',st.rate,{id:st.id}));
      else{

        h+=fld('구간 적용 방법',IN.seg('staff','tierWay',st.tierWay==='prog'?'prog':'flat',[['flat','달성 구간 %를 전체에'],['prog','구간별로 나눠서']],{id:st.id}));
        h+=`<p class="note" style="margin:0">${st.tierWay==='prog'?'예) 500만까지 30%, 500만~800만은 35%, 초과분은 40%로 나눠서 더해요.':'예) 기준 매출이 650만원이면 두 번째 구간 %를 650만원 전체에 적용해요.'} 기준은 수수료·부가세·재료비를 뺀 금액이에요.</p>`;
        h+=tl.map((x,i)=>i<tl.length-1
          ?`<div class="g2">${fld(`구간 ${i+1} 상한 (원)`,IN.money('staff',`tiers.${i}.upto`,x.upto,{id:st.id}))}${fld(`구간 ${i+1} (%)`,IN.pct('staff',`tiers.${i}.rate`,x.rate,{id:st.id}))}</div>`
          :`<div class="g2"><div class="fld"><span>구간 ${i+1} 상한</span><div class="note" style="padding:11px 0">위 구간 초과 전부</div></div>${fld(`구간 ${i+1} (%)`,IN.pct('staff',`tiers.${i}.rate`,x.rate,{id:st.id}))}</div>`).join('');
        h+=`<div class="btns">${tl.length<5?`<button class="btn sm ghost" data-act="tierAdd" data-id="${st.id}">+ 구간 추가</button>`:''}${tl.length>2?`<button class="btn sm ghost" data-act="tierDel" data-id="${st.id}">− 구간 줄이기</button>`:''}</div>`;
      }
      h+=`<div class="g2">${fld('기본급 (원)',IN.money('staff','base',st.base,{id:st.id}))}<div></div></div>
      ${fld('기본급 방식',IN.seg('staff','baseWay',st.baseWay==='max'?'max':'add',[['add','기본급 + 인센티브'],['max','보장급']],{id:st.id}))}
      <p class="note" style="margin:0">${st.baseWay==='max'?'보장급: 인센티브가 기본급보다 적으면 기본급만큼 맞춰 지급해요.':'기본급에 인센티브를 더해서 지급해요.'}</p>
      ${fld('재료비 공제',IN.seg('staff','mat',['pct','amt'].includes(st.mat)?st.mat:'none',[['none','없음'],['pct','기준 매출의 %'],['amt','매달 금액 입력']],{id:st.id}))}
      ${st.mat==='pct'?fld('재료비 공제율 (%)',IN.pct('staff','matPct',st.matPct,{id:st.id})):''}
      ${fld('점판(제품 판매) 인센티브율 (%)',IN.pct('staff','prodRate',st.prodRate,{id:st.id}))}
      ${fld('부가세 처리',IN.seg('staff','vat',st.vat==='off'?'off':'on',[['on','제외 후 계산'],['off','그대로 계산']],{id:st.id}))}
      ${IN.chk('staff','feeDeduct',st.feeDeduct!==false,'결제 수수료를 뺀 금액 기준',{id:st.id,rr:1})}

      <div class="g2">${CH.map(([c,l])=>fld(l,IN.money('pay','sales.'+c,getPath(inp,'sales.'+c),{id:st.id}))).join('')}</div>
      <div class="g2">${fld('제품 판매(점판) 매출 (원)',IN.money('pay','prod',inp.prod,{id:st.id}))}${st.mat==='amt'?fld('이번 달 재료비 공제 (원)',IN.money('pay','mat',inp.mat,{id:st.id})):'<div></div>'}</div>
      <div class="g2">${fld('추가 지급 (원)',IN.money('pay','extra',inp.extra,{id:st.id}))}${fld('차감 (원)',IN.money('pay','deduct',inp.deduct,{id:st.id}))}</div>
      ${st.tip?fld('이번 달 봉사료 (원)',IN.money('pay','tip',inp.tip,{id:st.id})):''}`;
    }else{
      const unit=st.type==='hourly'?'시급 (원)':st.type==='daily'?'일당 (원)':'월 급여 (원)';
      h+=fld('급여 형태',IN.seg('staff','type',st.type||'monthly',[['monthly','월급'],['hourly','시급'],['daily','일당·스페어']],{id:st.id}))
      +fld(unit,IN.money('staff','rate',st.rate,{id:st.id}))

      else if(st.type==='daily')h+=fld('근무 일수',IN.num('pay','days',inp.days,{id:st.id}));
      else h+=`<div class="g2">${fld('입사일 (일, 월중 입사)',IN.num('pay','startDay',inp.startDay,{id:st.id},'1'))}${fld('퇴사일 (일, 월중 퇴사)',IN.num('pay','endDay',inp.endDay,{id:st.id},String(daysIn(k))))}</div><p class="note" style="margin:0">비워두면 한 달 전체로 계산해요. 월중 입퇴사는 달력 일수 기준 일할 계산이에요.</p>`;
      h+=`<div class="g2">${fld('추가 지급 (원)',IN.money('pay','extra',inp.extra,{id:st.id}))}${fld('차감 (원)',IN.money('pay','deduct',inp.deduct,{id:st.id}))}</div>`;
      if(st.deduct==='ins')h+=fld('근로소득세 (원, 간이세액표 확인 후 입력)',IN.money('pay','incomeTax',inp.incomeTax,{id:st.id}));
    }
    h+=`</div><div class="hr"></div>`;
    const P=(l,f,c)=>lrow(l,`pay:${st.id}:${f}`,c);
    if(st.kind==='designer'){
      h+=P('담당 매출 합계','sales')+(st.feeDeduct!==false?P('수수료 차감 후','net'):'')+(st.vat!=='off'?P('부가세 제외','base0'):'')+(['pct','amt'].includes(st.mat)?P('재료비 공제','matDed:neg','mute'):'')+P('인센티브 기준금액','base')+P('적용 인센티브율','rateTxt','mute')+P('인센티브','incentive')+(n(st.prodRate)?P('점판 인센티브','prodInc'):'')+(st.baseWay==='max'?P('보장급 보전','topup'):(n(st.base)?P('기본급','fixed'):''))+P('지급 합계','pay','strong')+P('원천세 3.3%','tax')+P('급여 실수령','takeHome','strong');
      if(st.tip)h+=P('봉사료','tip')+P('봉사료 원천세 5.5%','tipTax')+P('봉사료 실수령','tipHome','strong');
    }else{
      h+=P('지급 합계','pay','strong');
      if(st.deduct==='ins')h+=P('국민연금','pension')+P('건강보험','health')+P('장기요양','ltc')+P('고용보험','emp')+P('근로소득세','itax')+P('지방소득세','ltax');
      if(st.deduct==='tax33')h+=P('원천세 3.3%','tax33');
      h+=P('공제 합계','ded')+P('실수령','takeHome','strong');
      if(st.deduct==='ins')h+=P('사업주 부담 4대보험','employer','mute');
    }
    h+=`<div class="btns" style="margin-top:14px"><button class="btn sm" data-act="settle" data-id="${st.id}">${I('send')}정산내역 보내기</button>${

  }
  return h+`</div>`;

/* 세금 */
function vTax(){
  const k=ui.month,t=calcTax(k),S=state.settings,simple=S.taxType==='simple';
  const waterfall=[['총매출',t.sales,'g'],['매입',-t.pt],['경비',-t.ex],['인건비',-t.lab.total],['수수료',-t.fee],['부가세',-t.vat],['소득세',-t.itMonthly],['남는 돈',t.net,'g']];
  const mx=Math.max(1,t.sales,...waterfall.map(w=>Math.abs(w[1])));
  return `${head('세금','이번 달 세금','매출 · 지출 · 급여만 입력하면 여기서 자동으로 잡혀요.')}

  <div class="hsub">매달 이만큼 세금 통장에 모아 두면 신고 때 편해요.</div>
  <div class="tiles"><div class="tile">${I('receipt')}<div class="tl">부가세</div><div class="tv sm num">${wonT(t.vat)}</div></div><div class="tile">${I('percent')}<div class="tl">종합소득세 (월)</div><div class="tv sm num">${wonT(t.itMonthly)}</div></div></div>

  <div class="card"><div class="sec">돈의 흐름</div><div class="cap">매출에서 무엇이 빠져 남는 돈이 되는지</div>${waterfall.map(w=>`<div class="wf"><span>${w[0]}</span><span class="bar"><i class="${w[2]||''}" style="width:${Math.min(100,Math.abs(w[1])/mx*100)}%"></i></span><span class="v num">${w[1]<0?'−':''}${fmt(Math.abs(w[1]))}</span></div>`).join('')}</div>
  <div class="card"><div class="sec">부가세 계산</div>${simple
    ?row('총매출 × 부가가치율 30% × 10%',wonT(t.sales*0.03))+row('매입세액공제 (세금계산서 매입 × 0.5%)','−'+wonT(purchTaxable(M(k))*0.005))
    :row('매출세액 (매출의 1/11)',wonT(t.outVat))+row('매입세액','−'+wonT(t.inVat))}
    ${row('카드·전자결제 발행세액공제 (1.3%)','−'+wonT(t.credit))}
    ${t.exempt?row('간이과세 납부면제 (연 환산 4,800만원 미만)','0원'):''}${row(t.refund?'환급 예상':'납부 예상',wonT(t.refund||t.vat),'strong')}
    <p class="note" style="margin:8px 0 0">부가세는 반기(1·7월)에 신고해요. 이 화면은 한 달 기준으로 환산한 금액이에요. 발행세액공제는 연 한도가 있어요.</p></div>
  <div class="card"><div class="sec">종합소득세 (연 환산 추정)</div>
    ${row('이번 달 소득금액 (매출 공급가 − 비용)',wonT(t.profit))}${row('연 환산 (×12)',wonT(t.annualProfit))}${row('기본공제 차감 후 과세표준',wonT(t.taxable))}${row('산출세액 (연)',wonT(t.itAnnual))}${row('지방소득세 포함, 월 환산',wonT(t.itMonthly),'strong')}${row('적용 세율 구간',pc(t.rate*100),'mute')}
    <p class="note" style="margin:8px 0 0">이번 달 숫자가 1년 내내 이어진다고 가정한 추정이에요. 각종 공제와 장부 방식에 따라 실제와 달라져요.</p></div>
  <p class="note">과세유형과 기본공제는 설정에서 바꿀 수 있어요. 최종 신고는 세무 담당자와 확인하세요.</p>`;
}

async function askGemini(prompt){

  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent((ai.model||AI_MODEL).trim())+':generateContent';
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':ai.key.trim()},
    body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.4}})});
  if(!res.ok){let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||''}catch(e){}const e=new Error(msg||('HTTP '+res.status));e.status=res.status;throw e}
  const j=await res.json();
  const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
  const text=parts.map(x=>x.text||'').join('').trim();
  if(!text){const e=new Error('EMPTY');e.code='EMPTY';throw e}
  return text;
}

      ${mo.img?`<img src="${mo.img}" alt="정산내역 이미지"><p class="note">이미지를 길게 눌러 저장할 수 있어요.</p>`:''}
      <div class="btns col" style="margin-top:16px"><button class="btn block" data-act="shareImg" data-id="${st.id}">${I('image')}이미지로 보내기</button><div class="btns"><button class="btn ghost" style="flex:1" data-act="copySettle" data-id="${st.id}">${I('copy')}텍스트 복사</button><button class="btn ghost" style="flex:1" data-act="closeModal">닫기</button></div></div></div></div>`;
  }
  return '';
}
function drawSettle(st){
  const data=settleData(st),W=750,P=56,LH=62,rows=data.rows,HH=268;
  const H=HH+40+rows.length*LH+36+176+120;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');if(!x)return null;
  const C={bg:'#FFFFFF',ink:'#131A26',mute:'#6B7684',pri:'#2F6BFF',soft:'#EDF2FF',line:'#E7EBF0',navy:'#0A1428',navy2:'#15295A'};
  const F=(s,w)=>`${w||400} ${s}px "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,W,HH);g.addColorStop(0,C.navy2);g.addColorStop(1,C.navy);x.fillStyle=g;x.fillRect(0,0,W,HH);
  x.strokeStyle='rgba(255,255,255,.05)';x.lineWidth=1;for(let i=0;i<W;i+=34){x.beginPath();x.moveTo(i,0);x.lineTo(i,HH);x.stroke()}for(let j=0;j<HH;j+=34){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
  x.textBaseline='alphabetic';
  x.fillStyle='#86A8FF';x.font=F(24,700);x.fillText(state.settings.shop||'미용실',P,P+30);
  x.fillStyle='#FFFFFF';x.font=F(46,800);x.fillText(`${mlabel(ui.month)} 정산내역`,P,P+104);
  x.fillStyle='#A7B6D8';x.font=F(28,500);x.fillText(`${st.name||''} ${st.kind==='designer'?'디자이너':''}님`,P,P+156);
  let y=HH+40+LH-22;
  for(const r of rows){
    if(r.t==='sep'){x.fillStyle=C.line;x.fillRect(P,y-34,W-P*2,2);y+=LH/2;continue}
    const b=r.t==='b';
    x.font=F(28,b?700:500);x.fillStyle=b?C.ink:C.mute;x.fillText(r.k,P,y);
    x.font=F(28,b?800:600);x.fillStyle=b?C.pri:C.ink;x.textAlign='right';x.fillText(r.v,W-P,y);x.textAlign='left';
    x.fillStyle=C.line;x.fillRect(P,y+22,W-P*2,2);y+=LH;
  }
  y+=14;rr(P,y,W-P*2,150,28);x.fillStyle=C.soft;x.fill();
  x.fillStyle=C.pri;x.font=F(26,700);x.fillText(data.totalLabel,P+32,y+52);
  x.font=F(58,800);x.textAlign='right';x.fillText(data.total,W-P-32,y+118);x.textAlign='left';
  y+=150+70;
  rr(W/2-96,y-30,40,40,11);x.fillStyle=C.pri;x.fill();
  x.strokeStyle='#fff';x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(W/2-85,y-10);x.lineTo(W/2-78,y-3);x.lineTo(W/2-66,y-17);x.stroke();
  x.fillStyle=C.ink;x.font=F(26,800);x.fillText('CLOSING',W/2-44,y);
  return cv;
}
async function shareImage(st){
  let cv;try{cv=drawSettle(st)}catch(e){cv=null}
  if(!cv){toast('이미지를 만들 수 없는 환경이에요. 텍스트 복사를 이용하세요.');return}
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  const name=`CLOSING_settle_${ui.month}_${(st.name||'staff').replace(/[^\w가-힣]/g,'')}.png`;
  try{
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'정산내역'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  ui.modal.img=cv.toDataURL('image/png');render(true);
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
}
function copyText(t){
  const done=()=>toast('복사했어요');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));return}
  fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done()}catch(e){toast('복사할 수 없어요. 직접 선택해 복사하세요.')}ta.remove();
}
let toastT;
function toast(msg){
  const old=$('.toast');if(old)old.remove();
  const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);
  clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200);
}

function aiGuard(){
  if(!ai.key){toast('설정에서 Gemini API 키를 먼저 입력해 주세요.');return false}
  if(!state.plan.aiConsent){toast('AI 상담 탭에서 전송 동의를 먼저 체크해 주세요.');return false}
  return true;
}
async function runAsk(){
  if(!aiGuard())return;
  const q=(state.plan.aiQ||'').trim();
  if(!q){toast('질문을 입력해 주세요.');return}
  ui.aiBusy=true;ui.aiErr='';ui.aiOut='';render(true);

  toast('연결 확인 중');
  try{await askGemini('"연결됨"이라고만 답하세요.');toast('연결됐어요')}catch(e){toast(aiErrMsg(e))}
}

/* ---------- 백업 ---------- */
function backupJSON(){return JSON.stringify({app:'CLOSING',backup:1,exportedAt:new Date().toISOString(),state})}
function markBackup(){meta.lastBackup=new Date().toISOString();metaSave();if(ui.tab==='home'||ui.tab==='more'||ui.view==='settings')render(true)}
function parseBackup(txt){
  try{
    let o=JSON.parse(String(txt||'').trim());let when='';
    if(o&&o.app==='CLOSING'&&o.state){when=o.exportedAt||'';o=o.state}
    if(!o||o.v!==1||typeof o.months!=='object'||!Array.isArray(o.staff))return null;
    const mk=Object.keys(o.months).sort();
    const info=(when?'백업한 날: '+when.slice(0,10)+' · ':'')+(o.settings&&o.settings.shop?'상호: '+o.settings.shop+' · ':'')+'기록된 달 '+mk.length+'개'+(mk.length?' ('+mlabel(mk[0])+(mk.length>1?' ~ '+mlabel(mk[mk.length-1]):'')+')':'')+' · 직원 '+o.staff.length+'명';
    return {state:o,info};
  }catch(e){return null}
}
async function backupShare(){
  const txt=backupJSON(),name='CLOSING_backup_'+todayStr()+'.json';
  let file=null;
  try{
    if(navigator.canShare){
      for(const [nm,ty] of [[name,'application/json'],[name.replace(/\.json$/,'.txt'),'text/plain']]){
        try{const f=new File([txt],nm,{type:ty});if(navigator.canShare({files:[f]})){file=f;break}}catch(e){}
      }
    }
    if(file&&navigator.share){
      await navigator.share({files:[file],title:'CLOSING 백업'});markBackup();toast('백업했어요');return;
    }
  }catch(e){if(e&&e.name==='AbortError'){toast('백업을 취소했어요');return}}
  try{
    const blob=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);markBackup();toast('백업 파일을 저장했어요');
  }catch(e){toast('파일로 저장할 수 없어요. 백업 내용 복사를 이용하세요.')}
}
/* ---------- 이벤트 ---------- */
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.path)return;
  if(el.type==='checkbox'||el.tagName==='SELECT')return;
  if(el.dataset.t==='money')fmtLive(el);
  commit(el);live();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='dayPick'){const v=el.value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ui.day=v;ui.month=v.slice(0,7);ui.confirmDel=null;ui.moreAll=false;render(true)}return}
  if(el.id==='restoreFile'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const p=parseBackup(r.result);if(p){ui.pendingRestore=p;render(true)}else{toast('CLOSING 백업 파일이 아니거나 손상된 파일이에요.');el.value=''}};r.onerror=()=>toast('파일을 읽지 못했어요.');r.readAsText(f);return}
  if(!el.dataset||!el.dataset.path)return;
  if(el.type==='checkbox'||el.tagName==='SELECT'){commit(el);if(el.dataset.rr)render(true);else live()}
});
document.addEventListener('focusout',e=>{
  const el=e.target;if(el.dataset&&el.dataset.t==='money'){const v=parseMoney(el.value);el.value=v?fmt(v):''}
});
/* 금액 입력 중에도 1,000 단위 쉼표를 넣고 커서 위치는 유지 */
function fmtLive(el){
  try{
    const pos=el.selectionStart==null?el.value.length:el.selectionStart,digits=el.value.slice(0,pos).replace(/[^\d]/g,'').length;
    const v=parseMoney(el.value),out=v?fmt(v):'';if(out===el.value)return;el.value=out;
    let i=0,c=0;while(i<out.length&&c<digits){if(/\d/.test(out[i]))c++;i++}
    el.setSelectionRange(i,i);
  }catch(e){}
}
function addFocus(sel){const el=$(sel);if(el)el.focus()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const d=b.dataset;
  switch(d.act){
    case 'tab':
      if(d.tab==='sales'||d.tab==='exp'){ui.tab='input';ui.inSub=d.tab}
      else if(d.tab==='aid'){ui.tab='aid'}
      else ui.tab=d.tab;
      ui.view=null;ui.confirmDel=null;ui.pendingRestore=null;render(false);break;
    case 'inSub':ui.inSub=d.val;ui.confirmDel=null;render(false);break;
    case 'goDay':ui.tab='input';ui.inSub='day';ui.day=todayStr();ui.month=todayStr().slice(0,7);ui.view=null;render(false);break;
    case 'goAid':ui.tab='aid';ui.view=null;render(false);break;
    case 'goBackup':{const el=$('#backup');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break}
    case 'pickDay':ui.day=d.val;ui.confirmDel=null;ui.moreAll=false;render(true);break;
    case 'moreCh':ui.moreAll=true;render(true);break;
    case 'delDay':
      if(ui.confirmDel==='day:'+d.val){delDay(d.val);ui.confirmDel=null;save();toast('삭제했어요. 월 합계에서도 빠졌어요.');render(true)}
      else{ui.confirmDel='day:'+d.val;render(true)}break;
    case 'installLater':meta.installLater=new Date().toISOString();metaSave();render(true);break;
    case 'backupShare':backupShare();break;
    case 'restoreYes':{const pr=ui.pendingRestore;if(pr){state=deepMerge(defaults(),pr.state);ensureLegacyCH();ui.pendingRestore=null;ui.open={};ui.day='';flush();toast('백업으로 되돌렸어요');ui.view=null;ui.tab='home';render(false)}break}
    case 'restoreNo':ui.pendingRestore=null;render(true);break;
    case 'mprev':ui.month=shiftMonth(ui.month,-1);render(false);break;
    case 'mnext':ui.month=shiftMonth(ui.month,1);render(false);break;
    case 'settings':ui.view='settings';ui.confirmReset=false;render(false);break;
    case 'back':ui.view=null;render(false);break;
    case 'sub':ui.sub=d.val;render(false);break;
    case 'seg':{const t=target(b);if(t){setPath(t.obj,t.path,d.val);if(t.path==='mode'&&d.val==='tier'&&!(Array.isArray(t.obj.tiers)&&t.obj.tiers.length))t.obj.tiers=DEFAULT_TIERS.map(x=>({...x}));if(t.path==='mat'&&d.val==='pct'&&t.obj.matPct==null)t.obj.matPct=10;save();render(true)}break}
    case 'addItem':{
      const m=getMonth(),id=uid();
      m[d.list].push(d.list==='purchases'?{id,name:d.name||'',amt:0,taxable:true}:{id,name:d.name||'',amt:0});
      save();render(true);
      addFocus(`[data-id="${id}"][data-path="${d.name?'amt':'name'}"]`);break}
    case 'delItem':{const m=getMonth();m[d.list]=m[d.list].filter(i=>i.id!==d.id);save();render(true);break}
    case 'addStaff':{
      const id=uid();
      state.staff.push(d.kind==='designer'?{id,kind:'designer',name:'',rate:40,base:0,vat:'on',feeDeduct:true,tip:false}:{id,kind:'worker',name:'',type:'monthly',rate:0,deduct:'ins'});
      ui.open[id]=true;save();render(true);addFocus(`[data-id="${id}"][data-path="name"]`);break}
    case 'tierAdd':case 'tierDel':{
      const st=state.staff.find(s=>s.id===d.id);if(!st)break;
      let t=(Array.isArray(st.tiers)&&st.tiers.length?st.tiers:DEFAULT_TIERS).map(x=>({upto:n(x.upto),rate:n(x.rate)}));
      if(d.act==='tierAdd'&&t.length<5){const pv=t.length>1?t[t.length-2]:{upto:0,rate:t[0].rate};const nu=(pv.upto||3000000)+2000000;t.splice(t.length-1,0,{upto:nu,rate:t[t.length-1].rate})}
      if(d.act==='tierDel'&&t.length>2){t.splice(t.length-2,1)}
      st.tiers=t;save();render(true);break}
    case 'toggleStaff':ui.open[d.id]=!ui.open[d.id];ui.confirmDel=null;render(true);break;
    case 'delStaff':
      if(ui.confirmDel===d.id){state.staff=state.staff.filter(s=>s.id!==d.id);ui.confirmDel=null;save();render(true)}
      else{ui.confirmDel=d.id;render(true)}break;
    case 'settle':ui.modal={type:'settle',id:d.id};render(true);break;
    case 'closeModal':if(b.classList.contains('over')&&e.target!==b)break;ui.modal=null;render(true);break;
    case 'shareImg':{const st=state.staff.find(s=>s.id===d.id);if(st)shareImage(st);break}
    case 'copySettle':{const st=state.staff.find(s=>s.id===d.id);if(st)copyText(settleText(st));break}
    case 'aiPreset':state.plan.aiQ=AI_PRESETS[Number(d.val)]||'';save();render(true);break;
    case 'aiAsk':runAsk();break;
    case 'aiTest':runTest();break;
    case 'copyAi':copyText(ui.aiOut);break;
    case 'sample':if(anyData()){toast('이미 기록이 있어서 예시를 불러오지 않았어요.');break}loadSample();render(false);break;
    case 'clearSample':state.months={};state.staff=[];state.settings.shop='';state.sample=false;save();render(false);break;
    case 'backupCopy':copyText(backupJSON());markBackup();break;
    case 'restore':{
      const box=$('#restoreBox');const r=parseBackup(box?box.value:'');
      if(r){ui.pendingRestore=r;render(true)}else toast('백업 내용을 읽을 수 없어요. 전체를 다시 복사해 붙여넣어 주세요.');break}
    case 'reset':
      if(ui.confirmReset){state=defaults();ui.confirmReset=false;ui.open={};ui.view=null;ui.modal=null;save();toast('모든 데이터를 지웠어요');render(false)}
      else{ui.confirmReset=true;render(true)}break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render(true)}});

window.__app={setDayVal,delDay,parseBackup,backupJSON,get meta(){return meta},safetyCards,pickDay,todayStr,drawSettlePng:st=>{const c=drawSettle(st);return c?c.toDataURL('image/png'):null},get state(){return state},get ai(){return ai},askGemini,aiContext,runAsk,ui,calcStaff,calcTax,laborOf,salesTotal,incomeTaxAnnual,settleData,render,loadSample,getMonth};
render(false);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
